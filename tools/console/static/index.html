<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Console</title>
<!-- Inline so the console needs no extra request and no binary in the tree;
     without it every page load logs a 404 for /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.95em' font-size='90'%3E%F0%9F%9B%A0%3C/text%3E%3C/svg%3E">
<style>
  /* Palette roles (dataviz reference instance): light on :root, dark under both
     the OS media query and an explicit data-theme toggle. */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --accent-track: #cde2fb;
    --good: #0ca30c; --good-text: #006300; --warning: #fab219; --warning-track: #fdeec6;
    --serious: #ec835a; --critical: #d03b3b; --critical-track: #f6d2d2;
    --series-2: #eb6834; --series-3: #1baf7a;
    /* Terminal colours for job logs. The tools/ scripts emit SGR codes, so the
       log view decodes them instead of printing the escapes; these are the
       light-theme values, darkened for contrast on the light surface. */
    --ansi-red: #c02b2b; --ansi-green: #006300; --ansi-yellow: #8a6100;
    --ansi-blue: #1f63b8; --ansi-magenta: #9c3f9c; --ansi-cyan: #0f7180;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-track: #184f95;
      --good-text: #0ca30c; --warning-track: #4a3a0e; --critical-track: #4a1f1f;
      --series-2: #d95926; --series-3: #199e70;
      --ansi-red: #f08a8a; --ansi-green: #5fd35f; --ansi-yellow: #e5b53f;
      --ansi-blue: #6aa9f0; --ansi-magenta: #d69bd6; --ansi-cyan: #62c6d4;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-track: #184f95;
    --good-text: #0ca30c; --warning-track: #4a3a0e; --critical-track: #4a1f1f;
    --series-2: #d95926; --series-3: #199e70;
    --ansi-red: #f08a8a; --ansi-green: #5fd35f; --ansi-yellow: #e5b53f;
    --ansi-blue: #6aa9f0; --ansi-magenta: #d69bd6; --ansi-cyan: #62c6d4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--grid); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .meta { color: var(--ink-2); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; gap: 5px; align-items: center; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; background: var(--surface); color: var(--ink-2); }
  .chip.ok { border-color: var(--good); } .chip.bad { border-color: var(--critical); }
  nav { display: flex; gap: 2px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--grid); overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--ink-2); cursor: pointer; font-size: 13.5px; white-space: nowrap; }
  nav button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 18px 20px 60px; max-width: 1500px; margin: 0 auto; }
  section[hidden] { display: none; }
  h2 { font-size: 15px; margin: 22px 0 10px; font-weight: 650; }
  h2:first-child { margin-top: 0; }
  .sub { color: var(--ink-2); font-size: 12.5px; margin: -4px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; }
  .tile .value { font-size: 26px; font-weight: 600; margin: 2px 0; }
  .tile .delta { font-size: 12px; color: var(--ink-2); }
  .hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .hero .value { font-size: 52px; font-weight: 600; line-height: 1; }
  .hero .label { color: var(--ink-2); }
  .meter { height: 8px; border-radius: 4px; background: var(--accent-track); overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .meter.warn { background: var(--warning-track); } .meter.warn > i { background: var(--warning); }
  .meter.crit { background: var(--critical-track); } .meter.crit > i { background: var(--critical); }
  .status { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .status.good { color: var(--good-text); border-color: var(--good); }
  .status.warn { color: var(--ink); border-color: var(--warning); background: var(--warning-track); }
  .status.crit { color: var(--ink); border-color: var(--critical); background: var(--critical-track); }
  .status.info { color: var(--ink-2); }
  /* .status is a nowrap PILL — a sentence-length notice belongs in a banner,
     or it widens the whole page on a narrow viewport (the Auth tab's
     "no DASH_CONSOLE_TOKEN set…" line overflowed a 430px screen by 151px). */
  .banner { display: block; margin: 8px 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12.5px; }
  .banner.warn { border-color: var(--warning); background: var(--warning-track); }
  .banner.crit { border-color: var(--critical); background: var(--critical-track); }
  .banner.info { color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; font-size: 13px; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; background: var(--surface); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.flag td { background: color-mix(in srgb, var(--warning-track) 45%, var(--surface)); }
  tr.bad td { background: color-mix(in srgb, var(--critical-track) 45%, var(--surface)); }
  .wrap { overflow-x: auto; max-width: 100%; }
  /* A grid/flex child defaults to min-width:auto, so it refuses to shrink below
     its content. That silently defeats the .wrap scrollers: instead of the wide
     table scrolling inside its own box, the whole PAGE scrolled sideways on a
     narrow viewport (Fleet overflowed by 473px). Opting these children out of
     the auto minimum is what lets the inner overflow do its job. */
  .split > *, form.contract label > span { min-width: 0; }
  details.sect { margin-bottom: 10px; }
  details.sect > summary { cursor: pointer; font-weight: 650; font-size: 13.5px; list-style-position: outside; }
  details.sect > summary small { display: block; font-weight: 400; color: var(--ink-2); margin-top: 3px; }
  .cred { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--grid); }
  .cred:last-child { border-bottom: 0; }
  .cred .n { min-width: 0; }
  .cred .n small { display: block; color: var(--ink-2); }
  .cred .set { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .set .btn { white-space: nowrap; }
  /* Read-only reference tables carry long unbreakable values (a serialised
     tier config, a cron). Let those wrap instead of widening the page — for a
     value you only read, wrapping beats a horizontal scrollbar. */
  table.ref td { overflow-wrap: anywhere; }
  form.contract label > span { overflow-wrap: anywhere; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
  button.btn { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 7px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger { border-color: var(--critical); color: var(--critical); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=password], input[type=number], select { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 13px; }
  label.inl { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
  pre.log { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; max-height: 520px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
  /* Decoded SGR spans (see ansiToHtml) */
  .log .a-red { color: var(--ansi-red); } .log .a-green { color: var(--ansi-green); }
  .log .a-yellow { color: var(--ansi-yellow); } .log .a-blue { color: var(--ansi-blue); }
  .log .a-magenta { color: var(--ansi-magenta); } .log .a-cyan { color: var(--ansi-cyan); }
  .log .a-grey { color: var(--muted); }
  .log .a-bold { font-weight: 650; } .log .a-dim { opacity: .65; }
  .log .a-under { text-decoration: underline; }
  .split { display: grid; gap: 16px; grid-template-columns: minmax(280px, 1fr) minmax(360px, 2fr); }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .ops .op { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--grid); }
  .ops .op:last-child { border-bottom: 0; }
  .ops .op .t { flex: 1; } .ops .op .t b { font-weight: 600; } .ops .op .t small { display: block; color: var(--ink-2); }
  /* 24 fixed tracks need ~380px before the hour labels start colliding, which
     is wider than a phone's content box — so the chart scrolls in its own box
     rather than widening the page. minmax keeps the columns legible instead of
     letting `1fr` squeeze them to nothing. */
  .hours { display: grid; grid-template-columns: repeat(24, minmax(14px, 1fr)); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
  .hours div { text-align: center; font-size: 11px; color: var(--ink-2); }
  .hours .bar { height: 46px; display: flex; align-items: flex-end; }
  .hours .bar i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; }
  .hours .bar i.crit { background: var(--critical); }
  .muted { color: var(--muted); }
  .toast { position: fixed; right: 18px; bottom: 18px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.15); max-width: 460px; z-index: 9; }
  .toast.err { border-left-color: var(--critical); }
  details summary { cursor: pointer; color: var(--ink-2); }
  form.contract label { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
  form.contract label span small { display: block; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛠️ Harness Console</h1>
  <div class="meta" id="meta">loading…</div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
    <button class="btn" id="refresh" title="Re-read the committed state">↻ Refresh</button>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
    <a class="btn" href="/docs" target="_blank" rel="noopener" style="text-decoration:none">API</a>
  </div>
</header>
<nav id="nav">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="harnesses">Harnesses</button>
  <button data-tab="schedules">Schedules</button>
  <button data-tab="loops">Loops</button>
  <button data-tab="costs">Costs</button>
  <button data-tab="traces">Traces</button>
  <button data-tab="fleet">Fleet</button>
  <button data-tab="contract">Config</button>
  <button data-tab="auth">Auth</button>
  <button data-tab="jobs">Jobs</button>
</nav>
<main>
  <section id="tab-overview"></section>
  <section id="tab-harnesses" hidden></section>
  <section id="tab-schedules" hidden></section>
  <section id="tab-loops" hidden></section>
  <section id="tab-costs" hidden></section>
  <section id="tab-traces" hidden></section>
  <section id="tab-fleet" hidden></section>
  <section id="tab-contract" hidden></section>
  <section id="tab-auth" hidden></section>
  <section id="tab-jobs" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
// ------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// --- ANSI -> HTML ---------------------------------------------------------
// Job logs are the real output of the tools/ scripts, which colour their
// findings. Rendered as plain text those SGR codes show up literally ("[33m!"),
// which is both noise and a loss of the signal the colour carried. Decode the
// SGR subset the scripts actually use and drop every other escape (cursor
// moves, erase-line, OSC hyperlinks) rather than printing it.
const ANSI_COLOUR = {30:'a-grey',31:'a-red',32:'a-green',33:'a-yellow',34:'a-blue',35:'a-magenta',36:'a-cyan',37:'',
                     90:'a-grey',91:'a-red',92:'a-green',93:'a-yellow',94:'a-blue',95:'a-magenta',96:'a-cyan',97:''};
const ANSI_STYLE = {1:'a-bold', 2:'a-dim', 4:'a-under'};
function ansiToHtml(text) {
  // strip OSC (\x1b]…BEL or ST) first — it carries no display state
  text = String(text).replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, '');
  const CSI = /\x1b\[([0-9;]*)([A-Za-z])/g;
  let out = '', last = 0, open = 0, m;
  while ((m = CSI.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    last = CSI.lastIndex;
    if (m[2] !== 'm') continue;                       // not a colour/style code: drop it
    for (const part of (m[1] === '' ? '0' : m[1]).split(';')) {
      const code = parseInt(part || '0', 10);
      if (code === 0) { out += '</span>'.repeat(open); open = 0; continue; }
      const cls = ANSI_STYLE[code] ?? ANSI_COLOUR[code];
      if (cls) { out += `<span class="${cls}">`; open++; }
    }
  }
  return out + esc(text.slice(last)) + '</span>'.repeat(open);
}
const fmt = (n, d = 1) => (n === null || n === undefined || n === '') ? '—' : (typeof n === 'number' ? (Number.isInteger(n) ? n.toLocaleString() : n.toFixed(d)) : esc(n));
const usd = n => (n === null || n === undefined) ? '—' : '$' + Number(n).toFixed(2);
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0);
const sev = ratio => ratio >= 1 ? 'crit' : ratio >= 0.7 ? 'warn' : '';
const banner = (kind, html) => `<div class="banner ${kind}">${kind === 'good' ? '✓' : kind === 'warn' ? '⚠' : kind === 'crit' ? '✖' : '●'} ${html}</div>`;
const status = (kind, text) => `<span class="status ${kind}">${kind === 'good' ? '✓' : kind === 'warn' ? '⚠' : kind === 'crit' ? '✖' : '●'} ${esc(text)}</span>`;
const meter = (value, cap, extra = '') => `<div class="meter ${sev(cap ? value / cap : 0)} ${extra}"><i style="width:${Math.min(100, cap ? 100 * value / cap : 0)}%"></i></div>`;
let TOKEN = localStorage.getItem('console_token') || '';
let STATE = null, OPS = [], CAPS = null, JOBS = [], ACTIVE = 'overview', POLL = null, CURRENT_JOB = null;

function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, err ? 7000 : 3500);
}
async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) {
    const t = prompt('This console requires its bearer token (DASH_CONSOLE_TOKEN):');
    if (t) { TOKEN = t; localStorage.setItem('console_token', t); return api(path, opts); }
    throw new Error('console token required');
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || (r.status + ' ' + r.statusText));
  return body;
}

// ------------------------------------------------------------------ data
async function loadAll() {
  try {
    [STATE, OPS, CAPS, JOBS] = await Promise.all([api('/api/state'), api('/api/ops'), api('/api/capabilities'), api('/api/jobs')]);
    renderMeta();
    // Deep links: /#harnesses opens that tab (also what the screenshots use).
    const want = location.hash.replace('#', ''), btn = want && $(`#nav button[data-tab="${want}"]`);
    if (btn && want !== ACTIVE) { btn.click(); } else { renderTab(ACTIVE); }
  } catch (e) { toast('load failed: ' + e.message, true); }
}
function renderMeta() {
  const g = STATE.git || {}, c = CAPS || {}, tok = c.env_tokens || {};
  const tokens = Object.entries(tok).filter(([, v]) => v).map(([k]) => k);
  $('#meta').innerHTML = [
    `<span class="chip" title="git branch / head">⎇ ${esc(g.branch || '?')} <code>${esc(g.head || '')}</code></span>`,
    `<span class="chip ${g.dirty_count ? '' : 'ok'}" title="uncommitted files — the console never commits; review and commit the generated data yourself">${g.dirty_count ? '✎ ' + g.dirty_count + ' uncommitted' : '✓ clean tree'}</span>`,
    `<span class="chip ${c.gh_authenticated ? 'ok' : 'bad'}" data-goto="auth" title="gh auth status — click to sign in on the Auth tab" style="cursor:pointer">${c.gh_authenticated ? '✓ gh authenticated' : '✖ gh not authenticated'}</span>`,
    `<span class="chip" data-goto="auth" title="credential names present in this process environment (values never shown) — click to manage them" style="cursor:pointer">🔑 ${tokens.length ? tokens.join(', ') : 'no tokens in env'}</span>`,
    `<span class="chip" title="snapshot time">${esc(STATE.generated_at)}</span>`,
  ].join('');
  // The two credential chips are the shortest path to the Auth tab — this is
  // where you notice gh is signed out, so this is where fixing it should start.
  $('#meta').querySelectorAll('[data-goto]').forEach(el => el.onclick = () => $(`#nav button[data-tab="${el.dataset.goto}"]`).click());
}

// ------------------------------------------------------------------ tabs
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ACTIVE = b.dataset.tab; history.replaceState(null, '', '#' + ACTIVE);
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== 'tab-' + ACTIVE);
  renderTab(ACTIVE);
});
function renderTab(tab) {
  if (!STATE) return;
  ({ overview: renderOverview, harnesses: renderHarnesses, schedules: renderSchedules, loops: renderLoops,
     costs: renderCosts, traces: renderTraces, fleet: renderFleet, contract: renderConfig,
     auth: renderAuth, jobs: renderJobs })[tab]();
}

// ------------------------------------------------------------------ overview
function renderOverview() {
  const hr = STATE.harnesses || {}, t = hr.totals || {}, tp = hr.throughput || {}, tr = (hr.trends || {}).ai_cost_usd || {};
  const h = STATE.health || {}, wires = h.trip_wires || [], tripped = wires.filter(w => w.tripped).length;
  const tri = STATE.triage.totals || {}, pipe = STATE.pipeline.totals || {};
  const baseTotal = (t.baseline_ok || 0) + (t.baseline_gaps || 0);
  const attention = hr.attention || [];
  $('#tab-overview').innerHTML = `
    <div class="card hero">
      <div><div class="value">${fmt(t.attention ?? attention.length)}</div><div class="label">attention items across the fleet's AI harnesses</div></div>
      <div class="muted" style="max-width:640px">Every finding names its lever. Nothing here writes to a fleet repo by itself — deploys are dry-run PRs unless you confirm <b>apply</b>, and the console never commits: review the generated data in git and commit it yourself.</div>
    </div>
    <h2>Fleet at a glance</h2>
    <div class="grid">
      <div class="card tile"><div class="label">AI workflows</div><div class="value">${fmt(t.ai_workflows)}</div><div class="delta">in ${fmt(t.repos_with_ai)} / ${fmt(t.repos_scanned)} repos · scan ${esc((hr.scan || {}).mode || 'none')}</div></div>
      <div class="card tile"><div class="label">Scheduled AI runs / day (est.)</div><div class="value">${fmt(tp.est_scheduled_ai_per_day)}</div><div class="delta">cap ${fmt(tp.cap_fleet)} · observed ${fmt(tp.observed_ai_runs_per_day)}/day all triggers</div>${meter(tp.est_scheduled_ai_per_day || 0, tp.cap_fleet || 1)}</div>
      <div class="card tile"><div class="label">Projected monthly Claude spend</div><div class="value">${usd(tr.projected_monthly)}</div><div class="delta">ceiling ${usd(tr.budget_monthly)} · WoW ${tr.wow_delta_pct == null ? '—' : tr.wow_delta_pct + '%'} · ${esc(tr.status || '')}</div>${meter(tr.projected_monthly || 0, tr.budget_monthly || 1)}</div>
      <div class="card tile"><div class="label">Repos at harness baseline</div><div class="value">${fmt(t.baseline_ok)} / ${baseTotal}</div><div class="delta">${fmt(t.kit_upgradeable)} machine seeds upgradeable</div>${meter(t.baseline_ok || 0, baseTotal || 1, 'good')}</div>
      <div class="card tile"><div class="label">Trip wires tripped</div><div class="value">${tripped} / ${wires.length}</div><div class="delta">hub scorecard · ${esc(h.generated_at || 'no data')}</div></div>

// ------------------------------------------------------------------ schedules
function cronHours(cron) {
  const f = String(cron || '').split(/\s+/); if (f.length !== 5) return [];
  const h = f[1]; if (h === '*' || h.startsWith('*/')) return [...Array(24).keys()];
  const out = []; h.split(',').forEach(p => { const m = p.match(/^(\d+)(?:-(\d+))?$/); if (!m) return; const a = +m[1], b = m[2] ? +m[2] : a; for (let i = a; i <= b && i < 24; i++) out.push(i); }); return out;
}

  const load = Array(24).fill(0), loadAll = Array(24).fill(0);

  const cap = tp.cap_per_utc_hour || 3;
  $('#tab-schedules').innerHTML = `
    <div class="grid">

      <div class="card tile"><div class="label">Phoenix</div><div class="value" style="font-size:18px">${reach}</div><div class="delta"><code>${esc(px.collector)}</code> · ${fmt(ex.count)} traces / ${fmt(ex.spans)} spans exported${ex.last ? ' · last ' + esc(ex.last) : ''}${CAPS && CAPS.otel_exporter === false ? ' · ' + status('warn', 'OTel exporter not installed (dry run still works)') : ''}</div></div>

      ${repos.map(r => `<tr><td><code>${esc(r.nwo)}</code>${r.factory ? ' <span title="GitFactory-managed: .factory/ blueprints">⚙</span>' : ''}${r.manifest ? ' <span title="declares fleet.manifest.yml">📜</span>' : ''}${r.archived ? ' <span class="muted">archived</span>' : ''}</td><td class="num">${fmt(r.runs)}</td><td class="num">${fmt(r.ai_runs)}</td><td class="num">${fmt(r.workflows)}</td><td class="num">${fmt(r.open_issues)}</td><td class="muted">${esc(r.last_run || '—')}</td><td class="muted">${esc(r.synced_at || '')}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">empty — sync first (needs gh auth)</td></tr>'}
    </tbody></table></div>
    <h2>Agent runs (with parsed agent facts first)</h2>
    <div class="sub">One trace per run: workflow → jobs → steps → the Claude step (model, turns, cost from the run log) → tool calls when the action ran with <code>show_full_output</code>. Exported rows show their Phoenix trace id. Runs whose log yielded those facts are listed first — an AI workflow's mention handler fires and skips on every issue comment, so plain recency buries them.</div>
    <div class="wrap"><table><thead><tr><th>repo</th><th>workflow</th><th>event</th><th>conclusion</th><th>model</th><th class="num">turns</th><th class="num">cost</th><th class="num">min</th><th>trace</th></tr></thead><tbody>
      ${runs.map(r => `<tr class="${r.conclusion === 'failure' ? 'bad' : ''}"><td><code>${esc(r.nwo)}</code></td><td><a href="${esc(r.html_url)}" target="_blank" rel="noopener">${esc(r.workflow_name)}</a></td><td>${esc(r.event)}</td><td>${r.conclusion === 'success' ? status('good', 'success') : r.conclusion === 'failure' ? status('crit', 'failure') : status('info', r.conclusion || r.status)}</td><td>${esc(r.model || '—')}</td><td class="num">${fmt(r.num_turns)}</td><td class="num">${r.cost_usd == null ? '—' : usd(r.cost_usd)}</td><td class="num">${r.duration_ms == null ? '—' : (r.duration_ms / 60000).toFixed(1)}</td><td>${r.trace_id ? '<code title="exported ' + esc(r.exported_at) + '">' + esc(r.trace_id.slice(0, 12)) + '…</code>' : '<span class="muted">not exported</span>'}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">no agent runs in the lake yet</td></tr>'}
    </tbody></table></div>
    <h2>Lines</h2>
    <div class="sub">Every workflow in the lake in GitFactory's vocabulary: a <b>line</b> compiled from a blueprint (⚙ header → <code>blueprint@hash</code>, ✓ when that blueprint is mirrored in the lake), its <b>gate</b> (a <code>vars.*_ENABLED</code> kill switch), triggers and crons, and its latest verdict. Hand-built workflows are the adoption candidates (gitorio specs/012).</div>
    <div class="toolbar"><input id="l-filter" type="text" placeholder="filter repo / path / kind…" size="34"><label class="inl"><input id="l-ai" type="checkbox" checked> AI lines only</label></div>

  const parse = s => { try { return JSON.parse(s || '[]'); } catch (e) { return []; } };
  const draw = () => { const q = $('#l-filter').value.toLowerCase(), ai = $('#l-ai').checked;
    $('#l-lines').innerHTML = lines.filter(w => (!ai || w.ai) && (!q || (w.nwo + ' ' + w.path + ' ' + (w.kind || '')).toLowerCase().includes(q))).map(w => {
      const trig = parse(w.triggers), crons = parse(w.crons);
      return `<tr><td><code>${esc(w.nwo)}</code></td><td><code>${esc(w.path.replace('.github/workflows/', ''))}</code></td><td>${w.ai ? (w.kind === 'mention-handler' ? '💬 ' : w.kind === 'scheduled-agent' ? '⏰ ' : '⚙️ ') + esc(w.kind) : '<span class="muted">non-AI</span>'}</td><td>${w.factory_blueprint ? '⚙ <code>' + esc(w.factory_blueprint.replace('.factory/', '')) + '@' + esc(w.factory_hash || '?') + '</code>' + (w.blueprint_in_lake ? ' ✓' : '') : '<span class="muted">hand-built</span>'}</td><td>${w.switch ? status('good', w.switch) : (w.kind === 'scheduled-agent' ? status('warn', 'no switch') : '<span class="muted">—</span>')}</td><td>${trig.map(esc).join(', ')}${crons.length ? ' <code>' + crons.map(esc).join(' | ') + '</code>' : ''}</td><td>${esc(w.model || '—')}${w.max_turns ? '/' + w.max_turns + 't' : ''}</td><td>${w.ai ? (/oauth/.test(w.auth || '') ? status('good', w.auth) : status('crit', w.auth || 'none')) : ''}</td><td>${w.last_conclusion === 'success' ? status('good', 'success') : w.last_conclusion === 'failure' ? status('crit', 'failure') : '<span class="muted">' + esc(w.last_conclusion || '—') + '</span>'}</td><td class="num">${fmt(w.runs)}</td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">no lines match — sync first</td></tr>'; };
  ['#l-filter', '#l-ai'].forEach(s => $(s).addEventListener('input', draw)); draw();
  $('#l-sync').onclick = () => runOp('lake-sync', { days: $('#l-days').value, target: $('#l-target').value.trim() });
  $('#l-export').onclick = () => runOp('lake-export', { days: $('#l-days').value, local: $('#l-local').checked, dry_run: $('#l-dry').checked, force: $('#l-force').checked });
  bindRunButtons('#tab-traces');
}

// ------------------------------------------------------------------ config
// The whole fleet contract (_data/fleet.yml), section by section. Saving edits
// the WORKING TREE with every comment preserved and shows the git diff — the
// commit and the PR stay with the human, exactly as they do for the generated
// data. Nothing here reaches a fleet repo; projecting the canonical variables
// outward is a separate, confirm-gated job (config-sync).
async function renderConfig() {
  let c; try { c = await api('/api/config'); } catch (e) { $('#tab-contract').innerHTML = status('crit', e.message); return; }
  const fid = k => 'c-' + k.replace(/[^A-Za-z0-9]/g, '-');
  const input = f => {
    if (!f.present) return `<span class="status info" title="not declared in ${esc(c.path)} — add the key by hand first, then it becomes editable here">not declared</span>`;
    const a = `id="${fid(f.key)}" data-key="${esc(f.key)}" data-kind="${esc(f.kind)}"`;
    if (f.kind === 'bool') return `<input type="checkbox" ${a}${f.value ? ' checked' : ''}>`;
    if (f.kind === 'choice') return `<select ${a}>${(f.choices || []).map(o => `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    if (f.kind === 'list') return `<input type="text" ${a} value="${esc((f.value || []).join(','))}" placeholder="comma-separated repo names" size="26">`;
    if (f.kind === 'int' || f.kind === 'float') return `<input type="number" step="any" ${a} value="${esc(f.value)}" style="width:120px">`;
    return `<input type="text" ${a} value="${esc(f.value)}" size="${f.kind === 'cron' ? 15 : 22}"${f.kind === 'cron' ? ' placeholder="m h dom mon dow"' : ''}>`;
  };
  // `harnesses:` opens by default — it is what this tab was before it grew the
  // rest of the contract, and what the Costs/Overview deep links come here for.
  const section = s => `<details class="card sect" data-section="${esc(s.key)}"${s.key === 'harnesses' ? ' open' : ''}>
    <summary><code>${esc(s.key)}:</code> ${esc(s.title)}<small>${esc(s.blurb)} <a href="https://github.com/bamr87/bamr87/blob/main/${esc(s.doc)}" target="_blank" rel="noopener">${esc(s.doc)}</a></small></summary>
    ${s.present ? '' : banner('warn', `no <code>${esc(s.key)}:</code> block in <code>${esc(c.path)}</code>`)}
    <form class="contract" data-section="${esc(s.key)}">${s.fields.map(f => `<label><span><code>${esc(f.path)}</code><small>${esc(f.help)}</small></span>${input(f)}</label>`).join('')}
      <div class="toolbar" style="margin:12px 0 0"><button class="btn primary" type="submit">Save <code>${esc(s.key)}:</code></button>
      ${s.key === 'harnesses' ? '<button class="btn" type="button" data-recompute title="re-grade the committed inventory against the new contract">then ↻ recompute (offline)</button>' : ''}
      ${s.key === 'variables' ? '<button class="btn" type="button" data-run=\'{"op":"config-sync"}\'>▶ project onto the fleet (dry run)</button>' : ''}</div></form></details>`;
  $('#tab-contract').innerHTML = `<div class="sub">Every knob the console may change in <code>${esc(c.path)}</code> — the control plane's own settings. Saving rewrites <b>only the blocks you edited</b>, comments intact, and shows the git diff; <b>the commit (and the PR) stays with you</b>. A key the file doesn't declare is shown read-only: add it by hand first, so the console can never invent contract structure. Values that must reach GitHub (canonical variables, secrets) still travel through their own confirm-gated jobs.</div>
    ${CAPS && CAPS.config_editing === false ? banner('warn', 'ruamel.yaml missing — editing disabled (<code>pip install ruamel.yaml</code>)') : ''}
    <div class="split"><div>${c.sections.map(section).join('')}</div>
      <div><h2>Working tree</h2><div class="card"><div class="sub" style="margin:0">Saved edits land in <code>${esc(c.path)}</code> and nowhere else. Review them in git, commit, open a PR — the drift gate and the fixture tests are what verify a contract change, and they run on the PR.</div>
        <div class="toolbar" style="margin:10px 0 0"><button class="btn" data-run='{"op":"tests"}'>▶ fixture tests</button><button class="btn" data-run='{"op":"drift"}'>▶ drift gate</button><button class="btn" data-run='{"op":"config-show"}'>▶ dash config show</button></div></div>
      <pre class="log" id="c-diff" hidden></pre>
      <h2>Read-only here</h2><div class="card"><b>Hub identity</b><table class="ref" style="margin-top:6px;border:0">${Object.entries(STATE.contract.hub || {}).map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join('')}</table>
        <div class="sub" style="margin:10px 0 0">Also read-only: the dependency policy (<code>latest</code>, never a lockfile), the token contract (Auth tab), and every policy key <code>fleet.yml</code> itself calls non-negotiable — <code>rotation.hub_first</code>, <code>issue_pipeline.autonomy.never_merge</code>. Those change in an editor, with the comment that explains why.</div></div></div></div>`;
  $('#tab-contract').querySelectorAll('form.contract').forEach(form => {
    form.onsubmit = async e => {
      e.preventDefault();
      const changes = {};
      form.querySelectorAll('[data-key]').forEach(el => { changes[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value; });
      try {
        const r = await api('/api/config', { method: 'PUT', body: JSON.stringify({ changes }) });
        const d = $('#c-diff'), keys = Object.keys(r.applied);
        d.hidden = false; d.textContent = keys.length ? (r.diff || '(no diff — already saved?)') : 'nothing changed';
        toast(keys.length ? 'saved: ' + keys.join(', ') : 'no changes');
        STATE = await api('/api/state'); renderMeta();
      } catch (err) { toast(err.message, true); }
    };
  });
  const rc = $('#tab-contract [data-recompute]'); if (rc) rc.onclick = () => runOp('harnesses-offline', {});
  bindRunButtons('#tab-contract');
}

// ------------------------------------------------------------------ auth
// The console can be HANDED a credential instead of dead-ending at "go find a
// terminal". A value posted here lives in this process's environment — which is
// exactly what a job inherits — and dies with the process; writing it to the
// gitignored .env is a separate, explicitly confirmed step; a GitHub token can
// instead go to `gh auth login --with-token` over stdin so the CLI's own store
// keeps it. Nothing ever reads a value back: this page only ever learns which
// names are present and where they came from.
async function renderAuth() {
  let a; try { a = await api('/api/auth'); } catch (e) { $('#tab-auth').innerHTML = status('crit', e.message); return; }
  const gh = a.github || {}, cl = a.claude || {}, ef = a.env_file || {}, rot = (STATE.rotation || {}).tokens || [];
  const ghState = !gh.cli ? status('crit', 'gh CLI not installed')
    : gh.authenticated ? status('good', `signed in${gh.account ? ' as ' + gh.account : ''}${gh.host ? ' @ ' + gh.host : ''}`)
    : status('warn', 'not signed in');
  const row = c => `<div class="cred"><div class="n"><code>${esc(c.name)}</code> ${c.present ? status('good', c.source === 'session' ? 'set in this console' : 'in the environment') : status('warn', 'absent')}${c.in_env_file ? ' ' + status('info', 'in .env') : ''}
      <small>${esc(c.label)} — ${esc(c.help)} <a href="${esc(c.url)}" target="_blank" rel="noopener">↗</a></small>
      <div class="set"><input type="password" data-cred="${esc(c.name)}" placeholder="paste value…" size="26" autocomplete="off" spellcheck="false">
        <label class="inl"><input type="checkbox" data-persist="${esc(c.name)}"> also write to <code>.env</code></label>
        <button class="btn primary" data-set="${esc(c.name)}">Set</button>
        ${c.present || c.in_env_file ? `<button class="btn danger" data-clear="${esc(c.name)}">Clear</button>` : ''}</div></div>
    <div class="muted" style="white-space:nowrap">${rot.filter(t => t.name === c.name).map(t => `oldest ${fmt(t.oldest_age_days)}d / ${fmt(t.max_age_days)}d`).join('') || ''}</div></div>`;
  $('#tab-auth').innerHTML = `<div class="sub">Credentials for <b>this console process</b>. A value you set here reaches the jobs the console runs — the same environment a terminal would give them — and dies when the console stops, unless you also write it to <code>.env</code> (gitignored, mode 600). Values are never returned, logged, or put on a command line; this page only ever sees which names are present. The fleet's own copies live in GitHub Actions secrets and are rotated by <a href="https://github.com/bamr87/bamr87/blob/main/docs/TOKEN-ROTATION.md" target="_blank" rel="noopener">token-rotation.yml</a>.</div>
    ${a.writes_enabled ? '' : banner('warn', 'Credential writes are disabled (<code>DASH_CONSOLE_AUTH=off</code>) — this page is read-only.')}
    ${a.console_token_required ? '' : banner('info', 'No <code>DASH_CONSOLE_TOKEN</code> set: this console is protected by the loopback Host guard alone. Set one before serving it anywhere but localhost.')}
    ${ef.tracked_by_git ? banner('crit', `<code>${esc(ef.path)}</code> is TRACKED BY GIT — the console refuses to write a credential into it.`) : ''}
    <div class="split"><div>
      <h2>GitHub</h2><div class="card">${ghState}
        ${gh.scopes && gh.scopes.length ? `<div class="sub" style="margin:8px 0 0">scopes: ${gh.scopes.map(s => `<code>${esc(s)}</code>`).join(' ')}${gh.protocol ? ' · protocol ' + esc(gh.protocol) : ''}</div>` : ''}
        ${gh.env_token ? banner('warn', `<code>${esc(gh.env_token)}</code> is set in this process's environment — gh prefers it over a stored login, so a sign-in here will not change which token gh uses until you clear it.`) : ''}
        <div class="sub" style="margin:8px 0 4px">Paste a personal access token; it goes to <code>gh auth login --with-token</code> over <b>stdin</b>, never a command line, and the CLI's own credential store keeps it. Fleet work needs <code>repo</code>, <code>workflow</code> and <code>read:org</code> — cross-repo PRs and secret writes want a <code>FLEET_TOKEN</code> below instead.</div>
        <div class="set"><input type="password" id="gh-token" placeholder="ghp_… / github_pat_…" size="30" autocomplete="off" spellcheck="false">
          <button class="btn primary" id="gh-login" ${a.writes_enabled && gh.cli ? '' : 'disabled'}>Sign in</button>
          ${gh.authenticated ? `<button class="btn danger" id="gh-logout" ${a.writes_enabled ? '' : 'disabled'}>Sign out</button>` : ''}
          <a class="btn" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener" style="text-decoration:none">Create a token ↗</a></div>
        ${gh.message ? `<pre class="log" style="max-height:120px;margin-top:10px">${esc(gh.message)}</pre>` : ''}</div>
      <h2>Claude</h2><div class="card">${cl.oauth ? status('good', 'CLAUDE_CODE_OAUTH_TOKEN present') : cl.api_key ? status('warn', 'API key only — the fleet convention is OAuth first') : status('warn', 'no Claude credential')}
        <div class="sub" style="margin:8px 0 0">The OAuth token is minted by a browser flow that cannot run headlessly: run <code>claude setup-token</code> in a terminal${cl.cli ? '' : ' (the <code>claude</code> CLI is not on this PATH)'} and paste the result into <code>CLAUDE_CODE_OAUTH_TOKEN</code> opposite. It lasts a year; <code>token-rotation.yml</code> propagates the hub's copy to the fleet weekly, and only ever propagates one that is newer than what a repo already has.</div></div>
      <h2>Where values live</h2><div class="card"><table class="ref" style="border:0"><tr><td><b>this process</b></td><td>every credential you Set — inherited by jobs, gone when the console stops</td></tr>
        <tr><td><b><code>${esc(ef.path)}</code></b></td><td>${ef.exists ? 'exists' : 'absent'}${ef.names && ef.names.length ? ' · declares ' + ef.names.map(n => `<code>${esc(n)}</code>`).join(', ') : ''} — gitignored, mode 600, written only on an explicit confirm</td></tr>
        <tr><td><b>gh CLI store</b></td><td>the GitHub login above (keychain / config file, this machine only)</td></tr>
        <tr><td><b>GitHub Actions</b></td><td>the fleet's copies — audited by <code>dash secrets</code>, rotated weekly, never readable back</td></tr></table></div></div>
      <div><h2>Credentials</h2><div class="card">${(a.credentials || []).map(row).join('')}</div>
      <h2>The token contract</h2><div class="sub">Names and placement from <code>_data/fleet.yml</code> <code>tokens:</code> — never values.</div>
      <div class="wrap"><table><thead><tr><th>secret</th><th>scope</th><th>used by</th></tr></thead><tbody>${(STATE.tokens || []).map(t => `<tr><td><code>${esc(t.name)}</code>${t.deprecated ? ' ' + status('warn', 'deprecated') : ''}</td><td>${esc(t.scope)}${t.required ? ' · required' : ''}</td><td class="muted">${esc((t.used_by || []).join(', '))}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">no contract</td></tr>'}</tbody></table></div>
      <div class="toolbar" style="margin-top:12px"><button class="btn" data-run='{"op":"secrets-audit"}'>▶ audit the fleet's secrets</button><button class="btn" data-run='{"op":"secrets-plan"}'>▶ rotation plan</button></div></div></div>`;

  const refresh = async () => { CAPS = await api('/api/capabilities'); renderMeta(); renderAuth(); };
  $('#tab-auth').querySelectorAll('[data-set]').forEach(b => b.onclick = async () => {
    const name = b.dataset.set, el = $(`[data-cred="${name}"]`), persist = $(`[data-persist="${name}"]`).checked;
    if (!el.value.trim()) { toast('paste a value first', true); return; }
    if (persist && !confirm(`Write ${name} to ${ef.path}?\n\nIt is gitignored and written mode 600, but it IS a credential on disk.`)) return;
    try {
      await api('/api/auth/credential', { method: 'PUT', body: JSON.stringify({ name, value: el.value.trim(), persist, confirm: persist }) });
      el.value = ''; toast(name + ' set' + (persist ? ' and written to .env' : ' for this console')); refresh();
    } catch (e) { toast(e.message, true); }
  });
  $('#tab-auth').querySelectorAll('[data-clear]').forEach(b => b.onclick = async () => {
    const name = b.dataset.clear;
    const purge = confirm(`Clear ${name} from this console.\n\nOK also removes it from ${ef.path}; Cancel clears only the running process.`);
    try { await api(`/api/auth/credential/${encodeURIComponent(name)}?purge=${purge}`, { method: 'DELETE' }); toast(name + ' cleared'); refresh(); }
    catch (e) { toast(e.message, true); }
  });
  const login = $('#gh-login'); if (login) login.onclick = async () => {
    const el = $('#gh-token'); if (!el.value.trim()) { toast('paste a token first', true); return; }
    try { const r = await api('/api/auth/github', { method: 'POST', body: JSON.stringify({ action: 'login', token: el.value.trim() }) });
      el.value = ''; toast(r.ok ? 'gh signed in' : r.message, !r.ok); refresh(); }
    catch (e) { toast(e.message, true); }
  };
  const logout = $('#gh-logout'); if (logout) logout.onclick = async () => {
    if (!confirm('Sign the gh CLI out of github.com on this machine?')) return;
    try { const r = await api('/api/auth/github', { method: 'POST', body: JSON.stringify({ action: 'logout' }) });
      toast(r.ok ? 'gh signed out' : r.message, !r.ok); refresh(); }
    catch (e) { toast(e.message, true); }
  };
  bindRunButtons('#tab-auth');
}

// ------------------------------------------------------------------ jobs
function renderJobs() {
  const groups = ['observe', 'plan', 'verify', 'lake', 'deploy'];
  $('#tab-jobs').innerHTML = `<div class="split"><div class="card ops"><h2>Run an operation</h2>
    <select id="op-select">${groups.map(g => `<optgroup label="${g}">${OPS.filter(o => o.group === g).map(o => `<option value="${o.id}">${esc(o.title)}</option>`).join('')}</optgroup>`).join('')}</select>
    <div id="op-params" style="margin:10px 0"></div><div class="toolbar"><button class="btn primary" id="op-run">▶ Run</button><span class="muted" id="op-desc"></span></div>
    <details style="margin-top:14px"><summary>Every allowlisted operation</summary>${OPS.map(o => `<div class="op"><div class="t"><b>${esc(o.title)}</b> <code>${esc(o.id)}</code>${o.remote_write ? ' ' + status('warn', 'can write to GitHub') : ''}${o.needs_token ? ' <span class="muted">needs gh auth</span>' : ''}<small>${esc(o.desc)}</small></div><button class="btn" data-run='${JSON.stringify({ op: o.id })}'>▶</button></div>`).join('')}</details></div>
    <div><h2>Jobs</h2><div class="wrap"><table><thead><tr><th>status</th><th>operation</th><th>started</th><th class="num">exit</th><th></th></tr></thead><tbody id="jobs-rows"></tbody></table></div>
    <h2 id="log-title">Log</h2><pre class="log" id="log">select a job</pre></div></div>`;
  const sel = $('#op-select');
  const paramsFor = id => { const o = OPS.find(x => x.id === id) || {}; $('#op-desc').textContent = o.desc || '';
    const p = o.params || []; $('#op-params').innerHTML = p.map(k => ({
      days: `<label class="inl">days <input id="p-days" type="number" min="1" max="90" value="14" style="width:80px"></label>`,
      target: `<label class="inl">target <input id="p-target" type="text" placeholder="submodule name" size="22"></label>`,
      artifacts: `<label class="inl">artifacts <input id="p-artifacts" type="text" value="claude" size="24"></label>`,
      upgrade: `<label class="inl"><input id="p-upgrade" type="checkbox"> upgrade machine seeds</label>`,
      apply: `<label class="inl"><input id="p-apply" type="checkbox"> <b>apply</b> (write to GitHub)</label>`,
      key: `<label class="inl">key <input id="p-key" type="text" placeholder="harnesses.budget" size="24"></label>`,
      workflow: `<label class="inl">workflow <select id="p-workflow">${['harness-fanout', 'fleet-pulse', 'issue-pipeline', 'token-rotation', 'repo-evolution', 'standardize-fanout', 'schema-fanout', 'build-dash', 'reconcile-registry', 'refresh-dash', 'update-submodules'].map(w => `<option>${w}</option>`).join('')}</select></label>`,
      fields: `<label class="inl">inputs <input id="p-fields" type="text" placeholder="key=value,key=value" size="34"></label>`,
      jobs: `<label class="inl">jobs+steps for <select id="p-jobs"><option>ai</option><option>all</option><option>none</option></select> runs</label>`,
      logs: `<label class="inl">logs for <select id="p-logs"><option>ai</option><option>all</option><option>none</option></select> runs</label>`,
      local: `<label class="inl"><input id="p-local" type="checkbox"> include this machine's Claude Code sessions</label>`,
      dry_run: `<label class="inl"><input id="p-dry_run" type="checkbox" checked> dry run (preview only)</label>`,
      force: `<label class="inl"><input id="p-force" type="checkbox"> force (resend exported traces)</label>`,
    })[k] || '').join(' '); };
  sel.onchange = () => paramsFor(sel.value); paramsFor(sel.value);
  $('#op-run').onclick = () => { const id = sel.value, params = {};
    ['days', 'target', 'artifacts', 'key', 'workflow', 'jobs', 'logs'].forEach(k => { const el = $('#p-' + k); if (el && el.value !== '') params[k] = el.value; });
    ['upgrade', 'apply', 'local', 'dry_run', 'force'].forEach(k => { const el = $('#p-' + k); if (el) params[k] = el.checked; });
    const f = $('#p-fields'); if (f && f.value.trim()) { params.fields = {}; f.value.split(',').forEach(kv => { const [k, ...v] = kv.split('='); if (k.trim()) params.fields[k.trim()] = v.join('=').trim(); }); }
    runOp(id, params); };
  bindRunButtons('#tab-jobs'); drawJobs();
}
function drawJobs() {
  const rows = $('#jobs-rows'); if (!rows) return;
  rows.innerHTML = JOBS.map(j => `<tr class="${j.status === 'failed' ? 'bad' : ''}"><td>${j.status === 'succeeded' ? status('good', 'succeeded') : j.status === 'failed' ? status('crit', 'failed') : j.status === 'cancelled' ? status('warn', 'cancelled') : status('info', j.status)}</td><td><b>${esc(j.title)}</b>${j.remote_write ? ' ' + status('warn', 'remote') : ''}<br><code class="muted">${esc(j.argv.map(a => a.replace(/^.*\/tools\//, 'tools/')).join(' '))}</code></td><td class="muted">${j.started ? new Date(j.started).toLocaleTimeString() : '—'}</td><td class="num">${j.exit_code ?? ''}</td><td><button class="btn" data-log="${j.id}">log</button>${j.status === 'running' ? ` <button class="btn danger" data-cancel="${j.id}">✖</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">no jobs yet</td></tr>';
  rows.querySelectorAll('[data-log]').forEach(b => b.onclick = () => watch(b.dataset.log));
  rows.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => { try { await api(`/api/jobs/${b.dataset.cancel}/cancel`, { method: 'POST' }); toast('cancel requested'); } catch (e) { toast(e.message, true); } });
}
function bindRunButtons(scope) { document.querySelectorAll(scope + ' button[data-run]').forEach(b => b.onclick = () => { const r = JSON.parse(b.dataset.run); runOp(r.op, r.params || {}); }); }
async function runOp(op, params) {
  const o = OPS.find(x => x.id === op) || {};
  const remote = o.remote_write && (params.apply === true || op === 'dispatch');
  if (remote) {
    const detail = op === 'dispatch' ? `Dispatch ${params.workflow}.yml in GitHub Actions with ${JSON.stringify(params.fields || {})}` : `${o.title} — WITH --apply: this opens pull requests / writes secrets in fleet repos.`;
    if (!confirm(detail + '\n\nContinue?')) return;
  }
  if (o.needs_token && CAPS && CAPS.gh_authenticated === false && !confirm('gh is not authenticated in the console’s environment — this operation will probably degrade or fail. Run anyway?')) return;
  try {
    const job = await api('/api/jobs', { method: 'POST', body: JSON.stringify({ op, params, confirm: !!remote }) });
    toast('started: ' + job.title);
    if (ACTIVE !== 'jobs') $('#nav button[data-tab="jobs"]').click();
    JOBS = await api('/api/jobs'); drawJobs(); watch(job.id);
  } catch (e) { toast(e.message, true); }
}
function watch(id) {
  clearInterval(POLL); CURRENT_JOB = id; let offset = 0; const log = $('#log'); if (!log) return;
  // Keep the raw text: an SGR sequence can straddle two poll chunks, so the
  // decode has to run over the whole log, not per-chunk.
  let raw = ''; log.textContent = '';
  const tick = async () => { try { const t = await api(`/api/jobs/${id}?offset=${offset}`); if (t.text) {
        // Only follow the tail if the reader is already at the bottom —
        // otherwise a streaming job yanks the view back every second and you
        // cannot read what scrolled past.
        const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        raw += t.text; offset = t.offset;
        log.innerHTML = ansiToHtml(raw);
        if (pinned) log.scrollTop = log.scrollHeight;
      }
      $('#log-title').textContent = `Log — ${t.job.title} (${t.job.status})`;
      if (t.done) { clearInterval(POLL); POLL = null; JOBS = await api('/api/jobs'); drawJobs(); if (t.job.status === 'succeeded') { STATE = await api('/api/state'); renderMeta(); if (ACTIVE !== 'jobs') renderTab(ACTIVE); } } }
    catch (e) { clearInterval(POLL); toast(e.message, true); } };
  tick(); POLL = setInterval(tick, 1000);
}

// ------------------------------------------------------------------ boot
$('#refresh').onclick = loadAll;
$('#theme').onclick = () => { const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('console_theme', r.dataset.theme); } catch (e) {} };
try { const t = localStorage.getItem('console_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
loadAll();
</script>
