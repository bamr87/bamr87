# The ONE spec for repo-scout's agent step: .github/workflows/repo-scout.yml,
# job `scout`, step id `scout` (tools/jev/steps/README.md, docs/adr/0002).
#
# The plan job renders scout.prompt.txt per matrix leg (repo_scout.build_plan ->
# tools/jev/spec.py) and the step reads it as `prompt: ${{ matrix.prompt }}`.
# Model, turns and dollars are REFERENCES into _data/fleet.yml, never copies.
# The caps and the allowlist are also literals in that step's claude_args
# (harness_registry and test_ai_budget read literals); `python3 -m tools.jev
# steps check` holds every copy equal to what this file resolves to.
schema: loop-step/v1
# == this directory == the workflow stem (the console's LOOPS id repo_scout
# joins through its `workflow` field)
loop: repo-scout
step: scout
# <workflow file>:<job id>, the key of _data/fleet.yml budget.call_sites
call_site: repo-scout.yml:scout
# the claude-code-action step's `id:` in that job
step_id: scout

# Beside this file: UTF-8, LF, exactly one trailing newline, never .md.
prompt: scout.prompt.txt
# {{TOKEN}} -> the plan.json include[] key whose value fills it. BRIEF is the
# bare file name; the prompt keeps the literal `.scout/`.
inputs:
  NWO: nwo
  REPO_NAME: name
  BRANCH: branch
  BRIEF: brief

# Resolved from _data/fleet.yml. The model must be an exact id in
# ai_models.allowed (constitution 13.3); CI passes it as
# --model ${{ needs.plan.outputs.model }}.
model_from: scout.model
max_turns_from: scout.max_turns
# == jobs.scout.timeout-minutes; the local engine's wall clock
timeout_minutes: 30

# == claude_args --allowedTools, joined with "," in THIS order. Read-only and
# run-to-verify, plus Write for the one file the agent produces.
allowed_tools:
  - Bash(git status:*)
  - Bash(git diff:*)
  - Bash(git log:*)
  - Bash(git show:*)
  - Bash(git grep:*)
  - Bash(git ls-files:*)
  - Bash(git blame:*)
  - Bash(ls:*)
  - Bash(cat:*)
  - Bash(head:*)
  - Bash(tail:*)
  - Bash(grep:*)
  - Bash(find:*)
  - Bash(wc:*)
  - Bash(sed:*)
  - Bash(awk:*)
  - Bash(cut:*)
  - Bash(sort:*)
  - Bash(uniq:*)
  - Bash(tr:*)
  - Bash(jq:*)
  - Bash(diff:*)
  - Bash(echo:*)
  - Bash(mkdir:*)
  - Bash(cd:*)
  - Bash(npm:*)
  - Bash(npx:*)
  - Bash(node:*)
  - Bash(python3:*)
  - Bash(python:*)
  - Bash(pip:*)
  - Bash(pytest:*)
  - Bash(bundle:*)
  - Bash(ruby:*)
  - Bash(gem:*)
  - Bash(go:*)
  - Bash(cargo:*)
  - Bash(make:*)
  - Bash(shellcheck:*)
  - Read
  - Grep
  - Glob
  - Write

# What a runner must reproduce. CI implements it in the job's steps, except
# what `exceptions` names; the local engine (P1) builds all of it. Parity
# asserts each part that has a CI counterpart and reports each exception.
workspace:
  # the row's nwo at the row's branch, full history, no persisted credential
  cwd: target
  # == the scout job's download-artifact path; excluded via .git/info/exclude
  brief_dir: .scout
  # == the upload-artifact path; an absent file is zero proposals (valid)
  outputs:
    - .scout/proposals.json
  # The contract: no GitHub credential reaches the agent. Parity refuses one
  # the step inherits or carries (workflow, job or step env, its own inputs, an
  # earlier $GITHUB_ENV export) and reports what the action itself still does.
  github_credential: none
  # Known gaps CI leaves open today (ADR 0002, follow-ups outside P0). Parity
  # fails when a gap is open and undeclared, and when a declared one is closed.
  exceptions:
    app-token: >-
      claude-code-action, given no github_token input, still exports its OIDC App
      token (contents, issues, pull requests: write) to the agent's subprocesses;
      the fix (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB, a read-only github_token posture,
      or base-action) is a follow-up issue the maintainer files
    setting-sources: >-
      claude_args passes no --setting-sources, so the target checkout's
      .claude/settings.json (permissions.allow, hooks) loads in CI; the same
      follow-up issue, and P1's runner isolates settings itself

# Constitution 13.6: every action tagged reversible / external / money and
# tiered; irreversible, external or money starts high. DECLARED, not enforced:
# CI reads neither tier today — the agent runs ungated, and the scheduled file
# job runs --apply without a human yes, gated only by REPO_SCOUT_ENABLED.
risk:
  agent:
    what: >-
      runs the target repo's own tooling (interpreters, package managers, make,
      sed) over untrusted repo and issue text, with network egress, on an
      ephemeral runner; its one kept output is .scout/proposals.json
    # external: egress plus the App token above (constitution 13.8); it comes
    # down only through 13.7, or a 13.9 re-tier once P1's sandbox removes both
    tags:
      - external
    tier: high
  publish:
    what: dash-gen scout-file --apply files the proposals as issues in the target repository (the file job)
    tags:
      - external
    tier: high

# Constitution 13.1: the eval set's path, null during the grace period.
evals: null

# P1: how `python3 -m tools.jev loop` runs this step on a workstation (docs/JEV.md,
# ADR 0002 P1). CI ignores this block; the prompt above stays the CI prompt.
local:
  # a key of tools/jev/adapters REGISTRY (tools/jev/adapters/repo_scout.py)
  adapter: repo_scout
  # == repo-scout.yml plan job `if:` (vars.REPO_SCOUT_ENABLED == 'true'): a
  # local --scheduled run reads the variable the way the cron does; a manual
  # run bypasses it as a workflow_dispatch does. `steps check` holds them equal.
  switch:
    config: scout.enabled
    variable: REPO_SCOUT_ENABLED
    default: 'off'
  # the plan job's command; its stdout is plan.json, the briefs land in {plan_dir}
  planner:
    argv: [scout, --out-dir, '{plan_dir}']
    flags:
      target: --target
      focus: --focus
      day: --day
      offline: --offline
      no_files: --no-briefs
  # the file job's command, plus the exact issue bodies for the reviewer;
  # --apply only after the 13.6 yes (risk.publish is high). {bodies_dir} is the
  # phase's own directory (items/<dir>/bodies for the preview, filed/ for the
  # apply), so filing never overwrites the reviewed bytes.
  publish:
    argv: [scout-file, --nwo, '{nwo}', --proposals, '{validated}', --run-url, '{run_ref}', --bodies-dir,
           '{bodies_dir}']
    apply_flag: --apply
    risk: publish
  # JEV's rule, a deliberate divergence from CI's file job (which files what a
  # budget-hit leg left behind): a budget-hit attempt is discarded
  on_budget_hit: discard
  # The context pack (tools/jev/context.py): read-only, redacted, capped data
  # the HOST gathers before an attempt — the lake, the code index, the
  # telemetry and this loop's own earlier attempts — placed as
  # <brief_dir>/<file> in the clone, with a pointer appended to the clone's
  # copy of the brief (never the plan's brief, never the prompt above). CI has
  # no pack: `loop run --context off` is the CI-identical local run. The values
  # below are the defaults, spelled out.
  context:
    # auto: build it and note an unavailable plane; require: an unavailable
    # plane fails the item before any spend; 'off' (quoted: a bare off is a
    # YAML boolean): no pack
    mode: auto
    # a bare .md name beside the brief: never a brief's name or a declared output
    file: context.md
    providers: [history, lake_issues, lake_ci, lake_agents, index_code, telemetry_errors]
    # the rendered pack's cap (about 4k tokens), 2000..64000
    max_chars: 16000
    # the planes' wall clock, seconds, at most 300
    deadline_s: 20
    # the lake and telemetry window, 1..365 days
    days: 30
