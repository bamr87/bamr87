# The ONE spec for the evolution agent's step: .github/workflows/repo-evolution.yml,
# job `evolve`, step id `evolve` (tools/jev/steps/README.md, docs/adr/0002 P3).
#
# The prompt names its repository, branch and brief through four {{TOKEN}}
# inputs the matrix row fills; the workflow carries the same text inline with
# the matrix expressions in their place, and parity holds the two byte-equal.
# Model, turns and dollars are REFERENCES into _data/fleet.yml, never copies;
# the caps and the allowlist are also literals in that step's claude_args
# (harness_registry and test_ai_budget read literals), and
# `python3 -m tools.jev steps check` holds every copy equal to this file.
schema: loop-step/v1
# == this directory == the workflow stem (the console's LOOPS id repo_evolution
# joins through its `workflow` field)
loop: repo-evolution
step: evolve
# <workflow file>:<job id>, the key of _data/fleet.yml budget.call_sites
call_site: repo-evolution.yml:evolve
# the claude-code-action step's `id:` in that job
step_id: evolve

# Beside this file: UTF-8, LF, exactly one trailing newline, never .md.
prompt: evolve.prompt.txt
# {{TOKEN}} → the plan.json include[] key that fills it (dash-gen targets)
inputs:
  NWO: nwo
  REPO_NAME: name
  BRANCH: branch
  BRIEF: brief

# Resolved from _data/fleet.yml. The model must be an exact id in
# ai_models.allowed (constitution 13.3): `opus` became claude-opus-5-5 there
# and in the workflow's literal (ADR 0002 P3).
model_from: evolution.model
max_turns_from: evolution.max_turns
# == jobs.evolve.timeout-minutes; the local engine's wall clock
timeout_minutes: 45

# == claude_args --allowedTools, joined with "," in THIS order: read / verify
# commands and the editing tools, no `git push`, no `git checkout`, no writing
# `gh` verb — publishing is the workflow's job (CI) or the filer's (locally).
allowed_tools:
  - Bash(git status:*)
  - Bash(git diff:*)
  - Bash(git log:*)
  - Bash(git show:*)
  - Bash(git grep:*)
  - Bash(git ls-files:*)
  - Bash(git blame:*)
  - Bash(git restore:*)
  - Bash(gh issue view:*)
  - Bash(gh issue list:*)
  - Bash(gh pr view:*)
  - Bash(gh pr list:*)
  - Bash(gh pr diff:*)
  - Bash(gh run view:*)
  - Bash(gh run list:*)
  - Bash(ls:*)
  - Bash(cat:*)
  - Bash(head:*)
  - Bash(tail:*)
  - Bash(grep:*)
  - Bash(find:*)
  - Bash(wc:*)
  - Bash(sed:*)
  - Bash(awk:*)
  - Bash(cut:*)
  - Bash(sort:*)
  - Bash(uniq:*)
  - Bash(tr:*)
  - Bash(jq:*)
  - Bash(diff:*)
  - Bash(echo:*)
  - Bash(mkdir:*)
  - Bash(cd:*)
  - Bash(npm:*)
  - Bash(npx:*)
  - Bash(node:*)
  - Bash(python3:*)
  - Bash(python:*)
  - Bash(pip:*)
  - Bash(pytest:*)
  - Bash(bundle:*)
  - Bash(ruby:*)
  - Bash(gem:*)
  - Bash(go:*)
  - Bash(cargo:*)
  - Bash(make:*)
  - Bash(shellcheck:*)
  - Read
  - Grep
  - Glob
  - Edit
  - Write

# What a runner must reproduce. CI implements it in the job's steps, except
# what `exceptions` names; the local engine builds all of it.
workspace:
  # the TARGET repository is the checkout (CI: actions/checkout of matrix.nwo
  # at matrix.branch; locally: a clone of the item's nwo at its branch)
  cwd: target
  # the brief's directory inside the clone, git-excluded; locally also the
  # engine's own directory (the agent's TMPDIR, the context pack)
  brief_dir: .evolution
  # the agent keeps no file output: its edits to the checkout are the pass
  # (local.harvest: patch), and its final message becomes the PR body
  outputs: []
  # The posture CI gives this step, exactly: FLEET_TOKEN as GH_TOKEN in the
  # step's env, for the read-only gh verbs the allowlist grants (issue/pr
  # view and list, pr diff, run view and list) on private targets. Parity
  # holds the step to exactly that route. The LOCAL engine hands the agent no
  # credential (its environment is built from scratch and gh is denied): the
  # brief already carries the listed issues and PRs, and the filer holds the
  # credential, behind --apply.
  github_credential: fleet-read
  # Known gaps CI leaves open today (ADR 0002)
  exceptions:
    app-token: >-
      claude-code-action, given no github_token input, still exports its OIDC App
      token (contents, issues, pull requests: write) to the agent's subprocesses;
      the fix (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB, a read-only github_token posture,
      or base-action) is a follow-up issue the maintainer files
    setting-sources: >-
      claude_args passes no --setting-sources, so the target checkout's own
      .claude/settings.json (permissions.allow, hooks) loads in CI; the same
      follow-up issue, and the local runner isolates settings itself

# Constitution 13.6 / 13.8: in CI the step meets the lethal trifecta —
# private data (FLEET_TOKEN as GH_TOKEN, a private target's issues), untrusted
# content (the target repository and its issue text) and an external send
# (the workflow's publish step pushes a branch and opens a draft PR with that
# token) — ungated. Locally every leg is cut: no credential, no network, and
# the only send is the engine's filer after the maintainer's --apply.
risk:
  agent:
    what: >-
      runs the target repo's own tooling (interpreters, package managers, make,
      sed) over untrusted repo and issue text and edits the checkout; in CI the
      workflow then commits as bamr87-bot, pushes an ai-evolution/<date>-<run>
      branch and opens a draft PR in the target repository with FLEET_TOKEN
    tags:
      - external
    tier: high
  publish:
    what: >-
      dash-gen evolve-file --apply would push the ai-evolution branch to the
      target repository and open the draft PR, its body carrying the brief's
      marker line CI dedupes on (refused until bamr87/bamr87#488's publish
      step lands)
    tags:
      - external
    tier: high

# Constitution 13.1: the eval set's path, null during the grace period.
evals: null

# How `python3 -m tools.jev loop` runs this step on a workstation (docs/JEV.md,
# ADR 0002 P3). CI ignores this block; the prompt above stays the CI prompt.
local:
  # a key of tools/jev/adapters REGISTRY (tools/jev/adapters/repo_evolution_evolve.py)
  adapter: repo_evolution_evolve
  # == repo-evolution.yml plan job `if:` (vars.REPO_EVOLUTION_ENABLED != 'false'):
  # default ON, a switch added to a loop already in service. `steps check`
  # holds them equal.
  switch:
    config: evolution.enabled
    variable: REPO_EVOLUTION_ENABLED
    default: 'on'
  # CI's plan job, exactly: `dash-gen targets` selects the opted-in submodules,
  # skips a repo whose previous pass is still open, caps the run and writes one
  # brief per target; its stdout is plan.json, every row carrying the prompt
  # rendered from this spec
  planner:
    argv: [targets, --out-dir, '{plan_dir}']
    flags:
      target: --target
      focus: --focus
      offline: --offline
      no_files: --no-briefs
  # the filer: a dry run of the validated patch + the draft PR body (the exact
  # bytes for the reviewer); --apply only after the 13.6 yes, and refused by
  # the filer itself in this release (#488)
  publish:
    argv: [evolve-file, --item, '{validated}', --run-url, '{run_ref}', --bodies-dir, '{bodies_dir}']
    apply_flag: --apply
    risk: publish
  # This loop's own rule (bamr87/bamr87#488, #238): a pass stopped at its
  # dollar cap is previewed FLAGGED as partial — the body CI's publish step
  # would write carries the same warning — never silently discarded; a genuine
  # turn exhaustion (no reported success) is still discarded, as CI's salvage
  # step publishes only a reported success.
  on_budget_hit: publish-flagged
  # the agent's edits to the checkout ARE the output: the engine diffs the
  # clone against the fresh HEAD and hands the adapter changes.patch
  harvest: patch
  # The context pack beside the brief directory (the CI-identical run is
  # `--context off`): the target's lake rows, code index and telemetry, and
  # this loop's earlier attempts on the repository.
  context:
    mode: auto
    file: context.md
    # `library`: the experience library's lessons for this loop in the item's domain
    # (docs/HARNESS-REFINEMENT.md, ADR 0004), data to re-verify, trimmed just before history
    providers: [history, library, lake_issues, lake_ci, lake_agents, index_code, telemetry_errors]
    max_chars: 16000
    deadline_s: 20
    days: 30
