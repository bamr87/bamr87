# ---------------------------------------------------------------------------
# Grafana dashboard provider.
#
# The dashboards directory is mounted READ-ONLY and the dashboards in it are
# GENERATED by `dash observe verify --write` from _data/fleet.yml. Editing one
# in the Grafana UI is therefore a scratch change that the next provision
# discards — which is the point: the contract is the source, and a dashboard
# that only exists in a volume is not reproducible from a clean checkout.
# ---------------------------------------------------------------------------
apiVersion: 1

providers:
  - name: fleet
    orgId: 1
    folder: Fleet
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
