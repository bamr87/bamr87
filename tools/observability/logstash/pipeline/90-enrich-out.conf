# ---------------------------------------------------------------------------
# The ONE enrichment path: ECS normalisation, secret redaction, data-stream
# routing. Both inputs land here; nothing writes to Elasticsearch but this.
# ---------------------------------------------------------------------------
input {
  pipeline { address => "enrich" }
}

filter {

  # -- ECS shape ------------------------------------------------------------
  # Filebeat's container input gives `message` + docker metadata; a UPS-OPS-10
  # JSON line gives `ts`/`level`/`msg`/`logger`/`request_id`/`app`/`version`.
  # Map the second onto ECS without disturbing the first.
  if [msg] and ![message] { mutate { rename => { "msg" => "message" } } }
  if [ts]  { date { match => ["ts", "ISO8601"] target => "@timestamp" } }
  if [level] {
    mutate { lowercase => ["level"] }
    mutate { rename => { "level" => "[log][level]" } }
  }
  if [logger]     { mutate { rename => { "logger"     => "[log][logger]" } } }
  if [request_id] { mutate { rename => { "request_id" => "[trace][request_id]" } } }
  if [app]        { mutate { rename => { "app"        => "[service][name]" } } }
  if [version]    { mutate { rename => { "version"    => "[service][version]" } } }

  # Docker labels carry the fleet attribution (UPS-OPS-17). An unlabelled
  # container never reaches here — Filebeat's autodiscover condition drops it.
  if [container][labels][com_bamr87_fleet_repo] {
    mutate {
      copy => {
        "[container][labels][com_bamr87_fleet_repo]"    => "[fleet][repo]"
        "[container][labels][com_bamr87_fleet_project]" => "[fleet][project]"
        "[container][labels][com_bamr87_fleet_stack]"   => "[fleet][stack]"
      }
    }
  }

  # -- Level inference ------------------------------------------------------
  # Actions logs and raw container output have no level field. Infer one so
  # "show me errors" works across all three datasets rather than only the one
  # that happens to emit JSON.
  if ![log][level] {
    grok {
      match => { "message" => "(?i)\b(?<[log][level]>error|fatal|critical|warn(?:ing)?|debug|trace)\b" }
      tag_on_failure => []
    }
    if [log][level] { mutate { lowercase => ["[log][level]"] } }
    else            { mutate { add_field => { "[log][level]" => "info" } } }
  }
  if [log][level] == "warning" { mutate { replace => { "[log][level]" => "warn" } } }

  # -- Drop the verbatim copies BEFORE redacting ----------------------------
  # Both inputs keep a byte-exact copy of what arrived, and a copy is not
  # covered by a gsub on `message`. The http input's ECS-compatibility mode
  # writes the WHOLE request body to `event.original`, which on the first live
  # test round-tripped a GitHub token into the index in full while `message`
  # next to it was correctly masked — the redaction looked like it worked.
  #
  # So these die first. They are also pure duplication: `message` already holds
  # the line, and keeping the original doubles the index for a field nobody
  # searches. http/url/user_agent are the http input's transport metadata,
  # meaningless once the document is stored.
  mutate {
    remove_field => ["event.original", "[event][original]", "log.original",
                     "[log][original]", "http", "url", "user_agent", "@version"]
  }

  # -- Redaction (UPS-OPS-12) ----------------------------------------------
  # GitHub masks secrets in ITS logs; nothing masks a local container's. This
  # is the only guard, and it runs on every event from every input because it
  # lives here rather than in the inputs. Prefixes mirror
  # _data/fleet.yml `observability.logs.redact` — keep the two in step.
  #
  # Applied to every field that can carry free text, not just `message`: a
  # stack trace in `error.message` is exactly where a token ends up.
  mutate {
    gsub => [
      "message", "sk-ant-[A-Za-z0-9_\-]+",     "sk-ant-[REDACTED]",
      "message", "github_pat_[A-Za-z0-9_]+",   "github_pat_[REDACTED]",
      "message", "ghp_[A-Za-z0-9]{20,}",       "ghp_[REDACTED]",
      "message", "gho_[A-Za-z0-9]{20,}",       "gho_[REDACTED]",
      "message", "ghs_[A-Za-z0-9]{20,}",       "ghs_[REDACTED]",
      "message", "AIza[A-Za-z0-9_\-]{20,}",    "AIza[REDACTED]"
    ]
  }
  if [error][message] {
    mutate {
      gsub => [
        "[error][message]", "sk-ant-[A-Za-z0-9_\-]+",   "sk-ant-[REDACTED]",
        "[error][message]", "github_pat_[A-Za-z0-9_]+", "github_pat_[REDACTED]",
        "[error][message]", "gh[pous]_[A-Za-z0-9]{20,}", "gh?_[REDACTED]",
        "[error][message]", "AIza[A-Za-z0-9_\-]{20,}",  "AIza[REDACTED]"
      ]
    }
  }

  # -- Routing --------------------------------------------------------------
  # One dataset per SOURCE, repo as a field. 40 repos x 3 sources would be 120
  # data streams to template, alias and expire; this is 3.
  mutate {
    add_field => {
      "[data_stream][type]"      => "logs"
      "[data_stream][dataset]"   => "fleet.%{[@metadata][fleet_dataset]}"
      "[data_stream][namespace]" => "default"
      "[ecs][version]"           => "8.11.0"
    }
  }
  mutate { remove_field => ["agent", "input", "log.offset", "log.file"] }
}

output {
  elasticsearch {
    hosts       => ["${ELASTIC_HOSTS:http://elasticsearch:9200}"]
    data_stream => "true"
    # The data_stream.* fields set above pick the stream; ILM comes from the
    # index template `dash observe verify` renders out of fleet.yml, so
    # retention is never expressed twice.
    action      => "create"
  }
}
