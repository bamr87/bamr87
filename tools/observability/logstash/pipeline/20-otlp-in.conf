# Claude Code's OpenTelemetry EVENTS, forwarded by the otel-collector as
# OTLP/JSON (tools/observability/otel-collector/config.yaml). Not published on
# the host: only the collector, on the fleet network, talks to :8089.
#
# One request is one OTLP envelope — resourceLogs → scopeLogs → logRecords,
# with every attribute a {key, value: {stringValue|intValue|…}} pair. This
# input flattens that into ONE event per log record and hands it to `enrich`,
# where redaction and data-stream routing happen exactly as for the other two
# inputs. Mapping:
#
#   message        the record body — the event name, e.g. claude_code.api_request
#   event.action   event.name without the prefix (api_request, tool_result, …)
#   claude.*       every attribute, dots → underscores (session_id, prompt_id,
#                  cost_usd, tool_name…). Flattened on purpose: Claude Code
#                  emits both `prompt` (text) and `prompt.id`, which as dotted
#                  ES paths collide — a string and an object at one name.
#   fleet.repo     owner/name from vcs.* (Claude Code ≥ 2.1.269 with
#                  OTEL_METRICS_INCLUDE_REPOSITORY) — the same field the
#                  Actions and container datasets filter on
#   trace.id       the record's traceId when it has one (-p / SDK runs under
#                  a TRACEPARENT), so an event joins its span in Phoenix
input {
  http {
    port => 8089
    codec => json
    additional_codecs => { "application/json" => "json" }
  }
}

filter {
  ruby {
    init => '
      @val = lambda do |v|
        next nil unless v.is_a?(Hash)
        if v.key?("stringValue") then v["stringValue"]
        elsif v.key?("intValue") then v["intValue"].to_i       # int64 travels as a JSON string
        elsif v.key?("doubleValue") then v["doubleValue"].to_f
        elsif v.key?("boolValue") then v["boolValue"]
        elsif v.key?("arrayValue") then ((v["arrayValue"] || {})["values"] || []).map { |x| @val.call(x) }
        elsif v.key?("kvlistValue") then @kv.call((v["kvlistValue"] || {})["values"])
        end
      end
      @kv = lambda do |pairs|
        out = {}
        (pairs || []).each { |p| out[p["key"]] = @val.call(p["value"]) if p.is_a?(Hash) && p["key"] }
        out
      end
      # Levels are set here rather than inferred in enrich: its regex needs a
      # word boundary, and "api_error" has none before "error".
      @errors = %w[api_error internal_error api_retries_exhausted]
      @warns  = %w[api_refusal]
    '
    code => '
      (event.get("resourceLogs") || []).each do |rl|
        resource = @kv.call(((rl["resource"] || {})["attributes"]))
        (rl["scopeLogs"] || []).each do |sl|
          (sl["logRecords"] || []).each do |rec|
            attrs = @kv.call(rec["attributes"])
            name  = attrs["event.name"].to_s
            name  = name.sub(/\Aclaude_code\./, "")
            claude = {}
            attrs.each { |k, v| claude[k.to_s.tr(".", "_")] = v }
            doc = {
              "message" => (@val.call(rec["body"]) || "claude_code.#{name}").to_s,
              "event"   => { "action" => name, "module" => "claude_code", "kind" => "event" },
              "service" => { "name" => resource["service.name"], "version" => resource["service.version"] },
              "host"    => { "architecture" => resource["host.arch"], "os" => { "type" => resource["os.type"] } },
              "claude"  => claude,
            }
            user = { "email" => attrs["user.email"], "id" => attrs["user.id"] }.compact
            doc["user"] = user unless user.empty?
            owner, repo = attrs["vcs.owner.name"], attrs["vcs.repository.name"]
            doc["fleet"] = { "repo" => [owner, repo].compact.join("/") } if repo
            tid, sid = rec["traceId"].to_s, rec["spanId"].to_s
            doc["trace"] = { "id" => tid } unless tid.empty? || tid =~ /\A0+\z/
            doc["span"]  = { "id" => sid } unless sid.empty? || sid =~ /\A0+\z/
            level = if @errors.include?(name) then "error"
                    elsif @warns.include?(name) || (name == "tool_result" && attrs["success"].to_s == "false") then "warn"
                    else "info" end
            doc["log"] = { "level" => level }
            ns = (rec["timeUnixNano"] || rec["observedTimeUnixNano"]).to_i
            e = LogStash::Event.new(doc)
            e.timestamp = LogStash::Timestamp.at(ns / 1_000_000_000, (ns % 1_000_000_000) / 1000.0) if ns > 0
            e.set("[@metadata][fleet_dataset]", "claude")
            e.set("[@metadata][fleet_source]", "otel")
            new_event_block.call(e)
          end
        end
      end
      # The envelope itself is never a document: its children are.
      event.cancel
    '
  }
}

output {
  pipeline { send_to => ["enrich"] }
}
