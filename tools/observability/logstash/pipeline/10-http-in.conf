# GitHub Actions run logs, replayed from the local data lake by
# `dash observe ship`. Loopback-published (:8088) like everything else here.
input {
  http {
    port => 8088
    codec => json
    # The shipper POSTs newline-free JSON arrays in batches of
    # `observability.logs.ship.batch`; Logstash splits an array into events.
    additional_codecs => { "application/json" => "json" }
  }
}

filter {
  mutate {
    add_field => {
      "[@metadata][fleet_dataset]" => "actions"
      "[@metadata][fleet_source]"  => "actions"
    }
  }
  # The shipper sends ECS field names already (it shares fleet_lake's parsers),
  # so nothing is re-derived here — this input exists to give the HTTP path the
  # same redaction and routing the beats path gets, not to re-map it.
  # Belt and braces — the enrich pipeline drops these too, but not asking for
  # the raw body at all is cheaper than carrying it one hop further.
  mutate { remove_field => ["headers", "host", "[event][original]"] }
}

output {
  pipeline { send_to => ["enrich"] }
}
