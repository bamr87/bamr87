# Container stdout/stderr, shipped by Filebeat's docker autodiscover.
input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat has already parsed the line as JSON when it could
  # (json.keys_under_root). A line carrying both `level` and `msg` is a
  # UPS-OPS-10 structured line; anything else is raw container chatter. The
  # two get different datasets and therefore different retention, so the
  # difference stays VISIBLE instead of being averaged away in one index.
  if [level] and [message] {
    mutate { add_field => { "[@metadata][fleet_dataset]" => "app" } }
  } else {
    mutate { add_field => { "[@metadata][fleet_dataset]" => "container" } }
  }
  mutate { add_field => { "[@metadata][fleet_source]" => "container" } }
}

output {
  pipeline { send_to => ["enrich"] }
}
