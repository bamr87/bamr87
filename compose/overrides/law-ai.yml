# GENERATED by tools/fleet-compose.py from _data/ports.yml — do not hand-edit.
# Hub-side overrides for projects/law-ai — the submodule's own
# docker-compose.yml is untouched and still runs standalone.
#
# `!override` replaces the ports list rather than appending to it, which
# is what lets a hardcoded `8000:8000` become a fleet allocation with no
# upstream commit. `networks:` stays additive so the project keeps its own.

services:
  backend:
    # debugpy attach point (see .vscode/launch.json)
    # depends_on: dropped phoenix (superseded by the shared service, which lives in another compose project)
    depends_on: !override
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports: !override
      - "127.0.0.1:${LAW_AI_API_PORT:-8110}:8000"
      - "127.0.0.1:${LAW_AI_DEBUG_PORT:-5713}:5678"
    networks:
      - fleet-net
  frontend:
    # environment: URLs repointed at the remapped host port(s)
    environment:
      NEXT_PUBLIC_WS_URL: "${FRONTEND_WS_URL:-ws://localhost:${LAW_AI_API_PORT:-8110}}"
    ports: !override
      - "127.0.0.1:${LAW_AI_FRONTEND_PORT:-5110}:3000"
  langgraph-api:
    ports: !override
      - "127.0.0.1:${LAW_AI_LANGGRAPH_PORT:-8115}:8000"
    networks:
      - fleet-net
  postgres:
    ports: !override
      - "127.0.0.1:${LAW_AI_DB_PORT:-5442}:5432"
  redis:
    ports: !override
      - "127.0.0.1:${LAW_AI_REDIS_PORT:-6391}:6379"
  worker:
    # debugpy attach point (see .vscode/launch.json)
    ports: !override
      - "127.0.0.1:${LAW_AI_WORKER_DEBUG_PORT:-5714}:5679"
  phoenix:
    # superseded by the shared fleet-phoenix; reachable at its own hostname through the fleet-net alias
    profiles: [standalone]
  neo4j:
    # bound to loopback (was published on every interface)
    ports: !override
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
  ollama:
    # bound to loopback (was published on every interface)
    ports: !override
      - "127.0.0.1:11434:11434"

networks:
  fleet-net:
    external: true
