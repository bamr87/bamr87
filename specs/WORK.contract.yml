# =============================================================================
# specs/WORK.contract.yml — the machine-checkable contract for UPS-WORK rows
# =============================================================================
# Hand-written companion to specs/WORK.md (NOT generated; tools/gen-specs-data.py
# reads only the .md tables). WORK.md says what each rule means; this file says
# exactly what a checker reads and matches, per rule id, so tools/conformance.py
# can be keyed to it without interpreting prose. When the two disagree, fix both
# in the same PR; until then this file wins for checker behaviour.
#
# Result vocabulary (same as tools/conformance.py):
#   pass | fail | unverified (the fact is not visible offline; never pass/fail)
# `mode`: offline = static tree checks; online = needs the GitHub API (fleet
# scorecard only, never in the in-repo gate); scorecard = reported, never gating.
#
# Regexes are Python `re` syntax. Paths are relative to the repo root unless
# prefixed `hub:` (relative to the bamr87/bamr87 checkout the checker runs from).
# =============================================================================
schema: work-contract/v1
spec: specs/WORK.md
ups_version: "1.0"
decisions: [D1, D2, D3, D4, D5, D6]   # all settled 2026-10-03; nothing below is switchable

definitions:
  sdlc_file: .github/sdlc.yml
  sdlc_schema: hub:templates/sdlc/sdlc.schema.json     # JSON Schema 2020-12 for sdlc/v1
  registry_block: hub:_data/projects.yml `sdlc:` key of the repo's entry (same keys as sdlc_file)
  profile_precedence: [sdlc_file, registry_block]       # first one present wins; neither = WORK-01 fail
  # D6: repo type -> default UPS kinds when `kinds:` is omitted.
  type_kinds:
    app: [app]
    library: [lib]
    site: [site]
    docs: [content]
    demo: [site]
    control-plane: [site, hub]   # `hub` is a marker kind; no row targets it yet
    fork: [fork]
  # D5: release-please release-type by repo type (sdlc.yml `release.type`).
  release_type:
    docs: simple
    site: simple
    demo: simple
    control-plane: simple
    app: "node | python | ruby by ecosystem, else simple"
    library: "node | python | ruby by ecosystem, else simple"
    fork: none        # forks keep upstream's changelog
  modules_shape: >-
    sdlc_file: a map of module name -> boolean (canonical). registry_block: a map
    or a list of enabled module names (list accepted for the registry only).
    Known modules: spec_driven, adr, features, issue_autopilot, content_queue, ai_lanes.
  adr_path: "`adr_path` top-level key in the profile; default docs/adr; no trailing slash"
  backlog:
    mode_key: backlog.mode            # issues | file; absent = issues (D1)
    file_key: backlog.file            # BACKLOG.md | _data/backlog.yml; required when mode is file
    mirror_key: backlog.mirror_to_issues
  labels_source: hub:_data/fleet.yml issue_pipeline.labels    # authoritative names
  labels_file: hub:templates/community/labels.yml            # names + colours + renames
  duplicate_label_re: '^(enhancement|documentation|priority:\s*p\d)$'   # case-insensitive
  form_label_exempt: [page_feedback]  # its label is owned by UPS-FB-07
  pr_templates: [.github/pull_request_template.md, .github/PULL_REQUEST_TEMPLATE.md, pull_request_template.md, docs/pull_request_template.md, ".github/PULL_REQUEST_TEMPLATE/*.md"]
  dod_block_re: '<!-- fleet-dod:start v(\d+) -->\n(.*?)<!-- fleet-dod:end -->'   # re.S
  dod_reference: hub:templates/community/.github/pull_request_template.md
  spec_driven_kit: hub:templates/spec-driven/tools/          # canonical copies (kit path, top level)
  spec_driven_tools: [spec_validator.py, backlog_lint.py, next_backlog_id.py, pick_backlog_item.py]
  changelog: CHANGELOG.md
  release_files: [release-please-config.json, .release-please-manifest.json]
  release_workflow_re: 'uses:\s*[''"]?bamr87/bamr87/\.github/workflows/release-please\.yml@'
  agents_file: AGENTS.md
  claude_file: CLAUDE.md
  # UPS-WORK-10 / UPS-QA-40 ref rule (the spec wins over any older drift-gate wording).
  fleet_uses_re: '^\s*(?:-\s*)?uses:\s*[''"]?(bamr87/(?:bamr87|\.github)/[^@\s''"]+)@([^\s''"#]+)'
  pinned_ref_re: '^(v\d+|v\d+\.\d+\.\d+|[0-9a-f]{40})$'     # fullmatch; v1.2, 1.2.3, short SHAs, branches fail
  pin_comment_re: '#\s*v\d+\.\d+\.\d+\s*$'                   # optional after a SHA; never required
  pin_scope: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".github/actions/**/action.yml", ".github/actions/**/action.yaml"]
  pin_exempt: "local paths starting `./` (the hub calling its own workflows/actions) and `docker://`; YAML comments ignored"
  deviations: >-
    A waived row is listed in BOTH the profile `deviations: [{id, reason, until?}]`
    and AGENTS.md `## Standard deviations` (CLAUDE.md `## Standard deviations` is
    accepted during the D4 transition). MUST rows cannot be waived.

rules:
  UPS-WORK-01:
    level: MUST
    applies: "all except fork"
    mode: offline
    reads: [sdlc_file, registry_block]
    pass: >-
      A profile is found (profile_precedence) and validates against sdlc_schema:
      schema == "sdlc/v1"; type in type_kinds; tier; backlog.mode; modules is a map
      (sdlc_file) of known modules; release.type unless type is fork.
    fail: "no profile; YAML error; any schema violation (report the JSON pointer)"

  UPS-WORK-02:
    level: MUST
    applies: "all except content, fork"
    mode: offline
    reads: [backlog.mode_key, backlog.file_key, ".github/workflows/*.y*ml"]
    pass: >-
      mode == file: backlog.file exists AND some workflow contains
      'backlog[_-]?lint|lint[_-]?backlog|validate[_-]?backlog' (case-insensitive).
      A sync job (e.g. sync-backlog.rb) alone does NOT satisfy the lint.
    unverified: "mode == issues (labels live on GitHub; see UPS-WORK-14)"
    fail: "mode == file and the file or the lint is missing"

  UPS-WORK-03:
    level: MUST
    applies: "all except fork"
    mode: offline
    reads: [pr_templates]
    pass: >-
      The first template found contains dod_block_re, and the block's checkbox
      lines '^- \[ \] \*\*(.+?)\*\*' equal the reference block's, in order, for the
      same marker version. Extra boxes below `fleet-dod:end` are allowed.
    unverified: "no template in the tree (the owner .github default is inherited; online: community profile API)"
    fail: "template present without the markers, or the block's boxes differ"

  UPS-WORK-04:
    level: MUST
    applies: "app, api, lib, cli, ext"
    mode: offline
    reads: [adr_path]
    pass: >-
      <adr_path>/ has README.md and >= 1 file matching '^\d{4}-[a-z0-9][a-z0-9-]*\.md$'
      other than 0000-*.md (the template). D2 transition paths accepted when declared
      as adr_path: lineage/decisions (year-of-ai, Wave 4a); docs/adr plus a frozen
      docs/DECISIONS.md (gitorio, Wave 2).
    fail: "no ADRs, or no README.md index"

  UPS-WORK-05:
    level: SHOULD
    applies: "all except fork"
    mode: offline
    reads: [changelog, "git tags in the checkout"]
    pass: >-
      CHANGELOG.md exists (its absence is UPS-REPO-21); AT MOST ONE heading matches
      '^##\s*\[?unreleased\b' (re.I|re.M) — zero is normal, release-please writes none;
      and when the checkout has tags matching '^v?\d+\.\d+\.\d+$', the first heading
      matching '^##\s*\[?v?(\d+\.\d+\.\d+)' equals the newest such tag.
    fail: "two or more [Unreleased] headings; newest heading != newest tag"

  UPS-WORK-06:
    level: SHOULD
    applies: all
    mode: offline
    reads: [features/features.yml, _data/features.yml]
    pass: "features/features.yml absent, or present with no '^version\\s*:' key and no version comment in its first 40 lines, and no _data/features.yml"

  UPS-WORK-07:
    level: MUST
    applies: "all (binds only when modules.spec_driven is true; otherwise pass)"
    mode: offline
    reads: ["specs/[0-9][0-9][0-9]-*/spec.md", BACKLOG.md, ".github/workflows/*.y*ml", spec_driven_tools]
    pass: >-
      >= 1 spec package; BACKLOG.md exists; one workflow job runs spec_validator.py and
      every other job in that workflow transitively `needs` it (its own prerequisites
      excepted); that workflow also runs backlog_lint.py; every tracked file whose
      basename is in spec_driven_tools is byte-identical to spec_driven_kit/<basename>.
    fail: "any clause above"

  UPS-WORK-08:
    level: SHOULD
    applies: "all except content"
    mode: scorecard
    reads: ["specs/*/spec.md status lines", "git log", backlog.file_key]
    flag: >-
      a spec whose status is in-progress with no commit under its dir for > 30 days;
      the backlog file last committed > 60 days before HEAD. Online (Issues API):
      a P0/P1 issue with no activity for > 30 days.

  UPS-WORK-09:
    level: MUST
    applies: all
    mode: offline
    reads: [".github/ISSUE_TEMPLATE/*.yml|*.yaml|*.md (config.yml excluded)", labels_source]
    pass: >-
      Every form's `labels` (YAML forms; front matter for .md) contains none matching
      duplicate_label_re and, unless its stem is in form_label_exempt, exactly one
      fleet type label from labels_source.
    unverified: "no forms in the tree (inherited)"

  UPS-WORK-10:
    level: MUST
    applies: all
    mode: offline
    reads: [pin_scope]
    pass: "every fleet_uses_re match's ref fullmatches pinned_ref_re (pin_exempt applies)"
    fail: "any branch ref (@main, @master, @release/v1), partial version (@v1.2), unprefixed (@1.2.3) or short SHA"
    note: >-
      Hub self-references count: a hub workflow calling bamr87/bamr87/...@main fails.
      Non-reusable hub workflows use ./ paths; reusable ones (whose ./ resolves in the
      caller) pin a tag. UPS-QA-40 uses the same ref rule for third-party actions.

  UPS-WORK-11:
    level: SHOULD
    applies: "all except content"
    mode: offline
    reads: [ROADMAP.md, TODO.md, PRD.md, docs/ROADMAP.md, docs/TODO.md, docs/PRD.md]
    pass: >-
      Each file present contains no task-list lines '^\s*[-*] \[[ xX]\] ' and no
      backlog ids '\b(BL-\d{8}-\d{2}|T-\d{3,})\b' outside markdown links, AND contains a
      link to the backlog of record: '/issues' (issues mode) or the backlog.file path
      (file mode) or 'bamr87/bamr87/blob/main/_data/roadmap.yml'.
    fail: "a planning file carries its own item list, or does not link the backlog"

  UPS-WORK-12:
    level: MUST
    applies: "all except fork"
    mode: offline
    reads: [agents_file]
    pass: >-
      AGENTS.md has a '^##\s+Conventions\b' section that matches 'backlog' and
      'Definition of Done|pull_request_template' and contains the literal adr_path
      (or 'ADR' when the adr module is off).

  UPS-WORK-13:
    level: SHOULD
    applies: site
    mode: offline
    same_as: UPS-WORK-04

  UPS-WORK-14:
    level: SHOULD
    applies: all
    mode: online
    reads: ["gh label list --json name", labels_file]
    pass: "every labels_file name in families state/type/priority/size exists, and no name matching duplicate_label_re exists"

# Rows in other areas changed alongside WORK (same PR), with their checker contract.
related:
  UPS-REPO-21:
    level: MUST
    applies: "all except fork"     # D5: content repos included
    pass: >-
      CHANGELOG.md exists; release_files exist and parse as JSON; the config's
      packages["."]["release-type"] is simple|node|python|ruby; some workflow matches
      release_workflow_re with a ref that fullmatches pinned_ref_re.
    replaces: UPS-REPO-13
  UPS-AGENT-07:
    level: MUST
    applies: "all except fork"
    pass: >-
      AGENTS.md exists with '##' headings, in order: What this repo is, Stack & commands,
      Layout, Conventions, Fleet context, Standard deviations; no line starting 'TODO:'.
    replaces: [UPS-AGENT-01, UPS-AGENT-02]
  UPS-AGENT-08:
    level: MUST
    applies: "all except fork"
    pass: >-
      CLAUDE.md exists, has a line matching '^@AGENTS\.md\s*$', has none of the
      UPS-AGENT-07 headings, and at most 20 non-blank lines.
    replaces: [UPS-AGENT-01, UPS-AGENT-02]
  UPS-AGENT-09:
    level: MUST
    applies: "all except fork"
    pass: "AGENTS.md matches '<!-- kit: (agent-context|sdlc) v\\d+\\.\\d+\\.\\d+'"
    replaces: UPS-AGENT-03
  UPS-QA-20:
    pass: "ci.yml calls bamr87/bamr87/.github/workflows/standard-ci.yml (ref per UPS-WORK-10); bamr87/.github ci.yml callers fail"
  UPS-QA-40:
    pass: "every `uses:` ref fullmatches pinned_ref_re (pin_exempt applies); no committed lockfiles"
