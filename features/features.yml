  # ------------------------------------------------------------------ loops
  - id: HUB-008
    title: "Drift gate"
    description: "Offline+API gate on every PR: registry↔.gitmodules parity, stray project dirs, stale README span, SCHEMA.md pyramid, vendored-tool parity, composite-action manifests; advisory GitHub-reality drift."
    implemented: true
    surface: infra
    link: tools/check-drift.sh
    docs: docs/DASH.md
    tags: [ gate, ci, drift ]
    tests:
      - { na: "self-validating gate; runs in drift-check.yml on every PR and push" }
  - id: HUB-009
    title: "Fan-out engine"
    description: "One clone→branch→seed→commit→PR engine for every downward kit (standardize, schema, prose, deps-latest, verify): dry-run default, PRs only, additive-only, external-upstream guard, byte-identical --upgrade."
    implemented: true
    surface: infra
    link: tools/fanout.sh
    docs: docs/STANDARDS.md
    tags: [ fanout, kits, standardization ]
    tests:
      - { na: "shellcheck in the drift gate; each kit is exercised by its dispatch workflow in dry-run" }
  - id: HUB-010
