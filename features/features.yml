  - id: HUB-031
    title: "Harness Console MCP layer: the console's API for any AI agent"
    description: "tools/dash mcp serves the Harness Console's HTTP API as an MCP server built on the official mcp SDK: stdio for Claude Code, Cursor and local agents (registered in .mcp.json as fleet, having absorbed tools/fleetcore/mcp_server.py: its fleet_* read tools and console_* action names live on as tools and aliases, with --fleet-compat) and streamable HTTP on 127.0.0.1:4002/mcp with bearer auth and DNS-rebinding protection for remote agents such as Grok Bots. 26 read tools (22 console + 4 merged fleet views) and 5 resources cover fleet status, harness health and scorecard, live snapshot and sessions (with bamr87/bamr87#432), agent activity, ops, jobs and logs, spend vs budget, the lake's runs and workflow lines, observability, semantic code search, the deep dive, the Work board and the loops. Write tools (run_op, cancel_job, workflow_kill_switch) are registered only with HARNESS_MCP_ALLOW_WRITES=1, annotated destructive, and refused without confirm=true; the console's allowlist and confirm gate still decide. HTTP auth uses a dedicated HARNESS_MCP_TOKEN (never the console token); an opt-in compose sidecar (profile mcp, 127.0.0.1:4002) keeps it always on, and dash mcp --tunnel opens a temporary cloudflared quick tunnel. Results are sized for an agent's context: work_board pages the ~390k-character /api/work document (summary=true drops each item's detail record; lane/repo/kind/stage/priority/q filters, limit/offset, matched_by_lane and next_offset), and fleet_docker errors with the remedy when no Docker host answers instead of returning an empty container list. The code index reaches Qdrant and Ollama through QDRANT_URL / OLLAMA_URL (the contract's URLs are the browser's) and chooses the collection by listing the store, since Kilo's name is a hash of the workspace root path; QDRANT_COLLECTION overrides it."
    implemented: true
    status: shipped
    prd: [FR26, NFR9]
    surface: infra
    link: tools/console/mcp_layer/server.py
    docs: tools/console/docs/mcp-layer.md
    tags: [ console, mcp, agents, ai-layer, integration ]
    date: 2026-10-30
    tests:
