    description: "The verify kit (feature index scaffold, user scenarios, Playwright runner, MCP config, CI caller, verify-feature skill + verifier agent) fanned out by verify-fanout, and the reusable fleet-verify.yml that runs scenarios on every PR and hands the live app to a Claude Code pass on `verify`-labelled PRs."
    implemented: true
    surface: infra
    link: templates/verify/
    docs: docs/VERIFICATION.md
