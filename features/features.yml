# =============================================================================
# features/features.yml — THE FEATURE INDEX of the bamr87 dash (the hub)
# =============================================================================
# kit: verify v0.1.0 — the hub practices what it seeds (templates/verify/).
#
# What the control plane DOES for a user (the operator, or an agent working in
# the fleet), where each capability lives, where it is documented, and what
# proves it: the tests under .github/scripts/dash-gen/ and tools/, the user
# scenarios under verify/scenarios/, and the evidence bundles under
# test/evidence/. Aggregated with every submodule's index by
# `dash features fleet --write` → _data/features_index.yml → /features/.
# Validate: python3 tools/features_index.py check .   Grade: … coverage .
#
# Schema: features/v1 (see templates/verify/features.template.yml for the
# field reference). `surface: ui` rows are dash pages; `infra` rows are the
# loops and gates; `{na: reason}` under tests waives coverage with a reason.
# =============================================================================
schema: features/v1
repo: bamr87/bamr87

