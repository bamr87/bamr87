  - id: HUB-027
    title: "Backlog fan-out routine"
    description: "Scheduled (daily default, weekly option) routine that reads the pending hub backlog (open issues, PRD requirements no shipped feature serves, catalog features not shipped), maps each item to the fleet repos it applies to (labels, applies_to, title, config), and opens or updates one idempotent tracking PR per item and repo through tools/fanout.sh --kit backlog, linking feature ids to PRD requirements; never merges, dry run until _data/backlog_fanout.yml apply: true. Emits every fanned-out/skipped/failed decision to the fleet activity log queue (schema from the activity-log PRD, bamr87/bamr87#409, HUB-024); the store and flusher endpoint arrive with that PRD, so events are queued locally and uploaded as an artifact for now."
    implemented: true
    status: partial
    prd: [FR6, FR22, FR23]
    surface: infra
    link: .github/workflows/backlog-fanout.yml
    docs: docs/BACKLOG-FANOUT.md
    tags: [ fan-out, backlog, automation, activity-log ]
    date: 2026-10-25
    tests:
      - tools/test_backlog_fanout.py
  - id: HUB-028
    title: "Work board: rebalance the loops' work by drag and drop"
    description: "Every open issue, PR, roadmap spec, spec package and BACKLOG.md item on six lanes at /work, in the order the loops take them, with each loop's next-run picks marked by the issue pipeline's own queue builder. Drag within a lane to pin the order, across lanes to move an issue (agent: labels) or a roadmap spec (status), across P0-P3 to reprioritise; every change is previewed, then applied after one confirm. The order and overrides land in _data/work_queue.yml, which the issue pipeline and repo-evolution read. Drill-downs show issue gaps, the spec packages a PR changes read at its head, roadmap entries, spec tasks and open questions. Throughput shows each loop's cap, drain time and per-repo share. The fleet_work MCP tool reads the same board."
    implemented: true
    status: shipped
    prd: [FR5, FR6]
    surface: ui
    link: /work
    docs: docs/WORK-BOARD.md
