  - id: HUB-035
    title: "JEV: conflict-free numbering + tiered PR conflict triage"
    description: "JEV is the harness-level agent logic engine (planned in bamr87/it-journey's PRD roadmap, 2027 Q1); this is its first capability, in two halves. (1) Conflict-free numbering: a pull request never picks the next HUB-NNN, FRn/NFRn or amendment number — it writes a fragment (features/features.d/, changelog.d/, docs/amendments/proposed/) with HUB-NEW / FR-NEW:key / number: NEW and references other new things by slug, and tools/jev/number.py assigns the id on main under a concurrency group, compiles the fragments into features.yml, PRD.md, CHANGELOG.md and docs/amendments/NNNN-slug.md, regenerates the PRD block, docs index and CATALOG, and publishes through publish-data (never a bare push to a protected branch). .gitattributes marks generated files merge=jev-regen (tools/jev/merge-regen.sh keeps ours and records the path for regeneration) and two append-only files merge=union; because GitHub's mergeability check ignores custom merge drivers, the fully generated CATALOG.md and docs/README.md are also marked jev-main-only: only the post-merge job on main (jev-number.yml, after every push) regenerates and commits them, and drift-check.yml fails a PR that edits one (python3 -m tools.jev generated guard); generated spans (PRD block, README AUTO:projects, docs/DASH.md CLI reference) are regenerated by the same job and their PR-side drift checks are advisory (JEV_SPANS_ADVISORY=1); other generated files still fail CI on drift (proposed amendment generated-files-main-only). (2) The conflict engine: every six hours, and on a push to main, it lists open fleet PRs GitHub reports as CONFLICTING (registry + the year-of-ai, ai-world-view, bash-365, EissaLab and zer0-mistakes orgs), reproduces each with a trial merge, classifies it deterministically from the conflicted files' kinds, hunks and lines, and spends the cheapest tier that finishes: tier 0 costs nothing (regenerate / union / renumber), tier 1 is Haiku 4.5 capped at $0.25 per attempt for at most 3 files and 40 lines with no workflow, secret, migration or lockfile in the set, tier 2 is Sonnet capped at $1.50, tier 3 labels jev:needs-human with the triage report. Every tier merges base into head with a merge commit (never a rebase or force-push), validates with the repo's own gates plus a clean git diff --check and no leftover markers, and discards the attempt on failure. It never merges a PR, never uses --admin and never touches settings; it only pushes to same-repo branches from listed authors. Capped at $10/month (budget.jev) inside the $75 fleet ceiling, with scheduled runs stopping at 80%; every attempt is recorded in _data/jev_resolutions.yml with its cost and whether that cost was reported or estimated. jev.enabled is on with jev.auto_tiers: [tier0] (model tiers off until listed); the scheduled and push-to-main loop still waits for vars.JEV_CONFLICTS_ENABLED to be true."
    implemented: true
    status: partial
    prd: [FR28, NFR11]
    surface: infra
