# features/features.d/onprem-compute.yml — compiled into features/features.yml at merge (HUB-NEW)
id: HUB-NEW
slug: onprem-compute
title: "On-premise compute node: local LLMs and Claude Code sessions on Amr's own machine (planned)"
description: "Plan only: enrol Amr's new on-premise machine (Ryzen 9 9950X3D2, 64 GB, Radeon RX 9070 XT 16 GB, picked up 2026-11-10) as a second workload node in _data/fleet.yml nodes:, disabled until its deploy step. It serves local LLMs through Ollama on its loopback (Vulkan baseline, ROCm in a container compared; no CUDA), hosts Claude Code sessions (ssh + tmux, bashOS's oneos-remote, and the hub's own headless entry points tools/dash loop | conflicts | weekly | refine under systemd user timers), cleans its own worktrees, clones and idle session state with the weekly classifier, and closes the weekly console lanes' R6:no-local-entry gap with a local adapter; a self-hosted runner is optional and fenced by constitution § 30.5. Cost is stated honestly: $0 metered API spend and no hosted minutes for what moves onto the node, the same Claude subscription for Claude Code sessions, and a measured electricity cost. Phased P0–P6 rollout in docs/ONPREM-COMPUTE.md."
implemented: false
status: planned
surface: infra
link: docs/ONPREM-COMPUTE.md
docs: docs/ONPREM-COMPUTE.md
tags: [ platform, nodes, local-llm, claude-code, weekly, housekeeping, cost ]
date: 2026-11-15
tests:
  - {na: "plan only; phases P2–P6 add their tests (tools/test_fleetcore_nodes.py for the node entry, the weekly and JEV suites for the timers and the local tier)"}
prd: [FR64, FR56, FR65, FR130, FR131, "FR-NEW:onprem-session-host", "FR-NEW:onprem-local-inference", "NFR-NEW:onprem-runner-isolation"]
prd_new:
  - key: onprem-session-host
    kind: FR
    text: "The hub must run its local entry points (tools/dash loop, conflicts, weekly and refine) unchanged on an enrolled on-premise node, from the node's own git checkout, under the same kill switches, caps, AI ledger and sandbox as on the maintainer's workstation, scheduled by one timer per installer and registered in the agent inventory; the node's housekeeping acts only on its own checkouts, worktrees, clones, archives and session state, saves before it removes, reports idle or stuck Claude Code sessions without ending them, and never needs the node to be up for the fleet to work (constitution § 30; docs/ONPREM-COMPUTE.md)."
  - key: onprem-local-inference
    kind: FR
    text: "The hub must be able to run a loop step, a JEV tier, a typed decision or an embedding job on a local model served from an enrolled on-premise node only when that model is pinned by exact tag and digest under a local provider in _data/fleet.yml ai_models.allowed and the step's eval set passes on it; the model is served on the node's loopback only, receives no secret, and runs with the step's own tool allowlist; each run is recorded in the AI ledger with cost source local ($0 metered API spend, with its energy estimate), never summed with API-equivalent or metered figures (constitution § 30; docs/ONPREM-COMPUTE.md)."
  - key: onprem-runner-isolation
    kind: NFR
    text: "A self-hosted GitHub Actions runner on an on-premise node must never run a job from a fork's pull request: only schedule and workflow_dispatch workflows on the default branch target its labels and a drift check fails any workflow reachable from a fork-raisable event that does; the repository requires approval for fork pull-request workflows from all external contributors; the runner is ephemeral, runs as its own unprivileged user in a container or VM with no access to the maintainer's home, keys, Claude credentials or .env, has a kill switch, and stays off until the maintainer registers it (constitution § 30.5)."
