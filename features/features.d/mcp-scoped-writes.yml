id: HUB-NEW
slug: mcp-scoped-writes
title: "Scoped MCP write access: approved report jobs and Work-board prioritisation for remote agents"
description: "HARNESS_MCP_SCOPES grants the Harness Console's MCP layer narrow write scopes in place of the all-or-nothing HARNESS_MCP_ALLOW_WRITES, so a remote agent such as Grok Bot can act without reaching secret pushes, key rotation, deploys, CI dispatch or the observe reset. The jobs scope adds job_dispatch, which runs one op from a fixed allowlist of local, $0 reports and checks (config-show, status, audit, drift, schema-lint, workflows-lint, observe-status, observe-verify, lake-status, refine-surface), and job_cancel, which stops only those jobs. job_dispatch rechecks each op's console card, always sends the console confirm=false, gives each op a wall clock that a watchdog enforces by cancelling, allows 2 jobs at once and 20 an hour, and with wait_s returns the end of the log. The work scope adds work_apply: priority, pins, unpin and notes written to the working tree's _data/work_queue.yml (a roadmap key's priority to _data/roadmap.yml), never a GitHub label move, a roadmap status change or a commit. It is applied only with confirm=true and the plan_id of a work_preview of the same plan, and is refused when the targets moved after that preview. Two read tools are always on: work_preview, which writes nothing and returns before → after rows, the files an apply would edit and an undo_plan, and work_item. Every scoped call, whether it ran, was refused or failed, is one scrubbed JSON line in .fleet/mcp/audit.jsonl and on stderr. The scoped tools are annotated destructive and closed-world, and console_overview reports mcp_scopes. smoke_mcp_layer.py --url runs the remote handshake against a running HTTP server or the tunnel, and fails when no tools are listed."
implemented: true
status: shipped
surface: infra
link: tools/console/mcp_layer/server.py
docs: tools/console/docs/mcp-layer.md
tags: [ console, mcp, agents, work-board, guardrails, audit ]
date: 2026-11-08
tests:
  - tools/console/test_mcp_layer.py
prd: ["FR26", "NFR9", "FR-NEW:mcp-scoped-writes", "NFR-NEW:mcp-scopes-narrow-only"]
prd_new:
  - key: mcp-scoped-writes
    kind: FR
    text: "The MCP layer must let an operator grant a remote agent narrow write scopes in place of the broad write switch: starting and stopping allowlisted local report jobs, and applying Work-board priority, pin and note plans after their preview was approved. Each scoped call needs confirm=true, and a plan apply also needs the plan_id of its preview."
  - key: mcp-scopes-narrow-only
    kind: NFR
    text: "A scoped MCP write tool may add checks of its own: an allowlist, validation, a plan_id binding, caps, a wall clock and an audit line. It never widens what the console allows. It sends the console confirm=false, writes nothing to GitHub, reads or writes no secret, and records every call, whether it ran, was refused or failed, in an append-only, scrubbed audit. This refines NFR9's 'no enforcement of its own' for the scoped tools only."
