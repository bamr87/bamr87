# Progress, history, activity and statistics for the agentic loops dashboard.
# Numbered at merge: id stays HUB-NEW (amendment 0002).
id: HUB-NEW
slug: agentic-loops-activity
title: "Agentic loops history and statistics"
description: "Progress, history and activity for each agentic loop, plus counts, durations, success and failure, idle and stale. A cost figure appears only when existing telemetry already has one. Design only (docs/prd/AGENTIC-LOOPS-DASHBOARD.md). The board is HUB-NEW:agentic-loops-dashboard. Roadmap FF-NEW:agentic-loops-dashboard."
implemented: false
status: planned
surface: ui
link: docs/prd/AGENTIC-LOOPS-DASHBOARD.md
docs: docs/prd/AGENTIC-LOOPS-DASHBOARD.md
tags: [dashboard, agents, loops, statistics, history]
date: 2026-11-10
tests:
  - {na: "docs-only PRD; history and statistics land with the dashboard implementation"}
prd:
  - "FR-NEW:agentic-loops-history"
  - "FR-NEW:agentic-loops-statistics"
prd_new:
  - key: agentic-loops-history
    kind: FR
    text: "Opening a loop on the dashboard must show the progress the source already has, the recent activity, and the history of earlier completed runs for that actor, each as a link to the underlying record. A history source that does not exist yet must be named as missing, and the row must still show what the console jobs, sessions and workflow runs already provide. The dashboard must not copy a transcript, a log body or a private repository into the row."
  - key: agentic-loops-statistics
    kind: FR
    text: "The dashboard must show counts by kind, source, status and flight, durations where start and finish exist, success and failure among completed runs, and idle and stale counts. A cost figure must appear only when the cost ledger or the live view already has one for that run, and a run with no figure must show no cost."
