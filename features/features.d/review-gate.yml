title: "Review gate: needs-amr label holds a PR from agent merge"
description: "A PR in a gated category (constitution § 12) carries the needs-amr label and Fleet status Needs Amr; a check fails while the label is present, so the PR is never mergeable by an agent until Amr clears it."
