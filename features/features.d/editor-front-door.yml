# features/features.d/editor-front-door.yml — compiled into features/features.yml at merge (HUB-NEW)
id: HUB-NEW
slug: editor-front-door
title: "The editor is a front door: every harness surface from VS Code through tools/dash"
description: "Every development tool, loop, gate and surface of the hub is reachable from VS Code (.vscode/launch.json, 131 configurations in eleven groups that follow the console's sections, plus tasks.json) through tools/dash, a tool's own entry point, or docker compose against the hub's services — the shared core via `tools/dash up`, per-project stacks via `tools/dash dev up <p> [--debug]`, workspace-hosted submodules via compose exec on the workspace port block. Real debuggers where a surface can be debugged: the console's FastAPI under debugpy on :4004 with its page under Vite on :5173 proxied to it, debugpy on any generator or hub test, debugpy attach into law-ai, djangoerp and fredgar-ai. Pickers and ports come from the registries and tools/test_vscode_launch.py holds them equal (constitution § 20); fleet repos carry their own .vscode calling their own one-command entry points (UPS-REPO-40, audited by tools/conformance.py, surfaced by dash audit as the `vscode` artifact)."
implemented: true
status: shipped
surface: infra
link: .vscode/launch.json
docs: .vscode/README.md
tags: [ vscode, editor, dash, debug, developer-experience ]
date: 2026-11-02
tests:
  - tools/test_vscode_launch.py
  - tools/test_docker_view.py
prd: ["FR-NEW:editor-front-door"]
prd_new:
  - key: editor-front-door
    kind: FR
    text: "Every development tool, loop, gate and surface of the hub is reachable from the editor through the same entry points the CLI, the Harness Console's job API and CI run (`tools/dash`, a tool's own entry point, or `docker compose` against the hub's services), never a second implementation; every port, project, site, scenario and loop an editor configuration names comes from its registry and a gate (`tools/test_vscode_launch.py`) holds the pickers equal to those registries; a new surface adds its editor entry in the same pull request; fleet repos with a run, test or debug command carry their own `.vscode/launch.json` + `tasks.json` calling their own one-command entry points (UPS-REPO-40); see constitution § 20 and `.vscode/README.md`"
