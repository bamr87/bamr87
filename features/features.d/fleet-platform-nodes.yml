id: HUB-NEW
slug: fleet-platform-nodes
title: "Workloads placed across fleet nodes, with OpenTofu for node infrastructure"
description: "Where every hub service runs is data: _data/fleet.yml `nodes:` places each compose service on the Mac (the edge) or forge (a workload node), and tools/fleetcore/nodes.py resolves it against docker-compose.yml, refusing an edge-bound service off the edge, a workload service that calls back to the edge, durable data on a node without a backup and a colliding link port. `tools/dash node status|plan|gen|key` show reachability, capacity and drift, preview the move (--assume-enabled), write each node's compose overlay, its OpenTofu inputs and the Ansible inventory of the workload nodes, and print the forwarding-only link key; `tools/dash infra plan|apply` runs OpenTofu (infra/node) for the node's network and data volumes, apply gated on --yes and a saved plan of the current inputs; .github/workflows/infra.yml validates the HCL. forge ships disabled, so nothing moves until that flag is the deploy step (ADR 0003, docs/PLATFORM.md)."
implemented: true
status: partial
surface: infra
