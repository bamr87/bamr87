id: HUB-NEW
slug: pm-review
title: "The routine PM review: project, roadmap and release alignment"
description: "A daily, read-only review (`tools/dash pm`, fleet-pm.yml) reads every open issue and pull request of the registry repos, their pull-request state, recent comments and releases, and the Fleet project, and reports what is out of line with three records: the Fleet project (every item tracked with Status and Priority, closed work marked Done, pull-request and CI state mirrored), the roadmap (_data/roadmap.yml entries following the issues they name) and each repo's release train (blocked or waiting release PRs, unreleased work). It plans the Fleet project ops as a preview `tools/dash projects apply` takes through the § 11 service and the roadmap status edits for the working tree, publishes the public snapshot _data/pm_review.yml with a 30-run history, and never writes to GitHub itself. The console surface, unattended sync and the agent brief are later phases of #588."
implemented: true
status: partial
surface: cli
link: tools/pm_review.py
docs: docs/PM.md
tags: [ pm, projects, roadmap, releases, loops ]
date: 2026-11-04
tests:
  - tools/test_pm_review.py
prd: ["FR-NEW:pm-review", "NFR-NEW:pm-review-read-only"]
prd_new:
  - key: pm-review
    kind: FR
    text: "The product must review, on a schedule, every open issue and pull request of the registry repos against the Fleet project, the roadmap and each repo's release train, and report each mismatch with its evidence and a proposed fix."
  - key: pm-review-read-only
    kind: NFR
    text: "The PM review must not write to GitHub: the Fleet project ops it plans are applied only through the § 11 write-back service after a person has read them, and its public outputs must not list a private repo's items."
