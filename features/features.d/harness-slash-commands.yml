# Numbered at merge: id stays HUB-NEW (amendment 0002).
id: HUB-NEW
slug: harness-slash-commands
title: "Run the harness and its loops one stage at a time from Claude Code: /harness, /loops and /console slash commands over the console's operation allowlist"
description: "Three namespaces of Claude Code slash commands (.claude/commands/harness, loops, console) let an operator run any part of the harness and any stage of any loop from a session: /harness:status, :inventory, :health, :decisions, :graph, :gates, :refine, :learn and :lake observe and gate the harness; /loops:list and one command per loop of the console's loops table (pulse, issues, conflicts, pm, credentials, evolution, scout, fanout, upkeep) run one stage at a time (plan, rehearse, run, show, publish, ci); /console:ops, :run and :jobs reach the whole allowlist. Every stage runs through `tools/dash ops` (tools/console/ops_cli.py), which runs the console's own operations with their validation and confirm gate, and joins the running console's job list and locks when it serves the same checkout. The console gains the operations the loop stages lacked (agents, pm, conflicts, conflicts-resolve, evidence), the jev_conflicts and fleet_pm loops, their dispatch, and a select for fixed-choice parameters. tools/console/test_ops_cli.py holds the commands to the console: every operation they name exists, nothing they pre-approve can write to GitHub or spend, and the /loops commands cover exactly core.LOOPS. The surface check and the catalog read a command subdirectory as a namespace."
implemented: true
status: shipped
surface: cli
link: tools/console/ops_cli.py
docs: .claude/README.md
tags: [ harness, loops, console, claude-code, slash-commands ]
date: 2026-11-13
tests:
  - tools/console/test_ops_cli.py
  - tools/console/test_console.py
  - tools/test_jev_surface.py
  - tools/test_vscode_launch.py
prd: ["FR-NEW:harness-slash-commands", "FR65", "FR63"]
