title: "JEV: the fleet doctor's step spec and local dry run (P3, step 1)"
description: "The fleet doctor (fleet-pulse.yml, job doctor) is the second agent step with one spec CI and the local loop runner render from (tools/jev/steps/fleet-pulse/doctor.yml + doctor.prompt.txt; ADR 0002 P3, bamr87/bamr87#488, epic #484): the prompt the workflow carries inline is held byte-equal to the spec, its model and turn cap are _data/fleet.yml remediation.model (claude-opus-5-5, an exact id) and remediation.max_turns, and the fix step pins the spec pair's hash. The spec format gained what the doctor needs, each optional and v1-compatible: a prompt with no token (inputs: {}), workspace.cwd hub, workspace.brief_file (the work order at its fixed root name), the fleet-write credential posture (CI's exact token routes, which parity holds exact; the local engine still hands the agent no credential) and local.harvest patch (the agent's edits are the output; its own branch and commits are inside the tamper allowance). Locally, python3 -m tools.jev loop run fleet-pulse runs CI's queue one candidate per attempt: dash-gen remediate --plan-dir splits the queue and fetches the evidence Step 2 of the prompt would read with gh into each brief, the sealed attempt edits the hub clone, the engine harvests changes.patch, the adapter pairs it with the gh pr create / gh issue create the permission layer refused (MARKER line first) and dash-gen doctor-file writes the dry-run preview; --apply is refused by the filer, naming #488, until the publish step lands. budget.loops rose from $25 to $50 so one $40 doctor attempt fits (a maintainer decision)."
