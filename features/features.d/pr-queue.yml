prd: ["FR-NEW:pr-queue", "FR-NEW:pr-queue-bulk-actions"]
prd_new:
  - key: pr-queue
    kind: FR
    text: "The Harness Console must list every open pull request of the hub and the registry repos in one queue, each with its checks collapsed per check to the latest run on the head commit, its review-gate verdict and reason, the merge method its repo allows, and who moves it next, filterable by repo, kind, gate and who, with fan-out batches grouped by head branch."
  - key: pr-queue-bulk-actions
    kind: FR
    text: "The PR queue must let the maintainer select pull requests and apply one bulk action through a plan made from live GitHub and shown per pull request first; the plan is applied only after the maintainer confirms, only while it still matches GitHub, through the console's job API, with each result recorded; a merge or close runs only while its pr_queue switch is on."
