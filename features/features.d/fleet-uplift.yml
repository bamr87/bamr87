id: HUB-NEW
slug: fleet-uplift
title: "Fleet uplift: what one repo improved that the others still lack, captured for the hub and deployed by the loops it already has"
description: "tools/dash uplift reads every fleet repo's default branch from the local submodule checkouts and compares file contents: a repo that changed a file other repos still hold in an earlier version, byte for byte, is a candidate, listed with exactly the repos behind and the route the contents imply (the kit that seeded the file, or the same patch in each repo). Content that is the hub's own, that came in on a fan-out branch, that carries a newer kit stamp or that several repos already hold is a rollout in flight, shown with the repos that have not taken it. A second lane lists the features each repo declared or shipped in its feature index. uplift file previews one hub issue per candidate for the issue pipeline and files only the bytes a person previewed, never from a repo less visible than the hub, never twice, inside its caps. It reads no GitHub and calls no model; the judgment (is the change general?) is a Claude Code session's, through the uplift skill and the work order uplift brief renders."
implemented: true
