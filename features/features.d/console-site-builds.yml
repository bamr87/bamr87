# A site build of the console: the same page published at another address under that site's own identity, with the bashOS desktop as its front door. The first is bash-365, the platform's front door.
id: HUB-NEW
slug: console-site-builds
title: "Site builds: the console published at another address, with the bashOS desktop as its front door"
description: "`_data/profile.yml` `sites:` declares other public builds of the Harness Console, and `CONSOLE_SITE=<key> tools/console/build-pages.sh` (or `tools/dash serve`) builds one: the same app and documents with that entry laid over `site:`, so its title, who it is by, its link card and its mark are settings (ADR 0011). A site may make the bashOS desktop its front door (`front_door: desktop`): `/` is then the desktop under the site's name and mark, the profile Home answers at `/home`, and the start menu, the palette and the classic console reach every other page. With `desktop.icons: repos` the desktop shows an icon for every repo in the registry, grouped in a dock that scrolls: its own frontend framed where it has one, the generated repo app (HUB-080) where it has not, the site's pinned apps first. A site build's page policy names the launcher's origins in `frame-src`, so it frames the fleet's live sites; the default build keeps `frame-src 'self'`. `sites.bash-365` is the first: the front door of the bash-365 platform, with the BASH Consulting site pinned and framed from the live site. Built without `CONSOLE_SITE` the public site is unchanged. Not built: where the bash-365 build is served (the maintainer's decision), and BASH content rendered natively in a window."
implemented: true
status: partial
surface: ui
link: tools/console/build-pages.sh
docs: docs/CONSOLE-PAGES.md
tags: [console, frontend, bashos, desktop, portal, instances]
date: 2026-11-20
tests:
  - tools/console/test_pages.py
  - tools/console/test_bashos_shell.py
  - tools/test_vscode_launch.py
scenarios:
  - verify/sites/site-front-door.yml
evidence:
  - test/evidence/site-front-door
prd: [FR58, FR77, "FR-NEW:console-site-builds"]
prd_new:
  - key: console-site-builds
    kind: FR
    text: "The Harness Console must be buildable as a named site for another address, taking that site's title, mark and front door from the instance's settings and not from code, with the default public build unchanged when no site is named; the first such site is the front door of the bash-365 platform: the bashOS desktop with an icon for every repo and application the registry declares, the BASH Consulting site among them."
