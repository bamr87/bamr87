title: "Recursive harness refinement (Harness²): the surface check, the Propose–Probe–Compose plan and evidence tree, the experience library"
description: "JEV capability three adopts the Harness² method onto the hub's own loops at $0: `tools/dash refine surface check` validates any repository's harness surface (the context-file chain, settings permissions and hooks, agents, skills, commands, hook scripts, MCP) with the rules production harnesses converge on and holds the hub's own clean; `refine plan` prints one Propose–Probe–Compose step's schedule, its R = 4k / P = 3k identity and its ceiling against budget.loops; `refine evidence` builds the redacted evidence tree a proposer reads from real local attempts; and `refine library` keeps the human-gated experience library (_data/harness_library) whose lessons reach every local attempt through the context pack. The model-backed stages are ADR 0004 P1."
