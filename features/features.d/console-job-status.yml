id: HUB-NEW
slug: console-job-status
title: "In-flight job status for agents: state, ages and slowness diagnostics"
description: "A job sent through the Harness Console reports, per job, a derived state (queued, running, stalled, done, failed), the time since it was sent and since its last progress (log growth or heartbeat), and basic diagnostics on why it may be slow (waiting on the queue or a conflicting job, live-collector lag, a long-running step, no heartbeat). Exposed as MCP read tools job_status(job_id) and an enriched jobs_list (state and diagnostics per row), built on the existing /api/jobs, job_log, sessions and ops_list, and shown on the console's Jobs page, so the primary bot can audit an operation instead of holding only its receipt (motivating case: a slow Claude Code session lookup that could not be diagnosed)."
implemented: false
status: planned
surface: infra
link: tools/console/mcp_layer/server.py
docs: tools/console/docs/job-status.md
tags: [ console, mcp, jobs, observability, agents ]
date: 2026-11-01
tests:
