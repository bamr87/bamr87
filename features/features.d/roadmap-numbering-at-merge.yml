id: HUB-NEW
slug: roadmap-numbering-at-merge
title: "JEV: roadmap FF ids assigned at merge"
description: "Roadmap entries join conflict-free numbering. A pull request (or the /future-features flow, or the feature-scout) writes a new roadmap entry as _data/roadmap.d/SLUG.yml with id: FF-NEW and cites it elsewhere as FF-NEW:SLUG; tools/jev/number.py assigns the next FF-NNNN on main (one past the highest FF ever seen in the roadmap, feature catalog, PRD, changelog or a numbered amendment, so gaps such as FF-0022/0023/0027/0028 are never back-filled), appends the entry to _data/roadmap.yml as text (header kept), rewrites FF-NEW:SLUG references in the same run and deletes the fragment. `jev number lint --base` rejects a hand-picked `- id: FF-NNNN` added to roadmap.yml, `jev number next` reports the next FF, governance_lint accepts roadmap ids in an amendment's Affects line, and the PM review and Work board read pending fragments as FF-NEW:SLUG."
implemented: true
status: shipped
prd: [FR28]
surface: infra
link: tools/jev/number.py
docs: docs/JEV.md
tags: [ jev, governance, numbering, roadmap ]
