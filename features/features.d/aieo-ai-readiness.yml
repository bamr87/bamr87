description: "A repo-readiness mode in the AIEO engine (hub tools/aieo/, migrated from zer0-CMS apps/aieo) run by tools/conformance.py as check ai-ready: validates each layer (OpenAPI, server.json, llms.txt, --json, JSON-LD) and scores agent docs; warn-only per repo until its fan-out PR lands, then a hard fail; the score is advisory until AIEO passes its § 13 eval set, then a score below the minimum (PLACEHOLDER 60/100) also fails. Enforces HUB-NEW:ai-ready-foundation."
