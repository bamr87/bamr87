id: HUB-NEW
slug: fleet-assistant-baseline
title: "The fleet assistant baseline: any fleet page can be shared with a Claude Code session, through one page bridge with an adapter per platform"
description: "A page of any fleet site or app that carries the kit's payload (templates/assistant/fleet-assist.js) can be shared with the Harness Console on the same machine from a small panel on the page. A Claude Code session paired with it by a single-use code then reads what the person has open, learns which repo and source file it came from, points at things and, in the mode the person chooses (Look, Ask first or Act), navigates, clicks and types. The rules are the console page's own: nothing is clicked or typed inside a modal dialog, a secret field is never read or filled, and the page holds no token. tools/dash apps assist says which baseline each repo's platform gets: the page bridge for the 19 repos that draw pages (Jekyll, MkDocs, plain HTML, Django templates, React, Next.js), the agent-context baseline for the 22 that do not. Fanned out as pull requests with tools/fanout.sh --kit assist."
implemented: true
status: shipped
