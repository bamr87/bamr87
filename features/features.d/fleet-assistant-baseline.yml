prd: ["FR-NEW:fleet-assistant-baseline"]
prd_new:
  - key: fleet-assistant-baseline
    kind: FR
    text: "Every repo in the fleet must have a baseline way for an AI agent to work with it, sized to its platform: where a repo draws pages, an agent session the person paired with a page can see that page and act on it only as far as the person allows, under the same rules on every stack; where it does not, the agent works in its checkout on the fleet's agent context."
