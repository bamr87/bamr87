# Automatic credential rotation through the fleet's key rotation protocol (backlog).
# Numbered at merge: id stays HUB-NEW (amendment 0002).
id: HUB-NEW
slug: credential-auto-rotation
title: "Automatic credential rotation: started by a secret-scanning alert, a schedule or a failing credential, for the credentials the weekly loop does not reach"
description: "Backlog. Extends the fleet's key rotation protocol (the token contract in _data/fleet.yml tokens: and the weekly credential loop, docs/TOKEN-ROTATION.md) to credentials it cannot declare today: a secret on one repository, an organization secret and a third-party provider key. Its first trigger is a GitHub secret-scanning alert: an alert for a covered credential, starting with google_api_key alerts on bamr87/zer0-CMS (bamr87/bamr87#460), automatically starts a rotation of the affected key instead of only flagging it. The alert is detected by a secret_scanning_alert webhook delivery or by a scheduled poll of the secret-scanning alerts API, and the rotation contains first (revoke or restrict), then mints the replacement, updates the consuming secret, verifies, resolves the alert as revoked and closes the tracking issue. Where automation cannot perform a step (no provider API, no access, a key it cannot match, a copy outside GitHub secrets) the rotation still starts and that step goes to a person as a prepared, containment-first instruction that automation verifies. A rotation also starts on its schedule, on a rejected health probe, on consecutive consumer failures and on an approaching expiry, automated where the provider has an API and assisted where only a person can mint. First covered, by name: the zer0-CMS Google API key (bamr87/bamr87#460), the ai-world-view organization's CLAUDE_CODE_OAUTH_TOKEN (ai-world-view/ai-world-view.github.io#29) and bamr87/it-journey's AUTO_PR_GITHUB_TOKEN (bamr87/bamr87#761). Design only (docs/prd/CREDENTIAL-ROTATION.md): no workflow, tool, setting or secret is changed. Direction: bamr87/bamr87#788. Roadmap FF-NEW:credential-auto-rotation."
implemented: false
status: planned
surface: infra
link: docs/prd/CREDENTIAL-ROTATION.md
docs: docs/TOKEN-ROTATION.md
tags: [security, tokens, rotation, secrets, secret-scanning, backlog]
date: 2026-11-11
tests:
  - {na: "docs-only backlog item; the contract additions, triggers and adapters land in later implementation PRs"}
prd:
  - "FR-NEW:credential-rotation-contract"
  - "FR-NEW:credential-rotation-alert-trigger"
  - "FR-NEW:credential-rotation-triggers"
  - "FR-NEW:credential-rotation-methods"
  - "NFR-NEW:credential-rotation-failure"
  - "NFR-NEW:credential-rotation-audit"
prd_new:
  - key: credential-rotation-contract
    kind: FR
    text: "Every credential the fleet's automation depends on must be declared by name in the token contract (_data/fleet.yml tokens:) with its owner, its scope and location (fleet, hub, one repository, an organization, or a third-party provider), its rotation class (automated, assisted or propagate), its maximum age and expiry lead, its triggers and its consumers; a secret a fleet workflow reads that the contract does not declare must be reported by name (see docs/prd/CREDENTIAL-ROTATION.md)."
  - key: credential-rotation-alert-trigger
    kind: FR
    text: "A GitHub secret-scanning alert for a covered credential (one whose alert type the token contract lists) must automatically start a rotation of the affected key instead of only flagging it; this is the key rotation protocol's first trigger, wired first for google_api_key alerts on bamr87/zer0-CMS (bamr87/bamr87#460). The alert must be detected by a secret_scanning_alert webhook delivery forwarded to the hub or by a scheduled poll of the secret-scanning alerts API that hides the secret, with the poll kept as the backstop. The rotation must contain first (revoke the affected key, or restrict it where the contract says so), then mint the replacement, update each consuming secret, verify the new credential and its consumers, resolve the alert as revoked and close the tracking issue. Where automation cannot perform a step (no provider API, no access, a secret that matches no key the owner controls, a consumer copy outside GitHub secrets) the rotation must still start by itself and hand that step to a person as an ordered, containment-first instruction that automation verifies before it performs the remaining steps, and automation must never resolve as revoked an alert whose key it did not revoke. A webhook delivery and a poll for one alert must produce one rotation, a failed step must leave the alert and the tracking issue open saying what is needed, and no step may print, log or store a secret value (acceptance criteria: docs/prd/CREDENTIAL-ROTATION.md § 7.1)."
  - key: credential-rotation-triggers
    kind: FR
    text: "Beside the secret-scanning alert, the key rotation protocol must start a rotation of a declared credential on its schedule (maximum age, or its expiry less the lead) and on two more events read on the fleet's scheduled reads: a capability probe the provider rejects, or N consecutive consumer runs failing at authentication; a rate limit or spent usage window is never a trigger, an unreachable signal reads unknown instead of healthy, and one credential has at most one open rotation and one tracking issue."
  - key: credential-rotation-methods
    kind: FR
    text: "A credential a provider can mint and revoke through an API must be rotated with no human step; a credential only a person can mint (a browser sign-in, a web form) must be rotated with one prepared step that states the command or link, the scopes, the expiry and where the value goes; in both cases the new credential must be verified by a capability probe and by its consumer running before the rotation is recorded as done and before the old credential is revoked."
  - key: credential-rotation-failure
    kind: NFR
    text: "Every rotation must follow detection, containment, recovery and verification in that order: a leak contains the old credential (revoke or restrict) before anything else, any other trigger keeps it valid until the new one is proved in every consumer, values are written hub first, a malformed or under-scoped value is refused before any target is written, a leaked credential that was revoked is never restored, a consumer failing on a dead credential is paused only through the central switches map, and a step that fails leaves one tracking issue saying what is needed and never fails silently; the alert-started rotation runs unattended only while the maintainer has switched it on, and every other revocation or secret write outside the existing weekly propagation waits for the maintainer's confirm."
  - key: credential-rotation-audit
    kind: NFR
    text: "Every rotation must be recorded in a committed, values-free ledger (credential name, scope, target, trigger and its evidence link, each step with its time and result, the actor, the outcome), and no secret value, fragment or hash of one may ever appear in a log, a ledger, an issue, a pull request, a commit, a command's arguments or a URL; a value travels only from an environment variable to a secret store's stdin, masked before first use."
