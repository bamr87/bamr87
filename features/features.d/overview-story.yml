    text: "The console's front door must answer, before any scrolling, how healthy the fleet is, which way each budget is moving against its ceiling, what waits on the maintainer and how current its inputs are; it must show a count's cap, a series' direction and a finding's lever rather than a bare number, and every figure must link to the page that explains it."
