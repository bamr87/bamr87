id: HUB-NEW
slug: console-loop-run-op
title: "Run a loop's agent step locally from the console, the TUI and the MCP (loop-run)"
description: "P2 of epic #484 (bamr87/bamr87#487): the JEV loop runner as the console's `loop-run` op. Every loop page lists the agent steps whose spec has a `local:` block (read through tools.jev, never a list kept in the console) and offers Run locally beside Dispatch in CI; the op form takes the loop, the step, one registry target and `rehearse`; the TUI's `L` runs the selected repo; the fleet MCP's run_op reaches the same job API. The job is `tools/dash loop run <loop> [step] --target <name> --json`: the spec, planner and prompt bytes CI renders, one capped attempt per item in the § 13.8 sandbox, then the dry-run preview under .fleet/runs/ — never a filing. A live attempt spends Claude budget (API-equivalent, an estimate), so it is confirm-gated; a rehearsal is $0 and is not. Two runs of one loop never overlap (a key per loop); without a `claude` CLI on the console's PATH the op says so instead of failing; `apply` is refused with #487 named until the § 11 write-path decision. The engine's run record is parsed once (tools/fleetcore/loopjob.py) into the status, spend and per-item fields the job page and the TUI render. The public build shows the step and no run button."
