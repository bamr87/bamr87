id: HUB-NEW
slug: jev-context-pack
title: "JEV: the loop runner's context pack — the fleet's planes, read on the host for a sealed agent"
description: "Phase 2 of the loop runner's context pack (bamr87/bamr87#486, epic #484): before each local attempt the HOST reads the fleet's planes — the SQLite data lake (closed issues and PRs, CI on the tracked branch, agent runs and failing command heads), the Qdrant + Ollama code index (queries from the item's brief: the registry description, the category and stack, the operator focus or the first conformance gap) and Claude Code's OTel telemetry in Elasticsearch — plus the loop's own earlier attempts, through tools/dash-gen context (fleet-context/v1, read-only, bounded) and tools/jev/context.py, and places one capped, redacted, freshness-stamped pack as <brief_dir>/context.md in the throwaway clone, with a fixed pointer appended to the clone's copy of the brief. The agent stays sealed (§ 13.8 both layers, no network, empty MCP) and only reads a file; the reviewed prompt bytes never change (JEV_STEP_SHA256), the plan's brief and tier 0's reuse key never change, and every engine write into the clone is a new file under real directories (O_EXCL, no link followed). The step spec's local.context block sets mode (auto, off, require), file, providers, cap, deadline and window; loop plan/run --context overrides it (off is the CI-identical attempt; require fails an item whose plane is down as context-blocked before any spend), --refresh-context imports this machine's Claude Code sessions into the lake first (never a GitHub sync, never scheduled), loop plan previews each item's statuses and ages, loop doctor shows the hub's planes with their refresh commands, and the pack's sha256 and statuses are recorded in run.json, attempts.jsonl, argv.json and summary.md. $0: no model, no GitHub write. A live read-only MCP for the agent is a later decision."
implemented: true
status: partial
surface: cli
link: tools/jev/context.py
docs: docs/JEV.md
tags: [ jev, ai, loops, local, context ]
