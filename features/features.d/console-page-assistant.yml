prd: ["FR-NEW:console-page-assistant"]
prd_new:
  - key: console-page-assistant
    kind: FR
    text: "The console must let an assistant session see the page a person has open and act on it for them only as far as that person allows: the session reads and points by default, each action is asked of the person unless they chose otherwise, and no session can answer a confirming dialog or read or fill a secret field."
