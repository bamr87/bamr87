id: HUB-NEW
slug: weekly-routine
title: "The weekly routine: save everything, get back to main, recap the week and plan the next"
description: "tools/weekly.py and `tools/dash weekly`. Every Friday night a LaunchAgent takes inventory of the hub and every submodule, proves what is merged, saves everything else to a local archive, refreshes to main and removes what is proven safe, ranks the open work and drafts the week's chronicles and retro. Every external write waits for one confirm, and one weekly pull request records the state and publishes the writing."
implemented: true
status: shipped
surface: cli
