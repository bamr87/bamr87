tests:
  - tools/test_weekly.py
prd: ["FR-NEW:weekly-routine"]
prd_new:
  - key: weekly-routine
    kind: FR
    text: "The hub must, once a week and without help, save all work that exists only on the maintainer's machine, return the workspace to main without removing anything unmerged or in use, and prepare the week's recap and next week's plan, with every external write held for one confirmation."
