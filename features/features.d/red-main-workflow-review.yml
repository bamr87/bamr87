# The CI review loop of the red-main resolver: is the CI right to run, and right to fail?
# Numbered at merge: id stays HUB-NEW (amendment 0002).
id: HUB-NEW
slug: red-main-workflow-review
title: "CI review loop: each failed run on a red default branch traced through its workflow, judged for selectivity, and answered with a minimal diff (proposed)"
description: "A read-only loop of the red-main resolver (proposed `tools/dash red-main ci-review`, HUB-NEW:red-main-resolver). For each failed or cancelled run on a red default branch, and optionally a capped sample of failed pull-request runs, it reads the failed step's log, traces the workflow at the run's own commit (triggers, branches, paths, concurrency, job and step conditions, matrix) through every reusable workflow, composite action and script the fleet owns, including bamr87/.github and the hub, and flags the CI as over-broad, under-selective, misconfigured or ok, each with file-and-line evidence. For every flag but ok it proposes the minimal fix as a diff suggestion in its output and routes it: to Claude Code as a handoff issue (§ 26), as one kit issue when the same file sits in several repos, or to the maintainer when it touches a setting, a secret, branch protection or a tag. It never edits a workflow, a script, a setting or a secret, and never proposes weakening a check to clear a real failure. Time and rate budgets, an audit record per finding, a central kill switch. Design only (docs/prd/RED-MAIN-RESOLVER.md § 20); its first application to seven red default branches is § 20.8."
implemented: false
status: planned
surface: cli
link: docs/prd/RED-MAIN-RESOLVER.md
docs: docs/prd/RED-MAIN-RESOLVER.md
tags: [loops, harness, ci, workflows, review]
date: 2026-11-11
tests:
  - {na: "docs-only PRD; the subcommand, its rule table and their tests land in later implementation PRs"}
prd:
  - "FR-NEW:red-main-ci-review"
  - "NFR-NEW:red-main-guardrails"
prd_new:
  - key: red-main-ci-review
    kind: FR
    text: "For each failed run on a red default branch, and optionally a sample of failed pull-request runs, the hub must review the CI itself, read-only: trace the workflow at the run's commit through its triggers, conditions and matrix and through the reusable workflows, composite actions and scripts it calls; flag it as over-broad, under-selective, misconfigured or ok with file-and-line evidence; and propose the minimal fix as a diff suggestion in its output, routed to Claude Code for implementation (§ 26) and to the maintainer for anything that touches a setting or a secret. It must never edit a workflow, a script, a setting or a secret, and must never propose weakening a check to clear a failure it has not shown to be a non-issue."
