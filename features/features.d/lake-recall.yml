id: HUB-NEW
slug: lake-recall
title: "Lake recall: past local sessions by keyword"
description: "tools/dash lake recall --query WORDS, the console's GET /api/lake/recall and the MCP read tool lake_recall find the stored local Claude Code sessions whose first prompt or one assistant turn holds every word of the query: one result per session, best match first (FTS5 bm25, or a substring match when the sqlite build has no FTS5), at most 50, each with its key, session id, repo, start and end and an excerpt of at most 300 characters that the context pack's Scrubber redacts before it is clipped. Only that redacted text is indexed and matched, so a query cannot probe what the redaction hides. The lake is attached read-only and the index is built in memory for each call, so recall never writes the lake; an empty query exits 2 (a 422 on the route); no network. Proof is .github/scripts/dash-gen/test_fleet_lake.py."
implemented: true
status: shipped
surface: cli
