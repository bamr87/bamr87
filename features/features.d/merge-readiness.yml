id: HUB-NEW
slug: merge-readiness
title: "Merge readiness: what is left before a pull request merges, on the pull request and in the queue"
description: "Every pull request has one verdict (ready, waiting, not-ready) and an ordered list of what is left before it merges: the checks on its head commit, its base, its draft state, the review gate and its label, the governance trace, the description's task list, review threads and the review decision, each with who moves it. The PR queue computes it for every row (tools/dash prs --verdict, /api/prs, the MCP pr_queue tool) and for one pull request read live (tools/dash prs ready --pr). With vars.PR_READINESS_ENABLED set to true, pr-review.yml writes the same thing on the pull request on every finished workflow and on the events that start none (marked ready, labelled, edited): under the failed runs in the one sticky comment while anything is left, and as one comment-only review per head commit when nothing is. No model; ADR 0012 stage A."
implemented: true
status: partial
surface: cli
link: tools/fleetcore/prqueue.py
docs: docs/adr/0012-merge-readiness.md
