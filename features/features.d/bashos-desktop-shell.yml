# features/features.d/bashos-desktop-shell.yml — numbered at merge (amendment 0002)
id: HUB-NEW
slug: bashos-desktop-shell
title: "The bashOS desktop: an icon for every fleet app, each opened in a window that shares one App Shell"
description: "ADR 0005 decisions 9 and 10 (phase D0). The console's Desktop page (/desktop) is the bashOS OS shell in the browser: a dock of icons, one per fleet frontend, floating windows and a taskbar, in the bashOS GUI's paper palette (--os-* in /theme.css). Its window state is bashOS's own layout reducer, vendored byte-identical in tools/console/web/src/vendor/bashos/ and pinned by tools/console/test_bashos_shell.py: open, focus, move, resize, snap to an edge, minimize and restore, tile and cascade, and a layout shared as a ?windows= link that carries ids and geometry and never an address. Every window hosts the common App Shell (the Apps page's controls) around the framed app. The Fleet window lists every repo in the registry by the frontend component it has or is owed (fleetcore.apps repos, `tools/dash apps plan`), and a repo with no frontend opens a window that says which component it gets. Below 900 px the desktop is a home screen that opens one app at a time. Console pages as windows and the generated repo app are later phases."
implemented: true
status: partial
surface: ui
link: /desktop
docs: docs/FRONTEND-PLATFORM.md
tags: [ console, frontend, bashos, desktop, portal, registry ]
date: 2026-11-05
tests:
  - tools/console/test_bashos_shell.py
  - tools/test_fleetcore_apps.py
  - tools/test_fleetcore.py
  - tools/console/test_pages.py
scenarios:
  - desktop
evidence:
  - test/evidence/desktop
prd: ["FR58", "FR-NEW:bashos-desktop-shell"]
prd_new:
  - key: bashos-desktop-shell
    kind: FR
    text: "The product must present the fleet as a desktop in the browser on the bashOS layout engine: an icon for every app, each opened in a window that shares one set of controls, every repo listed by the frontend component it has or is owed, and the same desktop usable at a phone's width."
