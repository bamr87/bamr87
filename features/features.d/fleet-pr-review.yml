  - key: fleet-pr-review
    kind: FR
    text: "The hub must provide a reusable PR review workflow that posts at most one sticky summary comment per PR (none when clean), inline comments only for severity-tagged deduplicated findings, a fleet signature footer on every comment, never posts with the maintainer's personal token, skips content checks on Dependabot and release PRs, runs AI review only on opened, ready_for_review or label events behind the central switch, and sends cost and test tables to job summaries."
