prd: ["FR26", "FR46", "FR54", "FR56", "FR59", "FR60", "FR63", "NFR9", "NFR11", "FR-NEW:harness-loop-contract", "FR-NEW:harness-task-trace", "FR-NEW:harness-adapters", "NFR-NEW:harness-protocol-portable"]
prd_new:
  - key: harness-loop-contract
    kind: FR
    text: "Every fleet harness (the Harness Console API, CI agent steps, local headless runs and each JEV tier) must run work as tasks with sessions, a typed event stream (task, turn, tool call, interrupt, budget, artifact, error) validated by one versioned schema, interrupts that pause for approval and resume, and enforced budgets, using MCP for tools and AGENTS.md for repo instructions."
  - key: harness-task-trace
    kind: FR
    text: "Every harness task must emit one OpenTelemetry GenAI span tree to Phoenix, a root span per task with a child span per turn and per tool call, whose trace id is stamped on every harness event and redacted before export."
  - key: harness-adapters
    kind: FR
    text: "External agent protocols (the Unified Harness Protocol, A2A, AG-UI, Agent Client Protocol) must connect only through adapters that map to the fleet contract, each off by default, version-pinned and removable without changing the core."
  - key: harness-protocol-portable
    kind: NFR
    text: "The harness core never depends on a single-vendor or pre-1.0 protocol: core tests pass with every adapter removed, a pinned spec drifting raises an attention item instead of a failure, and no adapter can bypass risk tiers, kill switches or budgets."
