id: HUB-NEW
slug: harness-protocol
title: "Common harness protocol and platform: one agent-loop contract for console, CI, local and JEV harnesses (proposed)"
description: "Design only (Draft). Refactors the harness layer onto one agent-loop contract (tasks, sessions, a typed event stream, interrupts as approval pauses, budgets) that the Harness Console API, CI agent steps, local headless Claude Code and the JEV tiers all speak; keeps MCP for tools and AGENTS.md for repo instructions; emits one OTel GenAI span tree per task to Phoenix; treats the Unified Harness Protocol as an optional adapter and plans A2A as the later external interface (AG-UI and Agent Client Protocol as options). Harmonizes the fleet.yml harnesses contract, #586, #587, #472, the activity-replay epic #624 and FF-0032. Epic bamr87/bamr87#632, roadmap FF-0038. Spec: docs/prd/HARNESS-PROTOCOL.md."
implemented: false
status: planned
surface: infra
link: docs/prd/HARNESS-PROTOCOL.md
docs: docs/prd/HARNESS-PROTOCOL.md
tags: [ harness, protocol, agent-loop, mcp, otel, phoenix, a2a, uhp, jev, epic ]
