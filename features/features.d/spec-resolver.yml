# Resolver, CI gate, and docs-site parity. One feature, three requirements plus the SSOT non-functional.
id: HUB-NEW
slug: spec-resolver
title: "Functional spec resolver, CI gate and docs parity"
description: "One resolver reads each repo's specs.json and the central library and emits one resolved set (core plus framework overlay, minus exclusions, ratified overrides last). CI fails on an unknown id or a required spec without coverage. The docs site renders that same output. Design only (docs/prd/FUNCTIONAL-SPEC-LIBRARY.md)."
implemented: false
status: planned
surface: infra
link: docs/prd/FUNCTIONAL-SPEC-LIBRARY.md
docs: docs/prd/FUNCTIONAL-SPEC-LIBRARY.md
tags: [specs, ci, docs, resolver]
date: 2026-11-10
tests:
  - {na: "docs-only PRD; resolver tests land in the implementation PR"}
prd:
  - "FR-NEW:spec-resolver"
  - "FR-NEW:spec-library-gate"
  - "FR-NEW:spec-docs-parity"
  - "NFR-NEW:spec-resolver-ssot"
prd_new:
  - key: spec-resolver
    kind: FR
    text: "One fleet-level resolver must read each repo's manifest, load the matching library entries, and produce one resolved spec set per repo: core specs plus the framework-specific overlay for the repo's kinds, minus exclusions that are in force, with ratified override precedence applied last."
  - key: spec-library-gate
    kind: FR
    text: "On every pull request, resolution must run and fail when a required spec in the resolved set lacks coverage or when the manifest names a spec id that is not in the library."
  - key: spec-docs-parity
    kind: FR
    text: "The docs site must render each repo's spec page from that same resolver output, so the page shows the set CI enforces, including coverage gaps and unknown ids."
  - key: spec-resolver-ssot
    kind: NFR
    text: "CI and the docs site must both call the one resolver and must not reimplement selection, exclusion or override precedence. A test must show that the document the gate asserts is the document the page renders."
