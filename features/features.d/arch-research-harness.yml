id: HUB-NEW
slug: arch-research-harness
title: "Architecture research harness: literature-grounded fleet architecture review and research papers"
description: "A read-only R&D loop that surveys each fleet repo's high-level architecture against a versioned literature registry, ranks structural challenges linked to feature and PRD ids, turns qualifying challenges into research projects, and publishes reviewed research papers under docs/research/. Design only."
implemented: false
status: planned
surface: infra
docs: docs/ARCH-RESEARCH-HARNESS.md
tags: [ harness, architecture, research ]
date: 2026-10-30
prd: ["FR-NEW:arch-research-survey", "FR-NEW:arch-research-sources", "FR-NEW:arch-research-trace", "FR-NEW:arch-research-papers", "FR-NEW:arch-research-gate"]
prd_new:
  - key: arch-research-survey
    kind: FR
    text: "The hub must survey every registry repo's high-level architecture on a rotating cadence, read-only, and record per-repo fitness and ranked findings."
  - key: arch-research-sources
    kind: FR
    text: "Every architecture finding and paper must cite only entries of a versioned source registry that is refreshed at least quarterly."
  - key: arch-research-trace
    kind: FR
    text: "Every architecture finding and recommendation must link to feature catalog ids and PRD requirement ids, and accepted recommendations must become Fleet project items."
  - key: arch-research-papers
    kind: FR
    text: "The harness must turn a qualifying architecture challenge into a scoped research question and produce a research paper in docs/research/<slug>/ with a fixed structure, sources and metadata."
  - key: arch-research-gate
    kind: FR
    text: "No research paper may be published until automated citation and traceability checks, an independent AI review and a maintainer merge have passed."
