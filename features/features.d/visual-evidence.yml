id: HUB-NEW
slug: visual-evidence
title: "Visual evidence standard: screenshots and front-end evidence for tutorials, guides and setup docs"
description: "A hub-owned standard (constitution § 24) that requires tutorials, how-tos, setup docs, console/UI help and walkthrough articles to ship screenshots, GIFs or recordings — with naming under docs/assets/guides/<slug>/ or test/evidence/<slug>/, meaningful alt text, redaction of secrets/PII/tokens, and re-capture when the depicted UI changes — plus a warn-then-fail guides lint (tools/guides_visual_lint.py), Harness Console capture/attach helpers (phased), and fleet fan-out from the hub. Distinct from § 15 frontend-PR evidence; epic #678, backlog #679, roadmap FF-0039."
implemented: false
status: planned
surface: infra
link: tools/guides_visual_lint.py
docs: docs/VISUAL-EVIDENCE.md
tags: [ docs, guides, evidence, console, lint, standards ]
date: 2026-11-05
tests:
  - tools/test_guides_visual_lint.py
prd: ["FR-NEW:visual-evidence"]
prd_new:
  - key: visual-evidence
    kind: FR
    text: "Tutorials, how-tos, setup docs, console/UI help pages and walkthrough articles must ship visual front-end evidence (screenshots, a short recording or a GIF) under docs/assets/guides/<slug>/ or test/evidence/<slug>/ with meaningful alt text and redaction of secrets/PII/tokens, or a one-line skip-visuals reason; a guides visual lint must flag gaps (warn-only per repo until adoption, then hard fail); when a PR changes a depicted UI it must update or re-capture the guide visuals in the same PR."
