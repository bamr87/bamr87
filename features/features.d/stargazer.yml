id: HUB-NEW
slug: stargazer
title: "Stargazer: the open-source radar (stars, trending, like the fleet)"
description: "tools/stargazer.py (tools/dash stars; daily, read-only stargazer.yml) reads the account's public GitHub stars and star lists, every fleet repo's topics, the repos rising this week, this month and in the fleet's strongest topics, and one search per fleet project; tools/fleetcore/stars.py categorises each repo, matches it against every fleet project by tf-idf over topics, stack, language and description with the shared terms as the reason, measures star velocity from a thinned history, flags star-farmed repos and never recommends them, and lists what each project should review. The committed _data/stars.json feeds the console's Stars page (radar, starred, trending, fleet match, feed, a repo drawer), /api/stars and the published site, the MCP's fleet_stars, and a SessionStart hook that starts every local Claude Code session with the starred repos relevant to its project; private repositories and lists never enter it."
implemented: true
status: shipped
surface: ui
link: tools/console/web/src/pages/Stars.tsx
docs: docs/STARGAZER.md
tags: [ stars, discovery, console, loop, sessions ]
date: 2026-11-23
tests:
  - tools/test_stargazer.py
  - tools/console/test_console.py
  - tools/console/test_mcp_layer.py
scenarios:
  - verify/scenarios/stars.yml
evidence:
  - test/evidence/stargazer
prd: ["FR-NEW:stargazer-radar", "FR-NEW:stargazer-session-brief"]
prd_new:
  - key: stargazer-radar
    kind: FR
    text: "The hub must keep a public radar of the account's GitHub stars and of the repositories trending in, or most like, the fleet's projects — categorised, measured by star velocity, matched to each fleet project with the reason, with star-farmed repositories flagged and never recommended — and render it on the console and the published site, read-only on GitHub."
  - key: stargazer-session-brief
    kind: FR
    text: "Every local Claude Code session must start with the starred repositories relevant to the project it works in, so a starred repository is considered before an equivalent is built; the brief treats third-party text as data and never names a suspect repository."
