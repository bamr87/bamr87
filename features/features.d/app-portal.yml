# features/features.d/app-portal.yml — numbered at merge (amendment 0002)
id: HUB-NEW
slug: app-portal
title: "The app portal: every fleet frontend opened inside the Harness Console, at its live address or its local stack"
description: "P0 of ADR 0005. One launcher (fleet-launcher/v1, tools/fleetcore/apps.py) joins each registry `frontend:` block to its live address and to the ports its compose-hosted dev stack publishes in _data/ports.yml. The console's Apps page (/apps, GET /api/apps, the public snapshot) lists every frontend and opens one in a sandboxed frame at /apps/<id>: Live or Local, at the page width or one of the verify kit's device sizes, with a path box that stays inside the app. A stopped local stack shows the command that starts it; the public page asks no address anything until a reader opens an app. `tools/dash apps` prints the same list in a terminal, `apps open` opens one in the console, and `apps check` reports whether each address answers, whether it moves to another origin and whether the shell may frame it. The console's Content-Security-Policy names exactly the launcher's origins. Starting a stack, running a repo's scenarios from the portal, the bridge, and the VS Code and mobile shells are later phases."
implemented: true
status: partial
surface: ui
link: /apps
docs: docs/FRONTEND-PLATFORM.md
tags: [ console, frontend, portal, registry, launcher, cli ]
date: 2026-11-04
tests:
  - tools/test_fleetcore_apps.py
  - tools/test_frontend_registry.py
  - tools/console/test_console.py
  - tools/console/test_pages.py
scenarios:
  - apps
evidence:
  - test/evidence/apps
prd: ["FR58", "FR-NEW:app-portal"]
prd_new:
  - key: app-portal
    kind: FR
    text: "The product must let a person open any frontend the registry declares from one place, in the browser and from a terminal, at its deployed address or at its local development stack and at a chosen device size, framing only addresses the registry declares and asking a visitor's own machine nothing unprompted."
