id: HUB-NEW
title: "Typed decisions gate the pipeline: a decision lockfile, traces and replay, the trim and verify loops"
description: "Every skip, retry and auto-fix in a fleet pipeline is a typed, thresholded, replayable decision that fails closed: _data/decisions.yml holds each question, its options, its confidence threshold and its conservative branch; the typed-decision composite action asks TypeSafe Jev (or claude -p) and returns answer, confidence and cleared; every decision writes a trace the lake keeps beside run cost, queue time, cache hit rate, flake rate and time-to-green; the doctor and the issue pipeline classify a failure before any agent turn and a 0.70-floor patch screen checks every PR; a per-PR trim loop selects tests and prunes matrix legs in shadow until the nightly decision-verify loop has reported zero missed failures, and a missed failure becomes a regression case and a demotion; and one flow policy (fleet.yml flow:) bounds work in process per lane, loop and repository, balances the loops' shares of capacity, is read by every loop before it takes a slot, and is measured daily and drawn on the Work board, Roadmap and Home pages. Plan and phases: docs/prd/AGENTIC-SDLC.md; decision: ADR 0008."
implemented: false
status: planned
surface: infra
link: docs/prd/AGENTIC-SDLC.md
