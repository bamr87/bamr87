prd_new:
  - key: typed-decision-gate
    kind: FR
    text: "A workflow consumes a pipeline decision only through the typed-decision action against an entry in _data/decisions.yml, which declares the question, its options or rubric, its confidence threshold and its conservative branch; a decision below threshold or unanswerable takes the conservative branch and never fails the step."
  - key: decision-trace-replay
    kind: FR
    text: "Every decision writes one trace (policy fingerprint, model version, inputs digest, usage, typed answer, confidence, cleared, outcome) that the lake keeps beside run cost, and the traces of a window can be replayed against the current lockfile and fuzzed for stability."
  - key: trim-verify-loops
    kind: FR
    text: "Test selection and matrix pruning run in shadow per repository until a nightly verify loop has reported zero missed failures over the declared window; a missed failure becomes a regression case in the decision's eval set, raises the threshold and demotes the repository, and an optimization is promoted only when minutes drop on the billing meter while missed failures stay at zero."
  - key: flow-control
    kind: FR
    text: "One flow policy in _data/fleet.yml declares work-in-process limits per lane, loop and repository and each loop's share of capacity; every loop asks it for slots before taking work and records the answer; WIP against limit, throughput, lead time, blocked age, starvation and epic and roadmap progress are measured daily at no model cost and shown on the Work board, the Roadmap page, the Home page and the public site."
  - key: fail-closed-decisions
    kind: NFR
    text: "No typed decision ever skips work, lowers a gate or lets an agent act unless its confidence cleared the lockfile threshold; a model error, timeout or usage limit is the conservative branch."
