name: Verify

# kit: verify v__KIT_VERSION__
# Adopted from bamr87/bamr87 via verify-fanout (tools/fanout.sh --kit verify).
# Thin caller — the machinery is shared and versioned in bamr87/bamr87
# (.github/workflows/fleet-verify.yml, tools/features_index.py, docs/VERIFICATION.md).
#
# What runs:
#   every PR commit   validate features/features.yml, start the app per
#   (opened, pushed   verify/verify.yml, execute verify/scenarios/*.yml with
#   to, reopened)     Playwright, upload the evidence bundles, summarise coverage.
#   label `verify`    additionally hand the LIVE app to a Claude Code pass that
#   (or dispatch)     drives it through the Playwright MCP like a user would,
#                     writes verify/AGENT-REPORT.md, and the WORKFLOW (never the
#                     agent) posts it on the PR. Needs CLAUDE_CODE_OAUTH_TOKEN
#                     (ANTHROPIC_API_KEY fallback) — pass `secrets: inherit`.
#
# What does not run, because it only repeated a verdict (kit 0.2.0):
#   any other label   bots label a PR in bursts as they open it (Dependabot two
#                     labels, the content agents up to four), and each label
#                     started a full pass that cancelled the one in flight.
#                     Such a run now takes a concurrency group of its own and
#                     its job skips, at zero minutes.
#   a push to the     nearly every push there is a merged PR whose commits
#   default branch    this workflow had just verified (151 of 155 sampled
#                     across ten repos in 2026-11). Dispatch it to verify the
#                     default branch on demand.
#
# Advisory until this repo's scenarios are trustworthy; then flip `gate` to
# true to make a failing scenario block the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: "Run the Claude Code verification pass against the live app"
        type: boolean
        default: false
      only:
        description: "Comma-separated scenario ids (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

# A label other than `verify` must neither re-run the pass nor cancel the one in
# flight, so it gets a group of its own here and the job below skips. Both halves
# are needed: with the `if:` alone, the label run would still take the shared
# group and cancel the real run before skipping, leaving the PR with no verdict.
concurrency:
  group: verify-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'verify') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'verify' }}
    uses: bamr87/bamr87/.github/workflows/fleet-verify.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      gate: false
      agent: ${{ github.event_name == 'workflow_dispatch' && inputs.agent || contains(github.event.pull_request.labels.*.name, 'verify') }}
      only: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
    secrets: inherit
