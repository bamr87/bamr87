# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/gitorio
provenance: derived
summary: GitFactory — a visual builder whose blueprints compile to GitHub Actions
  workflows running Claude agents; plus the Fleet Ops cockpit that observes the wider fleet.
lanes:
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--docs-gardener
  kind: content
  harness: claude-code-action
  implementation: .github/workflows/factory--docs-gardener.yml
  description: 'Factory: Docs Gardener'
  triggers:
  - kind: dispatch
  switch: DOCS_GARDENER_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
- id: factory--gitorio-factory-1
  kind: other
  harness: claude-code-action
  implementation: .github/workflows/factory--gitorio-factory-1.yml
  description: 'Factory: Gitorio Factory 1'
  triggers:
  - kind: event
    events:
    - issues
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--gitorio-factory-2
  kind: other
  harness: claude-code-action
  implementation: .github/workflows/factory--gitorio-factory-2.yml
  description: 'Factory: Gitorio Factory 2'
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: factory--gitorio-factory-3
  kind: other
  harness: claude-code-action
  implementation: .github/workflows/factory--gitorio-factory-3.yml
  description: 'Factory: Gitorio Factory 3'
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: false
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
  - factory--docs-gardener
  - factory--gitorio-factory-1
  - factory--gitorio-factory-2
  - factory--gitorio-factory-3
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by `claude setup-token`.'
  used_by:
  - claude
  - factory--docs-gardener
  - factory--gitorio-factory-1
  - factory--gitorio-factory-2
  - factory--gitorio-factory-3
