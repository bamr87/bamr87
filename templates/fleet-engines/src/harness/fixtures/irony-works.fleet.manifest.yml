# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/irony-works
provenance: derived
summary: A self-growing encyclopedia of irony — the germinate engine scouts candidates,
  scores them at the Alanis Gate, and drafts passes into vault/nursery/ for a human to merge.
lanes:
- id: alanis-gate
  kind: other
  harness: claude-cli
  implementation: .github/workflows/alanis-gate.yml
  description: Alanis Gate
  triggers:
  - kind: event
    events:
    - pull_request
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: germinate
  kind: content
  harness: claude-cli
  implementation: .github/workflows/germinate.yml
  description: Germinate
  triggers:
  - kind: schedule
    cron: 0 6 * * 1
  - kind: dispatch
  switch: GERMINATE_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    writable_paths:
    - vault/nursery/
    - vault/compost/the-merely-unfortunate.md
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - alanis-gate
  - germinate
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by `claude setup-token`.'
  used_by:
  - alanis-gate
  - germinate
skills:
- grow-irony-works
