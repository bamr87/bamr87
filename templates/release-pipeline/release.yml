name: Release

# kit: release-pipeline v__KIT_VERSION__
# Scaffolded by tools/adopt-release.sh — Conventional Commits drive release-please
# (opens a release PR that bumps the version + CHANGELOG); merging it tags, releases,
# and publishes. Shared logic lives in bamr87/.github. See release-please-config.json.
#
# Pinned to bamr87/.github's floating major tag, never a branch (UPS-WORK-10,
# UPS-QA-40). `tools/adopt-release.sh <repo> --upgrade` refreshes this file while
# it is untouched; a hand-edited copy is left alone.

on:
  push:
    branches: [__DEFAULT_BRANCH__]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bamr87/.github/.github/workflows/release-please.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: bamr87/.github/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
