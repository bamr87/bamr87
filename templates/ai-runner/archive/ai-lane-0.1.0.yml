# kit: ai-runner v0.1.0 — a caller of the fleet's reusable AI lane.
# Copy per lane; fill the four __PLACEHOLDERS__; keep the rest.
# Docs: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
name: __LANE__

on:
  schedule:
    - cron: "17 6 * * 1"          # pick an odd minute; never :00
  workflow_dispatch:              # a human can always run it by hand (bypasses the switch)

# Least privilege lives HERE: the reusable lane inherits exactly these.
permissions:
  contents: write
  pull-requests: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: __LANE__
      switch: __SWITCH___ENABLED     # repo VARIABLE; the lane idles until it is "true"
      agent: __AGENT__               # .claude/agents/__AGENT__.md owns the role
      prompt: "You are the __AGENT__ agent for __PROJECT_NAME__. Do EXACTLY ONE unit of work, verify it with the repo's own harness, open ONE pull request, write its URL to pr-result.txt, and STOP. Never merge."
      tools: "Bash,Read,Write,Edit,Grep,Glob"
      setup-ruby: "3.3"
      result-file: pr-result.txt
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
