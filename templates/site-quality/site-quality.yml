name: Site quality

# kit: site-quality v__KIT_VERSION__
# Adopted from bamr87/bamr87 via tools/fanout.sh --kit site-quality.
# Thin caller: the machinery is shared and versioned in bamr87/bamr87
# (.github/workflows/site-quality.yml, .github/site-quality/, specs/QUALITY.md
# "Site quality"). Every threshold lives in .github/site-quality.yml (this
# repo's config, validated against templates/site-quality/site-quality.schema.json).
#
# What runs (mode: build):
#   build the Jekyll site with a FRESH copy of its theme (remote_theme is
#   resolved to a commit SHA and pinned for the build; the SHA is recorded in
#   the job summary and report.json), serve _site locally, then run
#   Lighthouse CI, axe-core at 390 px and 1366 px, and pa11y contrast.
#   Reports are uploaded as the `site-quality-report` artifact.
#
# The job fails only for what .github/site-quality.yml marks as `error` (or
# `axe.fail_on`, or a contrast `max`). With the template config nothing is an
# error yet, so adopting this workflow cannot turn CI red.
#
# Pinned @v1 (major tag; additive releases move it). Never pin a custom tag.
# (__DEFAULT_BRANCH__ is substituted on adoption.)

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    uses: bamr87/bamr87/.github/workflows/site-quality.yml@v1
    permissions:
      contents: read
    with:
      mode: build
      config: .github/site-quality.yml
