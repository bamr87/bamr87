# kit: community v__KIT_VERSION__ (UPS-REPO-18). Labels are fleet taxonomy (UPS-AGENT-32).
name: 🐛 Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug", "agent:queued"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, commit or URL
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Triage sets the priority label (P0–P3). This is a hint.
      options:
        - "Outage or data loss"
        - "Major: a core flow is broken"
        - "Minor: a workaround exists"
        - "Cosmetic"
