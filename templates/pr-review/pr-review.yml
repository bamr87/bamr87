name: PR review

# kit: pr-review v__KIT_VERSION__
# Seeded from bamr87/bamr87 templates/pr-review/. Every CI failure on a pull
# request is summarized in one sticky comment (constitution § 19): the job, the
# reason from its log, whether the PR probably caused it, and what to do. The
# comment is deleted when nothing is failing. Each failed run also gets an AI
# analysis in that comment (§ 19.11), from the repo's CLAUDE_CODE_OAUTH_TOKEN:
# without it the comment says the analysis could not run. With the repo variable
# PR_READINESS_ENABLED set to 'true', the same comment also says what is left
# before the pull request merges (ADR 0012), and the pull-request events below
# keep it current. The AI review's findings (the kit's pr-ai-review.yml) are
# posted from here too. All the logic lives in the hub's reusable pr-review.yml;
# repo-specific checks plug in as inputs there.
# Off switch: set the repo variable PR_REVIEW_ENABLED to 'false'; the AI analysis
# alone: PR_AI_ANALYSIS_ENABLED to 'false'.

on:
  workflow_run:
    workflows: ["**", "!PR review"]
    types: [completed]
  # Merge readiness: the pull-request events that start no workflow of their own.
  # pull_request_target runs the hub's reusable file with this repo's token; it
  # checks out the hub's tooling only and reads the pull request through the API,
  # never its code.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read

# One review per head commit at a time; a later event queues, never cancels, so
# no update is dropped. The group is keyed like the reusable's but named apart:
# a caller and its called workflow sharing one group deadlock.
concurrency:
  group: pr-review-caller-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    uses: bamr87/bamr87/.github/workflows/pr-review.yml@v2
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    with:
      hub-ref: v2
    # Only the Claude credential, by name: the AI analysis runs one tool-less call with it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
