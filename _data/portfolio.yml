# =============================================================================
# _data/portfolio.yml — how the profile README groups the portfolio
# =============================================================================
# Read by .github/scripts/dash-gen (`dash-gen readme`) to render the profile
# README.md <!-- AUTO:projects --> span. Display only: nothing else reads it,
# so an entry under `extra:` is NOT a fleet member (no fan-out, drift, health or
# UX audit). To make a repo a fleet member, add it to _data/projects.yml instead.
#
#   groups   ordered list of {key, heading, blurb}; the portfolio categories
#            from the portfolio standard (topic taxonomy)
#   members  repo name -> group key, for registry entries (_data/projects.yml)
#            an unmapped registry entry falls back to its registry `category`
#   extra    owned repos shown on the profile but kept out of the registry:
#            {name, repo_url, description, group, status, live_url, fork}
#
# Status marks rendered after the description: experiment 🧪, maintenance 🛠️,
# archived 💤 (registry) — and `github_archived: true` 🗄️, `fork: true` 🍴,
# `private: true` 🔒 on extras.
# =============================================================================
groups:
  - key: platform
    heading: "🛰️ Fleet platform & standards"
    blurb: "The control plane, shared CI and the standards every repo follows."
  - key: zer0
    heading: "🎨 zer0 Jekyll ecosystem"
    blurb: "The zer0-mistakes theme and the plugins, CMS and demo sites built around it."
  - key: sites
    heading: "🌐 Websites"
    blurb: "Personal and business sites."
  - key: knowledge
    heading: "📚 Knowledge bases & learning"
    blurb: "Self-growing knowledge bases, study material and learning platforms."
  - key: ai
    heading: "🤖 AI applications & research"
    blurb: "Applications and experiments built on LLMs."
  - key: agents
    heading: "🧠 AI agents & SDLC automation"
    blurb: "Frameworks that put AI agents to work on repositories."
  - key: business
    heading: "💼 Business & career apps"
    blurb: "ERP, finance data and CV tooling."
  - key: devtools
    heading: "🛠️ Developer tools & extensions"
    blurb: "VS Code extensions and terminal tooling."
  - key: games
    heading: "🕹️ Games & retro computing"
    blurb: "Games, game frameworks and retro emulation."
  - key: related
    heading: "🔗 Related projects (not owned by bamr87)"
    blurb: "Upstreams vendored into the fleet hub, and repos that moved to other owners."
  - key: forks
    heading: "🍴 Forks"
    blurb: "Personal forks of other projects."

