# =============================================================================
# _data/standards.yml — the standardization baseline for the dash
# =============================================================================
# The "definition of done" every submodule is held to, tiered by what a repo
# actually is. Consumed by:
#   - tools/audit-standards.sh   (`dash audit`) — per-repo conformance matrix
#   - tools/check-drift.sh       — the standardization slice of the drift gate
#   - .github/workflows/fanout.yml (kit: standardize) — what to propagate downward
#
# Per artifact, each tier declares a level:
#   required     -> missing = FAIL (red)      counts against the gate
#   recommended  -> missing = WARN (amber)    surfaced, non-blocking
#   na           -> not expected (grey)       omit or set "na"
#
# TIER ASSIGNMENT (highest precedence first):
#   1. an explicit `tier:` field on the registry entry
#   2. tier_overrides below (by project name) — forks, pure content, archived
#   3. status_tier below (derived from the registry `status`)
#   4. fallback: experiment
#
# KIND ADJUSTMENT (applied after the tier, never raising a level):
#   kind_overrides below lowers an artifact's level for a stack kind — a Jekyll
#   site proves itself with a build gate and user scenarios, not a tests/ dir.
#   Kinds come from the registry `kinds:` field, else `.github/sdlc.yml`
#   (`kinds:`, or `type:` mapped per the sdlc kit), else detection (a root
#   `_config.yml` is a site).
#
# OVERRIDE HYGIENE: every tier_overrides key must be a registry `name` and every
# value a declared tier. `dash audit` lists offenders as `stale_overrides` and
# drift check (f) FAILS on them — a stale key used to silently no-op, which is
# how a renamed repo lost its tier without anyone noticing.
# =============================================================================

# Canonical artifact ids + the paths that satisfy each (first match wins).
# `ci` requires the dir to contain at least one *.yml/*.yaml.
artifacts:
  readme:        [README.md, README.rst, readme.md]
  license:       [LICENSE, LICENSE.md, LICENSE.txt, COPYING, COPYING.md]
  gitignore:     [.gitignore]
  editorconfig:  [.editorconfig]
  ci:            [.github/workflows]
  agent_context: [CLAUDE.md, AGENTS.md, .github/copilot-instructions.md, .cursorrules]
  claude_workflow: [.github/workflows/claude.yml]
  # Globs are allowed: a multi-surface repo (UPS-REPO-05) keeps each surface's
  # tests beside it (app/cypress, backend/tests, packages/x/tests), and a Django
  # project keeps tests.py per app. verify/scenarios/ (the agent-verification
  # kit's user scenarios) counts too: a product proved by being used is tested.
  tests:         [tests, test, spec, __tests__, cypress,
                  pytest.ini, jest.config.js, jest.config.ts, vitest.config.ts, vitest.config.mts, vitest.config.mjs,
                  playwright.config.ts, playwright.config.js, .vscode-test.mjs,
                  "*/tests", "*/test", "*/__tests__", "*/cypress", "*/tests.py", "packages/*/tests", "packages/*/test",
                  verify/scenarios]
  container:     [Dockerfile, .devcontainer, docker-compose.yml, compose.yml]
  release:       [release-please-config.json, .release-please-manifest.json, CHANGELOG.md]

tiers:
  active:
    label: "Active / maintained apps & libs"
    readme: required
    license: required
    gitignore: required
    editorconfig: recommended
    ci: required
    agent_context: required
    claude_workflow: recommended
    tests: required
    container: recommended
    release: recommended
  experiment:
    label: "Early / experimental"
    readme: required
    license: required
    gitignore: required
    editorconfig: recommended
    ci: recommended
    agent_context: recommended
    claude_workflow: recommended
    tests: na
    container: na
    release: na
  content:
    label: "Markdown / knowledge base"
    readme: required
    license: required
    gitignore: required
    editorconfig: recommended
    agent_context: recommended
    claude_workflow: recommended
    ci: na
    tests: na
    container: na
    release: na
  fork:
    label: "Fork of an upstream project (rely on upstream)"
    readme: recommended
    license: recommended
    gitignore: na
    editorconfig: na
    ci: na
    agent_context: na
    tests: na
    container: na
    release: na
  archived:
    label: "Archived / read-only"
    readme: required
    license: recommended
    gitignore: na
    editorconfig: na
    ci: na
    agent_context: na
    tests: na
    container: na
    release: na

# Default tier derived from the registry `status`.
status_tier:
  active: active
  maintenance: active
  experiment: experiment
  archived: archived

# Kind-aware adjustments (see KIND ADJUSTMENT above). Only lowering is honoured.
kind_overrides:
  site:
    tests: recommended     # build-validation + verify/scenarios prove a site
  content:
    tests: na

# Explicit per-project tier overrides (project name -> tier).
# Keys MUST be exact registry `name` values from _data/projects.yml and values
# MUST be declared tiers — `dash audit` reports anything else as stale and the
# drift gate fails on it.
tier_overrides:
  # forks: standardize only what bamr87 adds; upstream owns the baseline
  skills: fork
  # djangoerp: NOT a fork. It was labelled one here on the strength of a stale
  # "PostHog fork" note; the repo is bamr87's own Django ERP and, since the
  # amrs-project consolidation, the fleet's accounting/ERP system of record.
  # It is held to the full active-tier baseline like any other first-party repo.
  # zer0-CMS: NOT a fork either. The `fork` override dated from the
  # vscode-front-matter import; the repo is bamr87's own CMS monorepo (Wagtail,
  # Rails, the VS Code extension and the zer0-mistakes theme) and is held to the
  # active baseline since 2026-10-20.
  # pure content / knowledge bases (no build, no tests) — none registered at
  # present; the 1987, 2005 and cv entries were retired with their repos
  # (cv now lives in cv-pro). Add a `name: content` line here when one returns.
