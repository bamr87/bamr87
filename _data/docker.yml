missing_checkouts: []
commands:
- cmd: tools/dash dev up <project> [--debug]
  does: launch (and debug) any submodule from the hub
- cmd: tools/dash dev ps
  does: what is running, with its URLs
- cmd: tools/dash dev ports
  does: the allocation table
- cmd: tools/dash dev smoke check
  does: re-run the recorded baseline; exit 1 on regression
- cmd: tools/dash dev db-upgrade <project> --yes
  does: migrate a Postgres major without data loss
- cmd: tools/dash docker audit|apply|check|fleet
  does: converge a repo to the image contract
- cmd: tools/dash docker view --write
  does: regenerate this view
