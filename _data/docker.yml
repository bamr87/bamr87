shared:
- name: phoenix
  alias: fleet-phoenix
  default: true
  ports:
    ui: 6006
    grpc: 4317
  image: null
  url: http://127.0.0.1:6006/
  rationale: A trace sink with no schema coupling to its clients, and CLAUDE.md already designates ONE
    Phoenix as "the local stack's trace store" that `dash lake export` ships the whole fleet into. law-ai
    and bashos each ran a third copy on the same 6006/4317, which is both a collision and a violation
    of that design. Consolidating is strictly a fix.
- name: postgres
  alias: fleet-db
  default: false
  ports:
    sql: 5439
  image: postgres:17-alpine
  url: null
  rationale: 'Available behind `--profile shared-db`, NOT default. Sharing a server is correct for plain-Postgres
    consumers (one server, one database per app) but it is a behaviour change to a working stack, and
    two consumers cannot join at all: aieo needs timescale/timescaledb and law-ai pins its major version
    with a dump/restore note. Those keep their own, on a deconflicted `database:` band port.'
- name: redis
  alias: fleet-redis
  default: false
  ports:
    redis: 6389
  image: null
  url: null
  rationale: "Same deal as postgres \u2014 safe in principle (a logical DB index per app), but default-off\
    \ until each consumer is moved deliberately."
