# =============================================================================
# _data/fleet.yml — the fleet's central control-plane configuration
# =============================================================================
# ONE file for the settings that were previously copy-pasted inline across a
# dozen workflows: toolchain versions, schedule cadences, remediation caps, and
# the token/variable contract every repo is held to.
#
# Consumed by:
#   - tools/fleet-config.py        — reader + `dash config` / `dash secrets`
#   - .github/workflows/fleet-pulse.yml — cadence + caps for the daily loop
#   - .github/scripts/dash-gen/remediation.py — ranking + cap defaults
#   - .github/scripts/dash-gen/harness.py   — scorecard thresholds + trip wires
#   - .github/scripts/dash-gen/harness_registry.py — fleet harness/schedule contract
#
# WHY A FILE INSTEAD OF ORG SETTINGS
# ----------------------------------
# `bamr87` is a personal account, not an organization, so GitHub's org-level
# secrets/variables and shared rulesets are unavailable — there is no server-side
# place to centralize. The workable equivalent is: declare the contract here (in
# version control, reviewable, diffable), and use tooling to PROJECT it onto the
# fleet (`dash config sync`) and AUDIT the result (`dash secrets`). Secret VALUES
# never live here — only their names, purpose, and required placement.
# =============================================================================

# --------------------------------------------------------------------------- #
# Toolchain — the versions every reusable CI workflow defaults to.
# Bump here, not in each workflow's `inputs.default`.
# --------------------------------------------------------------------------- #
toolchain:
  node: "20"
  python: "3.12"
  ruby: "3.3"

# --------------------------------------------------------------------------- #
# Dependencies — the fleet-wide version policy: ALWAYS LATEST.
#
# Decision (2026-08): every repo installs whatever is newest at build time.
# No exact pins, no version ceilings, no committed lockfiles. Breakage is
# expected to surface in standard CI and flow through the daily fleet-pulse
# loop (triage → doctor draft PR) instead of being prevented by pinning.
# Accepted tradeoffs, on the record: builds are not reproducible, and a bad
# (or malicious) upstream release reaches CI the day it ships — the fleet
# trades both for zero update maintenance.
#
# Applied by: tools/unpin-deps.sh (one repo), the deps-latest kit in
# tools/fanout.sh + deps-fanout.yml (fleet-wide PRs), and the hub's own tree.
# Full policy: docs/DEPENDENCIES.md
# --------------------------------------------------------------------------- #
dependencies:
  strategy: latest
  lockfiles: never-commit           # local ephemera only — gitignored fleet-wide
  lockfile_patterns:
    - package-lock.json
    - npm-shrinkwrap.json
    - pnpm-lock.yaml
    - yarn.lock
    - Gemfile.lock
    - poetry.lock
    - Pipfile.lock
    - uv.lock
    - composer.lock
  exceptions:
    github_actions: major-tag       # `uses:` needs a ref; @vN floats minor/patch, hub dependabot bumps majors
    pre_commit: pinned-rev          # `rev:` is mandatory in .pre-commit-config.yaml; refresh via `pre-commit autoupdate`
    toolchain: fleet-config         # node/python/ruby versions stay governed by `toolchain:` above, not per-repo pins

# --------------------------------------------------------------------------- #
# Hub identity
# --------------------------------------------------------------------------- #
hub:
  repo: bamr87/bamr87
  shared: bamr87/.github          # reusable workflows + community health files
  default_branch: main
  bot_name: bamr87-bot
  bot_email: "10567847+bamr87@users.noreply.github.com"

# --------------------------------------------------------------------------- #
# Loop cadence (UTC) — the hub's SCHEDULE MAP. Every hub workflow that carries
# a `schedule:` is declared here with the SAME cron; test_schedule.py fails on
# any divergence in either direction (update_submodules once said weekly here
# and ran daily for months).
#
# Two placement rules, both asserted by that test:
#   * never on the hour. GitHub delays and drops :00 schedules under load,
#     and 06:00 was where four AI crons collided (2026-09 review). Hub
#     housekeeping fires at :07, the daily agent chain at :37.
#   * the hub owns 02:00–10:59. Fleet repos should place their own AI crons
#     from 11:00 UTC onward, off the hour — harnesses.throughput caps AI crons
#     per UTC hour at 3, and the hub's chain already takes one slot in each
#     of 05, 07 and (Mondays) 10.
#
# The daily chain is ordered by data flow: pulse publishes → build-dash
# republishes the site → issue-pipeline reads the fresh triage snapshot.
# --------------------------------------------------------------------------- #
schedule:
  rotate_tokens: "7 2 * * 1"      # weekly credential rotation (see rotation:)
  update_submodules: "7 3 * * *"  # daily pointer bump (published directly, [skip ci])
  refresh_dash: "7 4 * * *"       # README AUTO span refresh PR
  reconcile_registry: "7 5 * * *" # registry ↔ GitHub reconciliation
  fleet_pulse: "37 5 * * *"       # gather → publish → remediate (THE daily loop)
  build_dash: "37 6 * * *"        # republish the site after the data lands
  issue_pipeline: "37 7 * * *"    # intake → implement → complete (see issue_pipeline:)
  schema_vendor: "7 8 * * 1"      # weekly hub↔upstream SCHEMA kit parity PR
  repo_evolution: "37 10 * * 1"   # weekly proactive per-repo improvement pass (see evolution:)

# --------------------------------------------------------------------------- #
# Remediation — the auto-fix loop's guardrails.
#
# These are deliberately conservative. The loop opens DRAFT PRs and the caps
# bound blast radius: an agent that misreads a signal can waste a review, not a
# weekend.
# --------------------------------------------------------------------------- #
remediation:
  # Bounded by what the doctor agent can actually WORK, not by what looks
  # ambitious: each candidate costs it ~40 turns out of a 160-turn budget
  # (`--max-turns` in fleet-pulse.yml). At 6 the agent exhausted its turns and
  # the whole day's remediation was lost — a queue nobody can finish delivers
  # fewer fixes than a shorter one. Raise this and raise `--max-turns` with it;
  # test_fleet_pulse_doctor.py fails the pair if you don't.
  max_candidates: 4               # total candidates acted on per run
  max_cross_repo: 3               # of those, how many may become submodule PRs
  min_runs: 3                     # ignore workflows with fewer runs in the window
  min_priority: 10.0              # unflagged workflows at/above this are eligible
  slow_avg_min: 10                # avg minutes/run that counts as "long-running"
  slow_p95_min: 20                # p95 minutes/run that counts as "long-running"
  window_days: 14                 # analytics window
  # False-positive guards. Both exist because one remediation slot — of four,
  # and of only three cross-repo ones — was spent on a workflow that was
  # healthy, switched off, and had been green since fifteen minutes after the
  # failures that flagged it (bamr87/bamr87#92).
  supersede_on_success: true      # latest non-skipped run green ⇒ drop failing/flaky
  interactive_dispatch_pct: 60    # ≥ this % of runs hand-dispatched ⇒ its cost is a
                                  # debugging session, not standing fleet spend, so the
                                  # cost signals (and the priority fallback) don't apply
  # The third guard reads the CLOCK, not the verdict. A workflow triggered rarely
  # (`issues: opened`, `workflow_dispatch`, a weekly cron) cannot clear its own
  # red: the only thing that would is a fresh green run nothing is going to
  # produce, so a resolved incident holds a slot forever (bamr87/bamr87#200 —
  # gitorio Factory 1, red from an outage that lifted four days later, never
  # re-triggered). Unlike the two above this one only DE-PRIORITISES: staleness is
  # absence of evidence, not evidence of health, and a dispatch-only deploy broken
  # for three weeks is stale *and* genuinely broken. Set 0 to switch it off.
  stale_after_days: 7             # latest run older than this ⇒ sorts below every
                                  # live candidate of the same severity, never dropped
  # Signals ranked highest-first. A workflow matching several is ranked by its
  # strongest and reported with all of them.
  severity:
    failing: 100                  # currently red on its default branch
    high-cost-low-value: 80       # most minutes end in non-success
    flaky: 60
    slow: 40
    cancel-heavy: 20
    cron-heavy: 10

# --------------------------------------------------------------------------- #
# Issue pipeline — the three-tier loop that turns an open issue into a
# merge-ready pull request. Counterpart to `remediation:` above: that one fixes
# broken WORKFLOWS, this one resolves ISSUES.
#
#   T1 intake     enrich, gather evidence in an isolated virtual environment,
#                 label, prioritize, assign an owner  → `agent:ready`
#   T2 implement  branch, implement, open a DRAFT PR  → `agent:in-pr`
#   T3 complete   drive CI green, tests + docs, mark ready for review
#
# Stage lives in LABELS, not in a database: a human re-queues, skips, or stops
# any issue by editing one label, and a lost run resumes from current state
# instead of dying with the event that would have chained it.
#
# Consumed by:
#   - .github/scripts/dash-gen/issue_pipeline.py  — queues, caps, taxonomy
#   - .github/workflows/issue-pipeline.yml        — the three agent tiers
#   - tools/issue-evidence.sh                     — evidence timeout
# Full doc: docs/ISSUE-PIPELINE.md
# --------------------------------------------------------------------------- #
issue_pipeline:
  enabled: true
  hub: bamr87/bamr87
  branch_prefix: agent/issue      # T2 branches; also how T3 recognises its own PRs

  # Per-run blast radius. Deliberately small: every tier costs Claude tokens and
  # every T2 candidate becomes a pull request somebody has to look at.
  tiers:
    intake:
      max_issues: 8               # issues enriched per run, fleet-wide
      max_per_repo: 3             # …so one noisy backlog can't consume the run
    implement:
      max_issues: 3               # draft PRs opened per run
      max_cross_repo: 2           # of those, how many may land outside the hub
    complete:
      max_prs: 4                  # pipeline PRs driven toward mergeable per run

  # The virtual environment T1 reproduces issues in (tools/issue-evidence.sh).
  # This is the expensive half of intake — one clone + toolchain install + test
  # run per issue — so it is capped separately and cached by TTL.
  evidence:
    enabled: true
    max_runs: 6                   # evidence bundles built per run
    ttl_days: 7                   # a bundle newer than this is reused, not rebuilt
    timeout_minutes: 8            # per PHASE (clone/install/lint/test/build), not per bundle;
                                  # the workflow step's own timeout is the hard ceiling
    screenshots: true             # capture a page screenshot for web stacks

  readiness:
    min_score: 70                 # 100 − gap weights; below this T1 must not pass it on

  # What may proceed unattended, and what stops one step short of asking for a
  # merge. `assisted` still gets a full implementation and a PR — it just never
  # gets marked ready-for-review by an agent.
  autonomy:
    default: auto
    never_merge: true             # no tier may ever merge. Not configurable in practice.
    assisted_types: [security]    # a security fix always gets human eyes
    assisted_sizes: [size:xl]     # too big to land unattended — split it instead
    assisted_priorities: []       # e.g. [P0] to force review on urgent work

  # Suggested assignee. `bamr87` is a personal account with no teams, so this is
  # a routing table rather than a lookup — override per category or per repo as
  # collaborators appear.
  owners:
    default: bamr87
    by_category: {}               # e.g. docs: some-writer
    by_repo: {}                   # e.g. bamr87/it-journey: someone

  # The taxonomy every tier applies. Created/refreshed in each target repo by
  # `dash issues --sync-labels --apply` — `gh issue edit --add-label` fails the
  # WHOLE call on one unknown label, so a missing label costs an issue its
  # entire triage.
  labels:
    state:
      queued: agent:queued
      ready: agent:ready
      blocked: agent:blocked
      in_pr: agent:in-pr
      done: agent:done
      hold: agent:hold            # human brake: excluded from every tier
      human_review: human-review  # human brake: PR is never auto-advanced
    types: [bug, feature, docs, chore, ci, refactor, test, security, question]
    priorities: [P0, P1, P2, P3]
    sizes: [size:xs, size:s, size:m, size:l, size:xl]

# --------------------------------------------------------------------------- #
# Repo evolution — the weekly PROACTIVE loop's guardrails.
#
# Fourth sibling of `remediation:` (broken workflows), `issue_pipeline:` (filed
# issues), and `rotation:` (credentials). Those three REACT to a signal; this
# one improves what nobody filed a ticket for — documentation accuracy,
# onboarding, clarity, small correctness gaps — in each opted-in submodule's
# own upstream repo, as a DRAFT pull request there. Driven by
# .github/workflows/repo-evolution.yml (`schedule.repo_evolution`), planned by
# `dash-gen targets` (.github/scripts/dash-gen/evolution.py), runnable by hand
# as `dash evolve --repo <name>` / `--all`.
#
# WHY A SCHEDULED AI LOOP IS ACCEPTABLE HERE
# ------------------------------------------
# unified-evolution.yml stays dispatch-only because an unbounded "improve the
# repo" pass on a cron is speculative. This one is bounded the way the other
# scheduled agents are: the target set is declared per repo in the registry
# (`auto_evolve: true`), the planner refuses external upstreams and archived
# repos whatever the registry says, the brief is built from the fleet's
# observed signals (_data/fleet_triage.yml) rather than from imagination, the
# caps below bound each run, one open PR per repo is the backpressure, and
# nothing reaches a default branch without a human. Full doc: docs/EVOLUTION.md
# --------------------------------------------------------------------------- #
evolution:
  enabled: true

  # One open evolution PR per repository at a time. A repo whose previous pass
  # is still open for review is skipped — recognised by the branch prefix OR
  # the hidden marker in the PR body, so a renamed branch cannot fool it. One
  # unreviewed draft is a proposal; a stack of them is noise, and the doctor
  # loop already learned that a loop which re-files every cycle turns a queue
  # into spam. Dispatch with `force` to override for one run.
  skip_when_open_pr: true
  branch_prefix: ai-evolution     # PR branches: ai-evolution/<date>-<run id>
  marker: repo-evolution          # `<!-- repo-evolution key="owner/repo" -->`, first line of every PR body
  label: ai-evolution             # created on demand in the target repo

  # Blast radius per run. Deliberately small: every target is one Opus agent
  # and one pull request somebody has to read. Opt-ins beyond `max_targets`
  # are reported and dropped, never silently truncated.
  max_targets: 6                  # repos evolved per run
  max_parallel: 2                 # concurrent agents — the three Claude loops share one OAuth account's rate limit
  # Per repo (one repo per matrix job): orient (README, CLAUDE.md, tree), read
  # the listed issues/PRs that touch the change, edit, verify with the repo's
  # own lint/tests, report. Wired into `--max-turns` through the plan so this
  # is the only place the number is stated; test_evolution.py asserts the wiring.
  #
  # 120, not 60. Run #1 (2026-08-31) measured what that program actually costs:
  # scripts 46 turns, cv-builder-pro 61, README 63. A cap of 60 sat at the
  # MEDIAN of real demand, so two of three targets were billed in full
  # ($3.51 + $2.85) and produced no pull request — one exhausted at the cap,
  # one finished and had its result rejected for overshooting it. Set above the
  # observed ceiling of 63 with headroom for a repo larger than any of the
  # three, not at it. See bamr87/bamr87#214; `Salvage a successful overshoot`
  # in repo-evolution.yml is the backstop for the day this bound is hit anyway.
  max_turns: 120

  # How much of the triage snapshot each brief quotes. The rest is a link.
  signals:
    max_issues: 8
    max_prs: 5

# --------------------------------------------------------------------------- #
# Harness — the six-layer harness health scorecard + trip wires.
#
# The control plane's self-observation contract (docs/HARNESS.md). The four
# loops above REACT (doctor), RESOLVE (issues), ROTATE (credentials), and
# IMPROVE (evolution); this block watches the AGGREGATE: is the whole harness
# still healthy, and would we know within a day if a signal stopped flowing?
# Computed offline by `dash-gen harness` (.github/scripts/dash-gen/harness.py)
# from the committed fleet signals, published daily by fleet-pulse.yml's pulse
# job into _data/harness_health.yml. A tripped wire is an ATTENTION item — the
# loops above own the fixes; this is the alarm panel.
# --------------------------------------------------------------------------- #
harness:
  # Scorecard pass/fail lines. Only the metrics with a declared threshold are
  # judged; the rest are informational trends. "Completion" is the playbook's
  # real metric: verified runs over started runs, fleet-wide.
  scorecard:
    completion_rate_min_pct: 80   # fleet workflow success rate below this = warn
    effectiveness_min_pct: 70     # minutes ending in success, as a share of all minutes

  # Aggregate-drift alarms. Each wire exists because its failure mode has a
  # named precedent or a bounded blast radius worth watching (docs/HARNESS.md
  # maps each to the playbook's trip-wire table).
  trip_wires:
    # The observability layer watching itself: the pre-fleet-pulse data loops
    # died silently for THREE WEEKS (a ruleset rejected their closing push and
    # nothing said so). This wire makes that class of failure loud within days.
    # token_rotation gets 10 days of slack in the generator — it is weekly.
    stale_data_days: 3
    pass_rate_floor_pct: 75       # fleet-wide quality regression
    waste_ceiling_pct: 30         # non-success minutes / total minutes
    # A workflow averaging this multiple of the fleet MEDIAN run time is a
    # runaway. Median, not mean: one runaway must not raise the baseline that
    # would have flagged it. The absolute floor stops a fleet of sub-minute
    # workflows from tripping this wire on every ordinary CI run.
    cost_spike_multiplier: 3.0
    cost_spike_min_runs: 3        # ignore workflows with fewer runs in the window
    cost_spike_min_avg_min: 5.0   # …and anything cheaper than this on average
    standing_failures_max: 30     # red-workflow backlog beyond what the doctor's caps can drain
    credential_grace_days: 15     # past max_age_days + this, a credential is an alarm, not a chore

# --------------------------------------------------------------------------- #
# Harnesses — the fleet-wide AI-HARNESS DEPLOYMENT contract.
#
# `harness:` above watches the hub's own six layers; THIS block governs the
# harnesses deployed ACROSS the fleet: which repos must carry the agent-context
# kit, how much SCHEDULED agent work the fleet may commit itself to, and what
# the projected spend may grow to before somebody is told. Observed reality is
# gathered daily by `dash-gen harnesses` (harness_registry.py) into
# _data/harness_registry.yml — the read-only inventory the /harnesses/ dash
# page renders and the harness-fanout `gaps` target deploys from.
# Full doc: docs/HARNESS-OPS.md
# --------------------------------------------------------------------------- #
harnesses:
  # The deployable unit is the agent-context kit (templates/agent-context/):
  # the @claude mention workflow, the CLAUDE.md scaffold, and the opt-in
  # .claude artifacts. The CURRENT version is read from that kit's VERSION
  # file at scan time — never duplicated here, so a kit release can't drift
  # from the contract that grades the fleet against it.
  kit: agent-context

  # Baseline every OWNED, non-external, non-archived registry repo is held to.
  # The inventory grades each repo against these; a gap is an attention item
  # and a `gaps` fan-out target — never an auto-write.
  baseline:
    require_mention_handler: true   # a claude-code-action workflow answering @claude
    require_agent_context: true     # CLAUDE.md / AGENTS.md / copilot-instructions / .cursorrules
    require_oauth_secret: true      # CLAUDE_CODE_OAUTH_TOKEN per the rotation ledger
  exempt: [".github"]              # repo names excused from the baseline — bamr87/.github holds the
                                    # org defaults + workflow-templates; nobody @claude's it

  # Throughput — how much SCHEDULED (cron-driven) agent work the fleet may
  # standing-commit to, independent of what mention/PR traffic adds on top.
  # Estimated fires/day are derived from each workflow's cron fields; the
  # OBSERVED rate comes from ai_usage.yml as a cross-check. Exceeding a cap is
  # an attention item: the fix is retuning a cron (or this cap), by a human.
  throughput:
    max_scheduled_ai_per_day_fleet: 30  # estimated cron-driven AI workflow runs/day, fleet-wide
    max_scheduled_ai_per_day_repo: 8    # …and per repo, so one repo can't absorb the whole budget
    max_ai_crons_per_utc_hour: 3        # distinct AI crons sharing one UTC hour — the three Claude
                                        # loops already share one OAuth account's rate limit

  # Budget — trend + forecast guardrails. Claude spend projects from the
  # committed ai_usage.yml window. Actions minutes come from GitHub's OWN
  # billing usage API (actions_usage.yml `billing:`) whenever it is present:
  # the wall-clock proxy ranks workflows but cannot price them — it reported
  # 287k min/month against ~24k actually billed, and put a phantom breach at
  # the top of the attention queue (2026-09 review, docs/WORKFLOW-OPTIMIZATION.md).
  # Crossing a ceiling — or growing faster than trend_warn_pct — is an
  # attention item, not an enforcement action.
  budget:
    monthly_ai_usd: 75              # projected monthly Claude CI spend ceiling
    monthly_actions_minutes: 40000  # BILLED minutes/month ceiling — Jun–Aug 2026 ran 21–27k, all inside the included quota ($0 net)
    trend_warn_pct: 50              # growth beyond this is flagged (week-over-week for spend, month-over-month for billed minutes)

  # Inventory bounds (API cost + output size).
  inventory:
    max_workflow_files: 40          # workflow files parsed per repo
    schedule_limit: 120             # rows in the fleet schedule calendar
  attention_max: 20                 # findings surfaced per run, strongest first

# --------------------------------------------------------------------------- #
# Token contract — WHICH secret does WHAT, and where it must exist.
#
# `scope: hub` secrets live on bamr87/bamr87 only. `scope: fleet` secrets are
# expected on every non-external registry repo (audited by `dash secrets`).
# Values are never stored here.
#
# Each entry may carry a `rotation:` policy read by `dash secrets rotate` and
# the weekly `token-rotation.yml` workflow — see the `rotation:` block below for
# what the knobs mean and what the loop can and cannot do unattended.
# --------------------------------------------------------------------------- #
tokens:
  - name: CLAUDE_CODE_OAUTH_TOKEN
    scope: fleet
    required: true
    purpose: >-
      Preferred Claude auth for every claude-code-action call site (house
      convention: OAuth first). Produced by `claude setup-token`.
    used_by: [fleet-pulse.yml, claude.yml, issue-pipeline.yml,
              unified-evolution.yml, schema-fanout.yml, repo-evolution.yml]
    rotation:
      enabled: true
      # `claude setup-token` mints a ONE-YEAR credential, so the value itself is
      # not the weekly event — distribution and freshness are. 45 days is the
      # propagation heartbeat: any repo whose copy is older than this gets
      # rewritten, which is what pulls a newly-registered repo into line and
      # what re-heals a secret someone deleted by hand.
      # A repo is ALSO stale when its copy predates the hub's, whatever its
      # age. That is the rule that makes a human updating the hub's token
      # actually reach the fleet: without it, every repo written inside this
      # window keeps the OLD credential and the fleet ends up split across two.
      # Real case, 2026-08-24: the hub was updated at 22:26Z and three repos —
      # zer0-mistakes (1d), githubai (4d), irony-works (16d) — were classified
      # current by age and would have been skipped.
      max_age_days: 45
      # A hard deadline measured against the credential's own one-year life.
      # Past this the loop asks a human to re-mint (it cannot do it itself
      # unless `refresh:` below is provisioned).
      lifetime_days: 365
      renew_before_days: 30
      # Accepted value shapes. A rotation that would write something not
      # matching one of these is refused before any repo is touched — the fleet
      # has 41 call sites and a malformed credential breaks all of them at once.
      value_prefixes: ["sk-ant-oat", "sk-ant-oa"]
      refresh:
        # UNOFFICIAL and therefore opt-in: Anthropic documents no programmatic
        # way to re-mint a `claude setup-token` credential (the documented
        # zero-rotation path is Workload Identity Federation — see
        # docs/TOKEN-ROTATION.md). The OAuth refresh grant below is derived
        # from the CLI's own login flow and can change without notice, so the
        # loop treats a failure here as "ask a human", never as an error that
        # costs the fan-out. Provision CLAUDE_CODE_OAUTH_REFRESH_TOKEN on the
        # hub to turn it on; leave it unset to run propagate-and-alert only.
        secret: CLAUDE_CODE_OAUTH_REFRESH_TOKEN
        client_id: 9d1c250a-e61b-44d9-88ed-5944d1962f5e
        # Tried in order. Anthropic moved the token endpoint to platform.*;
        # console.* is kept as the fallback for older tenants.
        endpoints:
          - https://platform.claude.com/v1/oauth/token
          - https://console.anthropic.com/v1/oauth/token

  - name: CLAUDE_CODE_OAUTH_REFRESH_TOKEN
    scope: hub
    required: false
    purpose: >-
      OAuth refresh credential that lets the weekly rotation mint a fresh
      CLAUDE_CODE_OAUTH_TOKEN without a browser. Optional: without it the loop
      still propagates and audits, it just cannot re-mint. Rotates itself — the
      grant returns a new refresh token, which the loop writes straight back to
      the hub.
    used_by: [token-rotation.yml]
    rotation:
      enabled: false      # rotated as a side effect of the grant, not on its own

  - name: ANTHROPIC_API_KEY
    scope: fleet
    required: false
    purpose: Fallback Claude auth, used only when the OAuth token is absent.
    used_by: [fleet-pulse.yml, claude.yml, issue-pipeline.yml,
              unified-evolution.yml, schema-fanout.yml, repo-evolution.yml]
    rotation:
      # The loop cannot RE-ISSUE a console key — that is a human action in the
      # Anthropic console — but it can and should PROPAGATE whatever the hub
      # holds, exactly like the OAuth token. `enabled` means "this loop keeps
      # the fleet's copies in line with the hub's", not "this loop can mint".
      # The hub does not currently hold one; while that is true every run
      # simply reports it as unavailable and moves on, and because
      # `required: false` that is not an attention item.
      enabled: true
      max_age_days: 45
      value_prefixes: ["sk-ant-api"]

  - name: FLEET_TOKEN
    scope: hub
    required: true
    purpose: >-
      Fine-grained PAT the control plane uses to see and act on the whole fleet.
      Needs actions:read + contents:read + issues:read/write +
      pull_requests:read/write on the fleet, plus contents:write +
      workflows:write on repos the fan-outs, the remediation loop, and the
      weekly evolution loop may open PRs against, plus secrets:write on every fleet repo for the weekly
      rotation (writing an Actions secret is an admin-level operation — without
      it `token-rotation.yml` can audit ages but not fix them). Supersedes the
      three separate PATs below.
    replaces: [ACTIONS_ANALYTICS_TOKEN, DAILY_ANALYSIS_TOKEN, FANOUT_TOKEN]
    rotation:
      enabled: false      # GitHub PAT; re-issue in GitHub settings and re-seed

  # Legacy PATs — still honoured as fallbacks so nothing breaks mid-migration.
  # Remove from the repo once FLEET_TOKEN is provisioned and verified.
  - name: NPM_TOKEN
    scope: hub
    required: false
    purpose: >-
      Publishes the hub's shared runtime kits (templates/*/package.json →
      npm @bamr87/*) from publish-kits.yml so always-latest consumers receive
      them by dependency. Optional: without it the workflow packs and verifies
      only. Granular npm automation token, publish scope, hub-only.
    used_by: [publish-kits.yml]
    rotation:
      enabled: false
  - name: ACTIONS_ANALYTICS_TOKEN
    scope: hub
    required: false
    deprecated: true
    purpose: Legacy — read fleet Actions data. Folded into FLEET_TOKEN.
  - name: DAILY_ANALYSIS_TOKEN
    scope: hub
    required: false
    deprecated: true
    purpose: Legacy — read fleet runs/issues for the daily analysis. Folded into FLEET_TOKEN.
  - name: FANOUT_TOKEN
    scope: hub
    required: false
    deprecated: true
    purpose: Legacy — push branches + open PRs in submodules. Folded into FLEET_TOKEN.

# --------------------------------------------------------------------------- #
# Rotation — the weekly credential loop's guardrails.
#
# Counterpart to `remediation:` (broken workflows) and `issue_pipeline:` (open
# issues): this one keeps the fleet's CREDENTIALS current. Driven by
# .github/workflows/token-rotation.yml (weekly, `schedule.rotate_tokens`) and
# runnable by hand as `dash secrets rotate`.
#
# WHAT THE LOOP CAN AND CANNOT DO
# -------------------------------
# `claude setup-token` opens a browser and prints a one-year credential; it
# saves nothing and has no headless equivalent. So "rotate weekly" decomposes
# into three jobs, only two of which are unconditionally automatable:
#
#   1. PROPAGATE  push the canonical value to every fleet repo whose copy is
#                 missing or older than `max_age_days`. Always runs. This is
#                 what enrols a newly-registered repo and re-heals a secret
#                 someone deleted, without anyone remembering to.
#   2. AUDIT      record each repo's secret age from GitHub's own `updated_at`
#                 into the ledger below. Always runs. Values are never read —
#                 the secrets API returns names and timestamps only.
#   3. RE-MINT    obtain a genuinely NEW credential. Only possible when the
#                 optional refresh grant is provisioned (see the token entry
#                 above); otherwise the loop opens ONE tracking issue asking a
#                 human to run `claude setup-token`, and keeps propagating the
#                 current value meanwhile.
#
# The zero-rotation alternative is Workload Identity Federation, which trades
# the stored credential for an OIDC exchange per run. It needs an Anthropic
# organization console, which a personal account does not have — the same
# constraint that made `_data/fleet.yml` necessary in the first place.
# Full doc: docs/TOKEN-ROTATION.md
# --------------------------------------------------------------------------- #
rotation:
  enabled: true

  # Order matters and is not negotiable: the hub is written and verified FIRST,
  # and a failure there aborts the fan-out. A bad credential on one repo is an
  # incident; a bad credential on all 41 is an outage, and the hub is the repo
  # whose own automation would have to fix it.
  hub_first: true

  # Rewrite only what is missing or past `max_age_days`. A freshly MINTED value
  # overrides this and goes everywhere — a rotation that reached half the fleet
  # is worse than one that reached none.
  only_stale: true

  # Blast radius per run. `max_repos: 0` means "no cap" — the whole point is
  # fleet-wide consistency, and a partial rotation leaves call sites split
  # across two credentials. Raise `max_failures` tolerance rather than capping.
  max_repos: 0
  max_failures: 5             # abort the remaining writes past this many failures

  # Unreachable repos (no admin on them, or private and out of the token's
  # scope) are reported, not fatal. `dash secrets` already distinguishes
  # "cannot see" from "not there"; rotation inherits that distinction.
  fail_on_unreachable: false

  # When a credential is past `renew_before_days` of its `lifetime_days` and
  # cannot be re-minted unattended, open ONE hub issue (deduped by marker,
  # updated in place) rather than failing the run.
  issue:
    enabled: true
    repo: bamr87/bamr87
    labels: [automation, security, tokens]
    marker: token-rotation   # hidden dedupe marker, same convention as fleet-doctor

  # Repository VARIABLES ride the same weekly pass as the secrets.
  #
  # They are the half of the contract that CAN be read back: GitHub returns a
  # variable's value, so the hub's own settings are the live source of truth and
  # the fleet is compared against them by VALUE, not by age. A repo is written
  # when its value differs from the hub's or is absent — so a no-op week writes
  # nothing, and a variable corrected on the hub reaches the fleet within a week
  # instead of whenever somebody remembers `dash config sync --apply`.
  #
  # `variables:` at the bottom of this file declares WHICH names are canonical
  # and carries a fallback value for each; bamr87/bamr87 holds the authoritative
  # value. That is deliberately the same split the secrets half uses — the
  # contract is in version control, the values are in the hub — and it is why a
  # value can be fixed in one place and land everywhere.
  variables:
    enabled: true
    source: hub             # hub's live value wins; `variables:` below is the fallback
    warn_on_fallback: true  # say so when the hub lacks a declared variable

  # Values-free record of what happened, published like every other generated
  # signal. Names, ages, and outcomes only — never a credential. Variables are
  # not secret, so the ledger records their values.
  ledger: _data/token_rotation.yml

# --------------------------------------------------------------------------- #
# Canonical repository VARIABLES (not secrets).
#
# This block declares WHICH variables are canonical fleet-wide and carries a
# fallback value for each. The authoritative value lives on the hub
# (bamr87/bamr87's own repository variables) — the same split the token contract
# above uses, where the contract is in version control and the values are in the
# hub. `token-rotation.yml` reads the hub's live values weekly and propagates
# them; `dash config sync --apply` does the same on demand. A name declared here
# but absent from the hub falls back to the value below, and the run says so.
#
# This is what makes a per-repo workflow able to say `${{ vars.NODE_VERSION }}`
# instead of hardcoding a version that then drifts across 40 repos.
# --------------------------------------------------------------------------- #
variables:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUBY_VERSION: "3.3"
  FLEET_HUB: bamr87/bamr87
  FLEET_CI_WORKFLOW: bamr87/.github/.github/workflows/ci.yml@main
