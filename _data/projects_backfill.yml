# =============================================================================
# _data/projects_backfill.yml — the reviewed triage and board-backfill plan (projects-backfill/v1)
# =============================================================================
# The maintainer's decisions for the hub's open issues and their Fleet project
# items, written once per triage pass and applied through the § 11 service by
# `tools/dash projects plan` / `apply` (tools/projects_backfill.py). Committing a
# change to `issues:` is the review; `apply` still needs HARNESS_PROJECTS_WRITES=1
# and `--confirm` with the previewed plan ids (constitution § 11.4). Every
# decision carries its evidence in `why:`. Hand-edited; `applied:` is appended
# by the tool, one record per applied batch. Docs: docs/PROJECTS-FRAMEWORK.md § 3b.
#
#   issues.close       close with `reason: completed | not_planned`
#   issues.labels      add / remove labels that exist in the repo (never creates one)
#   issues.sub_issues  link children to a parent (the parent carries `epic`)
#   board              Status / Priority / Area rules on top of templates/projects/framework.yml
#                      `labels.canonical`; first match wins, then the default
# =============================================================================
