board:
  # Status from labels, first match wins (framework.yml `agent:*` rows apply first).
  status:
    closed: Done
    needs-amr: Needs Amr        # Blocked when the project has no such option (§ 12.4)
    human-review: Triaged
    default: Triaged            # every open item carries a type and a priority after this pass
    pr: In review
    pr_draft: In progress
  priority:
    default: P2
  # Area from labels, then title keywords, then the default (framework.yml fields.Area options).
  area:
    labels:
      security: security
      dependencies: deps
      ci: ci
      docs: docs
      area:docs: docs
      area:a11y: ux
      test: ci
    keywords:
      agents: [agent, claude, loop, jev, scout, pipeline, evolve, doctor, bot]
      site: [site quality, pages, jekyll]
      content: [content]
      data: [lake, ledger, telemetry, snapshot]
    default: platform
  # Closed items never put on the board: the 2026-10-03 cleanup closed bot duplicates and
  # spam as not_planned that day (#453). `plan --closed-since/--closed-before` drops them.
  exclude:
    closed_not_planned_on: ["2026-10-03"]
