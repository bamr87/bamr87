# _data/literal_owners.yml — the literal owners the framework's code still carries (schema literal-owners/v1).
# Read by tools/literal_owners.py (`tools/dash identity literals`). ADR 0011
# decision 2: an instance's identity is read once, from its settings
# (tools/fleetcore/identity.py), and a NEW literal owner in the framework's code
# is refused. This file is the record that makes "new" mean something.
#
# It sits beside _data/architecture.yml and not in fleet.yml for the same
# reason: fleet.yml is an instance's settings, and this is the shape of the
# framework's code. It names no owner itself: the tool reads the owners from
# the identity of the checkout it measures.
schema: literal-owners/v1

# REPORT ONLY. While this is false the tool prints what a gate would refuse and
# exits 0, so nothing fails on a literal owner. Turning it on is a change the
# maintainer reviews, made once the open pull requests that add literals have
# landed or been rebased; tools/test_literal_owners.py holds it false until then.
enforce: false

# Where a literal owner is held to the baseline (ADR 0011 decision 2).
roots:
  - templates
  - tools
  - .github/workflows
  - .github/actions
  - specs

# Counted in the report, never held. ADR 0011 measured the generator (69 on
# 2026-11-16) and decision 2 does not list it; whether it is held is undecided.
measured:
  - .github/scripts

# The framework's own address, which stays fixed (ADR 0011 decision 4). An
# occurrence one of these matches is counted and never held. `{framework}` is
# `_data/fleet.yml` `framework.repo` once that key exists (ADR 0011 P3); until
# then it is the hub's own slug. Each pattern starts with it: nothing but the
# framework's address can be allowed.
allow:
  - id: uses-ref
    pattern: '{framework}/[A-Za-z0-9_./-]+@[A-Za-z0-9_./-]+'
    why: A reusable workflow or a composite action called at a ref is how a repo consumes the framework. It is the framework's address, not an instance's identity.
  - id: tracker-ref
    pattern: '{framework}(?:#[0-9]+|/(?:issues|pull|discussions)/[0-9]+)'
    why: A link to an issue or pull request in the framework's own tracker says where a rule or an incident is recorded. It stays true for every instance.

# What the tree carries today, per file: the occurrences that no allow rule
# covers, in non-test files under `roots:`. Written by
