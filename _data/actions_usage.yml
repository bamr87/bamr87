note: Cost = wall-clock run minutes (run_started_at → updated_at), a proxy for billable
  minutes. Value = share of minutes ending in success. Waste = minutes on failed/cancelled/timed-out
  runs. Success rate counts only runs that reached a verdict (success + failure);
  cancelled runs were superseded, not broken, and show up as cancel_pct / the cancel-heavy
  flag instead. A workflow with NO verdicts in the window (every run skipped) reports
  null rates — 'no data', not 0%.
