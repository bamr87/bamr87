note: 'Cost = wall-clock run minutes (run_started_at → updated_at), a proxy for billable
  minutes, with two bounds: a run that never executed (startup_failure, or zero jobs
  — checked on any run over 360 min and on any non-success run over 15 min) counts
  as 0 minutes, and every other run is capped at 360 min — GitHub''s own job ceiling
  — so a run left parked in a non-terminal state cannot report minutes it never billed.
  Those runs still count against the success rate; only their minutes are zeroed.
  Value = share of minutes ending in success. Waste = minutes on failed/cancelled/timed-out
  runs. Fleet totals cover bamr87-owned workflows only — the same population on both
  halves of every ratio, so waste can never exceed consumption. Success rate counts
  only runs that reached a verdict (success + failure); cancelled runs were superseded,
  not broken, and show up as cancel_pct / the cancel-heavy flag instead. A workflow
  with NO verdicts in the window (every run skipped) reports null rates — ''no data'',
  not 0%. The `billing` block is GitHub''s own metered minutes (billing usage API),
  per month and per repo: that is what the harness budget wire prices; the proxy above
  only ranks.'
