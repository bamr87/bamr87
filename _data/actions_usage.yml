note: 'Cost = job-minutes: each job that ran on a GitHub-hosted runner, rounded up
  to a whole minute, as GitHub bills it; skipped jobs and jobs that never reached
  a runner count 0 (schema actions-usage/v2). The run wall clock (run_started_at →
  updated_at) is kept as wall_min / wall_avg_min / wall_p95_min — latency, which the
  `slow` flag reads — bounded: a run that never executed counts 0 and every other
  run is capped at 360 min. Every run created in the window is listed (paged by date
  range); a repo whose listing still fell short says truncated: true with runs_missed.
  Job-minutes are cached per run, fetched only for runs new since the last sweep,
  and capped per sweep; a run past the cap is estimated from its workflow''s measured
  job/wall ratio and its row says sampled: true. Value = share of minutes ending in
  success. Waste = minutes on failed/cancelled/timed-out runs. Fleet totals cover
  bamr87-owned workflows and the hub only — the same population on both halves of
  every ratio, so waste can never exceed consumption; external mirrors never enter
  them. Success rate counts only runs that reached a verdict (success + failure);
  cancelled runs were superseded, not broken, and show up as cancel_pct / the cancel-heavy
  flag instead. A workflow with NO verdicts in the window (every run skipped) reports
  null rates — ''no data'', not 0%. The `billing` block is GitHub''s own meter (billing
  usage API), per month, for the whole ACCOUNT — the repository names it files the
  total under are not per-repo shares; it is what the harness budget wire prices,
  and `parity` reports the gap between it and the analytics total.'
