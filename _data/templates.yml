# Toolbox catalog: common templates available in the monorepo.
- name: README template
  path: https://github.com/bamr87/bamr87/blob/main/.github/templates/README.template.md
  description: Standardized project README structure (badges, about, usage, FAQ).
- name: Project scaffolds
  path: https://github.com/bamr87/scripts
  description: Multi-stack project templates via scripts/project-init.sh.
- name: PR / issue templates
  path: https://github.com/bamr87/bamr87/tree/main/.github/templates
  description: Pull request and discussion templates.
- name: Prompt templates
  path: https://github.com/bamr87/bamr87/tree/main/.github/prompts
  description: Reusable prompt templates for AI workflows.
- name: Agent personas
  path: https://github.com/bamr87/bamr87/tree/main/.github/agents
  description: code-reviewer, prompt-engineer, systematic-debugger, test-writer, workflow-reviewer.
- name: MCP config
  path: https://github.com/bamr87/bamr87/blob/main/.mcp.json
  description: Model Context Protocol server configuration (github, memory, sequentialthinking, context7).
- name: Universal Project Standard
  path: https://github.com/bamr87/bamr87/tree/main/specs
  description: The requirement specs every fleet repo is built to (layout, agent context, quality, frontend, feedback, API, operations) by stack kind.
- name: SDLC kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/sdlc
  description: The per-repo delivery loop — .github/sdlc.yml profile and its JSON Schema, canonical AGENTS.md with a CLAUDE.md pointer, ADR log, and release-please (caller at @v1, configs per release type) so every repo, content included, has a generated CHANGELOG.
- name: Feedback widget kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/feedback
  description: fleet-feedback — "Improve this page" → prefilled GitHub issue carrying page context, environment and captured console errors, in any stack. Fanned out with tools/fanout.sh --kit feedback.
- name: AI runner kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/ai-runner
  description: "The fleet's model step and lane, consumed by reference: the claude-run action (Claude Code first, OAuth-first, API fallback, metering) and the reusable ai-lane.yml (kill switch, concurrency, hooks, result assertion)."
- name: Fleet engines package
  path: https://github.com/bamr87/bamr87/tree/main/templates/fleet-engines
  description: "@bamr87/fleet-engines — the fleet/v1 manifest, workflow facts, the audit rulebook, metrics and the harness scorecard as one npm package, consumed by dependency by GitFactory and zer0-CMS."
- name: ELK logging kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/elk
  description: "The fleet log plane's producer half — the vendored Filebeat shipper, the com.bamr87.fleet.* label + rotation fragment, a standalone single-node ES+Kibana overlay, and one UPS-OPS-10 JSON emitter per stack with redaction attached. Fanned out with tools/fanout.sh --kit elk."
- name: Seedable kits
  path: https://github.com/bamr87/bamr87/tree/main/templates
  description: standard-ci, agent-context, prose, schema, release-pipeline, feedback, elk, verify, site-quality — versioned kits fanned out by tools/fanout.sh; ai-runner is consumed by reference instead.
- name: Skill template
  path: https://github.com/bamr87/bamr87/tree/main/.claude/skills
  description: Author new skills with the skill-creator skill.
- name: Agent verification kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/verify
  description: Feature index + user scenarios + Playwright runner + fleet-verify CI caller + verify-feature skill — prove features work the way a user experiences them (docs/VERIFICATION.md).
- name: Site quality kit
  path: https://github.com/bamr87/bamr87/tree/main/templates/site-quality
  description: "Lighthouse CI + axe-core (390/1366 px) + pa11y contrast through one reusable workflow pinned @v1 — a fresh-theme Jekyll build or live URLs, graded by each repo's schema-validated .github/site-quality.yml with an expiring known-issue allowlist. Fanned out with tools/fanout.sh --kit site-quality."
