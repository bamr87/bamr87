# =============================================================================
# _data/profile.yml — WHO the site is about: the identity the public site
# (bamr87.github.io/bamr87 — the Harness Console's static build) renders on its
# Home page, header and feeds. Hand-edited. The long-form pages live in
# pages/profile/*.md and pages/posts/*.md; this file is only the facts every
# page shares. Replaces the identity block of the retired Jekyll _config.yml.
# =============================================================================
name: "Amr Abdel-Motaleb"
handle: bamr87
title: "Solutions Architect & ERP Specialist"
tagline: "IT Wizard — People Over Profits."
location: "Denver, CO"
email: "amr.abdel@gmail.com"
avatar: headshot-448.jpg          # under tools/console/web/public/; a 448 px copy of headshot.jpg (1.9 MB) for the 112 px avatar
summary: >-
  Solutions Architect and ERP Specialist with 15+ years building sustainable
  enterprise systems. This site is my portfolio and, at the same time, the
  control plane I run my whole fleet of repositories from: every project, its
  health, its AI harnesses and their cost, rebuilt from the repo every day.
site:
  title: "bamr87"
  url: "https://bamr87.github.io/bamr87"
  # The Home page's meta and Open Graph description (snapshot.py); keep it
  # under ~160 characters so search results and link cards show all of it.
  description: >-
    Amr Abdel-Motaleb's portfolio and the control plane that runs about forty
    repositories: their CI and security health, their AI agents and
    estimated cost.
  # The link-card image every page's og:image names, under
  # tools/console/web/public/. Wide (1280x640), so cards render large; the same
  # file is the repository's GitHub social preview. Without it, the avatar.
  # Undated on purpose (no KPI tiles, no snapshot chip): every page carries it
  # while the site rebuilds daily, so it must not show one day's numbers.
  image: social-preview.png
# Other public builds of this same console, each for an address of its own
# (tools/console/build-pages.sh with CONSOLE_SITE=<key>; docs/CONSOLE-PAGES.md
# "Site builds"). A build lays its entry over `site:` above, so its title, who
# it is by, its description, link card and mark are settings and not code, and
# it may make the bashOS desktop its front door. Built without CONSOLE_SITE the
# site is the one above, exactly as before, and none of this is published.
#   front_door      what `/` is: `home` (the profile, the default) or `desktop`
#                   (the bashOS desktop; the profile Home moves to /home)
#   mark            the tab icon and the header mark, under tools/console/web/public/
#   desktop.icons   `apps` (an icon per framed frontend, the default) or `repos`
#                   (an icon for every repo: its frontend, else the repo app)
#   desktop.pinned  registry ids shown first on the desktop and offered on Welcome
#   desktop.welcome the Welcome window's first paragraph
sites:
  bash-365:
    title: "bash-365"
    name: "BASH Consulting"
    # Provisional. Where this build is served (a subdomain, or a path of the
    # main domain) is the maintainer's decision; SITE_URL overrides it.
    url: "https://os.bash-365.com"
    description: >-
      The front door of the bash-365 platform: BASH Consulting's site and every
      repository and application behind it, each opened in a window.
    mark: bash-365-mark.svg
    image: null                  # no wide link card yet: cards show the mark
    front_door: desktop
    desktop:
      icons: repos
      pinned: [bash-365.com]
      welcome: >-
        This is the front door of the bash-365 platform. BASH Consulting's
        site and every repository and application behind it is an icon here,
        and each one opens in a window with the same controls.
links:
  - { label: "GitHub", icon: github, url: "https://github.com/bamr87" }
  - { label: "LinkedIn", icon: linkedin, url: "https://linkedin.com/in/amrabdel" }
  - { label: "Website", icon: world, url: "https://bashconsultants.com" }
  - { label: "Email", icon: mail, url: "mailto:amr.abdel@gmail.com" }
  - { label: "CV (PDF)", icon: file-cv, url: "https://github.com/bamr87/cv-pro/blob/main/cv/cv.pdf" }
