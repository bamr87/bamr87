id: FF-NEW
slug: agent-lens-crawl
title: "Agent-lens crawl — a harness that walks each site's frontend, compares it with its backend, and scores quality, conformance, coverage, accessibility, UI/UX and agent-readiness"
project: bamr87
repo_url: https://github.com/bamr87/bamr87
status: proposed
priority: P1
effort: XL
category: feature
problem: >-
  The fleet judges a repo from its files (conformance, standards) and a site from
  a few fixed scans (Lighthouse and axe on the Jekyll sites). Nothing walks a
  running frontend the way an agent does and compares what it finds with what
  the backend and the repo declare: pages no feature claims, endpoints and
  features no page reaches, an MCP server or a CLI a repo's type owes and does
  not have, navigation an agent cannot follow. So there is no view of a repo,
  site or application through the lens of the agent that assesses, builds and
  improves it, and UI/UX problems are found by a person, by chance.
proposal: >-
  An AI harness, `agent-lens`, run by the hub for every repo with a frontend.
  (1) CRAWL: walk the running or deployed frontend, headless and read-only, and
  record what an agent sees: each page as the page bridge's outline (ADR 0013,
  ADR 0014: headings, controls with their names and roles, forms, links,
  dialogs, page errors), plus a screenshot per page at desktop and mobile widths.
  (2) DECLARED MAP: read what the repo says it is: API routes (OpenAPI, Django
  urls, the static JSON data API), the feature index, the registry `frontend:`
  block, and the constitution § 16 layers (MCP server, CLI with `--json`,
  `llms.txt`, JSON-LD, agent card). (3) ALIGN: join the two and say where they
  disagree. (4) SCORE six lenses, each with its method written down:
  quality (broken links, console errors, failed requests, performance budget),
  conformance (the UPS-FE, UPS-FB and UPS-AST rows that can be observed at
  runtime), coverage (feature to page to scenario to endpoint), accessibility
  (axe and WCAG, the keyboard path, names and roles), UI/UX in general (the
  ux-audit kit's heuristics: hierarchy, spacing, states for empty, loading and
  error, responsiveness, copy, consistency with the fleet tokens; then a
  capped model review of the screenshots that proposes concrete improvements),
  and agent-readiness (can an agent discover and operate it: landmarks,
  labelled controls, no dialog traps, the page bridge mounted, and which agent
  surfaces exist or are missing, for example "has an MCP server", "has no
  CLI"). The agent-readiness lens is the runtime half of the AIEO score
  (§ 16.6). (5) PUBLISH: a committed snapshot per repo, a console page, a
  machine-API document and an MCP tool, with the trend over time, so the whole
  fleet is visible through this lens. (6) ACT: each finding names its fix path
  (an issue through the issue pipeline, a fan-out kit, or an evolution brief);
  nothing is merged by the harness. (7) CONTINUOUS: a local entry point first
  (`tools/dash lens`), then a scheduled rotation; the deterministic tier costs
  $0 and runs always, the model tier is capped, registered and behind a switch.
acceptance:
  - "`tools/dash lens crawl <repo>` writes a site map of a running or deployed frontend (pages, controls, forms, links, dialogs, errors, screenshots) at $0, read-only and bounded: a page cap, a time limit, the site's own origin only, robots.txt honoured, no form submitted and no state-changing request sent."
  - "`tools/dash lens declared <repo>` writes the declared map: API routes, feature index entries, the registry frontend block and each § 16 layer as present, absent or not applicable."
  - "The alignment report lists, each with evidence: pages no feature claims; features and endpoints no page reaches; agent surfaces the repo's type owes and lacks (for example no MCP server, no CLI `--json`, no `llms.txt`); navigation or interaction an agent cannot follow."
  - "Each repo gets a score per lens (quality, conformance, coverage, accessibility, UI/UX, agent-readiness). Deterministic checks and model-judged ones are reported apart, and a model-judged figure is labelled as one, with its cost as API-equivalent (estimate)."
  - "The UI/UX lens proposes general improvements a person would recognise (layout, hierarchy, states, responsiveness, copy), each with a screenshot and the page it is on, not only agent-specific findings."
  - "A console page, a committed snapshot under `_data/`, a machine-API document and an MCP tool show the report for every repo and its trend; the public site shows it for public repos only."
  - "A finding becomes at most one issue (the fleet's dedup marker), a fan-out, or an evolution brief; the harness opens no pull request it could merge and merges nothing."
  - "The harness is registered in `_data/agents.yml` under the efficacy contract, with an exact model, a cap, a kill switch that a manual dispatch bypasses, and a local entry point before any CI step."
  - "The model-judged lenses have an eval set before any score can fail a build (constitution § 13); until then every score is advisory."
scope:
  in:
    - "Every repo the registry gives a browser frontend (19 today), crawled at its dev stack locally and at its live address on a schedule."
    - "Reuse of what exists: the page bridge's outline, the verify kit's runner and scenarios, the site-quality and ux-audit kits' checks, `tools/conformance.py`, the feature index, the issue pipeline."
    - "The agent-readiness lens as the runtime input to the AIEO score and the § 16 `ai-ready` check."
    - "A context-only report for a repo with no page: which agent surfaces it owes and has (MCP server, CLI `--json`, agent docs)."
  out:
    - "Fixing what it finds: the issue pipeline, the fan-out and repo-evolution do that."
    - "Crawling behind a login with real credentials, or any site the fleet does not own."
    - "Submitting forms, or any request that changes state."
    - "A second accessibility or performance engine: axe, Lighthouse and pa11y stay the engines."
risks:
  - "Crawl safety: a GET that changes state, or an app that needs a login. Mitigation: same-origin, read-only, an allowlist of addresses from the registry, dev stacks seeded with fixture data."
  - "Cost and noise of the model-judged lenses. Mitigation: deterministic tier first, a per-repo cap, an eval set before anything gates, findings deduplicated before they are filed."
  - "Overlap with the site-quality, ux-audit and verify kits. The harness must compose them and report once, not add a fourth scan."
  - "The AIEO engine in `tools/aieo/` and the ai-ready kit are still planned; the agent-readiness lens depends on their manifest."
  - "Private repos: their reports stay local and out of the public site."
  - "The fleet already opens work faster than it closes it; this must rank findings and cap what it files, or it adds to the backlog it measures."
source: manual
created: 2026-11-19
