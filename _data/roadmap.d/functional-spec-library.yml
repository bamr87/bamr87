# Shared functional specification library. Numbered at merge (id: FF-NEW).
id: FF-NEW
slug: functional-spec-library
title: Shared functional specification library
project: bamr87
repo_url: https://github.com/bamr87/bamr87
status: proposed
priority: P2
effort: L
category: feature
problem: >-
  Fleet repos share a project standard and a per-change spec gate, and they do not share one library of product behaviour.
  A repo cannot declare which functional specs it adopts, CI and the docs site can disagree, and a downgrade of a required spec has no ratification step.
proposal: >-
  A hub library of generic functional specs (FEAT-NNN, each linked to a PRD requirement), a root specs.json per repo (version, adopted ids, overrides, exclusions), and one resolver whose output is what CI enforces and what the docs site renders.
  Core specs plus the framework overlay, minus exclusions, with ratified overrides applied last.
  A relaxation stays unapplied until the maintainer merges an amendment-style record.
  See docs/prd/FUNCTIONAL-SPEC-LIBRARY.md.
acceptance:
  - "The hub holds the library and spokes read it by reference, with no vendored copy."
  - "specs.json states version, adopted FEAT ids, optional narrowing overrides and exclusions."
  - "One resolver output is the input to both the pull-request gate and the repo spec page."
  - "The gate fails on an unknown spec id and on a required spec with no coverage."
  - "A downgrade from required to advisory, or any other relaxation, does not apply until Amr merges its record."
  - "FEAT, HUB, FR and FF numbers are assigned at merge from fragments, never chosen in the pull request."
scope:
  in:
    - hub library of functional specs
    - per-repo specs.json
    - single resolver shared by CI and the docs site
    - amendment-style ratification for relaxations
  out:
    - replacing UPS conformance or spec-gate
    - vendoring the library into spokes
    - workflow, settings, secrets or branch-protection edits in the PRD pull request
    - ratifying the constitution change inside the PRD pull request
risks:
  - "A hand-picked FEAT number would race another pull request; the series has to join JEV before any content spec is numbered."
  - "Filing relaxations under docs/amendments/ would mix them into the constitution log. The PRD keeps a parallel log with the same merge rule."
  - "The constitution section that makes ratification binding is a follow-up amendment. Until Amr merges it, relaxations stay invalid."
source: manual
created: 2026-11-10
issue_url: null
