# Automatic credential rotation through the key rotation protocol. Numbered at merge (id: FF-NEW).
id: FF-NEW
slug: credential-auto-rotation
title: Rotate credentials automatically through the fleet's key rotation protocol
project: bamr87
repo_url: https://github.com/bamr87/bamr87
status: proposed
priority: P1
effort: L
category: infra
problem: >-
  Three credentials are broken at once and each sits outside the weekly credential loop for a different reason.
  The zer0-CMS Google API key has a public secret-scanning alert open since 2026-10-21 (bamr87/bamr87#460), and the loop reads no alert.
  The ai-world-view organization's CLAUDE_CODE_OAUTH_TOKEN has been degraded since 2026-09-19 (ai-world-view/ai-world-view.github.io#29), and the loop reaches only repository secrets in the hub owner's repos.
  bamr87/it-journey's AUTO_PR_GITHUB_TOKEN expired, last set 2026-07-02, and failed 7 of 7 scheduled Issue Autopilot runs (bamr87/bamr87#761), and a repo-specific secret is not in the token contract.
  Each failure was detected and none started a rotation.
proposal: >-
  Extend the existing protocol (the token contract in _data/fleet.yml tokens: and the weekly loop, docs/TOKEN-ROTATION.md) instead of adding a second one.
  The contract gains scopes for one repository, an organization and a third-party provider, plus an owner, a rotation class (automated, assisted, propagate) and triggers.
  The first trigger is a GitHub secret-scanning alert. An alert for a covered credential, starting with google_api_key alerts on bamr87/zer0-CMS (bamr87/bamr87#460), automatically starts a rotation of the affected key instead of only flagging it: contain first (revoke or restrict), mint the replacement, update the consuming secret, verify, resolve the alert as revoked, close the tracking issue.
  The alert is detected by a scheduled poll of the secret-scanning alerts API, which ships first and stays as the backstop, and by a secret_scanning_alert webhook forwarded to the hub.
  Where automation cannot perform a step, the rotation still starts and that step goes to a person as a prepared, containment-first instruction that automation verifies.
  A rotation also starts on its schedule and on the other events: a rejected health probe, N consecutive consumer failures, an approaching expiry.
  A Google API key is rotated with no human step through gcloud services api-keys, every 90 days.
  A Claude OAuth token (claude setup-token browser sign-in) and a GitHub personal access token (web form) are assisted: automation prepares the one human step and verifies after it, 30 days before expiry or at 180 days for the token, and 14 days before expiry with a 90-day maximum for the PAT.
  Every rotation follows Design for Failure: detection, containment (revoke first on a leak), recovery, verification and a values-free audit trail.
  The feature is HUB-NEW:credential-auto-rotation.
  See docs/prd/CREDENTIAL-ROTATION.md.
acceptance:
  - "A secret-scanning alert for a covered credential starts a rotation of the affected key without a person, and the first run opens one for zer0-CMS alert #1 on bamr87/bamr87#460."
  - "The alert is detected by the scheduled poll of the secret-scanning alerts API within one interval, with the secret hidden from the poll, and by the secret_scanning_alert webhook path within minutes once it exists; a webhook delivery and a poll for one alert produce one rotation."
  - "An alert-started rotation contains first (revoke or restrict), then mints, updates each consuming secret, verifies, resolves the alert as revoked and closes the tracking issue, with no human step where the credential is automated and the adapter has access."
  - "Where automation cannot perform a step, the rotation still starts, the issue carries the remaining steps in order from containment, and automation verifies each one; an alert whose secret matches no key the owner controls is never resolved as revoked by automation."
  - "The three credentials are declared by name in the token contract with owner, scope and location, rotation class, schedule, triggers and consumers, and a secret a fleet workflow reads without a contract entry is reported."
  - "The other two incidents fire their triggers: two consecutive rejected probes, three consecutive Issue Autopilot runs failing at checkout."
  - "The Google API key also rotates on a 90-day schedule with no human step."
  - "An assisted rotation posts one prepared step on one issue (command or link, scopes, expiry, where the value goes) and closes it only after a capability probe and a consumer run pass."
  - "A malformed or under-scoped value is refused before any target is written, and the old credential stays valid until the new one is verified unless the trigger is a leak."
  - "Every rotation is in a committed ledger with its trigger, steps, actor and outcome, and no secret value, fragment or hash of one appears in any log, ledger, issue, pull request or commit."
  - "The alert-started rotation has a kill switch and is off until Amr switches it on in a gated pull request; with it off, alerts are still detected and each issue says the rotation is waiting on the switch."
  - "HUB, FR, NFR and FF numbers are assigned at merge from fragments."
scope:
  in:
    - token contract additions for repository, organization and provider scopes
    - the secret-scanning alert as the first trigger, starting a rotation of the affected key
    - alert detection by a scheduled poll of the alerts API and by a secret_scanning_alert webhook
    - the human-in-the-loop fallback when a step cannot be automated
    - schedule and the other event triggers evaluated on the fleet's scheduled reads
    - automated rotation for a provider with an API (Google API keys)
    - assisted rotation with a prepared human step and verification after it
    - Design for Failure and a values-free audit ledger
  out:
    - any workflow, tool, schedule, setting, secret or _data/fleet.yml change in the direction pull request
    - rotating, revoking or re-issuing the three credentials now; their incidents stay with their issues
    - the consumer fixes in it-journey (bamr87/bamr87#761) and zer0-CMS (bamr87/bamr87#460)
    - a new secrets manager or a second contract beside _data/fleet.yml tokens
    - rewriting git history to remove a leaked value
    - replacing dash keys, which owns ANTHROPIC_API_KEY
risks:
  - "The zer0-CMS alert may be a test fixture and not a live key (bamr87/bamr87#460 reads it that way). The rotation it starts then ends with Amr resolving the alert as used_in_tests, and nothing is revoked on a guess."
  - "An unattended revocation is an external action that constitution § 13.6 starts at the high tier. The gated pull request that switches the path on settles it, with the follow-up amendment credential-auto-revoke if Amr wants one."
  - "A webhook needs a receiver and a webhook or GitHub App that only Amr can add, and GitHub Actions has no secret_scanning_alert trigger. The poll ships first and stays as the backstop."
  - "Reading and resolving secret-scanning alerts needs a permission FLEET_TOKEN may not have. Whether it does is TBD."
  - "Writing an organization secret needs a credential that reaches the ai-world-view organization. Whether FLEET_TOKEN does is TBD."
  - "The Google Cloud project, and whether the key is one the API Keys API manages, are TBD. Until then the Google rotation is assisted."
  - "A daily scheduled read means up to a day between a leak and its detection. The target is TBD."
  - "Open fragment pull requests that merge first move the predicted HUB, FR, NFR and FF numbers. The slugs do not move."
source: manual
created: 2026-11-11
