id: FF-NEW
slug: about-section-sitemap
title: Fan the about-section site map out to every non-exempt fleet repo
project: bamr87
repo_url: https://github.com/bamr87/bamr87
status: proposed
priority: P2
effort: M
category: standards
problem: >-
  A visitor cannot yet rely on every fleet README as a complete map of the repo: many repos already have a constitution, PRD and feature catalog, but fewer have CONTRIBUTING, a code of conduct, SECURITY or a roadmap, and none on main yet carry a mission one-liner that links to constitution § 1.
proposal: >-
  After this hub amendment is ratified, open one fan-out PR per non-exempt repo that brings its README about section to the docs/ABOUT-SECTION.md structure, adding only links to pages that exist and recording genuine gaps rather than inventing pages. The conformance check named in constitution § 31.5 lands in a later PR and stays warn-only until each repo's fan-out merges.
acceptance:
  - "The hub README's control-plane documentation section lists every required about-section entry that the hub itself has."
  - "Every non-exempt public repo has either a merged or an open PR that applies the about-section site map, with missing optional pages marked as missing rather than invented."
source: manual
created: 2026-11-16
issue_url: null
