# ---------------------------------------------------------------------------
# External repositories (surfaced in the dash; not git submodules).
# Add entries here with submodule_path: null.
#
# Registration is how a repo becomes VISIBLE to the dash, the reconciler, and
# the engagement ledger. Being unregistered is not neutral — it is invisible.
# The 2026-08-09 audit found four live bamr87 repos in neither .gitmodules nor
# this file, one of them (irony-works) under active daily development. They are
# registered below as external rather than as submodules: the fleet's problem is
# too much duplicated weight, not too few tracked directories, so a repo earns a
# submodule checkout only when the hub actually needs to build or fan out into it.
# ---------------------------------------------------------------------------
