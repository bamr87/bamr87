# =============================================================================
# claude-cost — the per-run spend readout for a `claude-code-action` step, and
# the two loud classifications that turn "Claude execution failed" into an
# instruction: BUDGET CAP HIT (fails the step) or CREDENTIAL REJECTED.
# -----------------------------------------------------------------------------
# This was the same ~85-line `Report Claude run cost` step copy-pasted into six
# jobs (fleet-pulse doctor, the three issue-pipeline tiers, repo-evolution,
# unified-evolution). The copies had already drifted: one reported against a
# $25 cap while its claude_args said $40, so its budget-hit detection fired on
# the wrong number. One action, one script, asserted once by
# .github/scripts/dash-gen/test_ai_budget.py.
#
#   - name: Report Claude run cost
#     id: cost
#     if: !cancelled() && <the job's auth gate>
#     uses: ./.github/actions/claude-cost          # or ./.fleet-hub/.github/actions/claude-cost
#     with:
#       tier: Tier 2 — implement
#       icon: 🧭
#       budget-usd: "60"                             # == budget.call_sites[<file>:<job>]
#       outcome: <the agent step's outcome>
#
# WHAT IT DOES
#   * Reads the LAST `result` record out of the action's execution log
#     ($RUNNER_TEMP/claude-execution-output.json) and echoes it into the run log
#     as `claude-run-result …`: ai_usage_collector.py regex-scrapes
#     `total_cost_usd` out of run logs, so a run only enters the fleet's cost
#     ledger if its record reached the log — and the abort path is exactly where
#     the spend matters most.
#   * Writes the spend table to the job summary on EVERY run. Reporting only on
#     `failure()` hid the common case, the green run whose spend accumulates
#     unnoticed.
#   * BUDGET ABORT: `--max-budget-usd` stops the agent MID-TASK, which otherwise
#     looks like any other failed step. Detected from the result subtype when the
#     CLI names it, else from "failed at or above the cap" (the subtype is not a
#     contract). It FAILS the step (`exit 1`) — an `::error::` annotation alone
#     does not fail a job, and a green job runs every `success()`-gated step after
#     it on truncated work — and publishes `budget_hit` so a step that publishes
#     the agent's tree can mark the PR as a mid-task fragment instead.
#   * REJECTED CREDENTIAL: claude-code-action surfaces one as a bare
#     `is_error: true` with no message. A credential refused at the first API
#     call bills nothing, so `total_cost_usd == 0` AND an empty `modelUsage`
#     means the model was never reached — a genuine agent failure always has
#     usage. That is how an expired CLAUDE_CODE_OAUTH_TOKEN kept three loops red
#     for ten days without anyone being told which secret to rotate.
#   * USAGE LIMIT (429): also 0 cost and empty modelUsage, but the credential
#     WORKED — the subscription's session window is spent. Telling the operator
#     to rotate a valid token sends them the wrong way, so it is classified apart.
#
# `usage-limit: skip` — FOR SCHEDULED LOOPS. Every hub loop shares one Claude
# subscription; when its weekly window runs out, each loop went red every day
# until the reset (fleet-pulse and issue-pipeline, 2026-10-23..25) and the
# doctor filed "not a workflow defect" issues about it (#335, #348). A spent
# window is capacity, not a defect. In this mode the caller marks its agent
# step `continue-on-error: true` and THIS step owns the job's verdict: a usage
# limit is a warning, `usage_limit=true` (so a later tier can skip instead of
# paying its setup to hit the same wall), exit 0; every other failure — budget,
# refused credential, agent/tooling, no result record — still exits 1.
# test_ai_budget.py holds the two halves together at every call site.
#
# Never writes a secret anywhere; reads only the action's own log file.
# =============================================================================
name: claude-cost
description: Report a claude-code-action step's spend against its cap; fail on a budget abort; classify a refused credential.
inputs:
  tier:
    description: Human label for the summary and annotations, e.g. `Tier 2 — implement`.
    required: true
  icon:
    description: Emoji for the summary heading.
    required: false
    default: "🤖"
  budget-usd:
    description: The step's dollar cap — the same number its `--max-budget-usd` carries (`budget.call_sites` in `_data/fleet.yml`).
    required: true
  outcome:
    description: The agent step's outcome (`steps.<id>.outcome`), so a red step is classified and a green one is not.
    required: true
  log:
    description: Path of the claude-code-action execution log. Empty = `$RUNNER_TEMP/claude-execution-output.json`.
    required: false
    default: ""
  usage-limit:
    description: "`fail` (default) leaves the verdict to the agent step. `skip` = the agent step is `continue-on-error` and this step decides — a usage limit is a warning, every other failure exits 1."
    required: false
    default: fail
outputs:
  budget_hit:
    description: "`true` when the run was stopped by its dollar cap (work is partial by construction)."
    value: ${{ steps.report.outputs.budget_hit }}
  usage_limit:
    description: "`true` when the agent was refused because the subscription's usage window is spent (HTTP 429)."
    value: ${{ steps.report.outputs.usage_limit }}
  cost_usd:
    description: The run's `total_cost_usd` (the CLI's estimate; under subscription auth a throughput figure, not an invoice).
    value: ${{ steps.report.outputs.cost_usd }}
  turns:
    description: The run's `num_turns`.
    value: ${{ steps.report.outputs.turns }}
runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        TIER: ${{ inputs.tier }}
        ICON: ${{ inputs.icon }}
        BUDGET_USD: ${{ inputs.budget-usd }}
        STEP_OUTCOME: ${{ inputs.outcome }}
        LOG: ${{ inputs.log }}
        USAGE_LIMIT_MODE: ${{ inputs.usage-limit }}
      run: |
        log="${LOG:-${RUNNER_TEMP}/claude-execution-output.json}"
        result=""
        [ -f "$log" ] && result=$(jq -c '[.. | objects | select(.type? == "result")] | last // empty' "$log" 2>/dev/null || true)
        {
          echo "budget_hit=false"
          echo "usage_limit=false"
        } >> "$GITHUB_OUTPUT"
        # In `skip` mode the agent step is continue-on-error, so a red agent
        # only fails the job if this step says so.
        verdict=0
        [ "$USAGE_LIMIT_MODE" = "skip" ] && [ "$STEP_OUTCOME" = "failure" ] && verdict=1
        if [ -z "$result" ]; then
          if [ "$STEP_OUTCOME" = "failure" ]; then
            echo "::warning::${TIER}: Claude produced no result record — check the step output directly."
          fi
          exit "$verdict"
        fi

        # Echo the record into the RUN LOG for the fleet's cost collector. It
        # takes the LAST occurrence and this is the same record, so the value is
        # unchanged — it just can no longer go missing on the abort path.
        printf 'claude-run-result %s\n' "$result"
        cost=$(printf '%s' "$result" | jq -r '.total_cost_usd // 0')
        models=$(printf '%s' "$result" | jq -r '(.modelUsage // {}) | length')
        turns=$(printf '%s' "$result" | jq -r '.num_turns // 0')
        subtype=$(printf '%s' "$result" | jq -r '.subtype // ""')
        is_error=$(printf '%s' "$result" | jq -r '.is_error // false')
        pct=$(awk -v c="$cost" -v b="$BUDGET_USD" 'BEGIN { printf "%d", (b + 0 > 0) ? (c / b) * 100 : 0 }')
        {
          echo "cost_usd=${cost}"
          echo "turns=${turns}"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### ${ICON} ${TIER} — run cost"
          echo ""
          echo "| spend | cap | used | turns | models |"
          echo "| ---: | ---: | ---: | ---: | ---: |"
          echo "| \$${cost} | \$${BUDGET_USD} | ${pct}% | ${turns} | ${models} |"
          echo ""
          echo "Cap from \`_data/fleet.yml\` \`budget.call_sites\`. Subscription auth bills nothing per token — this is shadow accounting, not an invoice."
        } >> "$GITHUB_STEP_SUMMARY"

        budget_hit=false
        case "$subtype" in *budget*) budget_hit=true ;; esac
        if [ "$is_error" = "true" ] && awk -v c="$cost" -v b="$BUDGET_USD" 'BEGIN { exit !(b + 0 > 0 && c + 0 >= b + 0) }'; then
          budget_hit=true
        fi
        echo "budget_hit=${budget_hit}" >> "$GITHUB_OUTPUT"
        if [ "$budget_hit" = "true" ]; then
          echo "::error::${TIER}: BUDGET CAP HIT — metered \$${cost} against a \$${BUDGET_USD} ceiling after ${turns} turn(s) (a priced estimate under subscription auth, not an invoice — see _data/fleet.yml \`budget\`). The agent was stopped MID-TASK and its work is probably partial. Raise \`budget.call_sites\` in _data/fleet.yml if this spend is legitimate, or narrow the work."
          {
            echo ""
            echo "> **⛔ Budget cap hit.** \$${cost} of a \$${BUDGET_USD} ceiling, ${turns} turn(s)."
            echo "> The run was aborted mid-task, so its work is probably partial."
            echo "> Raise \`budget.call_sites\` in \`_data/fleet.yml\` or narrow the work."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        [ "$STEP_OUTCOME" = "failure" ] || exit 0
        api_status=$(printf '%s' "$result" | jq -r '.api_error_status // "" | tostring')
        api_msg=$(printf '%s' "$result" | jq -r '.result // "" | tostring' | head -c 200)
        if [ "$api_status" = "429" ] || printf '%s' "$api_msg" | grep -qiE 'session limit|usage limit|weekly limit|rate limit'; then
          echo "usage_limit=true" >> "$GITHUB_OUTPUT"
          level=error
          if [ "$USAGE_LIMIT_MODE" = "skip" ]; then level=warning; verdict=0; fi
          echo "::${level}::${TIER}: Claude usage limit hit (HTTP ${api_status:-429}): ${api_msg}. The credential is VALID — do NOT rotate it. Nothing ran; the next scheduled run picks the work up after the reset."
          {
            echo ""
            echo "**Claude usage limit hit — skipped.** \`api_error_status: ${api_status:-429}\` — ${api_msg}"
            echo "The credential was accepted; the subscription's usage window is spent. Capacity, not a defect: nothing to fix, nothing to rotate."
          } >> "$GITHUB_STEP_SUMMARY"
        elif [ "$models" = "0" ] && [ "$cost" = "0" ]; then
          echo "::error::${TIER}: Claude was never reached — 0 billed turns, empty modelUsage. The Claude credential was REJECTED (expired or revoked), not rate-limited. Rotate CLAUDE_CODE_OAUTH_TOKEN — see docs/TOKEN-ROTATION.md."
          {
            echo ""
            echo "**Claude credential rejected.** No billed API call (\`total_cost_usd: 0\`, \`modelUsage: {}\`, \`num_turns: $turns\`)."
            echo "The secret is present — the job's auth gate only tests that — but the API refused it."
            echo ""
            echo "**Fix:** rotate \`CLAUDE_CODE_OAUTH_TOKEN\` on the hub, then run \`token-rotation.yml\` to propagate it."
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::${TIER}: Claude ran ($turns turn(s), \$$cost billed) and still failed — an agent/tooling failure, not auth."
        fi
        exit "$verdict"
