# =============================================================================
# claude-run — the fleet's universal AI step (Claude Code first, Claude API
# fallback). kit: ai-runner v0.1.0 — SOURCE OF TRUTH for the whole fleet.
# -----------------------------------------------------------------------------
# Consume it BY REFERENCE, never by copy:
#
#   - uses: bamr87/bamr87/.github/actions/claude-run@main
#     with: { agent: grow, prompt: "…", tools: "Bash,Read,Write,Edit,Grep,Glob" }
#
# or take the whole lane (kill switch, concurrency, checkout, runtimes, this
# step, result assertion) from .github/workflows/ai-lane.yml. The runner beside
# this manifest (run.sh) installs Claude Code (best-effort), resolves the model
# (--model > AI_MODEL > the CONSUMER repo's _data/ai.yml > the fleet default),
# runs `claude -p` OAuth-first, and falls back to the Claude API when the
# consumer ships scripts/ai/api_call.rb|py. A call that was ATTEMPTED and FAILED
# with no fallback fails THIS step with the reason the run gave — never a silent
# no-op for a later step to discover (run.sh, EXIT CODES). With NO auth at all
# the step is a clean no-op (exit 0), so lanes degrade gracefully when unset.
#
# Auth comes from the job env: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`;
# drives the primary path) and/or ANTHROPIC_API_KEY (primary + fallback).
#
# METERING (optional, consumer-owned): when the consumer carries
# scripts/ai/usage.rb + usage_report.rb, run.sh records every call's tokens and
# API-equivalent cost and the post-steps publish them — job summary, an
# `ai-usage-*` artifact, the PR's sticky cost comment. Best-effort (`always()`,
# never fails the job); a repo without the metering scripts skips them with a
# notice. Contract tests: templates/ai-runner/tests/contract.sh (CI:
# ai-runner-contract.yml). Kit docs: templates/ai-runner/README.md.
# =============================================================================
name: claude-run
description: Run an AI step via Claude Code, falling back to the Claude API.
inputs:
  prompt:
    description: The instruction for the agent.
    required: true
  agent:
    description: Run AS a named agent (.claude/agents/<name>.md) — its system prompt, tools, and constraints. The single source of truth for a role.
    default: ""
  tools:
    description: Comma-separated --allowedTools for Claude Code (ignored by the API fallback).
    default: ""
  mcp:
    description: Path to an MCP config JSON for Claude Code.
    default: ""
  system:
    description: System prompt appended to the agent (and used by the API fallback).
    default: ""
  out:
    description: Write the result to this file instead of stdout.
    default: ""
  model:
    description: Model override for this step (beats AI_MODEL and _data/ai.yml).
    default: ""
  max-turns:
    description: Cap the agent's turns (Claude Code --max-turns). Empty = the CLI default.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        AGENT: ${{ inputs.agent }}
        TOOLS: ${{ inputs.tools }}
        MCP: ${{ inputs.mcp }}
        SYSTEM: ${{ inputs.system }}
        OUT: ${{ inputs.out }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
      run: |
        if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "::warning::no Claude auth (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY) — AI step is a no-op."
          exit 0
        fi
        # Keep the install log: when the CLI is missing, `command -v claude`
        # fails silently downstream and the run looks like an auth problem.
        if ! npm install -g @anthropic-ai/claude-code >"$RUNNER_TEMP/npm-install.log" 2>&1; then
          echo "::warning::Claude Code install failed — using the Claude API fallback."
          tail -n 40 "$RUNNER_TEMP/npm-install.log" >&2 || true
        fi
        args=(--prompt "$PROMPT")
        [ -n "$AGENT" ]     && args+=(--agent "$AGENT")
        [ -n "$TOOLS" ]     && args+=(--tools "$TOOLS")
        [ -n "$MCP" ]       && args+=(--mcp "$MCP")
        [ -n "$SYSTEM" ]    && args+=(--system "$SYSTEM")
        [ -n "$OUT" ]       && args+=(--out "$OUT")
        [ -n "$MODEL" ]     && args+=(--model "$MODEL")
        [ -n "$MAX_TURNS" ] && args+=(--max-turns "$MAX_TURNS")
        bash "$GITHUB_ACTION_PATH/run.sh" "${args[@]}"

    # ---- metering post-steps (always run, never fail the job) ----------------
    # Publish whatever run.sh recorded: step summary + PR sticky cost comment,
    # and hand the consumed records file to the artifact upload below. The
    # nightly ai-usage ledger sweeps these `ai-usage-*` artifacts into
    # _data/ai_usage/ and the public dashboard. Skipped (with a notice) in a
    # repo that carries the runner without the metering scripts.
    - id: usage
      if: always()
      shell: bash
      run: |
        if [ -f scripts/ai/usage_report.rb ]; then
          ruby scripts/ai/usage_report.rb || echo "::notice::AI usage report failed (non-fatal)."
        else
          echo "::notice::no scripts/ai/usage_report.rb — AI usage not metered in this repo."
        fi

    - if: ${{ always() && steps.usage.outputs.file != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.usage.outputs.name }}
        path: ${{ steps.usage.outputs.file }}
        if-no-files-found: ignore
        retention-days: 30
