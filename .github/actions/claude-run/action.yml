# =============================================================================
# claude-run — the fleet's universal AI step (Claude Code first, Claude API
# fallback). kit: ai-runner v0.1.0 — SOURCE OF TRUTH for the whole fleet.
# -----------------------------------------------------------------------------
# Consume it BY REFERENCE, never by copy:
#
#   - uses: bamr87/bamr87/.github/actions/claude-run@v2
#     with: { agent: grow, prompt: "…", tools: "Bash,Read,Write,Edit,Grep,Glob" }
#
# or take the whole lane (kill switch, concurrency, checkout, runtimes, this
# step, result assertion) from .github/workflows/ai-lane.yml. The runner beside
# this manifest (run.sh) installs Claude Code (best-effort), resolves the model
# (--model > AI_MODEL > the CONSUMER repo's _data/ai.yml > the fleet default),
# runs `claude -p` in the repo's credential order (AI_AUTH_ORDER, default
# oauth then api_key; a REFUSED credential moves on to the next one; a
# TRANSIENT failure that billed nothing is re-run on the same one, per
# AI_TRANSIENT_RETRIES / AI_TRANSIENT_BACKOFF in the step env), and falls
# back to the Claude API when the
# consumer ships scripts/ai/api_call.rb|py. A call that was ATTEMPTED and FAILED
# with no fallback fails THIS step with the reason the run gave — never a silent
# no-op for a later step to discover (run.sh, EXIT CODES). With NO auth at all
# the step is a clean no-op (exit 0), so lanes degrade gracefully when unset.
#
# Auth comes from the job env: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for
# now (2026-11-15): the step below unsets it before run.sh, which also ignores
# `api_key` in AI_AUTH_ORDER (no key-billed Claude Code run, no Claude API
# fallback). To restore, drop the two OAuth-only guards (here and in run.sh)
# and re-add the secrets.ANTHROPIC_API_KEY reference to the job env.
#
# METERING (optional, consumer-owned): when the consumer carries
# scripts/ai/usage.rb + usage_report.rb, run.sh records every call's tokens and
# API-equivalent cost and the post-steps publish them — job summary, an
# `ai-usage-*` artifact, the PR's sticky cost comment. Best-effort (`always()`,
# never fails the job); a repo without the metering scripts skips them with a
# notice. Contract tests: templates/ai-runner/tests/contract.sh (CI:
# ai-runner-contract.yml). Kit docs: templates/ai-runner/README.md.
# =============================================================================
name: claude-run
description: Run an AI step via Claude Code, falling back to the Claude API.
inputs:
  prompt:
    description: The instruction for the agent.
    required: true
  agent:
    description: Run AS a named agent (.claude/agents/<name>.md) — its system prompt, tools, and constraints. The single source of truth for a role.
    default: ""
  tools:
    description: Comma-separated --allowedTools for Claude Code (ignored by the API fallback).
    default: ""
  mcp:
    description: Path to an MCP config JSON for Claude Code.
    default: ""
  system:
    description: System prompt appended to the agent (and used by the API fallback).
    default: ""
  out:
    description: Write the result to this file instead of stdout.
    default: ""
  model:
    description: Model override for this step (beats AI_MODEL and _data/ai.yml).
    default: ""
  max-turns:
    description: Cap the agent's turns (Claude Code --max-turns). Empty = the CLI default.
    default: ""
  max-budget-usd:
    description: >-
      Dollar ceiling for this call (Claude Code --max-budget-usd). Defaults to the
      fleet fallback, bamr87/bamr87 _data/fleet.yml budget.default_usd (asserted by
      test_ai_budget.py), so a caller that forgets it is still capped. Empty = no cap.
      The cost is the CLI's client-side estimate: under OAuth a throughput ceiling.
    default: "10"
  permission-mode:
    description: >-
      Claude Code --permission-mode: acceptEdits (the default; the agent may edit
      files even when `tools` names no edit tool), default (the `tools` allowlist is
      the whole grant; use it for a reviewer that must not write) or plan (read
      only). Any other value fails the step before anything runs.
    default: "acceptEdits"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        AGENT: ${{ inputs.agent }}
        TOOLS: ${{ inputs.tools }}
        MCP: ${{ inputs.mcp }}
        SYSTEM: ${{ inputs.system }}
        OUT: ${{ inputs.out }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
        PERMISSION_MODE: ${{ inputs.permission-mode }}
      run: |
        # OAuth only for now (2026-11-15): a job env that still carries the key
        # never hands it to Claude. See the header to restore.
        unset ANTHROPIC_API_KEY
        if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
          echo "::warning::no Claude auth (CLAUDE_CODE_OAUTH_TOKEN; ANTHROPIC_API_KEY is disabled for now, OAuth only) — AI step is a no-op."
          exit 0
        fi
        # Keep the install log: when the CLI is missing, `command -v claude`
        # fails silently downstream and the run looks like an auth problem.
        # `@latest` explicitly: Claude Code declares engines node>=22, and on the
        # fleet's Node 20 a bare name makes npm skip to the newest engine-
        # compatible release (2.1.197), which current models reject with a 400.
        # The CLI is a native binary, so it runs on any Node.
        if ! npm install -g @anthropic-ai/claude-code@latest >"$RUNNER_TEMP/npm-install.log" 2>&1; then
          echo "::warning::Claude Code install failed — using the Claude API fallback."
          tail -n 40 "$RUNNER_TEMP/npm-install.log" >&2 || true
        elif ! command -v claude >/dev/null 2>&1; then
          # An install that exits 0 but leaves no `claude` on PATH is the
          # silent case: say so and name the log instead of carrying on.
          echo "::warning::npm install exited 0 but no \`claude\` is on PATH — see $RUNNER_TEMP/npm-install.log."
        fi
        # Always log what was actually installed: an install that "succeeded"
        # with the wrong release (2.1.197 on Node 20, bamr87#499) left no trace.
        echo "claude-run: Claude Code $(claude --version 2>/dev/null || echo 'not installed') on Node $(node --version 2>/dev/null || echo 'not installed')"
        # Nested calls: a skill the agent runs (e.g. an illustrator) may need the
        # runner too. Export its location so a consumer's thin scripts/ai/run.sh
        # shim can find it without a second copy or a download.
        export AI_RUNNER="$GITHUB_ACTION_PATH/run.sh"
        args=(--prompt "$PROMPT")
        [ -n "$AGENT" ]     && args+=(--agent "$AGENT")
        [ -n "$TOOLS" ]     && args+=(--tools "$TOOLS")
        [ -n "$MCP" ]       && args+=(--mcp "$MCP")
        [ -n "$SYSTEM" ]    && args+=(--system "$SYSTEM")
        [ -n "$OUT" ]       && args+=(--out "$OUT")
        [ -n "$MODEL" ]     && args+=(--model "$MODEL")
        [ -n "$MAX_TURNS" ] && args+=(--max-turns "$MAX_TURNS")
        [ -n "$MAX_BUDGET_USD" ] && args+=(--max-budget-usd "$MAX_BUDGET_USD")
        [ -n "$PERMISSION_MODE" ] && args+=(--permission-mode "$PERMISSION_MODE")
        bash "$GITHUB_ACTION_PATH/run.sh" "${args[@]}"

    # ---- metering post-steps (always run, never fail the job) ----------------
    # Publish whatever run.sh recorded: step summary + PR sticky cost comment,
    # and hand the consumed records file to the artifact upload below. The
    # nightly ai-usage ledger sweeps these `ai-usage-*` artifacts into
    # _data/ai_usage/ and the public dashboard. Skipped (with a notice) in a
    # repo that carries the runner without the metering scripts.
    - id: usage
      if: always()
      shell: bash
      run: |
        if [ -f scripts/ai/usage_report.rb ]; then
          ruby scripts/ai/usage_report.rb || echo "::notice::AI usage report failed (non-fatal)."
        else
          echo "::notice::no scripts/ai/usage_report.rb — AI usage not metered in this repo."
        fi

    - if: ${{ always() && steps.usage.outputs.file != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.usage.outputs.name }}
        path: ${{ steps.usage.outputs.file }}
        if-no-files-found: ignore
        retention-days: 30
