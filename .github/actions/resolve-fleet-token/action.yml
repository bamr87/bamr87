# =============================================================================
# resolve-fleet-token — pick the first GitHub token that WORKS, not the first
# one that happens to be non-empty, and export it as GH_TOKEN for the job.
# -----------------------------------------------------------------------------
# A presence chain (`FLEET_TOKEN || GITHUB_TOKEN`) chose an EXPIRED FLEET_TOKEN
# over a working fallback on 2026-09-27: every gather step got 401 on all 43
# repos, wrote zeros, and the run still went green (#280). Every loop then grew
# its own probe loop; this is that loop, once.
#
#   - id: token
#     uses: ./.github/actions/resolve-fleet-token
#     with:
#       fleet-token: <the FLEET_TOKEN secret>
#       default-token: <github.token>        # omit to REQUIRE a working PAT
#
# Each PAT candidate is probed with `GET /user` (an idempotent read a PAT
# answers and the job-scoped GITHUB_TOKEN cannot). The first 200 wins and is
# exported to $GITHUB_ENV as GH_TOKEN (or the name in `export`), so `gh` and
# every later step just work. The default token is never probed: it is the
# unprobed last resort that still reads the hub and public repos, which makes a
# degraded run partial rather than blind — and `pat=false` says it happened.
#
# Every candidate is masked before use, so a rejected one cannot leak. The
# `token` output is the winning value (it stays masked in logs); prefer the
# exported env var where one is enough.
#
# NOTE: never write a workflow expression inside these description strings. An
# action manifest is itself a TEMPLATE, and a context named in prose is parsed
# as a real expression against a context that does not exist at manifest-load
# time — the first scheduled token-rotation run died that way in 34 seconds
# (drift check (l) now gates it). Name contexts in plain backticks instead.
# =============================================================================
name: Resolve fleet token
description: Probe the fleet PAT(s) with GET /user, fall back to the job token, and export the winner as GH_TOKEN.
inputs:
  fleet-token:
    description: Primary candidate, normally the `FLEET_TOKEN` secret. May be empty.
    required: false
    default: ''
  fleet-token-name:
    description: Name reported in the `source` output when the primary candidate wins. Logging only, never the value.
    required: false
    default: FLEET_TOKEN
  fallback-token:
    description: Second PAT candidate, probed the same way. May be empty.
    required: false
    default: ''
  fallback-token-name:
    description: Name reported when the second candidate wins.
    required: false
    default: FALLBACK_TOKEN
  default-token:
    description: Last resort, normally the job's own token (`github.token`), accepted WITHOUT a probe. Empty = a working PAT is required.
    required: false
    default: ''
  default-token-name:
    description: Name reported when the last resort is used.
    required: false
    default: GITHUB_TOKEN
  export:
    description: Environment variable the winner is exported to via GITHUB_ENV for the rest of the job. Empty = export nothing.
    required: false
    default: GH_TOKEN
  fail-on-no-valid-token:
    description: "'true' (default) fails the step when no candidate validates and there is no default; 'false' sets valid=false and continues."
    required: false
    default: 'true'
outputs:
  token:
    description: The winning token value (masked in logs). Empty when nothing validated.
    value: ${{ steps.resolve.outputs.token }}
  source:
    description: Which candidate won, by the name given, e.g. `FLEET_TOKEN` or `GITHUB_TOKEN`. Empty when nothing validated.
    value: ${{ steps.resolve.outputs.source }}
  valid:
    description: "'true' when any candidate (including the unprobed default) is in use."
    value: ${{ steps.resolve.outputs.valid }}
  pat:
    description: "'true' when a PROBED personal access token won; 'false' when the run fell back to the default token or has nothing."
    value: ${{ steps.resolve.outputs.pat }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        FLEET_TOKEN: ${{ inputs.fleet-token }}
        FLEET_TOKEN_NAME: ${{ inputs.fleet-token-name }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token }}
        FALLBACK_TOKEN_NAME: ${{ inputs.fallback-token-name }}
        DEFAULT_TOKEN: ${{ inputs.default-token }}
        DEFAULT_TOKEN_NAME: ${{ inputs.default-token-name }}
        EXPORT: ${{ inputs.export }}
        FAIL_ON_NO_VALID_TOKEN: ${{ inputs.fail-on-no-valid-token }}
      run: |
        # No `set -e`: a failing probe is an expected outcome handled by falling
        # through to the next candidate, not a reason to abort the step.
        set -uo pipefail

        names=("$FLEET_TOKEN_NAME" "$FALLBACK_TOKEN_NAME")
        values=("$FLEET_TOKEN" "$FALLBACK_TOKEN")
        for value in "${values[@]}" "$DEFAULT_TOKEN"; do
          [ -n "$value" ] && echo "::add-mask::${value}"
        done

        api="${GITHUB_API_URL:-https://api.github.com}"; api="${api%/}"
        probe() {   # 200 = the PAT is alive; the body is discarded so nothing token-adjacent prints
          curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 2 --retry-connrefused \
            -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${api}/user" 2>/dev/null || echo 000
        }

        token=""; source=""; pat=false
        echo "Probing fleet token candidates (GET /user):"
        for i in "${!values[@]}"; do
          name="${names[$i]}"; value="${values[$i]}"
          if [ -z "$value" ]; then echo "  - ${name}: not set, skipping"; continue; fi
          status="$(probe "$value")"
          case "$status" in
            200) echo "  - ${name}: ok (200)"; token="$value"; source="$name"; pat=true; break ;;
            401) echo "::warning::${name} is set but rejected by the API (401: expired, revoked or malformed) — trying the next candidate." ;;
            403) echo "::warning::${name} is forbidden (403: insufficient scope or rate limited) — trying the next candidate." ;;
            000) echo "  - ${name}: network error contacting ${api}" ;;
            *)   echo "  - ${name}: unexpected status ${status}" ;;
          esac
        done

        if [ -z "$token" ] && [ -n "$DEFAULT_TOKEN" ]; then
          token="$DEFAULT_TOKEN"; source="$DEFAULT_TOKEN_NAME"
          if [ -n "$FLEET_TOKEN$FALLBACK_TOKEN" ]; then
            echo "::error::No fleet PAT is accepted by the API — falling back to ${DEFAULT_TOKEN_NAME} (this repo + public repos only). Re-mint FLEET_TOKEN (docs/TOKEN-ROTATION.md)."
          else
            echo "::notice::No fleet PAT provided — using ${DEFAULT_TOKEN_NAME} (this repo + public repos only)."
          fi
        fi

        {
          echo "token=${token}"
          echo "source=${source}"
          echo "pat=${pat}"
          echo "valid=$([ -n "$token" ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

        if [ -n "$token" ]; then
          [ -n "$EXPORT" ] && echo "${EXPORT}=${token}" >> "$GITHUB_ENV"
          echo "Using ${source}${EXPORT:+ (exported as ${EXPORT})}."
          exit 0
        fi
        if [ "$FAIL_ON_NO_VALID_TOKEN" = 'true' ]; then
          echo "::error::resolve-fleet-token: no working GitHub token (see the per-candidate status above)."
          exit 1
        fi
        echo "::warning::resolve-fleet-token: no working GitHub token; continuing because fail-on-no-valid-token is not 'true'."
