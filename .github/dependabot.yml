# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The github-actions ecosystem keeps the actions the hub's workflows and
# composite actions use on their newest MAJOR tag. Actions ride major tags, not
# SHAs (docs/DEPENDENCIES.md; drift check (j) rejects SHA pins), so minors and
# patches arrive on their own and only a new major needs a pull request.
version: 2

updates:
  - package-ecosystem: "github-actions"
    # "/" discovers every workflow under .github/workflows/; the glob covers the
    # composite actions (.github/actions/<name>/action.yml and
    # .github/actions/<group>/<name>/action.yml), which "/" alone never scans.
    directories:
      - "/"
      - "/.github/actions/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    # Batch action bumps into a single pull request per run instead of one PR
    # per action, to keep review load low.
    groups:
      github-actions:
        patterns:
          - "*"

  # The reusable site-quality.yml runtime (.github/site-quality/): lhci,
  # axe-core, @axe-core/playwright, pa11y, playwright, ajv, yaml are pinned
  # EXACTLY with a committed package-lock.json so every caller scans with the
  # same tools (Platform Architect decision; the one exception to the hub's
  # no-lockfile policy, see tools/check-drift.sh (j)). Dependabot is what keeps
  # those pins moving: one grouped PR a week, and the site-quality self-test
  # (.github/workflows/site-quality-selftest.yml) runs both fixture sites on it.
  # The entry and the lockfile are declared once in specs/QUALITY.contract.yml
  # (`sanctioned_lockfiles` / `sanctioned_dependabot`); check-drift (j) and
  # conformance UPS-QA-40 fail if they fall out of step.
  # RELEASE POLICY: axe-core minor and major releases add or tighten rules, and
  # @lhci/cli minor and major releases move the bundled Lighthouse (new audits,
  # rescored categories); either can turn a green gated caller red. Dependabot
  # therefore ignores those two update types for axe-core, @axe-core/playwright
  # and @lhci/cli; a maintainer bumps them by hand, reads the self-test, and
  # releases them deliberately (a minor of this workflow, or a major when a gated
  # caller would fail, per docs/WORKFLOW-VERSIONING.md's major-bump rule). Patch
  # releases still flow here.
  # TRANSITIVE ADVISORIES: @lhci/cli (latest 0.15.1) pins lighthouse 12.6.1 and
  # tmp ^0.1, so the patched tmp / zod / basic-ftp sit outside its ranges and
  # Dependabot's security updates failed every night trying to downgrade it.
  # They are lifted by top-level `overrides` in package.json instead (proven by
  # the self-test). Top-level, not nested under @lhci/cli: npm 10, which the
  # scanner's Node 22 ships, did not apply the nested form below the first
  # level, and its `npm ci` rejected a lockfile npm 11 had written. Regenerate
  # this lockfile with npm 10 (`npx npm@10 install --package-lock-only`).
  # extract-zip has no patched release at all; its alert stays open until
  # puppeteer drops it.
  - package-ecosystem: "npm"
    directory: "/.github/site-quality"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      site-quality-runtime:
        patterns:
          - "*"
    ignore:
      - dependency-name: "axe-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@axe-core/playwright"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@lhci/cli"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
