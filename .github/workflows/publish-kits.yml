name: publish-kits

# Publishes the hub's shared runtime kits as PACKAGES so the fleet receives
# them by dependency rather than by copy: with the always-latest dependency
# policy (_data/fleet.yml `dependencies:`), every consumer picks up the newest
# release on its next build with zero fan-out. Today: every templates/*/
# package.json → npm (@bamr87/*). Python/Ruby kits join the same job when they
# exist (specs/CONFORMANCE.md gap list).
#
# Runs on push to main when a kit manifest changes, and on dispatch. Not on
# VERSION alone: the published version is package.json's, and 15 of the 17
# kits with a VERSION file have no package to publish.
# Without NPM_TOKEN the job still builds and inspects the tarball (`npm pack`)
# so the packaging is verified on every change; only the publish step is
# skipped. A version that is already on the registry is skipped, not failed,
# so a doc-only change to a kit never breaks the workflow.

on:
  push:
    branches: [main]
    paths:
      - "templates/*/package.json"
      - ".github/workflows/publish-kits.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only; never publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-kits
  cancel-in-progress: false

jobs:
  npm:
    name: npm kits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Not vars.NODE_VERSION: the fleet's canonical value (20) is below
          # what fleet-engines declares (engines.node >=22; vitest 5 needs
          # ^22.12), and npm 10.8.2 on Node 20 crashes resolving it ("Cannot
          # read properties of null (reading 'edgesOut')") instead of reporting
          # the engine mismatch. The current LTS, as in console-web.yml and
          # fleet-engines-contract.yml (#356).
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Pack and publish every templates/*/package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          for manifest in templates/*/package.json; do
            dir=$(dirname "$manifest")
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            echo "::group::$name@$version ($dir)"
            # A TypeScript kit ships built JS: build first (no lockfile — always-latest), then check.
            ( cd "$dir" \
              && if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm install --no-audit --no-fund --no-package-lock && npm run build; fi \
              && node --check "$(node -p "require('./package.json').main")" && npm pack --dry-run )
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run — not publishing"
            elif [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::notice::NPM_TOKEN not provisioned — packed only (see _data/fleet.yml tokens)"
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "already on the registry — skipped"
            else
              ( cd "$dir" && npm publish --access public --provenance )
              echo "published $name@$version"
            fi
            echo "::endgroup::"
          done
