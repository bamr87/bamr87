name: 🚧 Drift Check

# Hard gate (fast, deterministic): fails CI on registry ↔ .gitmodules drift,
# stray/unregistered project dirs, a stale README AUTO:projects span, or missing
# top-level READMEs.
#
# The fleet-wide advisory checks run daily and on dispatch, never on a PR or a
# push: (g) that the registry's repo_urls still match GitHub, and (k) the fleet's
# dependency policy. They read every registry repo on this repo's shared
# GITHUB_TOKEN quota, at least 475 calls a run, and no PR can change what they
# read. Run on every PR and push, they spent the quota in busy hours: setup-node
# failed in build-dash and verify, and the gate itself passed with nothing read
# (docs/WORKFLOW-OPTIMIZATION.md, the November 2026 review).
#
# The control plane's own Python fixture tests (.github/scripts/dash-gen/
# test_*.py) run in python-tests.yml with every other hub suite — one place for
# tests, one for the gate.
#
# Deliberately submodule-content-agnostic and offline+API only — no Ruby/Jekyll
# build. The internal-link check moved out of the gate (it was non-gating and
# needed a full site build); run it locally with `tools/check-drift.sh --links`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 4 * * *'  # daily 04:07 UTC: the fleet-wide checks (_data/fleet.yml schedule.drift_check)
  workflow_dispatch:

permissions:
  contents: read

# The daily scan gets a group of its own, so a push to main cannot cancel it.
concurrency:
  group: drift-check-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shallow, no submodules: the gate reads .gitmodules, the registry, and
      # top-level READMEs — never submodule working trees.
      # fetch-depth 2: on a pull request the checkout is GitHub's merge commit,
      # whose first parent is the base — the generated-file guard diffs the two.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # PyYAML for the gate; gh is preinstalled on the runner.
      - uses: ./.github/actions/setup/dash-gen

      # Main-only generated files (CATALOG.md, docs/README.md — `jev-main-only`
      # in .gitattributes) are regenerated and committed on main by the JEV
      # post-merge job (jev-number.yml). GitHub's mergeability check ignores
      # custom merge drivers, so the only way two PRs stop conflicting on them
      # is that PRs stop editing them. docs/JEV.md "Main-only generated files".
      - name: Pull requests do not edit main-only generated files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 -m tools.jev generated guard --range HEAD^1 HEAD

      # JEV_SPANS_ADVISORY: a stale generated SPAN (README AUTO:projects, the
      # docs/DASH.md CLI reference) warns instead of failing — main's post-merge
      # job regenerates it, so a PR is never asked to (and never conflicts on it).
      - name: Run drift gate
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            tools/check-drift.sh --ci
          else
            tools/check-drift.sh
          fi
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEV_SPANS_ADVISORY: '1'

      # The workflows dir's own standard ("run actionlint after editing"). This
      # used to be a second job — a whole extra runner (and billed minute) on
      # every push and PR just to curl a binary and lint. It reuses this job's
      # checkout instead.
      #
      # Discovered by glob rather than a hand-maintained include list: the old
      # list silently skipped any newly added workflow.
      #
      # There are NO exemptions. `unified-evolution.yml` used to be one — carried
      # because the last of the legacy suite had pre-existing findings nobody
      # wanted to fix. It was rewritten on 2026-08-09 (424 lines → ~120) and the
      # exemption deleted with it. Re-adding an exemption here means the gate has
      # stopped covering a file; fix the workflow instead.
      - name: Run actionlint (control plane)
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          echo "Linting ${#files[@]} workflow(s):"
          printf '  %s\n' "${files[@]}"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color "${files[@]}"
