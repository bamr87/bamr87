name: 🚧 Drift Check

# Hard gate (fast, deterministic): fails CI on registry ↔ .gitmodules drift,
# stray/unregistered project dirs, a stale README AUTO:projects span, or missing
# top-level READMEs. Also runs an advisory (non-gating) check that the registry's
# repo_urls still match GitHub reality — renamed / moved / deleted repos the
# set-vs-set parity check can't see (uses GITHUB_TOKEN; self-skips if unreachable).
#
# Deliberately submodule-content-agnostic and offline+API only — no Ruby/Jekyll
# build. The internal-link check moved out of the gate (it was non-gating and
# needed a full site build); run it locally with `tools/check-drift.sh --links`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shallow, no submodules: the gate reads .gitmodules, the registry, and
      # top-level READMEs — never submodule working trees.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install gate deps
        run: pip install pyyaml   # the gate needs PyYAML + gh (preinstalled on the runner)

      - name: Run drift gate
        run: tools/check-drift.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The workflows dir's own standard ("run actionlint after editing"). This
      # used to be a second job — a whole extra runner (and billed minute) on
      # every push and PR just to curl a binary and lint. It reuses this job's
      # checkout instead.
      #
      # Discovered by glob rather than a hand-maintained include list: the old
      # list silently skipped any newly added workflow.
      #
      # There are NO exemptions. `unified-evolution.yml` used to be one — carried
      # because the last of the legacy suite had pre-existing findings nobody
      # wanted to fix. It was rewritten on 2026-08-09 (424 lines → ~120) and the
      # exemption deleted with it. Re-adding an exemption here means the gate has
      # stopped covering a file; fix the workflow instead.
      - name: Run actionlint (control plane)
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          echo "Linting ${#files[@]} workflow(s):"
          printf '  %s\n' "${files[@]}"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color "${files[@]}"
