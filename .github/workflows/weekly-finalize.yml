# kit: ai-runner v0.2.1 — a caller of the fleet's reusable AI lane.
# Sunday finalize: split the week between the Grok loops and the Claude job
# queue, and write the week-ahead brief. Console loop `weekly_finalize`
# (docs/WEEKLY-CLOSEOUT.md).
name: weekly-finalize

on:
  schedule:
    # Sunday 16:17 America/Denver (MST, UTC-7) = 23:17 UTC. Mirrors
    # _data/fleet.yml schedule.weekly_finalize (test_weekly_closeout.py).
    - cron: "17 23 * * 0"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional steer for this run (free text)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: weekly-finalize
      switch: WEEKLY_FINALIZE_ENABLED
      model: claude-sonnet-5-5
      prompt: "You are the weekly finalize agent for bamr87. Follow .github/weekly/finalize.md exactly. Focus: ${{ inputs.focus || '(none)' }}. Write the week-ahead brief to .weekly/brief.md, post it to the week's tracking issue, and STOP. Do not wake other Grok bots. Never merge, close, approve, push, or change settings, variables or secrets."
      tools: "Bash,Read,Write,Grep,Glob"
      max-turns: "60"
      max-budget-usd: "10"
      timeout-minutes: 30
      setup-python: "3.12"
      result-file: .weekly/brief.md
      artifact-path: .weekly/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
