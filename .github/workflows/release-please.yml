name: release-please

# The fleet's ONE release-please workflow (UPS-QA-32/33; the CHANGELOG rule
# UPS-REPO-20 proposed with the UPS-WORK spec). Every repo, content repos
# included (decision D5), keeps a CHANGELOG.md that release-please writes from
# Conventional Commit PR titles, never by hand. The caller needs two files at
# its root: release-please-config.json (release-type by repo type: `simple` for
# docs/content, Jekyll sites, demos and the control plane; `node` / `python` /
# `ruby` for packaged apps and libraries) and .release-please-manifest.json
# (e.g. {".": "0.1.0"}). The SDLC kit (templates/sdlc/release/) ships the
# caller and one config per release type.
#
# On every push to the default branch it opens or updates a "release PR" that
# bumps the version and rewrites CHANGELOG.md. Merging that PR tags vX.Y.Z and
# creates the GitHub Release. Publishing to a registry is NOT done here: callers
# that publish chain their own job off the `release_created` output (same run,
# so no PAT is needed to trigger it).
#
# Opening the release PR needs a credential allowed to create one: either a
# RELEASE_PLEASE_TOKEN secret, or the repo's Actions setting "Allow GitHub
# Actions to create and approve pull requests" (Settings > Actions > General >
# Workflow permissions) so GITHUB_TOKEN may. With neither, GitHub refuses
# `POST /pulls` and release-please exits 1 — on every push, forever, while
# nothing else about the run is wrong (bamr87/bamr87#406). That one denial is
# therefore a WARNING here, not a failure: the tagging pass stays strict, the
# PR pass is guarded, and `strict-pr-creation: true` turns the warning back
# into a failure on a repo whose credential is provisioned.
#
# Callers pin a tag, never @main (UPS-WORK-10; tag scheme in
# docs/WORKFLOW-VERSIONING.md):
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     release:
#       uses: bamr87/bamr87/.github/workflows/release-please.yml@v1
#       permissions: { contents: write, pull-requests: write }
#       secrets: inherit
#
# Home (decision D3): shared workflows live in the hub. This is the hub copy of
# the logic that bamr87/.github's release-please.yml carries today; retiring or
# shimming that one is Fleet Ops' change, not this file's. Tags (`v1`) are cut
# by Fleet Ops.

on:
  workflow_call:
    inputs:
      config-file:
        description: release-please config, relative to the caller's root
        type: string
        default: release-please-config.json
      manifest-file:
        description: release-please manifest, relative to the caller's root
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: branch to release from; empty = the caller's default branch
        type: string
        default: ''
      ruby-version:
        description: Ruby used to re-lock Gemfile.lock on the release PR (empty = vars.RUBY_VERSION, then 3.3)
        type: string
        default: ''
      strict-pr-creation:
        description: >
          Fail the run when the release PR cannot be created. Default false: the
          run warns instead, because the one cause a caller cannot fix from a PR
          is a repo with no RELEASE_PLEASE_TOKEN whose Actions setting forbids
          GITHUB_TOKEN from opening PRs (bamr87/bamr87#406). Set true on a repo
          whose credential is provisioned and whose releases must therefore
          never silently stop.
        type: boolean
        default: false
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: >
          PAT (contents + pull-requests write) so the release PR's commits
          trigger CI; commits made with the default GITHUB_TOKEN do not trigger
          other workflows. Falls back to GITHUB_TOKEN when unset, which is
          enough only where the repo's Actions setting "Allow GitHub Actions to
          create and approve pull requests" is on. Where it is off this secret
          is MANDATORY (docs/RELEASES.md): without it GitHub refuses POST /pulls
          and no release PR is ever opened. The PR step below downgrades that
          one denial to a warning rather than a red run.
        required: false
    outputs:
      releases_created:
        description: "true if any release was created on this run"
        value: ${{ jobs.release-please.outputs.releases_created }}
      release_created:
        description: "true if the root component was released"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "the created tag (e.g. v1.2.3)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "the released version (e.g. 1.2.3)"
        value: ${{ jobs.release-please.outputs.version }}
      prs_created:
        description: "true if a release PR was opened/updated on this run"
        value: ${{ jobs.release-please.outputs.prs_created }}
      pr:
        description: "JSON of the open release PR (headBranchName, number, ...)"
        value: ${{ jobs.release-please.outputs.pr }}

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      prs_created: ${{ steps.rp_pr.outputs.prs_created }}
      pr: ${{ steps.rp_pr.outputs.pr }}
    steps:
      # Two passes over the same config, because the two halves of what
      # release-please does have different failure modes. Tagging a merged
      # release PR only needs `contents: write`, which GITHUB_TOKEN always has,
      # so a failure there is a real defect and must stay red. OPENING the
      # release PR additionally needs permission to create a PR, which a repo
      # can withhold from Actions entirely — the `GitHub Actions is not
      # permitted to create or approve pull requests` denial of
      # bamr87/bamr87#406. Splitting the passes keeps `continue-on-error` off
      # everything except the one step that denial can reach.
      - name: Tag and publish any merged release PR
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch || github.event.repository.default_branch }}
          skip-github-pull-request: true

      - name: Open or update the release PR
        id: rp_pr
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch || github.event.repository.default_branch }}
          skip-github-release: true

      # The guard. A denial with no credential provisioned is a known, open
      # fleet decision (bamr87/bamr87#406) that no PR against this repo or its
      # callers can close, and failing every push to every adopter buys nothing:
      # the run is already a no-op. Warn, say exactly what to do, and pass.
      # Anywhere the credential IS provisioned the same failure is a defect, so
      # re-raise it — that is the case `strict-pr-creation` also forces.
      - name: Guard the release-PR denial
        if: steps.rp_pr.outcome == 'failure'
        env:
          # A comparison, never the value: this prints true/false only.
          HAVE_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          STRICT: ${{ inputs.strict-pr-creation }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          detail="see the \"Open or update the release PR\" step above for the error"
          if [ "$HAVE_PAT" = "true" ]; then
            echo "::error title=release-please could not open the release PR::RELEASE_PLEASE_TOKEN is set on $REPO, so this is not the known PR-creation denial — $detail."
            exit 1
          fi
          if [ "$STRICT" = "true" ]; then
            echo "::error title=release-please could not open the release PR::strict-pr-creation is on and no RELEASE_PLEASE_TOKEN is set on $REPO — $detail."
            exit 1
          fi
          echo "::warning title=No release PR — release-please has no way to open one::$REPO has no RELEASE_PLEASE_TOKEN, and GITHUB_TOKEN may not create pull requests unless Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\" is on. Versioning is paused, not broken: nothing else in this run failed."
          {
            echo "### Release PR not opened"
            echo
            echo "release-please computed the next release and updated its release branch, but could not open the release PR."
            echo
            echo "Give it one of these on \`$REPO\` and the next push to the default branch opens the PR:"
            echo
            echo "1. A \`RELEASE_PLEASE_TOKEN\` secret — a PAT with \`contents: write\` + \`pull requests: write\`. Preferred: the release PR then runs CI."
            echo "2. Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\". The release PR then runs no CI."
            echo
            echo "Tracked in [bamr87/bamr87#406](https://github.com/bamr87/bamr87/issues/406); background in [docs/RELEASES.md](https://github.com/bamr87/bamr87/blob/main/docs/RELEASES.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  # release-please bumps the version file on the release PR, but not lockfiles
  # that carry the project's own version (a path-gem in Gemfile.lock, the root
  # entry of package-lock.json). Left stale, a frozen install breaks on the merge
  # commit. Re-lock them on the PR branch in this same run. Repos that follow the
  # fleet's no-lockfile policy (docs/DEPENDENCIES.md) skip both steps.
  relock:
    name: Sync release-PR lockfiles
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        if: hashFiles('Gemfile.lock') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version || vars.RUBY_VERSION || '3.3' }}
          bundler-cache: false
      - name: Re-lock Gemfile.lock
        if: hashFiles('Gemfile.lock') != ''
        run: |
          bundle config set --local frozen false
          bundle lock   # re-resolves conservatively: only the path-gem version line moves

      - name: Sync package-lock.json version
        if: hashFiles('package-lock.json') != ''
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));const l=JSON.parse(fs.readFileSync("package-lock.json"));l.version=p.version;if(l.packages&&l.packages[""])l.packages[""].version=p.version;fs.writeFileSync("package-lock.json",JSON.stringify(l,null,2)+"\n")'

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync lockfiles to released version"
            git push
          else
            echo "Lockfiles already in sync."
          fi
