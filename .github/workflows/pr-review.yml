name: PR review

# The fleet's one PR comment (constitution § 19). Every CI failure on a pull
# request is summarized in one sticky comment, so a reader learns why a check
# failed without opening a log: which job, the reason from its log, whether the
# PR probably caused it, and what to do. .github/scripts/dash-gen/pr_review.py
# rebuilds the comment from the head commit's state each time a workflow finishes,
# and deletes it when nothing is failing. Doc: templates/pr-review/README.md.
#
# On a PR run it also posts findings (§ 19.3): a repo check uploads a
# `fleet-findings` artifact instead of commenting itself, and each finding on a
# line the PR adds becomes one inline comment with its severity, never posted
# twice for the same (path, line, rule). Content and docs findings are dropped
# on Dependabot and release-please PRs (§ 19.6); the job summary lists them all.
#
# This file is both the hub's own watcher and the reusable workflow a fleet repo
# calls from its stub (templates/pr-review/pr-review.yml). A called workflow sees
# the caller's `github.event`, so both paths read the same event.
#
# WHY workflow_run. It is the one event that can see every workflow: GitHub fires
# no `check_run` or `check_suite` event for a check GitHub Actions created. The
# `needs:` rule exists because a follower couples to one workflow's display name,
# and this one names none. The `!` keeps it from watching itself. A workflow_run
# job gets a write token even for a fork's PR, so it runs nothing from the PR: it
# checks out the hub's tooling only, and the log text and findings artifacts it
# reads are untrusted data, validated in memory and never executed or extracted.
#
# MERGE READINESS (ADR 0012). With `vars.PR_READINESS_ENABLED` set to 'true' the same comment
# also lists what is left before the pull request merges: the PR queue's reading of that
# one pull request (checks, base, draft state, the review gate and its label, the
# governance trace, the task list, review threads). The comment stays while anything is
# left; when nothing is, it goes (§ 19.2) and one review per head commit says the pull
# request is ready and who merges it. That review comments and never approves (§ 19.5).
# Marking a pull request ready, labelling it or editing it starts no workflow, so nothing
# would fire a workflow_run: those events come in through pull_request_target, which
# runs this file from the default branch with the same rule as above. It never checks
# out the pull request, and it reads the pull request through the API alone.
#
# AI ANALYSIS (§ 19.11). Every failed run on a pull request also gets an AI analysis in the
# same comment: the `ai-analysis` job hands each failed run's log, its workflow file and the
# pull request's diff to one claude-run call (Sonnet, no tools, ONE turn, a $1 cap) and writes
# what it says, validated and escaped, into the sticky under the summary
# (.github/scripts/dash-gen/pr_ai_analysis.py). Each run attempt is analysed once; a pass
# picks up every failed run on the head commit that has none yet. The pull request of an
# author outside the collaborators (author_association) waits for a maintainer's
# `ai-analysis` label; the next failed or re-run workflow on it is analysed. The analysis is
# advisory: it never fails a check, never approves, and a call that cannot run says so.
#
# It runs only from the default branch, so a change here takes effect at merge.
# Off switch: `vars.PR_REVIEW_ENABLED` set to 'false'. Default on.
# Readiness switch: `vars.PR_READINESS_ENABLED` set to 'true'. Default off.
# AI analysis switch: `vars.PR_AI_ANALYSIS_ENABLED` set to 'false'. Default on.

on:
  workflow_run:
    workflows: ["**", "!PR review"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled, edited]
  workflow_call:
    inputs:
      hub-ref:
        description: "bamr87/bamr87 ref to take the tooling from: pass the ref you call this workflow at"
        type: string
        default: "main"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "The repo's Claude credential, for the AI analysis (§ 19.11); without it the analysis says it could not run"
        required: false

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  ci-failure:
    # Every PR run, so a fixed failure clears its comment and a green check's
    # findings still reach the diff. For a push, only a failure: it is reported
    # on the PR that merged it, and a green push has nothing to say. A schedule
    # or dispatch has no PR. `actions: read` downloads the findings artifacts;
    # `pull-requests: write` posts the sticky and the inline comments.
    if: >-
      ${{ vars.PR_REVIEW_ENABLED != 'false' && (
      (contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)
      && !contains(fromJSON('["skipped","cancelled"]'), github.event.workflow_run.conclusion))
      || (github.event.workflow_run.event == 'push'
      && contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    outputs:
      ai-pending: ${{ steps.ai-pending.outputs.pending }}
    steps:
      - name: Check out the hub's tooling, never the pull request
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ inputs.hub-ref || 'main' }}
          path: .fleet-hub
          # The script, and what merge readiness reads beside it: the PR queue's model and the fleet's settings.
          sparse-checkout: |
            .github/scripts/dash-gen
            tools
            _data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the tooling's one dependency
        run: python -m pip install --quiet pyyaml

      - name: Summarize failures and post findings on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          READINESS: ${{ vars.PR_READINESS_ENABLED }}
        run: |
          # pr_readiness.py is pr_review.py's comment with what is left before the merge under it.
          script=pr_review.py
          if [ "$READINESS" = "true" ]; then script=pr_readiness.py; fi
          python ".fleet-hub/.github/scripts/dash-gen/$script" ci --repo "$GITHUB_REPOSITORY" --run "$RUN_ID"

      # Cheap, and no model: does any failed run on the head commit still lack an AI
      # analysis? The ai-analysis job starts only when one does.
      - name: Count the failed runs that still need an AI analysis
        id: ai-pending
        if: ${{ vars.PR_AI_ANALYSIS_ENABLED != 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python .fleet-hub/.github/scripts/dash-gen/pr_ai_analysis.py plan --check --repo "$GITHUB_REPOSITORY" --run "$RUN_ID"

  readiness:
    # The pull-request events that start no workflow of their own: marked ready, converted
    # to a draft, labelled, edited, opened. A push starts CI, and ci-failure reports when
    # that finishes; it also lands here at once, so the comment is current before CI is.
    if: ${{ github.event_name == 'pull_request_target' && vars.PR_READINESS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out the hub's tooling, never the pull request
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ inputs.hub-ref || 'main' }}
          path: .fleet-hub
          sparse-checkout: |
            .github/scripts/dash-gen
            tools
            _data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the tooling's one dependency
        run: python -m pip install --quiet pyyaml

      - name: Say what is left before the pull request merges
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python .fleet-hub/.github/scripts/dash-gen/pr_readiness.py ready --repo "$GITHUB_REPOSITORY" --pr "$PR"

  ai-analysis:
    # § 19.11: an AI analysis of every failed run, in the same sticky comment, after
    # ci-failure wrote the summary it lands in. A workflow_run only: the readiness job's
    # pull-request events run as other runs of this file in the same concurrency group,
    # so nothing edits the comment at once. Starts when ci-failure counted a failed run
    # with no analysis yet. A maintainer's `ai-analysis` label is read through the API by
    # the plan step, never used as a job condition: a label checked on pull_request_target
    # authorizes the PR at one moment, and this job must not depend on that moment.
    needs: ci-failure
    if: >-
      ${{ vars.PR_REVIEW_ENABLED != 'false' && vars.PR_AI_ANALYSIS_ENABLED != 'false'
      && github.event_name == 'workflow_run'
      && needs.ci-failure.outputs.ai-pending != '' && needs.ci-failure.outputs.ai-pending != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out the hub's tooling, never the pull request
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ inputs.hub-ref || 'main' }}
          path: .fleet-hub
          sparse-checkout: |
            .github/scripts/dash-gen
            _data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the tooling's one dependency
        run: python -m pip install --quiet pyyaml

      # Which failed runs need an analysis, who wrote the pull request, and the prompt:
      # each run's log, workflow file and the diff, fenced as untrusted data.
      - name: Plan the analysis
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python .fleet-hub/.github/scripts/dash-gen/pr_ai_analysis.py plan --repo "$GITHUB_REPOSITORY" \
            --run "$RUN_ID" --out-dir "$RUNNER_TEMP/ai-analysis"

      # The model: no tools, one turn, read-only, capped (budget.call_sites
      # pr-review.yml:ai-analysis). One turn means a tool call it is talked into can never
      # feed a result back into its answer. Only a collaborator's pull request, a listed
      # bot's, or one a maintainer labelled reaches it. Advisory: never fails the review.
      - name: Analyse the failed runs (Claude, no tools)
        id: analyst
        if: >-
          ${{ steps.plan.outputs.pending != '' && steps.plan.outputs.pending != '0' && (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), steps.plan.outputs.author_association)
          || steps.plan.outputs.vouched == 'true') }}
        continue-on-error: true
        uses: bamr87/bamr87/.github/actions/claude-run@v2
        env:
          # OAuth only (2026-11-15): the runner never sees an API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_AUTH_ORDER: oauth
        with:
          prompt: ${{ steps.plan.outputs.prompt }}
          system: ${{ steps.plan.outputs.system }}
          out: ${{ runner.temp }}/ai-analysis/answer.txt
          model: claude-sonnet-5-5
          max-turns: 1
          max-budget-usd: 1
          permission-mode: default
          tools: ""

      # Validate the answer and write it into the sticky; or say why there is none.
      - name: Write the analysis into the sticky comment
        if: ${{ !cancelled() && steps.plan.outputs.pending != '' && steps.plan.outputs.pending != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.analyst.outcome }}
          CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'present' || 'missing' }}
        run: |
          python .fleet-hub/.github/scripts/dash-gen/pr_ai_analysis.py post --repo "$GITHUB_REPOSITORY" \
            --plan "$RUNNER_TEMP/ai-analysis/plan.json" --result "$RUNNER_TEMP/ai-analysis/answer.txt" \
            --outcome "${OUTCOME:-skipped}" --credential "$CREDENTIAL"
