name: PR review

# The fleet's one PR comment (constitution § 19). Every CI failure on a pull
# request is summarized in one sticky comment, so a reader learns why a check
# failed without opening a log: which job, the reason from its log, whether the
# PR probably caused it, and what to do. .github/scripts/dash-gen/pr_review.py
# rebuilds the comment from the head commit's state each time a workflow finishes,
# and deletes it when nothing is failing. Doc: templates/pr-review/README.md.
#
# This file is both the hub's own watcher and the reusable workflow a fleet repo
# calls from its stub (templates/pr-review/pr-review.yml). A called workflow sees
# the caller's `github.event`, so both paths read the same event.
#
# WHY workflow_run. It is the one event that can see every workflow: GitHub fires
# no `check_run` or `check_suite` event for a check GitHub Actions created. The
# `needs:` rule exists because a follower couples to one workflow's display name,
# and this one names none. The `!` keeps it from watching itself. A workflow_run
# job gets a write token even for a fork's PR, so it runs nothing from the PR: it
# checks out the hub's tooling only, and the log text it reads is untrusted data.
#
# MERGE READINESS (ADR 0012). With `vars.PR_READINESS_ENABLED` set to 'true' the same comment
# also lists what is left before the pull request merges: the PR queue's reading of that
# one pull request (checks, base, draft state, the review gate and its label, the
# governance trace, the task list, review threads). The comment stays while anything is
# left; when nothing is, it goes (§ 19.2) and one review per head commit says the pull
# request is ready and who merges it. That review comments and never approves (§ 19.5).
# Marking a pull request ready, labelling it or editing it starts no workflow, so nothing
# would fire a workflow_run: those events come in through pull_request_target, which
# runs this file from the default branch with the same rule as above. It never checks
# out the pull request, and it reads the pull request through the API alone.
#
# It runs only from the default branch, so a change here takes effect at merge.
# Off switch: `vars.PR_REVIEW_ENABLED` set to 'false'. Default on.
# Readiness switch: `vars.PR_READINESS_ENABLED` set to 'true'. Default off.

on:
  workflow_run:
    workflows: ["**", "!PR review"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled, edited]
  workflow_call:
    inputs:
      hub-ref:
        description: "bamr87/bamr87 ref to take the tooling from: pass the ref you call this workflow at"
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  ci-failure:
    # Every PR run, so a fixed failure clears its comment. For a push, only a
    # failure: it is reported on the PR that merged it, and a green push has
    # nothing to say. A schedule or dispatch has no PR.
    if: >-
      ${{ vars.PR_REVIEW_ENABLED != 'false' && (
      (contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event)
      && !contains(fromJSON('["skipped","cancelled"]'), github.event.workflow_run.conclusion))
      || (github.event.workflow_run.event == 'push'
      && contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out the hub's tooling, never the pull request
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ inputs.hub-ref || 'main' }}
          path: .fleet-hub
          # The script, and what merge readiness reads beside it: the PR queue's model and the fleet's settings.
          sparse-checkout: |
            .github/scripts/dash-gen
            tools
            _data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the tooling's one dependency
        run: python -m pip install --quiet pyyaml

      - name: Summarize the failure on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          READINESS: ${{ vars.PR_READINESS_ENABLED }}
        run: |
          # pr_readiness.py is pr_review.py's comment with what is left before the merge under it.
          script=pr_review.py
          if [ "$READINESS" = "true" ]; then script=pr_readiness.py; fi
          python ".fleet-hub/.github/scripts/dash-gen/$script" ci --repo "$GITHUB_REPOSITORY" --run "$RUN_ID"

  readiness:
    # The pull-request events that start no workflow of their own: marked ready, converted
    # to a draft, labelled, edited, opened. A push starts CI, and ci-failure reports when
    # that finishes; it also lands here at once, so the comment is current before CI is.
    if: ${{ github.event_name == 'pull_request_target' && vars.PR_READINESS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out the hub's tooling, never the pull request
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ inputs.hub-ref || 'main' }}
          path: .fleet-hub
          sparse-checkout: |
            .github/scripts/dash-gen
            tools
            _data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the tooling's one dependency
        run: python -m pip install --quiet pyyaml

      - name: Say what is left before the pull request merges
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python .fleet-hub/.github/scripts/dash-gen/pr_readiness.py ready --repo "$GITHUB_REPOSITORY" --pr "$PR"
