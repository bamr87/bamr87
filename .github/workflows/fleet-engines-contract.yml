name: fleet-engines-contract

# Pre-flight gate for the fleet-engines kit (same precedent as the fan-out's
# feedback pre-flight and ai-runner-contract): the package is consumed by dependency by
# GitFactory and zer0-CMS, so a regression here reaches both on their next build.

on:
  pull_request:
    paths:
      - "templates/fleet-engines/**"
      - ".github/workflows/fleet-engines-contract.yml"
  push:
    branches: [main]
    paths:
      - "templates/fleet-engines/**"

permissions:
  contents: read

concurrency:
  group: fleet-engines-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: engines contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/fleet-engines
    steps:
      - uses: actions/checkout@v7

      # The kit's own engines.node (>=22), not the fleet's vars.NODE_VERSION:
      # its devDependencies (vitest 5) require Node 22, and npm on Node 20
      # crashes resolving them instead of reporting the engine mismatch.
      - uses: actions/setup-node@v7
        with:
          node-version-file: templates/fleet-engines/package.json

      - name: Install (always-latest, no lockfile)
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (vitest, node)
        run: npm test

      - name: Build + pack (what publish-kits would ship)
        run: |
          npm run build
          node --check dist/index.js
          npm pack --dry-run

      - name: VERSION and package.json agree
        run: |
          pv=$(node -p "require('./package.json').version")
          vv=$(awk '/^version:/{print $2; exit}' VERSION)
          [ "$pv" = "$vv" ] || { echo "::error::package.json ($pv) and VERSION ($vv) disagree"; exit 1; }
