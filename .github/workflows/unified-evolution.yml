name: 🌱 AI Evolution Pass

# The CI counterpart of the local self-evolution loop (`/evolve` → triage-attention
# → evolve-project → refresh-portfolio). Dispatch-only: no unattended AI writes on
# a schedule. Trigger deliberately via `tools/dash evolve` or the Actions UI.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN preferred, ANTHROPIC_API_KEY fallback — the house
# convention at every claude-code-action call site (docs/AI-INTEGRATION.md).
#
# REWRITTEN 2026-08-09, 424 lines → this.
# ------------------------------------
# The previous version was the last survivor of a generic `unified-*.yml` suite
# built for a single-app repo. It carried six jobs — analyze-repository,
# generate-evolution-prompt, execute-evolution, dry-run-preview,
# create-evolution-pr, evolution-metrics — that shell-scripted a "repository
# analysis" and hand-assembled a prompt for a tree that has no application code
# (every project is a submodule). Five of the six jobs existed to marshal inputs
# into, and metrics out of, the one step that does the work: the Claude Code call.
#
# It was also the sole documented exemption in the drift gate's actionlint sweep
# (drift-check.yml), carried because it had pre-existing findings nobody wanted to
# fix. A workflow that a gate has to be taught to ignore is a workflow the gate is
# telling you about. The capability is kept; the scaffolding around it is not, and
# the actionlint exemption is removed with it.

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "What to improve (free text — e.g. 'docs accuracy in tools/', 'error handling in dash-gen')"
        required: false
        default: "consistency and accuracy across hub docs and tooling"
        type: string
      dry_run:
        description: "Analyze and report only — make no commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: evolution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # No persisted credential: the publish step configures the PROBED token
      # (a PR pushed with a working PAT gets CI; one pushed with GITHUB_TOKEN
      # arrives with no checks).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve a working fleet token
        id: token
        uses: ./.github/actions/resolve-fleet-token
        with:
          fleet-token: ${{ secrets.FLEET_TOKEN }}
          default-token: ${{ github.token }}

      # Fail loudly rather than burning a runner on a no-op: this workflow is
      # dispatched deliberately, so missing auth is an error, not a skip.
      - name: Require Claude auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "::error::No Claude auth. Set CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY. See docs/AI-INTEGRATION.md."
            exit 1
          fi

      # The credential comes from this repo's CLAUDE_AUTH_ORDER (ai_auth: in
      # bamr87/bamr87 _data/fleet.yml) — a method NAME, never a secret, in the output.
      - name: Choose the Claude credential (ai_auth order)
        id: claude-auth
        uses: ./.github/actions/claude-auth
        with:
          order: ${{ vars.CLAUDE_AUTH_ORDER }}
          has-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude Code evolution pass
        id: evolve
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.claude-auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.claude-auth.outputs.method == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          # DOLLAR CAP: `--max-turns` bounds iterations, not spend — one turn on
          # a large context can outspend thirty small ones. Declared in
          # _data/fleet.yml `budget.call_sites` and repeated here because
          # `claude_args` is a literal; test_ai_budget.py asserts they agree.
          claude_args: "--max-turns 30 --max-budget-usd 10"
          prompt: |
            You are running the hub's self-evolution pass on bamr87/bamr87 — the
            control plane for a fleet of ~35 submodule repos. Read CLAUDE.md first;
            it is authoritative for conventions.

            FOCUS FOR THIS RUN: ${{ inputs.focus }}
            DRY RUN: ${{ inputs.dry_run }}

            Scope, in order of preference:
            1. Read _data/fleet_triage.yml and _data/actions_usage.yml if present —
               they are the fleet's live attention signals.
            2. Make ONE focused, surgical improvement in the hub tree. Hub only:
               everything under projects/ is a separate repo and MUST NOT be
               edited from here (see the submodule workflow in docs/SUBMODULES.md).
            3. Prefer correctness and accuracy fixes over new abstractions. Do not
               add a feature nobody asked for.

            Verify before finishing: `tools/check-drift.sh --report` must stay
            green, and any shell you touch must pass
            `shellcheck --severity=warning`.

            If DRY RUN is true, make NO file changes — write your findings and the
            change you would have made to the job summary instead.

      # Spend on EVERY run, a budget abort FAILS the step (and publishes
      # `budget_hit`), a refused credential and a 429 are each classified —
      # one script, .github/actions/claude-cost, asserted by test_ai_budget.py.
      - name: Report Claude run cost
        id: cost
        if: ${{ !cancelled() }}
        uses: ./.github/actions/claude-cost
        with:
          tier: Hub evolution
          icon: 🧬
          budget-usd: "10"
          outcome: ${{ steps.evolve.outcome }}
      # The raw result record, kept for 14 days. `dash lake sync` reads costs
      # out of run LOGS, which GitHub expires; this is the one call site with no
      # other durable trace, so the JSON itself is retained.
      - name: Upload the Claude result JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 14
          if-no-files-found: ignore

      # `success()` is not enough on its own: a budget abort that exits 0 would
      # publish truncated work as an ordinary pass. The cost step owns that
      # verdict, so publish on success OR on a budget hit — and when it is a
      # budget hit, say so in the body and open it as a draft. Discarding the
      # run instead would throw away work already paid for.
      - name: Open a pull request with the changes
        if: ${{ !cancelled() && !inputs.dry_run && (success() || steps.cost.outputs.budget_hit == 'true') }}
        env:
          BUDGET_HIT: ${{ steps.cost.outputs.budget_hit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Evolution pass produced no changes."
            exit 0
          fi
          BRANCH="ai-evolution/${{ github.run_id }}"
          git config credential.helper '!gh auth git-credential'
          git config user.name "bamr87-bot"
          git config user.email "10567847+bamr87@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(evolve): AI evolution pass" -m "Focus: ${{ inputs.focus }}"
          git push origin "$BRANCH"

          # The body is assembled in a FILE, not as an inline `--body "..."`
          # string: a YAML block scalar keeps the 10-space step indentation on
          # every continuation line, and 4+ leading spaces make Markdown render
          # the paragraph as a code block. The old inline body had that bug
          # (harmless for one line of prose, fatal for a blockquote warning).
          body="${RUNNER_TEMP}/pr-body.md"
          TITLE="chore(evolve): AI evolution pass"
          DRAFT=()
          {
            # A budget abort stops the agent MID-TASK, so this diff is whatever
            # it had done when the ceiling hit — partial by construction, and
            # its own verification step never ran. A reviewer must not have to
            # infer that from the Actions tab.
            if [ "${BUDGET_HIT:-}" = "true" ]; then
              echo "> **⛔ This pass hit its \`--max-budget-usd\` ceiling and was stopped MID-TASK.**"
              echo "> The diff is PARTIAL by construction and the agent's own verification never ran."
              echo "> Spend is in the [run summary](${RUN_URL}); the cap is \`budget.call_sites\` in \`_data/fleet.yml\`."
              echo ""
            fi
            echo "Automated evolution pass (run ${{ github.run_id }})."
            echo ""
            echo "**Focus:** ${{ inputs.focus }}"
            echo ""
            echo "Opened by \`.github/workflows/unified-evolution.yml\`, dispatched via \`tools/dash evolve\`. Review as you would any PR — this branch is machine-authored and nothing here is merged automatically."
          } > "$body"

          if [ "${BUDGET_HIT:-}" = "true" ]; then
            TITLE="chore(evolve): AI evolution pass (BUDGET-TRUNCATED)"
            DRAFT=(--draft)
          fi

          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" "${DRAFT[@]}" \
            --title "$TITLE" --body-file "$body"
