name: 🧭 Reconcile Registry

# Keeps the project registry in sync with GitHub reality.
#
# `drift-check.yml` runs check (g), which DETECTS registry↔GitHub drift — but it
# only warns, only on push/PR, and nothing ever acts on it. That is how two
# deleted repos (jekyll, Dodge-and-Reena-Book) sat in the registry as
# `maintained: true` while every recursive fetch errored on them.
#
# This closes the loop, routing by how trustworthy each signal is:
#
#   renamed / url-mismatch  -> GitHub states these unambiguously, so they are
#                              applied and opened as a PR.
#   404 / branch-drift      -> filed as an issue, NEVER auto-applied. A
#                              repo-scoped token 404s on a private repo exactly
#                              as it does on a deleted one, and this fleet
#                              intentionally tracks non-default branches
#                              (scripts=master, sonic-pi=dev).
#
# Token: the default GITHUB_TOKEN is repo-scoped and 404s on EVERY private repo
# in the fleet — observed live on PR #42, where check (g) reported 11 healthy
# private repos as "not found". FLEET_TOKEN (the fleet PAT) sees them. Without
# it reconcile still behaves: a mass of 404s collapses into a single
# "token-scope" finding rather than a dozen false deletion alarms. The token is
# PROBED (.github/actions/resolve-fleet-token), not picked by presence — a
# present-but-expired FLEET_TOKEN once filed all 42 repos as "could not verify"
# drift (#280) — and the same probed token opens the fix PR, so the PR gets CI
# (a PR pushed with GITHUB_TOKEN arrives with no checks).

on:
  schedule:
    - cron: '7 5 * * *'   # daily 05:07 UTC (_data/fleet.yml schedule.reconcile_registry), before fleet-pulse (05:37)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the authoritative fixes and open a PR'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reconcile-registry
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile registry against GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup/dash-gen

      # Probe, never presence-check (CLAUDE.md standing rule). GITHUB_TOKEN is
      # the unprobed last resort; the blind-token collapse in reconcile.py then
      # turns its 404s into one finding.
      - name: Resolve a working fleet token
        id: token
        uses: ./.github/actions/resolve-fleet-token
        with:
          fleet-token: ${{ secrets.FLEET_TOKEN }}
          default-token: ${{ github.token }}

      # Report-only first, so the routing decision is made from a clean read
      # of the fleet before anything is written.
      - name: Detect drift
        id: detect
        run: |
          python .github/scripts/dash-gen/dash_gen.py reconcile --json > /tmp/reconcile.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("/tmp/reconcile.json"))
          print(f"authoritative={d['authoritative']}")
          print(f"advisory={d['advisory']}")
          PY
          echo "--- findings ---"
          python .github/scripts/dash-gen/dash_gen.py reconcile

      # --- authoritative: apply + PR ------------------------------------
      # The README AUTO span is regenerated in the same change: the drift gate
      # hard-fails a registry edit whose README is stale, and this PR must pass
      # that gate like any other.
      - name: Apply authoritative fixes
        if: steps.detect.outputs.authoritative != '0' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        run: |
          python .github/scripts/dash-gen/dash_gen.py reconcile --apply
          python .github/scripts/dash-gen/dash_gen.py readme

      - name: Create pull request
        if: steps.detect.outputs.authoritative != '0' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          committer: bamr87-bot <10567847+bamr87@users.noreply.github.com>
          author: bamr87-bot <10567847+bamr87@users.noreply.github.com>
          commit-message: "chore(registry): reconcile repo urls with GitHub"
          title: "chore(registry): reconcile repo urls with GitHub"
          body: |
            Automated reconciliation of `_data/projects.yml` + `.gitmodules`
            against GitHub, by `dash-gen reconcile --apply`.

            Only **authoritative** drift is applied here — repository renames
            (GitHub resolves the old slug to a new `full_name`) and internal
            registry↔`.gitmodules` URL mismatches.

            Deletions (404) and branch drift are deliberately **not** touched;
            they are tracked in the companion issue instead.
          # Stable branch so the single open reconcile PR is updated in place
          # rather than a new one opened every night.
          branch: chore/reconcile-registry
          delete-branch: true
          labels: |
            registry
            automated

      # --- advisory: issue, never auto-applied ---------------------------
      # ONE issue, updated in place, closed the night the drift (or the dead
      # token that faked it) is gone — it once sat open indefinitely with a
      # stale list (#280).
      - name: Render the tracking issue
        if: steps.detect.outputs.advisory != '0'
        run: python3 -c 'import json; print(json.load(open("/tmp/reconcile.json"))["issue_body"])' > /tmp/issue_body.md

      - name: File / update tracking issue
        if: steps.detect.outputs.advisory != '0'
        uses: ./.github/actions/utilities/upsert-issue
        with:
          token: ${{ github.token }}
          title: "Registry drift needs review (deleted / branch-drift)"
          body-file: /tmp/issue_body.md
          labels: registry-drift

      - name: Close tracking issue when clean
        if: steps.detect.outcome == 'success' && steps.detect.outputs.advisory == '0'
        uses: ./.github/actions/utilities/upsert-issue
        with:
          token: ${{ github.token }}
          title: "Registry drift needs review (deleted / branch-drift)"
          state: close
          close-comment: "✓ Registry matches GitHub — clean as of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Closing; the next run reopens a fresh issue if drift returns."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Registry reconciliation"
            echo ""
            echo "- auto-fixable (renames, url mismatches): \`${{ steps.detect.outputs.authoritative }}\`"
            echo "- needs a human (404s, branch drift): \`${{ steps.detect.outputs.advisory }}\`"
            echo "- token: \`${{ steps.token.outputs.source }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
