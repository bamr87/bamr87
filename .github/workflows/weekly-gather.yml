# kit: ai-runner v0.2.1 — a caller of the fleet's reusable AI lane.
# Saturday gather: a draft of next week's plan from Friday's carry-over and
# upcoming work. Console loop `weekly_gather` (docs/WEEKLY-CLOSEOUT.md).
name: weekly-gather

on:
  schedule:
    # Saturday 10:17 America/Denver (MST, UTC-7) = 17:17 UTC. Mirrors
    # _data/fleet.yml schedule.weekly_gather (test_weekly_closeout.py).
    - cron: "17 17 * * 6"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional steer for this run (free text)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  lane:
    uses: bamr87/bamr87/.github/workflows/ai-lane.yml@main
    with:
      lane: weekly-gather
      switch: WEEKLY_GATHER_ENABLED
      model: claude-sonnet-5-5
      prompt: "You are the weekly gather agent for bamr87. Follow .github/weekly/gather.md exactly. Focus: ${{ inputs.focus || '(none)' }}. Write the draft week plan to .weekly/gather.md, post it to the week's tracking issue, and STOP. Read-only everywhere else: never merge, close, approve, push, or change settings, variables or secrets."
      tools: "Bash,Read,Write,Grep,Glob"
      max-turns: "60"
      max-budget-usd: "10"
      timeout-minutes: 30
      setup-python: "3.12"
      result-file: .weekly/gather.md
      artifact-path: .weekly/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.FLEET_TOKEN }}
