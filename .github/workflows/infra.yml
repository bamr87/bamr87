# The IaC layer's gate (ADR 0003, docs/PLATFORM.md). OpenTofu checks the
# formatting of infra/, then initialises every root module without a backend
# and validates it: nothing is read from a node and no state exists here.
# CI never holds an SSH key to a fleet node, so `plan` and `apply` stay local
# (`tools/dash infra`); this job only proves the HCL is well-formed. The same
# holds for the Google Cloud modules under infra/gcp/ (ADR 0020): CI holds no
# cloud credential, and the maintainer plans and applies with infra/gcp/deploy.sh.
#
# The Azure deployments under infra/azure/ are Bicep, as the fleet's other Azure
# deployments are (bash-365.com, bashcrawl). The bicep job compiles and lints
# each one; it holds no Azure credential, so nothing is planned or deployed here.
name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive -diff infra
      - name: Initialise and validate each root module
        run: |
          set -euo pipefail
          for dir in infra/*/ infra/*/*/; do
            # A root module is a directory with .tf files: infra/node/, and one level
            # down infra/gcp/<module>/ (infra/azure/ is Bicep and has none).
            compgen -G "${dir}*.tf" >/dev/null || continue
            echo "::group::${dir}"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The runner's az CLI fetches the newest Bicep CLI on first use.
      - name: Build and lint each Bicep deployment
        run: |
          set -euo pipefail
          for file in infra/azure/*/main.bicep; do
            echo "::group::${file}"
            az bicep build --file "$file" --stdout >/dev/null
            az bicep lint --file "$file" --diagnostics-format sarif >/dev/null
            echo "::endgroup::"
          done
      - name: Parameter files name only parameters the template declares
        run: |
          set -euo pipefail
          for file in infra/azure/*/main.bicep; do
            dir="$(dirname "$file")"
            az bicep build --file "$file" --stdout | jq -r '.parameters | keys[]' | sort > /tmp/declared
            jq -r '.parameters | keys[]' "$dir/parameters.json" | sort > /tmp/given
            extra="$(comm -13 /tmp/declared /tmp/given)"
            [ -z "$extra" ] || { echo "::error file=$dir/parameters.json::not declared by main.bicep: $extra"; exit 1; }
          done
