
# Seeded by the bamr87 hub (tools/fanout.sh --kit prose). Enforces the house
# rule "one paragraph per line" in markdown — and on a pull request it FIXES
# the file rather than just failing: the job unwraps any soft-wrapped prose and
# pushes the repair back to the PR branch, so no human round-trip is ever spent
# on whitespace. This is the Liquid-safe surgical unwrapper — it only joins
# wrapped prose and leaves Liquid/HTML/tables/code/front-matter untouched.
#
# The repair is pushed with GITHUB_TOKEN deliberately: GitHub fires no workflow
# events for refs pushed with it, so self-healing costs ZERO extra CI runs (the
# job that pushes the fix is the same job that then reports success). The fleet
# runs no required status checks, so the new head SHA carrying no check runs
# cannot strand the PR; if a repo ever adopts them, push with a PAT instead.
#
# It cannot self-heal two cases, which still fail with the fix instructions:
# a fork PR (read-only token) and a direct push to the default branch (never
# end a workflow in a bare push to a protected branch — a house rule).
#
# Fix locally:  python3 tools/unwrap-prose.py --write
# Or never think about it again: run tools/install-prose-hook.sh from the
# bamr87 hub once, and a global git pre-commit hook fixes it in every repo.
name: markdown-oneline

# No workflow-level `paths:` filter (bamr87/bamr87#952): GitHub never starts a
# path-filtered workflow when nothing matches, so `oneline` would never report
# and a ruleset that requires it would hold the PR on "Waiting for status to
# be reported". The job always starts; its first step reads the changed files
# from the API and the rest run only when markdown changed, so `oneline` reports
# success either way at the cost of one ~5 s API step.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: markdown-oneline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oneline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # the PR repair pushes back to its own branch
      pull-requests: read   # the changed-file list (#952)
    steps:
      - name: Did this change touch markdown?
        id: changes
        # Values reach the script through env:, never interpolated into it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PATTERN: '\.(md|markdown)$|^tools/unwrap-prose\.py$|^\.github/workflows/markdown-oneline\.yml$'
        run: |
          # Any doubt (a new branch, an API error, a compare over 300 files)
          # means "check": a false run costs seconds, a false skip lets prose through.
          files=ALL
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=ALL
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
              --jq 'if (.files | length) >= 300 then "ALL" else .files[].filename end') || files=ALL
          fi
          if [ "$files" = ALL ] || grep -qE "$PATTERN" <<<"$files"; then
            echo "markdown=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No markdown changed; oneline reports success without checking."
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.markdown == 'true'
        with:
          # Check out the PR's head COMMIT, not the merge commit, so the repair
          # can be committed onto it and pushed back. By SHA, not branch name:
          # a PR merged seconds after its last push (jev-numbering) has its
          # branch auto-deleted before this job starts, and fetching the gone
          # branch failed checkout after ~35s of retries. The SHA stays
          # reachable through refs/pull/N/head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.markdown == 'true'
        with:
          python-version: "3.x"
      - name: Unwrap soft-wrapped prose
        id: fix
        if: steps.changes.outputs.markdown == 'true'
        run: |
          python3 tools/unwrap-prose.py --write \
            --exclude '(^|/)SCHEMA\.md$' --exclude '(^|/)CHANGELOG\.md$' \
            --exclude '^\.claude/skills/archify/' --exclude '^\.agents/skills/archify/'
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Unwrapped:"; git diff --name-only | sed 's/^/  /'
          fi
      - name: Push the repair back to the pull request
        if: >-
          steps.fix.outputs.changed == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        # The branch name reaches the script through the environment, never
        # interpolated into it: a branch is attacker-controllable text.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A deleted branch means the PR already merged: pushing would
          # resurrect it. The push-to-main run reports the prose instead.
          if ! git ls-remote --exit-code --heads origin "refs/heads/$HEAD_REF" >/dev/null; then
            echo "::notice::Branch $HEAD_REF is gone (PR merged or closed); not recreating it."
            exit 0
          fi
          git commit -a -m "style: unwrap soft-wrapped markdown prose"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::Unwrapped markdown prose and pushed the fix to this PR."
      - name: Cannot self-heal here — report instead
        if: >-
          steps.fix.outputs.changed == 'true'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Wrapped markdown prose found, and this run cannot push the fix (fork PR, or a push to the default branch). Run: python3 tools/unwrap-prose.py --write"
          exit 1
