name: Conformance

# The hub practices what it seeds: this is the same thin caller the
# `conformance` fan-out artifact drops into member repos
# (templates/conformance/conformance.yml), except that it references the
# reusable workflow and the checker from THIS checkout — so a PR that changes
# the spec, the checker, or fleet-conformance.yml is validated by running it,
# before it can reach `main` and the fleet. Advisory (gate: false): the hub is
# a `site`-kind repo that is also the control plane, and its own MUST gaps are
# listed in specs/CONFORMANCE.md.
#
# Path-filtered to exactly that purpose: it is the reusable gate's pre-flight,
# not a per-PR check on the hub's own tree (which `dash spec fleet --write`
# snapshots into _data/conformance.yml). It used to run on every PR and push
# and was never read — ~50 runs a fortnight. PR-only: with gate: false a
# post-merge run cannot fail, so it only repeated the PR's run. The member-repo
# caller stays unfiltered: there the repo's own conformance is the point.

on:
  pull_request:
    paths:
      - "specs/**"
      - "_data/specs.yml"
      - "tools/conformance.py"
      - "tools/gen-specs-data.py"
      - "templates/conformance/**"
      - ".github/workflows/fleet-conformance.yml"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: ./.github/workflows/fleet-conformance.yml
    with:
      kinds: site
      tier: active
      gate: false
      hub-ref: ${{ github.event.pull_request.head.sha || github.sha }}
