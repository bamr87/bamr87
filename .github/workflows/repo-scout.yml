name: 🔭 Repo Scout

# The daily PROACTIVE *issue* loop. Sibling of repo-evolution (which writes
# code — a weekly draft PR in opted-in repos): this one writes TICKETS. Every
# day it visits a small sample of the fleet's repositories, has an agent read
# each one the way a new maintainer would, and files a few well-formed issues
# there — fixes, updates, features — for the issue pipeline (issue-pipeline.yml:
# intake → implement → complete) to turn into draft pull requests.
#
#   plan   DETERMINISTIC. `dash-gen scout` selects today's sample (a fixed
#          rotation over every owned, non-archived, non-opted-out registry
#          repo), skips any that still carries `max_open_per_repo` open scout
#          issues, and writes each survivor a BRIEF from the registry, the
#          fleet's signals (_data/fleet_triage.yml, _data/conformance.yml) and
#          the repo's live open-issue list. No AI, no judgement calls.
#   scout  One matrix job per repo. Checks the repo out with NO persisted
#          credentials, hands a Claude Code agent the brief, and keeps the one
#          file it writes — `.scout/proposals.json` — as an artifact. The agent
#          never files, edits, commits, or pushes anything: it has no write
#          credential and a read-only allowlist.
#   file   Back on the hub. `dash-gen scout-file` validates every proposal,
#          dedupes it against the repo's open issues, caps the batch, creates
#          the labels, and files the issues with FLEET_TOKEN, the loop's marker
#          as the first line of every body. Dry runs file nothing.
#
# WHY A NEW LOOP, AND WHY IT IS ALLOWED ON A SCHEDULE
# ---------------------------------------------------
# The issue pipeline only ever acts on what someone filed; repo-evolution is
# opt-in and weekly, and writes code nobody asked for. Between them was a gap:
# nothing walked the fleet looking for the next thing worth doing. This loop
# fills it, bounded the way the other scheduled agents are: the target set is
# the registry, the sample and caps live in _data/fleet.yml, open scout issues
# are the backpressure, the agent cannot write to GitHub, and every issue it
# produces still has to pass the pipeline's intake before an implementer runs.
#
# TOKENS (full contract in _data/fleet.yml)
#   FLEET_TOKEN  REQUIRED. Cross-repo checkout (private targets) and the
#                issue + label writes in `file`. Probed with `gh api user`,
#                never merely presence-checked, BEFORE any Claude spend.
#   CLAUDE_CODE_OAUTH_TOKEN  preferred Claude auth; ANTHROPIC_API_KEY fallback,
#                in the order the repo's CLAUDE_AUTH_ORDER names.
#
# Docs: docs/SCOUT.md · brief template: .github/scout/ · agent step spec (the
# hard-rules prompt, allowlist, caps by reference to _data/fleet.yml):
# tools/jev/steps/repo-scout/ (docs/adr/0002) · tests:
# .github/scripts/dash-gen/test_scout.py (asserts this file against
# _data/fleet.yml: cron, kill switch, wiring, allowlist, budget, no writes),
# tools/test_jev_spec.py and `python3 -m tools.jev steps check` (the spec
# against this file and _data/fleet.yml, and the rendered prompt's bytes).

on:
  schedule:
    - cron: '37 4 * * *' # daily 04:37 UTC — before fleet-pulse (05:37) snapshots the issues it
                         # files and issue-pipeline (07:37) intakes them, so the chain closes same-day
  workflow_dispatch:
    inputs:
      target:
        description: "Registry name of one repo (bypasses the rotation), or 'all' for today's sample"
        type: string
        default: all
      focus:
        description: "Optional steer for this run (free text, quoted into every brief)"
        type: string
        default: ""
      dry_run:
        description: "Run the agent and report what it would file, but file nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repo-scout
  cancel-in-progress: false

jobs:
  # ========================================================================= #
  # 1. PLAN — deterministic: select, rotate, backpressure, brief.
  # ========================================================================= #
  plan:
    name: Plan today's sample & briefs
    # Kill switch (house convention, fleet.yml harnesses:). A NEW loop starts
    # OFF: a scheduled firing is a no-op until the repo variable
    # REPO_SCOUT_ENABLED is set to 'true'. A manual dispatch always runs, so the
    # loop can be exercised before it is armed. (repo-evolution is the inverse,
    # default-ON, because its switch was added to a loop already in service.)
    if: ${{ github.event_name != 'schedule' || vars.REPO_SCOUT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      model: ${{ steps.plan.outputs.model }}
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      FLEET_WRITE_TOKEN: ${{ secrets.FLEET_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup/dash-gen

      - name: Require Claude auth
        if: ${{ env.HAS_CLAUDE_AUTH != 'true' }}
        run: |
          echo "::error::No Claude auth. Set CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY. See docs/AI-INTEGRATION.md."
          exit 1

      # A secret can be SET and still be dead. Probe it for real, and stop here
      # if it fails: the file job needs it, so a bad token would spend the
      # Claude budget and then throw every proposal away.
      - name: Probe fleet write token
        run: |
          if [ -z "${FLEET_WRITE_TOKEN}" ]; then
            echo "::error::FLEET_TOKEN is required — a fine-grained PAT with issues write on the fleet repos (see _data/fleet.yml). Nothing can be filed without it."
            exit 1
          fi
          if ! login="$(GH_TOKEN="${FLEET_WRITE_TOKEN}" gh api user --jq .login 2>/dev/null)"; then
            echo "::error::FLEET_TOKEN is set but rejected by the API (expired or revoked). Rotate it — see docs/TOKEN-ROTATION.md."
            exit 1
          fi
          echo "Fleet write token OK (acts as ${login})."

      # Inputs travel through the environment, never inline in the script:
      # `focus` is free text typed by whoever dispatched the run.
      - name: Build the plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
          TARGET: ${{ inputs.target || 'all' }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          args=(scout --target "$TARGET" --out-dir scout-workorders)
          [ -n "$FOCUS" ] && args+=(--focus "$FOCUS")
          tools/dash-gen "${args[@]}" > plan.json
          # Every leg carries the agent prompt dash-gen rendered from the hub's
          # tools/jev/steps/repo-scout/ spec at this commit. An empty prompt
          # makes the agent action skip silently and green, so stop here,
          # before any spend. An empty or disabled plan has no legs and passes.
          jq -e '.include | all((.prompt | type) == "string" and (.prompt | length) > 0)' plan.json > /dev/null \
            || { echo "::error::plan.json has a leg without a rendered prompt (tools/jev/steps/README.md)"; exit 1; }
          {
            echo "matrix=$(jq -c '{include: .include}' plan.json)"
            echo "count=$(jq -r '.count' plan.json)"
            echo "max_parallel=$(jq -r '.max_parallel // 2' plan.json)"
            echo "model=$(jq -r '.model // "claude-sonnet-5-5"' plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Show the plan
        if: always()
        run: |
          [ -f plan.json ] || exit 0
          {
            echo "### 🔭 Repo scout — plan for $(jq -r '.day' plan.json)"
            echo ""
            echo "| Target | Upstream | Branch | Category | Open issues | Scout issues open |"
            echo "| --- | --- | --- | --- | ---: | ---: |"
            jq -r '.include[] | "| \(.name) | \(.nwo) | `\(.branch)` | \(.category) | \(.open_issues // "?") | \(.scout_open // "?") |"' plan.json
            echo ""
            echo "- Sample \`$(jq -r .sample plan.json)\` of \`$(jq -r .eligible plan.json)\` eligible repos — every repo is visited about every \`$(jq -r .cycle_days plan.json)\` day(s)."
            if [ "$(jq -r '.skipped | length' plan.json)" != "0" ]; then
              echo "**Skipped (backpressure — earlier proposals still open):**"
              jq -r '.skipped[] | "- \(.name): \(.reason)"' plan.json
              echo ""
            fi
            if [ "$(jq -r '.dropped | length' plan.json)" != "0" ]; then
              echo "<details><summary>Not eligible ($(jq -r '.dropped | length' plan.json))</summary>"
              echo ""
              jq -r '.dropped[] | "- \(.name): \(.reason)"' plan.json
              echo ""
              echo "</details>"
            fi
            focus="$(jq -r '.focus' plan.json)"
            [ -n "$focus" ] && echo "**Focus:** ${focus}"
            echo ""
            echo "- Caps: \`max_issues_per_repo=$(jq -r .max_issues_per_repo plan.json)\`, \`max_parallel=$(jq -r .max_parallel plan.json)\`, \`max_turns=$(jq -r .max_turns plan.json)\`, model \`$(jq -r .model plan.json)\` (from \`_data/fleet.yml\` → \`scout:\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload briefs
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: scout-workorders
          path: scout-workorders/
          retention-days: 14
          if-no-files-found: error

  # ========================================================================= #
  # 2. SCOUT — one job per repo. Reads, proposes, writes ONE file.
  # ========================================================================= #
  scout:
    name: 🔭 ${{ matrix.name }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write         # OIDC for claude-code-action OAuth
    strategy:
      fail-fast: false        # one repo's failure must not strand the rest
      max-parallel: ${{ fromJson(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      NAME: ${{ matrix.name }}
      NWO: ${{ matrix.nwo }}
      BRIEF: .scout/${{ matrix.brief }}
    steps:
      # The target repo IS the workspace. persist-credentials:false is the
      # structural half of "the agent never pushes": there is no credential in
      # the tree for it to use, and no later step of THIS job writes anywhere.
      - name: Checkout ${{ matrix.nwo }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.nwo }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.FLEET_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # The brief lands inside the checkout (so the Read tool needs no extra
      # permissions) but is excluded from git; the proposals file goes beside it.
      - name: Download the brief
        uses: actions/download-artifact@v8
        with:
          name: scout-workorders
          path: .scout
      # The workspace IS the target repo, so the hub's composite actions come
      # from a sparse checkout of THIS commit — the same version as this
      # workflow, never a floating tag — hidden from git with the brief.
      - name: Checkout the hub's actions
        uses: actions/checkout@v7
        with:
          repository: bamr87/bamr87
          ref: ${{ github.sha }}
          path: .fleet-hub
          persist-credentials: false
          sparse-checkout: .github/actions
      - name: Hide the brief and the hub checkout from git
        run: mkdir -p .git/info && printf '/.scout/\n/.fleet-hub/\n' >> .git/info/exclude

      # The credential comes from this repo's CLAUDE_AUTH_ORDER (ai_auth: in
      # bamr87/bamr87 _data/fleet.yml) — a method NAME, never a secret, in the output.
      - name: Choose the Claude credential (ai_auth order)
        id: claude-auth
        uses: ./.fleet-hub/.github/actions/claude-auth
        with:
          order: ${{ vars.CLAUDE_AUTH_ORDER }}
          has-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      # NO GitHub token in this step's env. The agent reads text anyone can
      # write (open issue titles, the repository), and its allowlist runs
      # interpreters (python3, node, npm) that can read any variable — so a
      # FLEET_TOKEN here would be one prompt injection from a fleet-wide write
      # credential. The open issues it needs are already in the brief (the plan
      # job lists them), and the filer dedupes against the live list. The
      # action's own OIDC App token still reaches the agent's subprocesses: a
      # declared exception in the step spec (workspace.exceptions, ADR 0002).
      - name: Scout
        id: scout
        # continue-on-error: the cost step below owns this job's verdict
        # (`usage-limit: skip`) — a spent subscription window is a warning,
        # every other failure still fails the job. test_ai_budget.py pairs them.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        # The step spec pair's content hash (tools/jev/steps/repo-scout/: scout.yml,
        # NUL, scout.prompt.txt). A no-op at run time; `tools.jev steps check`
        # requires it to equal the spec, so changing the hard rules also changes
        # this workflow file — which GITHUB_TOKEN and the Claude App cannot push
        # (docs/adr/0002, governance trade-off).
        env:
          JEV_STEP_SHA256: c9b10c5ce1a22215bd75735d4be02a38db704a4f3f2f47c78c7fd45531465683
        with:
          claude_code_oauth_token: ${{ steps.claude-auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.claude-auth.outputs.method == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          # BUDGET: one repo per job, so both caps are per repo. The turn cap is
          # the LITERAL of _data/fleet.yml scout.max_turns (test_scout.py asserts
          # they agree) and the dollar ceiling is budget.call_sites — a
          # `claude_args` string cannot read YAML. The step spec
          # tools/jev/steps/repo-scout/scout.yml references the same keys and
          # carries the allowlist; `tools.jev steps check` holds all of them
          # equal. `--max-turns` bounds iterations, not spend; the dollar cap
          # is the real ceiling.
          #
          # ALLOWLIST: read + run-to-verify only, plus Write for the one file
          # the agent produces. No Edit, no `git push`, no `git checkout`, no
          # `gh` at all — filing is the workflow's job, not the agent's.
          claude_args: >-
            --model ${{ needs.plan.outputs.model }}
            --max-turns 40
            --max-budget-usd 8
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git blame:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(sed:*),Bash(awk:*),Bash(cut:*),Bash(sort:*),Bash(uniq:*),Bash(tr:*),Bash(jq:*),Bash(diff:*),Bash(echo:*),Bash(mkdir:*),Bash(cd:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(python:*),Bash(pip:*),Bash(pytest:*),Bash(bundle:*),Bash(ruby:*),Bash(gem:*),Bash(go:*),Bash(cargo:*),Bash(make:*),Bash(shellcheck:*),Read,Grep,Glob,Write"
          # PROMPT: the hard rules (propose-only, the lanes) are the JEV step
          # spec tools/jev/steps/repo-scout/scout.prompt.txt. The plan job
          # renders it per leg from THIS commit's hub checkout (dash-gen scout →
          # tools/jev/spec.py) and the matrix carries the exact bytes, so the
          # target repo's workspace can never supply or alter it.
          # tools/test_jev_spec.py pins the render to the inline prompt it replaced.
          prompt: ${{ matrix.prompt }}

      # Spend on EVERY run, a budget abort FAILS the step (and publishes
      # `budget_hit`), a refused credential and a 429 are each classified —
      # one script, .github/actions/claude-cost, asserted by test_ai_budget.py.
      - name: Report Claude run cost
        id: cost
        if: ${{ !cancelled() && env.HAS_CLAUDE_AUTH == 'true' }}
        uses: ./.fleet-hub/.github/actions/claude-cost
        with:
          tier: Repo scout — ${{ matrix.name }}
          icon: 🔭
          budget-usd: "8"
          outcome: ${{ steps.scout.outcome }}
          usage-limit: skip

      # The agent must leave tracked files alone. If it did not, the tree is
      # discarded here (nothing of this job is ever pushed anyway) and the run
      # says so — a scout that edits is a scout whose prompt needs fixing.
      - name: Verify the tree is untouched
        if: ${{ !cancelled() }}
        run: |
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "::warning::${NAME}: the scout modified tracked files (discarded — the scout proposes, it never edits):"
            echo "$changed"
            git checkout -- .
          fi

      # Whatever the agent wrote — or nothing — travels to the file job as an
      # artifact. An absent file is a valid "nothing to propose".
      - name: Upload proposals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: scout-proposals-${{ matrix.name }}
          path: .scout/proposals.json
          retention-days: 14
          if-no-files-found: ignore

  # ========================================================================= #
  # 3. FILE — back on the hub: validate, dedupe, cap, label, file.
  # ========================================================================= #
  file:
    name: File the proposals
    needs: [plan, scout]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup/dash-gen

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: scout-workorders
          path: scout-workorders
      - name: Download the proposals
        uses: actions/download-artifact@v8
        with:
          pattern: scout-proposals-*
          path: proposals

      # The ONLY GitHub-writing step in the loop. Issues go to the repo the
      # plan named for each leg (never to the hub), labels are created on
      # demand from the pipeline's catalogue, and a dry run files nothing.
      - name: File the issues
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          plan=scout-workorders/plan.json
          apply=(--apply); [ "$DRY_RUN" = "true" ] && apply=()
          : > results.jsonl
          for dir in proposals/scout-proposals-*/; do
            [ -d "$dir" ] || continue
            name="${dir#proposals/scout-proposals-}"; name="${name%/}"
            nwo="$(jq -r --arg n "$name" '.include[] | select(.name == $n) | .nwo' "$plan")"
            if [ -z "$nwo" ]; then
              echo "::warning::proposals for '${name}' have no matching plan entry — not filed"
              continue
            fi
            echo "::group::${nwo}"
            tools/dash-gen scout-file --nwo "$nwo" --proposals "${dir}proposals.json" --run-url "$RUN_URL" "${apply[@]}" \
              | jq -c --arg name "$name" '. + {name: $name}' >> results.jsonl
            echo "::endgroup::"
          done
          {
            echo "### 🔭 Repo scout — $([ "$DRY_RUN" = "true" ] && echo 'DRY RUN (nothing filed)' || echo 'issues filed')"
            echo ""
            echo "| Repo | Filed | Skipped | Rejected | Issues |"
            echo "| --- | ---: | ---: | ---: | --- |"
            jq -r '"| \(.name) (\(.nwo)) | \(.filed | length) | \(.skipped | length) | \(.rejected | length) | \([.filed[] | (.url // .title)] | join("<br>")) |"' results.jsonl
            echo ""
            if jq -e '(.skipped + .rejected) | length > 0' results.jsonl >/dev/null 2>&1; then
              echo "<details><summary>Skipped and rejected proposals</summary>"
              echo ""
              jq -r '.name as $n | (.skipped + .rejected)[] | "- \($n): \(.title) — \(.reason)"' results.jsonl
              echo ""
              echo "</details>"
            fi
            if jq -e '.notes != ""' results.jsonl >/dev/null 2>&1; then
              echo "<details><summary>Agent notes</summary>"
              echo ""
              jq -r 'select(.notes != "") | "**\(.name):** \(.notes)"' results.jsonl
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "Every filed issue carries \`$(jq -r '.label' "$plan")\` and enters the issue pipeline at intake (docs/ISSUE-PIPELINE.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          # A leg whose proposals exist but could not be matched or filed is a
          # failure worth seeing; an empty day is not.
          if jq -e 'select(.apply == true) | .skipped[] | select(.reason == "gh issue create failed")' results.jsonl >/dev/null 2>&1; then
            echo "::error::at least one issue could not be filed — see the groups above"
            exit 1
          fi
