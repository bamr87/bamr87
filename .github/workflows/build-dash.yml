name: 🛰️ Build & Deploy Dash

# Builds the PUBLIC site — https://bamr87.github.io/bamr87/ — which is the
# Harness Console's own page (tools/console/web, React + Mantine) built static:
# the portfolio and profile pages plus every console view, reading a snapshot
# of the API documents that tools/console/snapshot.py renders with the SAME
# Python the console runs (docs/CONSOLE-PAGES.md). Live monitoring data is
# regenerated at build time so the boards stay fresh without commits.
# Replaced the Jekyll (zer0-mistakes remote theme) site in 2026-10.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '_data/**'
      - 'tools/console/**'
      - 'tools/fleetcore/**'
      - 'README.md'
      - '.github/scripts/dash-gen/**'
      - '.github/actions/setup/dash-gen/**'
      - '.github/workflows/build-dash.yml'
  # Build (never deploy) on PRs touching the same paths. Without this the site
  # build was verified only AFTER merge, so a broken page reached main before
  # anything noticed — the same shape as the failure that froze the fleet's data
  # for three weeks. The drift gate covers the registry, not the page or the
  # snapshot exporter.
  #
  # The list is duplicated rather than shared via a YAML anchor: anchors are
  # valid YAML and actionlint accepts them, but GitHub Actions' own workflow
  # parser does not support them, so the anchor version parses clean locally and
  # fails on GitHub. Keep the two lists in sync by hand.
  pull_request:
    paths:
      - 'pages/**'
      - '_data/**'
      - 'tools/console/**'
      - 'tools/fleetcore/**'
      - 'README.md'
      - '.github/scripts/dash-gen/**'
      - '.github/actions/setup/dash-gen/**'
      - '.github/workflows/build-dash.yml'
  schedule:
    # Daily, AFTER the last generated-data push of the morning (fleet-pulse
    # 05:37, issue-pipeline 07:37). Those commits carry `[skip ci]` so they wake
    # no workflow — this run is what republishes them, exactly once a day. It
    # was every 6h, then 06:37 (which missed the issue-pipeline snapshot by an
    # hour and was then re-run by the data push itself); the Monitor board's
    # live signals are regenerated here at build time either way.
    - cron: '37 8 * * *'  # daily 08:37 UTC (_data/fleet.yml schedule.build_dash)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup/dash-gen

      - name: Generate monitoring data (ephemeral)
        run: python .github/scripts/dash-gen/dash_gen.py health || echo "health gen degraded; continuing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          # Not vars.NODE_VERSION: the fleet's canonical value (20) is below
          # what React Router 8 requires — the same choice as console-web.yml.
          node-version: lts/*

      # The page (base /bamr87/, VITE_STATIC=1) and the snapshot beside it:
      # every API document, a page per route, 404.html, sitemap, feed.
      - name: Build site
        run: tools/console/build-pages.sh
        env:
          OUT: ${{ github.workspace }}/_site

      - name: The bundle carries no inline script (the page's CSP is script-src 'self')
        run: |
          if grep -Eq '<script>|<script [^>]*>[^<]+</script>' _site/index.html; then
            echo "::error file=tools/console/web/index.html::inline script in the built page — its CSP would block it"
            exit 1
          fi

      # Agents should not have to drive the app. Project the same registries into
      # stable JSON under _site/api/v1/ (+ llms.txt) beside it so Pages serves
      # them as static files. Degraded endpoints still emit valid JSON.
      - name: Emit machine API (agent JSON + llms.txt)
        run: python .github/scripts/dash-gen/dash_gen.py machine-api --out _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # PRs verify the build and stop there. Deploying from a PR would publish
    # unreviewed content to the live dash.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
