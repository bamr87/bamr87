name: 🐍 Python Tests

# EVERY Python fixture test the hub carries: the control plane's generators
# (.github/scripts/dash-gen/test_*.py — the computational sensors for every
# deterministic planner the loops act on: budget caps, remediation guards,
# harness scorecard, schedule), tools/test_*.py (docker harmonize/view, features
# index, fleet config, terminal-dash data layer), the Harness Console
# (tools/console/test_*.py), the terminal dash (tools/tui/test_*.py; textual
# comes in through the console requirements) and every kit's own test
# (templates/*/test_*.py).
# Each file is a standalone script that exits non-zero on failure (no pytest).
# A file with no `__main__` runner exits 0 having run nothing — that is a
# failure here, not a pass.
#
# The console requirements are installed (not just PyYAML) so the tests that
# self-skip without fastapi / ruamel.yaml (the DNS-rebinding TestClient check,
# the round-trip YAML edits) actually run here; they pull in dash-gen's too.
#
# Kept as its own workflow, separate from drift-check.yml (the gate), so a
# test edit and a gate edit never collide.
#
# SHARDS
# ------
# One serial job took 21 minutes against a 25-minute timeout, so the files run as
# four parallel jobs: three files were 72% of that time. `rest` is the glob minus
# the named files, so a new test file can never be left out, and renaming a named
# file fails its shard instead of dropping it. Re-balance by moving a name.
#
# The `python-tests` job is the one result: it combines coverage and fails unless
# every shard passed. It keeps this workflow's check name, which the ratify guard
# reads with every other check on a commit (tools/jev/ratify.py).
#
# Triggers: every PR, every push to main, and nightly. The console's
# dependencies float (UPS-QA-40: always-latest, no pins, no lockfiles — the
# hub-only lockfile exception in specs/QUALITY.contract.yml covers only a
# reusable workflow's runtime under .github/, which tools/console is not), so
# an upstream release can break main with no PR in flight: the httpx→httpx2
# move silently disabled the DNS-rebinding test that way. The push and nightly
# runs are the sensor for that drift, and every run records the exact versions
# it resolved (job summary + `python-deps-resolved` artifact) so a red night
# can be diffed against the last green one. Nightly at 09:17 UTC is declared in
# _data/fleet.yml `schedule.python_tests` (test_schedule.py holds them equal).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'  # nightly 09:17 UTC (_data/fleet.yml schedule.python_tests)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The slowest shard takes about 7 minutes; this still stops a hung test.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [pages, jev-loop, console, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml coverage jsonschema -r tools/console/requirements.txt

      # Always-latest means every run may resolve different versions. Record
      # them (not a lockfile: nothing reads this back) so a drift break is a diff.
      - name: Record resolved dependency versions
        if: ${{ matrix.shard == 'rest' }}
        run: |
          pip freeze --all | sort > python-deps-resolved.txt
          {
            echo "<details><summary>Resolved Python dependencies ($(wc -l < python-deps-resolved.txt))</summary>"
            echo; echo '```'; cat python-deps-resolved.txt; echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.shard == 'rest' }}
        with:
          name: python-deps-resolved
          path: python-deps-resolved.txt
          retention-days: 30

      - name: Run this shard's test files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          shopt -s nullglob
          all=(.github/scripts/dash-gen/test_*.py tools/test_*.py tools/console/test_*.py tools/tui/test_*.py templates/*/test_*.py)
          [ "${#all[@]}" -gt 0 ] || { echo "::error::no test files found"; exit 1; }
          named=(tools/console/test_pages.py tools/test_jev_loop.py tools/console/test_console.py tools/test_jev_spec.py)
          files=()
          case "$SHARD" in
            pages)    files=(tools/console/test_pages.py) ;;
            jev-loop) files=(tools/test_jev_loop.py) ;;
            console)  files=(tools/console/test_console.py tools/test_jev_spec.py) ;;
            rest)
              for t in "${all[@]}"; do
                case " ${named[*]} " in *" $t "*) ;; *) files+=("$t") ;; esac
              done ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          [ "${#files[@]}" -gt 0 ] || { echo "::error::shard $SHARD has no test files"; exit 1; }
          failed=()
          for t in "${files[@]}"; do
            if [ ! -f "$t" ]; then
              echo "::error::$t is named in this workflow but does not exist; update the shard list"
              failed+=("$t"); continue
            fi
            if ! grep -q "__main__" "$t"; then
              echo "::error file=$t::$t has no __main__ runner; python3 would exit 0 without running it"
              failed+=("$t"); continue
            fi
            echo "::group::$t"
            if python -m coverage run -p --source=tools/console,tools/fleetcore "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#files[@]} test files in the $SHARD shard passed."

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  python-tests:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Advisory: coverage of the console and fleetcore, one table in the job
      # summary. Never gates — the last step does.
      - uses: actions/checkout@v7
        continue-on-error: true

      - uses: actions/setup-python@v7
        continue-on-error: true
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage summary (console + fleetcore)
        continue-on-error: true
        run: |
          python -m pip install --quiet coverage
          python -m coverage combine -q
          {
            echo "### Coverage — tools/console + tools/fleetcore"
            python -m coverage report --format=markdown --omit='*/test_*.py' --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --omit='*/test_*.py' --sort=cover

      - name: Every shard passed
        env:
          TESTS: ${{ needs.tests.result }}
        run: |
          if [ "$TESTS" != success ]; then echo "::error::the test shards ended $TESTS"; exit 1; fi
          echo "Every shard passed."
