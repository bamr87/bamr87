name: 🐍 Python Tests

# The hub's own Python fixture tests: tools/test_*.py (docker harmonize/view,
# features index, fleet config, terminal-dash data layer), the Harness Console
# (tools/console/test_*.py) and the issue-autopilot kit
# (templates/issue-autopilot/test_*.py). Each file is a standalone script that
# exits non-zero on failure (no pytest), and they were previously reachable only
# through tools/run-all-tests.sh on a laptop, so nothing gated a PR on them.
#
# The console requirements are installed (not just PyYAML) so the tests that
# self-skip without fastapi / ruamel.yaml (the DNS-rebinding TestClient check,
# the round-trip YAML edits) actually run here.
#
# Kept as its own workflow, separate from drift-check.yml, so it does not
# collide with edits to that gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml -r tools/console/requirements.txt

      - name: Run tools/, tools/console and templates/issue-autopilot tests
        run: |
          shopt -s nullglob
          files=(tools/test_*.py tools/console/test_*.py templates/issue-autopilot/test_*.py)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no test files found"; exit 1; }
          failed=()
          for t in "${files[@]}"; do
            echo "::group::$t"
            if python "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#files[@]} test files passed."
