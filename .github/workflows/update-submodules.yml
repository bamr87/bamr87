name: 🔀 Update Submodules

# Requires FLEET_TOKEN (see _data/fleet.yml) for two reasons:
#   - GITHUB_TOKEN 404s on the fleet's private submodules, so a recursive
#     checkout with it dies before the update step ever runs.
#   - A PR opened with GITHUB_TOKEN fires no workflow events, so the required
#     drift gate never runs and the PR is unmergeable on protected main.
# Both call sites fall back to GITHUB_TOKEN (degraded: public repos only).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Submodule path to update. Leave blank to update all.'
        required: false
        type: string
      base_branch:
        description: 'Base branch for the update pull request.'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    name: Update submodule pointers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      # submodules: false — a recursive checkout hard-fails the whole job when
      # one submodule repo is private-to-the-token or gone (renamed/deleted).
      # The update step below inits each submodule itself and degrades those
      # to per-path warnings instead.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        uses: ./.github/actions/setup/configure-git
        with:
          github-token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update submodules
        id: update
        shell: bash
        # The dispatch input reaches the script through env, never through `${{ }}`
        # interpolation: expanding it inline splices attacker-chosen text into the
        # shell source before bash ever parses it.
        env:
          REQUESTED_SUBMODULE: ${{ inputs.submodule }}
        run: |
          set -euo pipefail

          requested_submodule="${REQUESTED_SUBMODULE:-}"

          if [[ ! -f .gitmodules ]]; then
            echo "No .gitmodules file found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          update_submodule() {
            local submodule_path="$1"

            if grep -qE "^[[:space:]]*path[[:space:]]*=[[:space:]]*${submodule_path}$" .gitmodules; then
              echo "Updating submodule: ${submodule_path}"
              git submodule update --init --recursive --remote --merge "${submodule_path}" || {
                echo "::warning::Failed to update ${submodule_path}"
              }
            else
              echo "::warning::Submodule ${submodule_path} not found in .gitmodules"
            fi
          }

          if [[ -n "${requested_submodule}" ]]; then
            update_submodule "${requested_submodule}"
          else
            while IFS= read -r submodule_path; do
              update_submodule "${submodule_path}"
            done < <(git config --file .gitmodules --get-regexp path | awk '{ print $2 }')
          fi

          # Stage ONLY submodule pointer changes — never stray root-tree edits.
          # A path whose repo was unreachable is still an empty dir here; adding
          # it is a no-op, but don't let one bad path abort the loop.
          git config --file .gitmodules --get-regexp path | awk '{ print $2 }' \
            | while IFS= read -r p; do git add -- "$p" || echo "::warning::could not stage ${p}"; done

          # STABLE branch name — see the "Create pull request" step. Targeted
          # dispatches get their own branch so a `--submodule projects/foo` run
          # never fights the scheduled all-submodules PR for the same ref.
          if [[ -n "${requested_submodule}" ]]; then
            slug="$(printf '%s' "${requested_submodule}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
            echo "branch=chore/update-submodules-${slug}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=chore/update-submodules" >> "$GITHUB_OUTPUT"
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              git diff --cached --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # FLEET_TOKEN so the PR fires workflow events and the drift gate runs.
          token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(submodule): update ${{ inputs.submodule || 'all' }} submodule pointer(s)"
          title: "chore(submodule): update ${{ inputs.submodule || 'all' }} submodule pointer(s)"
          body: |
            Automated submodule pointer update.

            Changed files:

            ```text
            ${{ steps.update.outputs.changed_files }}
            ```

            Review the corresponding submodule repositories before merging.
          # STABLE across runs, deliberately. peter-evans/create-pull-request
          # reuses an existing branch: it force-pushes the new pointers and
          # UPDATES the open PR in place. Interpolating github.run_id here
          # defeated that — every nightly run cut a fresh branch and therefore a
          # fresh PR, so #110, #113, #118 and #126 accumulated as four open PRs
          # for one recurring job, each silently superseding the last.
          branch: ${{ steps.update.outputs.branch }}
          base: ${{ inputs.base_branch || 'main' }}
          labels: automation, submodule
          delete-branch: true

      - name: No changes
        if: steps.update.outputs.changed == 'false'
        run: echo "No submodule pointer updates detected."
