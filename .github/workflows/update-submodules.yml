name: 🔀 Update Submodules

# Submodule pointers land DIRECTLY on the base branch — no pull request. A
# pointer bump records a SHA that is already reviewed and merged in the
# submodule's own repo, so a hub PR reviews nothing; it was pure queue.
#
# Publishing goes through .github/actions/utilities/publish-data, which picks
# the route at runtime: direct push normally, stable-branch PR only if a ruleset
# rejects the push. A bare `git push` here would be the exact mistake that left
# four workflows failing nightly for three weeks (see that action's header).
#
# The commit carries `[skip ci]`: nothing needs to run on a pointer bump, and
# the per-workflow reasoning is at the publish step.
#
# Requires FLEET_TOKEN (see _data/fleet.yml) because GITHUB_TOKEN 404s on the
# fleet's private submodules, so a recursive checkout with it dies before the
# update step ever runs. Both call sites fall back to GITHUB_TOKEN (degraded:
# public repos only) — and on the PR fallback route a GITHUB_TOKEN-opened PR
# fires no workflow events, so its checks never run.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Submodule path to update. Leave blank to update all.'
        required: false
        type: string
      base_branch:
        description: 'Branch the pointer commit is published onto.'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    name: Update submodule pointers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      # submodules: false — a recursive checkout hard-fails the whole job when
      # one submodule repo is private-to-the-token or gone (renamed/deleted).
      # The update step below inits each submodule itself and degrades those
      # to per-path warnings instead.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        uses: ./.github/actions/setup/configure-git
        with:
          github-token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update submodules
        id: update
        shell: bash
        # The dispatch input reaches the script through env, never through `${{ }}`
        # interpolation: expanding it inline splices attacker-chosen text into the
        # shell source before bash ever parses it.
        env:
          REQUESTED_SUBMODULE: ${{ inputs.submodule }}
        run: |
          set -euo pipefail

          requested_submodule="${REQUESTED_SUBMODULE:-}"

          if [[ ! -f .gitmodules ]]; then
            echo "No .gitmodules file found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          update_submodule() {
            local submodule_path="$1"

            if grep -qE "^[[:space:]]*path[[:space:]]*=[[:space:]]*${submodule_path}$" .gitmodules; then
              echo "Updating submodule: ${submodule_path}"
              git submodule update --init --recursive --remote --merge "${submodule_path}" || {
                echo "::warning::Failed to update ${submodule_path}"
              }
            else
              echo "::warning::Submodule ${submodule_path} not found in .gitmodules"
            fi
          }

          if [[ -n "${requested_submodule}" ]]; then
            update_submodule "${requested_submodule}"
          else
            while IFS= read -r submodule_path; do
              update_submodule "${submodule_path}"
            done < <(git config --file .gitmodules --get-regexp path | awk '{ print $2 }')
          fi

          # Stage ONLY submodule pointer changes — never stray root-tree edits.
          # A path whose repo was unreachable is still an empty dir here; adding
          # it is a no-op, but don't let one bad path abort the loop.
          git config --file .gitmodules --get-regexp path | awk '{ print $2 }' \
            | while IFS= read -r p; do git add -- "$p" || echo "::warning::could not stage ${p}"; done

          # The exact submodule path list, handed to publish-data as the ONLY
          # paths it may stage. Preserves the "pointer changes, never stray
          # root-tree edits" guarantee the hand-rolled `git add` loop above gives.
          {
            echo "paths<<EOF"
            git config --file .gitmodules --get-regexp path | awk '{ print $2 }' | tr '\n' ' '
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              git diff --cached --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          # UNSTAGE. The staging above exists only to detect changes with
          # `git diff --cached`; publish-data detects with `git diff`, which
          # compares the working tree to the INDEX. Handing it a staged tree
          # makes those two identical, so it reports "nothing to publish" and
          # drops the pointers — silently, every night, with a green run. Left
          # unstaged, the submodule pointer change is a working-tree diff and
          # publish-data stages and commits it itself.
          git reset --quiet

      # Straight onto the base branch — no pull request. publish-data resolves
      # the route at RUNTIME: a direct push when the branch allows it (the
      # normal path today, and what the fleet-pulse bot already does nightly),
      # falling back to a stable-branch PR only if a ruleset ever rejects the
      # push. That fallback is not a preference for PRs — it is the reason this
      # repo's daily loop is not silently dead again. Four workflows once ended
      # in a bare `git push` to main, a ruleset was added, and they failed at
      # that last step every night for three weeks while every generator inside
      # them worked perfectly.
      - name: Publish submodule pointers
        id: publish
        if: steps.update.outputs.changed == 'true'
        uses: ./.github/actions/utilities/publish-data
        with:
          token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}
          paths: ${{ steps.update.outputs.paths }}
          base: ${{ inputs.base_branch || 'main' }}
          # `[skip ci]` because nothing needs to run on a pointer bump, and the
          # alternative is worse. build-dash.yml already filters `projects/**`
          # out by path, so it never woke for these. drift-check.yml has no path
          # filter and is the one workflow this push would trigger — but adding
          # `paths-ignore: projects/**` there would ALSO stop it firing when a
          # HUMAN touches projects/, and check (a) exists precisely to catch
          # stray/unregistered dirs in that directory. Skipping CI on the bot's
          # own commit is targeted; weakening the gate for everyone is not.
          message: "chore(submodule): update ${{ inputs.submodule || 'all' }} submodule pointer(s) [skip ci]"
          branch: chore/update-submodules
          title: "chore(submodule): update ${{ inputs.submodule || 'all' }} submodule pointer(s)"
          body: |
            Automated submodule pointer update.

            A direct push to the base branch was rejected by branch protection,
            so the pointers arrive as a pull request instead. Review the
            corresponding submodule repositories before merging.
          labels: automation,submodule
          auto-merge: 'true'

      - name: Report route
        if: steps.update.outputs.changed == 'true'
        env:
          MODE: ${{ steps.publish.outputs.mode }}
          CHANGED: ${{ steps.update.outputs.changed_files }}
        run: |
          echo "Published via: ${MODE}"
          printf '%s\n' "${CHANGED}" | sed 's/^/  /'

      - name: No changes
        if: steps.update.outputs.changed == 'false'
        run: echo "No submodule pointer updates detected."
