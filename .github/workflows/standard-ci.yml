name: standard-ci

# Reusable CI gate for bamr87 submodules — the shared "standard" a member repo
# adopts with a short caller workflow (see templates/standard-ci/ci.yml, dropped
# in by standardize-fanout.yml). Auto-detects the stack and runs lint + test +
# build; every step is guarded so a repo only runs what applies to it.
#
# Call it from a member repo, pinned to the floating major tag (never @main;
# tag scheme and bump rules: docs/WORKFLOW-VERSIONING.md, history: CHANGELOG.md):
#   jobs:
#     ci:
#       uses: bamr87/bamr87/.github/workflows/standard-ci.yml@v1
#       secrets: inherit
#
# THE ONE SHARED GATE
# -------------------
# This is the fleet's only reusable CI gate, for every tier. bamr87/.github
# used to publish a fuller six-job `ci.yml` (detect → test/lint/build/docs/
# commitlint/CodeQL); nothing called it, and it is being retired
# (bamr87/.github#5). A repo that needs more than the baseline adds its own jobs
# beside this caller (CodeQL, a spec-gate, e2e) instead of adopting a second
# shared gate — one job here keeps the per-push runner count flat across ~40
# repos, the cost the analytics layer exists to watch.
#
# TOOLCHAIN VERSIONS
# ------------------
# Resolution order per language: an explicit caller input, else the CALLING
# repo's `vars.*` variable, else the built-in default. The middle rung is what
# makes `dash config sync` able to bump a version across the whole fleet from
# _data/fleet.yml without editing 40 workflows. Inputs default to "" on purpose
# — a non-empty default would always win and mask the variable.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: ""
      python-version:
        type: string
        default: ""
      ruby-version:
        type: string
        default: ""
      # Optional, all empty by default = previous behaviour unchanged.
      python-extras:
        description: Comma-separated extras for the project install, e.g. `dev` installs `.[dev]`. Empty = plain `.`.
        type: string
        default: ""
      test-command:
        description: Shell command that replaces the default test step(s) (pytest / npm test / ruby test). Empty = auto-detect as before.
        type: string
        default: ""
      node-ruby-version:
        description: >-
          When set, set up Ruby (with bundler-cache) BEFORE the npm install/build,
          for npm builds that shell out to Jekyll/bundler. Empty = skip. Kept
          separate from `ruby-version` so existing callers are unaffected.
        type: string
        default: ""
      # Docs-only skip (Actions waste reduction, Oct 14). A reusable workflow
      # cannot take `paths-ignore`, so the gate decides itself: when EVERY file
      # changed by the push/PR matches one of `docs-paths`, the `ci` job is
      # skipped (a skipped job still satisfies a required check). Callers can
      # opt out with `skip-docs-only: false` or replace the patterns.
      skip-docs-only:
        type: boolean
        default: true
      docs-paths:
        description: Whitespace-separated globs treated as docs-only (`**` crosses directories).
        type: string
        default: "**/*.md **/*.markdown docs/** LICENSE* .github/ISSUE_TEMPLATE/** .github/*.md"
      timeout-minutes:
        description: Timeout for the ci job.
        type: number
        default: 30

permissions:
  contents: read

env:
  NODE_V: ${{ inputs.node-version || vars.NODE_VERSION || '20' }}
  PYTHON_V: ${{ inputs.python-version || vars.PYTHON_VERSION || '3.12' }}
  RUBY_V: ${{ inputs.ruby-version || vars.RUBY_VERSION || '3.3' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip-docs-only }}
          PATTERNS: ${{ inputs.docs-paths }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fail open: anything unexpected means "run CI".
          run=true
          if [ "$SKIP" = "true" ] && { [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; } \
             && [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename' 2>/dev/null) \
               && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ]; then
              run=$(FILES="$files" python3 - <<'PY'
          import fnmatch, os, re
          pats = os.environ["PATTERNS"].split()
          def rx(p):
              # `**/` matches zero or more directories; `**` anything; `*` within a segment.
              out, i = "", 0
              while i < len(p):
                  if p.startswith("**/", i): out += "(?:.*/)?"; i += 3
                  elif p.startswith("**", i): out += ".*"; i += 2
                  elif p[i] == "*": out += "[^/]*"; i += 1
                  elif p[i] == "?": out += "[^/]"; i += 1
                  else: out += re.escape(p[i]); i += 1
              return re.compile(out + r"\Z")
          rs = [rx(p) for p in pats]
          files = [f for f in os.environ["FILES"].splitlines() if f]
          docs_only = all(any(r.match(f) for r in rs) for f in files)
          print("false" if docs_only else "true")
          PY
              )
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then echo "::notice::docs-only change; skipping the ci job (set skip-docs-only: false to always run)"; fi

  ci:
    needs: changes
    if: needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7

      # ---------------------------- Node -----------------------------------
      - name: Setup Ruby (for npm build)
        if: ${{ inputs.node-ruby-version != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.node-ruby-version }}
          bundler-cache: true
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_V }}
          # Cache ~/.npm between runs. Only enabled when a lockfile exists —
          # setup-node hard-fails if `cache` is set and it can't find one.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install (npm)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint / test / build (npm)
        if: ${{ hashFiles('package.json') != '' }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          npm run lint --if-present
          # `test-command` replaces the default tests; it runs once, in its own step.
          if [ -z "$TEST_CMD" ]; then npm test --if-present; fi
          npm run build --if-present

      # --------------------------- Python ----------------------------------
      - name: Setup Python
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/*.txt', 'setup.py') != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_V }}
          # Cache the pip download cache. Only enabled when a file the cache can
          # key on exists — setup-python errors out on an unmatched dep path.
          cache: ${{ hashFiles('requirements.txt', 'requirements/*.txt', 'requirements-dev.txt', 'pyproject.toml') != '' && 'pip' || '' }}
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install (pip)
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/*.txt', 'setup.py') != '' }}
        env:
          EXTRAS: ${{ inputs.python-extras }}
        run: |
          python -m pip install --upgrade pip
          # Install the project itself only when it is actually installable: a
          # setup.py, or a pyproject.toml that declares a package / build
          # backend (a pyproject.toml holding only tool config such as
          # [tool.ruff] is not a package). Editable first; fall back to a
          # regular install for backends without PEP 660 support. A failure of
          # BOTH fails the job — a broken install is a red build, not a skip.
          if [ -f setup.py ] || { [ -f pyproject.toml ] && grep -Eq '^\[(project|build-system|tool\.poetry)\]' pyproject.toml; }; then
            spec=.
            if [ -n "$EXTRAS" ]; then spec=".[${EXTRAS// /}]"; fi
            pip install -e "$spec" || { echo "::warning::editable install failed; retrying as a regular install"; pip install "$spec"; }
          elif [ -f pyproject.toml ]; then
            echo "::notice::pyproject.toml has no [project]/[build-system] table; skipping package install"
          fi
          for r in requirements.txt requirements/base.txt requirements-dev.txt requirements-dev.in; do
            if [ -f "$r" ]; then pip install -r "$r"; fi
          done
          pip install pytest
      - name: Test (pytest)
        if: ${{ inputs.test-command == '' && hashFiles('pyproject.toml', 'requirements.txt', 'requirements/*.txt', 'setup.py') != '' }}
        run: |
          # `run:` uses `bash -eo pipefail`, so the exit status MUST be captured
          # with `set +e` — a bare `pytest -q; rc=$?` aborts the step on failure
          # and never reaches the exit-5 handling below.
          set +e
          pytest -q
          rc=$?
          set -e
          # exit code 5 = "no tests collected" — not a failure for the gate
          if [ "$rc" -eq 5 ]; then echo "::notice::no tests collected"; rc=0; fi
          exit "$rc"

      # ------------------------- Ruby / Jekyll -----------------------------
      - name: Setup Ruby
        if: ${{ hashFiles('Gemfile') != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_V }}
          bundler-cache: true
      - name: Test / build (ruby)
        if: ${{ hashFiles('Gemfile') != '' }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          if [ -n "$TEST_CMD" ] && grep -qi jekyll Gemfile; then bundle exec jekyll build
          elif [ -n "$TEST_CMD" ]; then echo "::notice::test-command set; skipping default ruby tests"
          elif bundle exec rake -T 2>/dev/null | grep -q ' test'; then bundle exec rake test
          elif [ -d spec ]; then bundle exec rspec
          elif grep -qi jekyll Gemfile; then bundle exec jekyll build
          else echo "::notice::no ruby test/build target"; fi

      # ------------------------ Custom test command ------------------------
      - name: Test (test-command)
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_CMD"
