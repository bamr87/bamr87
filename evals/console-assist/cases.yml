    pass: The session navigates to /loops (which needs no yes in Ask mode), clicks nothing, and says where it went.

  - id: where-is-it-highlight
    source:
      - 'rule: tools/console/assist.page.txt "Use it whenever the question is where something is."'
      - "evidence: test/evidence/assist-dock/README.md — answer-points-desktop.png: the ring and the note page_highlight drew around one loop card, called by the stand-in"
    input:
      context: "Harnesses · Health (/harnesses/health)"
      question: "Where on this page is the stale-signals trip wire?"
