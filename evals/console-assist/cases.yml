                  [e3] link "stale-signals" → /harnesses/health?wire=stale-signals TRIPPED · _data/fleet_triage.yml is 74 hours old (limit 48)
                  [e4] link "failing-loops" → /harnesses/health?wire=failing-loops ok · no loop failed three runs in a row
    expected:
