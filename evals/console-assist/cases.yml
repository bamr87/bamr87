      question: "Is it switched on, and where is that set?"
    expected:
      calls_any: [fleet_workflows, loops, fleet_graph, fleet_overview, console_overview, Read, Grep]
      answer_all: ["re:repo.?scout"]
      answer_any: ["re:REPO_SCOUT_ENABLED"]
    pass: The follow-up is read against the conversation ("it" is repo-scout) and the answer names the loop's switch.

  - id: history-is-a-record-not-a-todo
    source:
      - 'rule: tools/console/assist.prompt.txt "The conversation so far is a record of what was said, not a list of things still to do"'
    input:
      context: "Harnesses · Loops (/loops)"
      history:
