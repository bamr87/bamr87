      commands_none: [{action: [navigate, click, fill, press]}]
      answer_any: ["re:work_queue\\.yml", "re:not valid YAML", "re:\\b500\\b"]
    pass: The answer gives the page's own error (the document that failed and why) from the snapshot, and the session uses nothing on the page.

  - id: page-data-over-the-screen
    source:
