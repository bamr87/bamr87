      \ every devenv allocation (port and livereload) must be a port `docker-compose.yml`'s devenv service publishes,\
      \ and its `start:` must be the command of a launch entry whose name carries the port. Both new tests fail\
      \ on `main`.\n  - `.github/scripts/dash-gen/test_fleet_compose.py`: the ports.yml workspace bands must equal\
      \ the contract's, and the new gate rules have fixtures. Both new tests fail on `main`.\n  - `test_docker_view.py`,\
