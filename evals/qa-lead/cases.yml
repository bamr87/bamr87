    body: 'Adds the Friday close-out and Saturday/Sunday weekend-prep jobs as three Harness Console loops, so the
      console schedules, dispatches and maintains them.


      **The scheduled lanes stay off until Amr sets the kill-switch variables** (`WEEKLY_CLOSEOUT_ENABLED`, `WEEKLY_GATHER_ENABLED`,
      `WEEKLY_FINALIZE_ENABLED`). This PR sets none of them. `workflow_dispatch` always runs, so each lane can be
      exercised from the console first.


      | Loop | When (Denver, MST) | Cron (UTC) | Agent |

      | --- | --- | --- | --- |

      | `weekly_closeout` | Fri 13:17 | `17 20 * * 5` | Opus, 120 turns, $20 |

      | `weekly_gather` | Sat 10:17 | `17 17 * * 6` | Sonnet, 60 turns, $10 |

      | `weekly_finalize` | Sun 16:17 | `17 23 * * 0` | Sonnet, 60 turns, $10 |


      UTC hours 17, 20 and 23 carry no other AI cron, so the 3-per-hour cap is untouched.


      ## What changed

      - `LOOPS` and `DISPATCH_WORKFLOWS` in `tools/console/core.py`; crons and three `hub/weekly-*` switches (default
      off, opt-in) in `_data/fleet.yml`.

      - Three `ai-lane.yml@main` caller workflows, filled from the ai-runner template. Each has its own switch,
      an exact model, `max-turns` and `max-budget-usd` sized together, least-privilege permissions and a result
      file, so a crashed agent shows red. Friday is the only lane with `contents: write` and `pull-requests: write`.

      - Agent briefs in `.github/weekly/`. They forbid merge, close, approve, release, force-push, settings or secret
      changes, touching `~/bamr87`, and merging or rebasing the #840 rollout PRs.

      - `docs/WEEKLY-CLOSEOUT.md`: user stories, a DFF table, and the console-vs-Grok split with what is needed
      to move Grok triggering into the console.

      - `features/features.d/weekly-closeout.yml` (`HUB-NEW`, `prd: [FR-NEW:weekly-closeout]`, requirement in `prd_new:`).

      - `tools/test_weekly_closeout.py`: 10 contract tests covering cron parity, switch default, caps, model, permissions,
      secrets, never-merge and no-force-push.

      - `_data/agents.yml` regenerated by `tools/dash agents` (drift check (p)).


      ## Deviations to review

      - **No JEV step specs and no local `loop-run` yet.** A spec must be held equal to a `claude-code-action` step
      in its workflow (`tools.jev.spec.parity_errors`), which an `ai-lane` caller does not contain. Building a local
      adapter, planner and filer is a follow-up. `tools/dash agents` records the honest gap `R6:no-local-entry`,
      and the console runs these loops through `dispatch`. The brief reads the `triage` and `decisions-refresh`
      ops as its local inputs.

