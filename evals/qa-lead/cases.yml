- id: bamr87-917
  source: 'https://github.com/bamr87/bamr87/pull/917 — merge readiness: an ADR and fleet.yml make it major'
  input:
    author: bamr87
    labels:
    - needs-amr
    additions: 1018
    deletions: 18
    files:
    - .github/scripts/dash-gen/README.md
    - .github/scripts/dash-gen/pr_readiness.py
    - .github/scripts/dash-gen/test_pr_readiness.py
    - .github/workflows/pr-review.yml
    - _data/fleet.yml
    - changelog.d/merge-readiness.md
    - docs/DASH.md
    - docs/PR-QUEUE.md
    - docs/adr/0012-merge-readiness.md
    - docs/adr/README.md
    - features/features.d/merge-readiness.yml
    - templates/pr-review/README.md
    - tools/console/app.py
    - tools/console/mcp_layer/server.py
    - tools/console/pr_queue.py
    - tools/console/test_pr_queue.py
    - tools/dash
    - tools/fleetcore/prqueue.py
    - tools/test_fleetcore_prqueue.py
    ci_runs: []
    body: '## Description


      Redesigns what happens to a pull request between "ready" and "merged", and builds the first of four stages.
      Proposes [ADR 0012](https://github.com/bamr87/bamr87/blob/feature/pr-readiness/docs/adr/0012-merge-readiness.md).


      Amr asked on 2026-11-17 for the commenting, analysis and review of each pull request to be redesigned so that
      every check, review and adjustment is done before a merge, after he found #873 green, gated and labelled with
      no comment, review or review request.


      **Merging this changes nothing until `PR_READINESS_ENABLED` is set to `true`.**


      ## Why #873 was an empty page


      - § 19 is ratified and one item of it is built: `pr-review.yml` explains a failed CI run (§ 19.10). § 19.7''s
      review on open and on ready has no implementation.

      - No hub workflow runs when a pull request is marked ready, so nothing could react to it.

      - § 19.2 deletes the summary when every check is clean, so a finished pull request and an unexamined one look
      the same.

      - The code owner is the author''s own login, because agents open pull requests with the maintainer''s token,
      so GitHub requests no review and sends no notification.


      ## The design: four stages on the one workflow


      | Stage | Runs when | Does |

      | --- | --- | --- |

      | A. Readiness (this pull request) | every finished workflow, and every pull-request event that starts none
      | computes what is left from facts and writes it on the pull request; no model, $0 |

      | B. Review | opened as ready, marked ready, or the `review` label, once CI is green; once per head commit
      | a capped AI code review in a job with no GitHub credential; a second job posts findings inline (#880) |

      | C. Adjust | a `todo` a machine can move | a script first, then the queue''s capped agent, at most two attempts,
      then `needs-amr` |

      | D. Merge | the verdict is `ready` | a `Merge readiness` status the maintainer may require; ungated pull
      requests are an agent''s to merge, gated ones the maintainer''s |


      ## What stage A does


      Every pull request gets one verdict, `ready`, `waiting` or `not-ready`, and an ordered list of what is left,
      each item with who moves it: the checks, the base branch, the draft state, the review gate and its label,
      hold labels, the governance trace, the description''s task list, review threads and the review decision. The
      review gate is `held`, never work: a gated pull request with nothing else left is ready, for the maintainer.


      | The pull request | What appears on it |

      | --- | --- |

      | has work left, or is waiting on a running check | the one sticky comment: the failed runs first, then a
      table of what is left and who moves each item |

      | has nothing left | the comment is deleted (§ 19.2), and one review per head commit says "Ready to merge"
      and who merges it |


      The review is a comment. It never approves (§ 19.5), and its first line says no code was reviewed.


      This is what #873 would get today (a dry run from this branch):


      > **Ready to merge at `f923cbe`.** Everything the fleet checks before a merge is done. This is an automated
      readiness check: no code was reviewed.

      >

      > Done: 13 checks pass · merges into its base · marked ready · labelled needs-amr · names what governs it
      · every task ticked. Held: for the maintainer. Note: no review is recorded on it.

      >

      > **Merge:** The maintainer merges it.


      ## Across the fleet today (408 open pull requests, read from this branch)


      | | Count |

      | --- | --- |

      | Ready | 21 (20 for the maintainer, 1 for an agent) |

      | Not ready | 387 |

      | Exactly one thing left | 195: the `needs-amr` label on 102, still a draft on 64, unticked tasks on 21, a
      conflict on 5, a failing check on 3 |


      Left, by item: the gate label 231, draft 217, unticked tasks 151, checks 36, conflicts 8, review threads 4.


      ## What changed


      - `tools/fleetcore/prqueue.py`: `readiness_of`; `readiness` on every row; `counts.readiness`; the report''s
      own status is never counted as a check.

      - `tools/console/pr_queue.py`: `live_row` reads one pull request with a single query; `tools/dash prs ready
      --pr owner/repo#n`; a `--verdict` filter; the governance trace as a fact; cache schema v3 (every pull request
      is read once more).

      - `.github/scripts/dash-gen/pr_readiness.py`, new: `pr_review.py`''s comment with the readiness section under
      it, and the ready review. It calls `pr_review.py` for everything about a failed run and does not change it.

      - `.github/workflows/pr-review.yml`: a `pull_request_target` trigger for the events that start no workflow,
      a `readiness` job, and the `ci-failure` job runs the new script when the switch is on.

