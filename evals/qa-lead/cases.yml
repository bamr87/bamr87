      the kit''s stamp plus hand edits that added two of them, so the hub''s guardrails never reached the fleet
      | 36 untouched copies, 3 controls short | kit 0.6.0 passes all 7 |

      | `kit_status: upgradeable` came from the stamp. bashcrawl''s copy is stamped and hand-edited, so its `kit-drift`
      finding named a lever that could never close it | a dead-end finding | byte comparison at scan time |

      | ai-seed is archived on GitHub; its five crons were counted as scheduled agents and as throughput | counted
      | listed, counted for nothing |

      | csv-vscoode is `status: archived` in the registry and live on GitHub, with a handler that can still run
      | not noticed | `archive-mismatch` finding |

      | `--model sonnet` / `--model opus` in `fleet-verify.yml`, `issue-pipeline.yml` and the workflow atlas scaffold
      (§ 13.3 asks for exact ids) | aliases | exact ids |

      | A comment naming the action counted as a harness and recorded `v1);` as its ref | false positive | routes
      matched on code only |


      **What changed**


      - **The standard** (`_data/fleet.yml` `harnesses.standard`): six routes, three of them on the standard, and
      ten controls read from the workflow file, each with the rule it comes from and the kinds it binds. A control
      is counted only where it can bind.

      - **The generator** (`harness_registry.py`): route detection, the facts the controls read, a verdict and a
      lever per harness (`kit-upgrade`, `kit-adopt`, `lane-adopt`, `fix-controls`, `factory-recompile`, `hub-fix`,
      `retire`), a `catalog` index, and one `standard-gap` finding per lever. The verdicts are computed from stored
      facts, so editing the standard regrades the fleet offline.

      - **One classifier for both inventories**: `agent_inventory.py` drops its own `claude-run` detection.

