    - id: 43128132160
      head_match: false
      conclusion: cancelled
    - id: 43553985722
      head_match: false
      conclusion: cancelled
    body: '## Description


      A `python-tests` push run on `main` waits in the cheap `changes` job so that the next push of a merge burst
      cancels it before the four shards boot (#805). Merge bursts on 2026-11-10 still outlasted the 90-second wait.
      This PR raises the wait to 110 seconds. The fleet-doctor proposed this change in #821 but could not push it,
      because its token has no `workflows` permission.


      - `.github/workflows/python-tests.yml`: `sleep 90` becomes `sleep 110`. The PUSH DEBOUNCE header now says
      why, and that the wait must stay under about 115 s.

      - `docs/WORKFLOW-OPTIMIZATION.md`: two sentences in the 2026-11-09 section record the change and the numbers
      behind it.


      ### Measured


      These counts cover every `python-tests` push run on `main` from the debounce''s first run (2026-11-10 07:03
      UTC) to 2026-11-15 18:35 UTC: 33 runs. Job timings were read for 19 of them: every run that survived, and
      every run that was cancelled after the 90-second wait had ended.


      | Outcome | Runs |

      | --- | --- |

      | survived and passed | 12 |

      | cancelled before any shard started (only `changes` billed) | 15 |

      | cancelled after the shards had booted | 6 |


      Around the 90 s wait, `changes` took 92–96 s, after a queue delay of 3–20 s. With 110 s it takes 112–116 s.
      That stays under 120 s, so it still bills 2 minutes. A wait above about 115 s can bill 3.


      The six runs cancelled after their shards booted, and what a 110 s wait would have done. A run is caught if
      the next push arrives before `changes` ends.


      | Cancelled run (created, UTC) | Next push after | `changes` would end at (110 s wait) | Caught? |

      | --- | --- | --- | --- |

      | [11-10 07:06:15](https://github.com/bamr87/bamr87/actions/runs/42772953444) | 119 s | 133 s | yes |

      | [11-10 15:14:38](https://github.com/bamr87/bamr87/actions/runs/42842311739) | 148 s | 117 s | no |

      | [11-10 20:34:12](https://github.com/bamr87/bamr87/actions/runs/42896583035) | 133 s | 131 s | borderline:
      the shards would be queued 2 s before the cancel |

      | [11-12 00:33:22](https://github.com/bamr87/bamr87/actions/runs/43128132160) | 477 s | 130 s | no |

      | [11-14 03:54:29](https://github.com/bamr87/bamr87/actions/runs/43553985722) | 146 s | 117 s | no |

      | [11-14 07:02:00](https://github.com/bamr87/bamr87/actions/runs/43569152164) | 329 s | 120 s | no |


      **Expected impact: small.** Over those 5.5 days the longer wait would have caught one or two of the six escaped
      runs. Each costs about 4 billed shard-minutes, so the total is 4–8 billed minutes. That is a few minutes on
      a day with a long merge burst, and nothing on a quiet day. The issue estimated 12–20 job-min/day from 11-10''s
      traffic, which is too high for two reasons. First, one of its four escapes, [11-10 20:29:44](https://github.com/bamr87/bamr87/actions/runs/42895823522),
      was already caught by the 90 s wait: `changes` was cancelled at 94 s and no shard ever started. Second, the
      133 s and 148 s gaps are beyond 110 s.


      **Cost:** no extra billed minutes, because a surviving run''s `changes` still bills 2. The `python-tests`
      verdict on `main` arrives 20 s later on each push run that survives. Pull requests, the nightly run and manual
      dispatch do not wait and are unchanged.


      ## Governance Trace


      Governed by: NFR3 (HUB-012, fleet pulse and the remediation doctor; the doctor''s finding). Handoff: #821.


      ## Related Issues


      - Closes #821


      ## Type Of Change


      - [ ] Bug fix

      - [ ] New feature

      - [ ] Breaking change

      - [ ] Documentation update

      - [x] Maintenance or refactor

      - [ ] Test improvement


      ## Verification


      I ran these locally on this branch:


      ```

      grep -n ''sleep 110'' .github/workflows/python-tests.yml           → 134: run: sleep 110   (no `sleep 90`
      left)

      actionlint .github/workflows/python-tests.yml                    → clean (every workflow: clean)

      tools/dash workflows lint                                        → 0 error(s), 3 warning(s): concurrency on
      weekly-closeout/finalize/gather.yml, which this PR does not touch

      python3 .github/scripts/dash-gen/test_workflow_atlas.py          → OK

      python3 .github/scripts/dash-gen/test_schedule.py                → OK

      python3 tools/unwrap-prose.py --check docs/WORKFLOW-OPTIMIZATION.md → already unwrapped

      python3 tools/schema_lint.py check .                             → PASS: 0 error(s), 0 warning(s)

      python3 tools/docs_index.py --check                              → exit 0

      python3 -m tools.jev generated guard --base origin/main          → ok: no main-only generated file

      /opt/homebrew/bin/bash tools/check-drift.sh                      → No drift (submodule checks skipped: none
      checked out)

      ```


      - [x] Tests pass

      - [x] Lint/type checks pass

      - [x] Documentation updated

      - [ ] Manual verification completed, if needed: possible only after merge (below)


      **Not verified here: the wait itself.** It runs only on a push to `main`, so the first push run after this
      merges is the evidence. Its `changes` job should take under 120 s (`gh run view <run> -R bamr87/bamr87 --json
      jobs`). In the next merge burst, a push superseded within about two minutes should show `changes` cancelled
      and no `tests (…)` job started. On this PR, CI should run `python-tests` with all four shards and no wait,
      because the PR touches `.github/` and so is not docs-only.


      `skip-evidence`: this is a CI timing change, and nothing a user sees changes.


      ## Notes For Reviewers


      - **Gate:** not gated under § 12.3. `python-tests.yml` reaches no model, and no permission, secret, budget
      or setting changes.

      - **Why not higher:** across these 19 runs, `changes` spent 2–6 s around the sleep. A wait of about 115 s
      or more would put some surviving runs at 3 billed minutes, which is roughly +1 minute on each of about two
      surviving runs a day. That costs more than the escapes it would add: the 146–148 s gaps would need a wait
      of about 140 s, and 3 billed minutes on every surviving run.

      - **Not in this PR, as the issue says:** caching pip (11–26 s per shard), and speeding up `tools/test_jev_loop.py`,
      the one-file critical path.


      🤖 Generated with [Claude Code](https://clau'
