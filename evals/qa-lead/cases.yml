    body: "## Description\n\nAmr asked for \"a queue or dashboard/list of all the PR's that need my action/review\
      \ within the console, and then have an ability to select all for merging, processing, updates, etc. for the\
      \ AI agents to perform\". This PR adds the **PR queue**, a new Harness Console page at **Fleet → PR queue**\
      \ (`/prs`). It lists every open pull request in the hub and the registry repos: 218 on 2026-11-15. Amr can\
      \ filter and select pull requests, review a plan made from live GitHub, and an agent applies exactly that\
      \ plan once he confirms.\n\n**What each row shows** (`tools/fleetcore/prqueue.py`, a pure model):\n\n- **Checks:**\
      \ superseded runs on the head commit set aside per check, so a cancelled run followed by a success counts\
      \ as green, while an earlier failure still counts (the rule `tools/check_rollup.py` applies in #862). Verify\
      \ kit 0.1.0's label-burst race makes 9 green pull requests show red on GitHub; the page marks them *false\
      \ red*.\n- **Gate:** the § 12.3 verdict and its reason. It is `closeout.gate_verdict`, unchanged, asked of\
      \ the pull request as if it were green, so it reports the gate alone. Today 181 of 218 are gated.\n- **Merge:**\
      \ the method the repo allows (zer0-mistakes is squash only), and whether an agent may merge it under § 12.2.\n\
      - **Who moves next:** Amr, an agent, a loop or the author, with the action, the reason and the bulk action\
      \ that does it.\n- **Kinds:** security, Dependabot, release, fan-out batch, AI harness, ratification and draft.\
      \ Fan-out batches are grouped by head branch; `ci/claude-oauth-only` has 42 pull requests.\n- **Triage note:**\
      \ the `<!-- fleet:pr-triage -->` comment's next action, shown as a hint. It is never run and never changes\
      \ the row's verdict.\n\n**Data** (`tools/console/pr_queue.py`): the decision index's pull requests plus one\
      \ batched GraphQL detail read each. The detail is cached in `.fleet/prqueue/`, which is gitignored and owner-only,\
      \ under a TTL and a time budget. A cold read takes about 24 s and a cached one under a second.\n\n**Bulk actions,\
      \ plan then confirm:**\n\n1. `POST /api/prs/plan` reads each selected pull request live and gives it its exact\
      \ op or a skip reason, under a deterministic `plan_id`. It writes only a local plan file.\n2. **Apply** runs\
      \ the console job `prs-act` (or `prs-agent` for the agent) behind the existing confirm and remote lock.\n\
      3. The job plans again and refuses a plan whose pull requests moved since the preview (§ 11.4), then records\
      \ each result.\n\nThe actions:\n\n| Action | State |\n| --- | --- |\n| Mark ready | on |\n| Update branch\
      \ | on: a base merge with `expected_head_sha`, never a force-push |\n| Re-run cancelled or failed checks |\
      \ on: one at a time per pull request, each waited for |\n| Post or update the next-action comment | on: edited\
      \ in place by its marker |\n| Add `needs-amr` | on |\n| Agent: fix CI or address review | on: a capped local\
      \ Claude Code session per pull request (below) |\n| Close as superseded | **off** behind `pr_queue.close.enabled`\
      \ |\n| Merge | **off** behind `pr_queue.merge.enabled` |\n\nWhen merge is on, it uses `--match-head-commit`\
      \ and the repo's own method, never `--admin` or `--auto`. lifehacker.dev is never merged, and gitorio's Dependabot\
      \ pull requests get `dep:merge-approved` instead (ADR-039). Plans accept only fleet repos the hub owns, and\
      \ `DASH_CONSOLE_GITHUB_WRITES=off` refuses every apply.\n\n**The agent** is `local:pr-queue-agent`, registered\
      \ in `_data/agents.yml` (§ 29). For each pull request it:\n\n1. Clones the head branch outside the hub.\n\
      2. Runs one session through `tools/dash-gen ai-run --isolate`: no GitHub credential, a closed tool list, and\
      \ `pr_queue.agent`'s model, turn and dollar caps. Each session costs at most $2, API-equivalent (estimate),\
      \ and the cost goes on the AI ledger.\n3. Refuses edits to paths a repo keeps agents out of (it-journey's\
      \ workflows).\n4. Pushes one commit without force and adds `needs-amr`.\n\nIt skips private repos and fork\
      \ branches.\n\n**Other surfaces:**\n\n- `tools/dash prs [queue|refresh|plan|apply|actions]`\n- `GET /api/prs`,\
      \ `POST /api/prs/plan`, `GET /api/prs/plan/{id}`, `GET /api/prs/result/{id}`\n- the operations `prs`, `prs-refresh`,\
      \ `prs-act` and `prs-agent`\n- the MCP tools `pr_queue` (read) and `pr_queue_plan` (plan only; applying stays\
      \ on the console)\n- a `.vscode/launch.json` entry and the `verifyScenario` picker (§ 20)\n\nDesign record,\
      \ prior-art survey and build-vs-adopt decision (§ 10.8): [docs/PR-QUEUE.md](docs/PR-QUEUE.md).\n\n## Governance\
      \ Trace\n\nGoverned by: FR-NEW:pr-queue, FR-NEW:pr-queue-bulk-actions (new in `features/features.d/pr-queue.yml`);\
      \ constitution § 11.8 (amendment `ops-remote-write-path`) for the console's GitHub writes; § 12.7 (amendment\
      \ `local-first-ai`) for the base merge; § 10.9 and § 29 for the agent. Handoff: bamr87/bamr87#863\n\n**The\
      \ open governance question: merge and close.** § 11.2 says the console never merges, § 11.1 lists no pull-request\
      \ close, and § 12.2 lets an agent merge only an ungated pull request with a merge commit. A merge Amr selects\
      \ and confirms in the console is arguably his own, but the constitution does not say so. So both actions ship\
      \ disabled behind `pr_queue.merge.enabled` and `pr_queue.close.enabled` (both `false`). Their plans still\
      \ preview what they would do.\n\n**I filed a Fleet issue instead of drafting an amendment.** § 26.2 and §\
      \ 28.5 make amendments direction work for a Grok bot or Amr, and \"add this as a feature\" is not Amr's explicit\
      \ OK for Claude Code to cross that line. The issue is bamr87/bamr87#863, with roadmap `FF-NEW:pr-queue-maintainer-merge`.\
      \ It also asks whether a console comment Amr confirms is \"automation\" under § 19.5: today it posts under\
      \ the console's identity, which is Amr's login. Turning the switches on later is a gated change.\n\n## Related\
      \ Issues\n\n- Refs #863 (the amendment's direction half)\n\n## Type Of Change\n\n- [ ] Bug fix\n- [x] New\
      \ feature\n- [ ] Breaking change\n- [x] Documentation update\n- [ ] Maintenance or refactor\n- [x] Test improvement\n\
      \n## Verification\n\n- [x] Tests pass:\n  - `python3 tools/test_fleetcore_prqueue.py` (21)\n  - `python3 tools/console/test_pr_queue.py`\
      \ (24, against an in-memory `gh`): a moved plan is refused, merge and close are refused while off, writes-off\
      \ refuses every apply, applies run exactly the planned argv, re-runs go one at a time, non-fleet repos and\
      \ forks are refused\n  - `tools/console/test_console.py` (with FastAPI: the new ops, the routes, apply without\
      \ confirm refused)\n  - `tools/console/test_mcp_layer.py` (78, with the MCP venv)\n  - `tools/console/test_pages.py`,\
      \ `tools/test_vscode_launch.py`, `tools/console/test_ops_cli.py`, `tools/console/test_decision_index.py`,\
      \ `tools/test_fleetcore.py`, `tools/test_fleetcore_graph.py`\n- [x] Lint and type checks pass:\n  - `tsc -b\
      \ && vite build`\n  - `python3 tools/schema_lint.py check .` (0 errors, 0 warnings)\n  - `tools/unwrap-prose.py\
      \ --check`\n  - `python3 -m tools.jev number lint` and `generated guard`\n  - `tools/governance_lint.py check\
      \ .`\n  - `tools/dash agents --check`\n- [x] Documentation updated: `docs/PR-QUEUE.md` (new), the console\
      \ README, `docs/DECISION-INDEX.md`, the fleetcore README and SCHEMA, the console SCHEMA and `.vscode/README.md`.\n\
      - [x] Manual verification:\n  - [`verify/scenarios/pr-queue.yml`](verify/scenarios/pr-queue.yml) passes at\
      \ desktop and mobile against this branch's console on `:4013`, which ran with `DASH_CONSOLE_GITHUB_WRITES=off`\
      \ and read live GitHub. The run selects a tab's rows and plans *Mark ready*.\n  - Every action was dry-run\
      \ through that console on 2–3 real pull requests: a plan, the job without `apply` (\"still matches GitHub\
      \ … nothing written\"), and an apply without the confirm, which the job API refused (409). The record is [`test/evidence/pr-queue/dry-runs.json`](test/evidence/pr-queue/dry-runs.json)\
      \ and the bundle is [`test/evidence/pr-queue/`](test/evidence/pr-queue/).\n  - Nothing was written to GitHub.\n\
      - `tools/check-drift.sh --report` reports one item: the dash CLI reference span in `docs/DASH.md`. It is a\
      \ generated span in a hand-written file, so it is advisory on a PR and regenerated on `main` (§ 2).\n\n##\
      \ Notes For Reviewers\n\n- **`checks_green` in `tools/weekly/closeout.py` is unchanged.** The close-out fix\
      \ for superseded cancelled checks (bamr87/bamr87#862, `fix/superseded-cancelled-checks`) is still open. The\
      \ queue sets superseded runs aside itself by the same rule (a superseded cancel drops out, an earlier failure\
      \ stays) and passes the result to `closeout.gate_verdict`. Its 9 false-red pull requests are exactly the 9\
      \ #862 found. Once #862 merges, the queue's collapse can defer to `tools/check_rollup.py`.\n- **No `changelog.d/`\
      \ fragment.** `changelog.d/README.md` and its SCHEMA restrict that directory to the hub's versioned public\
      \ interface: \"a change to the dash, the site or generated data needs no fragment\".\n- **Not exercised live:**\
      \ no apply, and no agent session, which would spend and push. The agent runs only through an injected runner\
      \ in the tests. Its § 13.8 Seatbelt sandbox, `--settings` posture, is the loop runner's, and porting the action\
      \ onto a JEV step spec is the follow-up that brings it.\n- **Fleet project placement is not done.** Adding\
      \ this PR and #863 to the Fleet project (Status *Needs Amr*, Priority P1) was refused to this session, as\
      \ § 11's write-back rule expects. They need adding by hand or through `dash projects apply`.\n- **This PR\
      \ is gated** (§ 12.3): it touches `tools/console/*.py`, `tools/fleetcore/`, `_data/fleet.yml`, `.vscode/`\
      \ and `tools/dash`. An agent never merges it.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n"
