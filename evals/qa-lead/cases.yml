    body: '## Description


      This pull request writes two related fleet standards into the hub so Amr can ratify them by merging.


      1. **Mission statements.** Every governed fleet repo states its purpose in constitution § 1 as one direction
      statement plus exactly three numbered missions, adopted only through a numbered amendment. The first mission
      provides data, tools, resources and transparency for all stakeholders in that repo''s domain, including professionals
      in the field and the general public. Ambition is written as direction, not as a claim of current capability.
      README and AGENTS.md one-liners match the direction and link to § 1. Reference implementations already open:
      [fredgar-ai#153](https://github.com/bamr87/fredgar-ai/pull/153) and [law-ai#262](https://github.com/bamr87/law-ai/pull/262).

      2. **About section as a site map.** Every non-fork, non-archived fleet repo carries a public-facing about
      section (primarily in `README.md`) that maps identity, mission, docs, getting started, contributing, governance,
      roadmap, changelog, security/support, license and live site, with required vs optional rules in [docs/ABOUT-SECTION.md](docs/ABOUT-SECTION.md).
      This extends, and does not replace, the portfolio README skeleton.


      The pull request also adds [docs/FLEET.md](docs/FLEET.md): general fleet information, organization structure
      (bamr87, year-of-ai, ai-world-view, bash-365, EissaLab; submodule layout; ownership; the hub-first then fan-out
      governance flow), and a per-repo context table with about-section coverage as of 2026-11-16. Descriptions
      are taken from the registry, GitHub, or a README that was opened; unknown ones are marked unknown.


      The hub''s own constitution § 1, PRD § 1, AGENTS.md one-liner and the control-plane half of the profile README
      are updated to match in this same PR. Spoke fan-out and the conformance check are follow-up work (roadmap
      fragments below). Nothing is merged by this PR.


      ## Governance Trace


      Governed by: docs/amendments/proposed/mission-and-about-section.md (`AMEND-NEW:mission-and-about-section`);
      `FR-NEW:mission-statements`; `FR-NEW:about-section-sitemap` (constitution § 28). Handoff: Amr''s voice request
      on 2026-11-16.


      ## Type Of Change


      - [ ] Bug fix

      - [ ] New feature

      - [ ] Breaking change

      - [x] Documentation update

      - [ ] Maintenance or refactor

      - [ ] Test improvement


      ## What lands, and what is numbered at merge


      Per amendment 0002 this PR does not hand-pick sequential ids. `python3 -m tools.jev number plan` against current
      `main` would assign:


      | Kind | Slug | Next on main today |

      | --- | --- | --- |

      | Amendment | `mission-and-about-section` | 0033 |

      | Features | `about-section-sitemap`, `mission-statements` | HUB-116, HUB-117 |

      | Requirements | same slugs | FR132, FR133 |

      | Roadmap | `about-section-sitemap`, `fleet-mission-statements` | FF-0055, FF-0056 |


      Those numbers move if another pending fragment (for example #858 `onprem-compute`, which also uses `NEW` and
      proposes constitution § 30) merges first. This section is therefore numbered **§ 31** in `docs/constitution.md`
      to avoid colliding with #858''s proposed § 30.


      #858 and #905 already have `needs-amr`; this one should too, because merging ratifies a constitution change.


      ## Verification


      - [x] `python3 tools/governance_lint.py check .`

      - [x] `python3 -m tools.jev number lint --base origin/main` and `number plan`

      - [x] `python3 tools/schema_lint.py check .`

      - [x] `python3 tools/unwrap-prose.py --check` on the changed Markdown

      - [x] `python3 tools/gen-specs-data.py` (UPS-DOC-11 added; `_data/specs.yml` regenerated)

      - [ ] CI on this PR (will report once it finishes)

      - Docs index is `jev-main-only`: `docs/README.md` is left stale on purpose and will be regenerated on `main`
      after merge.


      ## Notes For Reviewers


      - Fan-out to other repos is **not** in this PR. Roadmap entries `FF-NEW:fleet-mission-statements` and `FF-NEW:about-section-sitemap`
      track it.

      - The hub profile README keeps the personal intro; the mission one-liner and site map sit in the control-plane
      half ("This repository" / Documentation / License).

      - Coverage in docs/FLEET.md § 4 is file presence plus the 2026-11-16 mission scan, not a heading-by-heading
      README audit. Getting started was not scored from files alone.'
