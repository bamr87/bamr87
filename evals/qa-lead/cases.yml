    body: "## Description\n\nGives the four devenv-hosted sites (bamr87.github.io, lifehacker.dev, cv-pro, rewind-arcade)\
      \ a local address in the app portal, on the ports the hub's devenv container actually publishes. This is the\
      \ hub half of P1 (#702, epic #698). The `dev-up` / `dev-down` / `dev-logs` operations already shipped in #758.\n\
      \n**Why.** `tools/fleetcore/apps.py` `local_targets()` returned nothing for `host: devenv`, and `_data/ports.yml`\
      \ allocated those projects 4012, 4013 and 5175. devenv publishes none of those ports. It publishes 4040-4049,\
      \ 35760-35769 and 5000-5001, which is also where their `.vscode/launch.json` entries serve.\n\n**What changed**\n\
      \n- **`_data/ports.yml`**\n  - Adds the workspace bands (`workspace` 4040-4069, `workspace_livereload` 35760-35789,\
      \ `workspace_node` 5000-5019), matching `_data/fleet.yml` `containers.ports.workspace*`.\n  - Narrows `frontend`\
      \ to 5020-5199 so no two bands overlap. Only cv-pro's grandfathered 5000 sat below 5020.\n  - Moves the four\
      \ projects to the ports their launch entries use: bamr87.github.io 4040 (livereload 35760), lifehacker.dev\
      \ 4041 (livereload 35761), cv-pro 5000, rewind-arcade 5001.\n  - Gives each of the four a `start:` field holding\
      \ exactly its launch entry's command.\n  - The header now explains devenv local targets.\n  - `compose/fleet.env`\
      \ and `compose/overrides/hub.yml` were regenerated with `tools/fleet-compose.py sync`. A second `sync` leaves\
      \ no diff.\n- **`tools/fleet-compose.py`** (drift check (m)):\n  - A Jekyll allocation's livereload falls\
      \ in `<band>_livereload` when that band exists.\n  - A `host: devenv` allocation must be on a workspace band,\
      \ and no other host may use one.\n  - Bands may not overlap.\n- **`tools/fleetcore/apps.py`**:\n  - A devenv\
      \ allocation becomes a local target only when it lies inside a declared workspace band.\n  - Its `start` comes\
      \ from the registry's `start:`, because `tools/dash dev up` does not apply to these projects.\n  - Every local\
      \ target now carries `host` (`compose` or `devenv`). The field is additive, so the `fleet-launcher/v1` schema\
      \ marker is unchanged.\n- **Console (`Apps.tsx`, `types.ts`)**: a devenv Local target gets no Start, Logs\
      \ or Stop. Instead the page explains that the site is served inside devenv and shows the command with a copy\
      \ button. The server already refuses `dev-up` for these projects (`core.stack_projects()`).\n- **`tools/docker_view.py`**:\
      \ workspace-band services are web pages, and their livereload counts in its own band.\n- **Tests**\n  - `tools/test_fleetcore_apps.py`:\
      \ the old line-64 case, which pinned \"devenv has no local address\", is replaced by `test_a_devenv_hosted_project_offers_its_workspace_port`\
      \ and `test_every_hub_devenv_site_opens_on_the_port_devenv_publishes`. Both fail on `main`. A new case, `test_a_devenv_port_devenv_does_not_publish_is_not_offered`,\
