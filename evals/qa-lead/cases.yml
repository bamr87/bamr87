# evals/qa-lead/cases.yml — the eval set for QA Lead, the § 15 completeness reviewer
# (.github/scripts/dash-gen/qa_lead.py `decide()`: the gate, the four lines, the event),
# constitution § 13.1. Runner: python3 tools/evals.py run qa-lead (offline, no model); the
# regression check is tools/test_evals.py in the python-tests workflow.
#
# Each real case is a merged fleet pull request recorded with
#   python3 .github/scripts/dash-gen/qa_lead.py facts --repo OWNER/NAME --pr N
# on 2026-11-23: its files, labels, size, author, body (cut at 6,000 characters where
# that changes no line) and the CI runs its body links, resolved against its head commit.
# The expectations were checked line by line against § 15 by the PR that added the set;
# the maintainer ratifies them by merging it. None of these pull requests linked a green
# run of its own head commit — § 15.2 is newer than all of them — so every real reviewed
# case is known-gap, and the two known-good cases (ids `rule-*`) are written for a stated
# rule under evals/SCHEMA.md's convention; the first real complete pull request replaces
# them. The advisory AI read is not in this set: it never changes the verdict.
#
# input:     author, labels, additions, deletions, files[], ci_runs[{id, head_match,
#            conclusion}], body, optional frontend_paths[] (the repo's verify/verify.yml).
# expected:  review, major, frontend; when review is true, event and lines{tests, ci,
#            visual, template} as pass | gap | n/a.
# pass:      the human-readable criterion the runner enforces.
schema: evals/v1
role: qa-lead
mode: deterministic
target: .github/scripts/dash-gen/qa_lead.py
