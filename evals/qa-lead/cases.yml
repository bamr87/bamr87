    body: '## Description


      `TEST (Latest Dependencies)` ran one linear pipeline across three runners (`build-latest` → `test` → `publish`)
      and handed the Docker image between them as an artifact: saved and uploaded in the build job, then downloaded
      and loaded again in the test job and in the publish job. bamr87/bamr87#552 measured about 2-3 billed minutes
      a run spent moving that tarball, plus three per-job round-ups (11 billed minutes a scheduled run, 13 a push
      run).


      The hand-off was also the reason the canary has been red since 2026-11-11. The build job''s `docker compose
      images -q jekyll` is always empty after `docker compose run --rm`, because that command lists the images of
      existing containers only. The step then fell back to `docker images | head -1`, which on the current Docker
      29 runners (containerd image store) returns an arbitrary image. In scheduled run [43684710049](https://github.com/bamr87/zer0-mistakes/actions/runs/43684710049)
      the build job saved the compose `validate` service''s image (`bcd6bef6e203`), and the test job then tagged
      a preinstalled runner image (`342cd624e1f1`) and ran validation in it.


      This PR merges the three jobs into one, `build-test-publish` (`Build, Test & Publish (Latest Deps)`, `timeout-minutes:
      25`), and keeps the step order:


      - **No hand-off.** `Save Docker Image`, `Upload Docker Image Artifact` and both `Download`/`Load` pairs are
      gone. The image stays in the runner''s Docker daemon from the build to the push.

      - **The image is named, never guessed.** A new `Resolve Built Image` step takes `zer0-mistakes-jekyll:dev-test`
      on push and dispatch runs (the `docker buildx build -t` name), and on the schedule the `jekyll` service''s
      image as `docker compose build` named it (`docker compose ... config --images jekyll`, which is `zer0-mistakes-jekyll`
      on the runner). If no image has that name, the run fails there. There is no `head -1` fallback. The step tags
      the image `zer0-mistakes-jekyll-test:latest` for the unchanged test steps.

      - **Same publish gate, at step level.** `Login to Docker Hub`, `Tag and Push Immutable Image`, `Save Latest
      Tag Reference` and `Upload Tag Reference` each carry `if: github.ref == ''refs/heads/main'' || inputs.force_publish`.
      A step `if:` without a status function also requires every earlier step to have succeeded, so nothing is pushed
      unless the build and every test passed, as before. They read `steps.tag.outputs.tag` and `steps.image.outputs.id`
      instead of the old job outputs.

      - **`debug-failure`** now `needs: [build-test-publish]`. It still fires on a build or test failure. A job
      output (`tests_outcome`, the last test step''s outcome) keeps it from firing on a failure in the publish steps,
      which matches the old graph, where it did not depend on `publish`.

      - Triggers, concurrency, `env`, the cached push build and the daily `--no-cache` scheduled build are unchanged.
      `.github/workflows/README.md` gets one sentence on the single job.


      Deviation from the triage plan: the plan suggested `docker compose ... images -q jekyll` for the scheduled
      path. That command returned nothing in both runs I read (the scheduled run above and dispatch run [43745153232](https://github.com/bamr87/zer0-mistakes/actions/runs/43745153232)),
      so the step uses `config --images jekyll`. That resolves the name compose builds under ("Image zer0-mistakes-jekyll
      Built" in the scheduled run''s log) without needing a container.


      Other behaviour changes, all small:


      - The Actions UI shows one job, and on a non-`main` dispatch the four publish steps show as skipped instead
      of a skipped `Publish Image` job. `test-latest.yml` does not run on `pull_request`, so no PR check depends
      on the old job names.

      - Scheduled runs now test and publish the `jekyll` service''s image. Before, they used whichever image `head
      -1` returned (the `validate` image on 2026-11-15). Both are built from the same `dev-test` target.

      - `Generate Test Summary` runs only once the image has resolved (`always() && steps.image.outcome == ''success''`).
      Before, it ran in the test job, which started only after a successful build.

      - `actions/cache@v6` saves only when its job succeeds (`post-if: success()`), and its job is now the whole
      pipeline, so a run whose tests fail no longer saves the buildx layer cache. The key is the `docker/Dockerfile`
      hash, so this matters only for the first run after a Dockerfile change.


      **Relation to #619.** This branch starts from #619''s head (`fix/test-latest-image-load`), so its commit is
      included. The restructure deletes the load steps #619 patches, and also the build job''s save step, whose
      `head -1` fallback #619 does not touch, so it supersedes #619. If #619 merges first, `git rebase origin/main`
      skips #619''s commit here (same patch) and replays this one cleanly; I simulated that squash-then-rebase locally
      and the result is byte-identical. If this PR merges first, #619 has nothing left to fix.


      Closes bamr87/bamr87#552


      Handoff: bamr87/bamr87#552 (fleet-doctor report)


      ## Type


      - [ ] `feat` — new feature

      - [ ] `fix` — bug fix

      - [ ] `docs` — documentation only

      - [ ] `refactor` / `perf` / `style`

      - [ ] `test` — tests only

      - [x] `chore` / `ci`


      ## Checklist


      - [x] Conventional-commit title (`type(scope): subject`)

      - [ ] `CHANGELOG.md`: not applicable, CI only (release-please writes it)

      - [ ] `./scripts/bin/test`: not run. The change is to a workflow that the theme suites do not exercise; the
      dispatch run below runs the workflow itself.

      - [ ] Theme/layout/include/sass change → Jekyll build validated: not applicable

      - [x] No version bump

      - [ ] Backlog task status: not applicable (no backlog task mirrors this issue)


      ## Verification


      Run locally:


      - `actionlint -ignore SC2086 -ignore SC2129 -ignore SC2035` (what `lint-workflows.yml` runs, over every workflow):
      exit 0. Plain `actionlint .github/workflows/test-latest.yml` reports 40 SC2086 info and 4 SC2129 style notes,
      all in unchanged steps; `main`''s version of the file has 42 and 4.

      - The YAML parses. No `docker save`, `docker load`, `downlo'
