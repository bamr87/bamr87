- id: bamr87-912
  source: https://github.com/bamr87/bamr87/pull/912 — a release cut of CHANGELOG.md alone
  input:
    author: bamr87
    labels:
    - needs-amr
    additions: 4
    deletions: 0
    files:
    - CHANGELOG.md
    ci_runs: []
    body: '## Description


      Cuts v2.2.0 of the hub''s reusable workflow interface: the `## [Unreleased]` entries move under `## [2.2.0]
      - 2026-11-16`, with the release''s summary paragraph. `CHANGELOG.md` only, the same shape as #851.


      ## Why now


      The floating `v2` tag is behind `main` on a decision that is already in force.


      | Ref | `claude-auth`, `claude-run`, `ai-lane.yml`, `fleet-verify.yml` |

      | --- | --- |

      | `v2` (= `v2.1.0`, `1c2da537`) | read `ANTHROPIC_API_KEY`, follow the caller''s `CLAUDE_AUTH_ORDER` (default
      `oauth,api_key`) |

      | `main` | OAuth only since #859 (2026-11-15): `CLAUDE_CODE_OAUTH_TOKEN` alone, `api_key` ignored with a notice,
      the key inputs kept declared and unread |


      `v2.1.0` was tagged the same day, before #859 merged. Three commits on `main` since the tag touch the interface:
      #859''s merge and its commit, and `d58f335c` (ai-runner kit 0.4.0 pins).


      The fleet has not felt this only because it is not pinned yet. Across the 39 submodules today: 34 callers
      of `claude-auth@main`, 27 of `claude-run@main`, 24 of `fleet-verify.yml@main`, 23 of `fleet-conformance.yml@main`,
      12 of `ai-lane.yml@main`. That is UPS-WORK-10 and UPS-QA-40 failing in 38 of 38 graded repos, the most-failed
      requirement in the fleet (`tools/dash spec fleet`, 2026-11-16), and it is what #458 is queued to fix. Every
      kit already seeds `@v2`, so each kit upgrade that lands moves a caller from the OAuth-only `main` back to
      the key-reading `v2`. Moving `v2` first removes that step backwards.


      A caller with no OAuth token skips its agent step, as before; nothing turns a green caller red, so this is
      a minor release.


      ## After this merges (Amr, from `docs/WORKFLOW-VERSIONING.md` "Cutting a release")


      ```bash

      git fetch origin && git checkout <merge-sha>

      git tag -a v2.2.0 -m "v2.2.0 — reusable workflow interface"

      git push origin v2.2.0

      gh release create v2.2.0 --verify-tag --title "v2.2.0" --notes "See CHANGELOG.md"

      git tag -fa v2 -m "v2 → v2.2.0" v2.2.0^{}

      git push --force origin refs/tags/v2

      ```


      Rollback: point `v2` back at `v2.1.0` (`1c2da537`).


      ## Open pull requests this touches


      Checked by trial merge against the 38 other open hub pull requests (2026-11-16): none of them edits `CHANGELOG.md`,
      so **this branch conflicts with none**, and it merges cleanly with #911 and #913.


      - **Order with any pull request that carries a `changelog.d` fragment** (#913, #875 and others): when one
      of those merges, the numbering job folds its fragment into `## [Unreleased]`, the lines this branch moves.
      If that happens first, this branch needs its move redone on the new `main`. Merging this one first avoids
      it.

      - **In the fleet, once the tag moves**: the callers already at `@v2` for the four changed files start running
      the OAuth-only versions. Among the 39 submodules'' default branches no workflow calls those four files at
      `@v2` yet; the hub''s own `claude.yml` (`claude-auth@v2`) and `ai-lane.yml` on `main` (`claude-run@v2`) do,
      and both already restrict themselves to OAuth at the call site. The next callers will be the 36 open `chore/agent-context-kit`
