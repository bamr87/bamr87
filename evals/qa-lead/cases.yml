    ci_runs: []
    body: "## What & why\n\nToday an agent writes to GitHub as whoever's credentials it holds: the job's `GITHUB_TOKEN`,\
      \ the shared Claude App (`claude[bot]`, only reachable inside Actions), or, in the fleet hub, the maintainer's\
      \ personal token. With the last, the maintainer is the author of the agent's work, so GitHub never asks them\
      \ to review it and never lets them approve it (bamr87/bamr87#565: 77 of 173 audited automated comments carried\
      \ the maintainer's login).\n\nThis PR adds an optional **agent identity App** that each maintainer registers\
      \ and owns. With its two secrets set, every lane and every interactive session writes as the maintainer's\
      \ own `<name>[bot]`. That makes the agent's work reviewable and approvable like any contributor's, and GitHub\
      \ never lets an App approve its own PR. Without the secrets, every lane behaves exactly as before.\n\n**`app/identity/`**\n\
      - **`manifest.json`** is a private App with no webhook and no events. It gets contents, pull requests and\
      \ issues write, workflows write, actions and checks read, and metadata.\n- **`register.py`** registers it\
      \ in one step through GitHub's manifest flow:\n  - it serves one page on `127.0.0.1` and checks the `state`\
      \ on the callback;\n  - it keeps the key at `~/.config/githubai/<slug>.pem` with mode 0600, and throws away\
      \ the client and webhook secrets;\n  - it prints the install link and the two `gh secret set` commands.\n\
      - **`agent_token.py`** mints a one-hour token for one repository with an openssl-signed JWT, so it needs no\
      \ Python packages. It runs a command as the bot (`-- gh …`, or `-- claude` for a whole session) without printing\
      \ the token.\n\n**`actions/agent-identity`** resolves the bot's login, user id and noreply email. With no\
      \ App it outputs `claude-code-action`'s own defaults (`claude[bot]`, id `41898282`), so a lane without the\
      \ App commits exactly as it does today.\n\n**Every `claude*.yml` lane** declares optional `AGENT_APP_CLIENT_ID`\
      \ and `AGENT_APP_PRIVATE_KEY` secrets. When both are set, the lane:\n- mints the App's token with `actions/create-github-app-token@v3`;\n\
      - resolves the bot before the framework checkout is removed;\n- passes `github_token`, `bot_id` and `bot_name`\
      \ to `claude-code-action`, and the token to its own `gh` steps.\n\nThe stubs already pass `secrets: inherit`,\
      \ so no stub changes.\n\n**`agent-handoff.yml`** is a new workflow, with a stub the installer adds. When a\
      \ *person* pushes a `claude/**` branch, it opens a draft PR as the bot and asks that person to review it.\
      \ This is how a web or terminal Claude Code session's work becomes authored by the agent: the session only\
      \ pushes. It does nothing (just leaves a notice) without the App, never runs commit messages through the shell,\
      \ and can be switched off with `vars.AGENT_HANDOFF_ENABLED`.\n\n**Docs:**\n- `app/identity/README.md`: register,\
      \ install, secrets, lanes, sessions, local use, rotate and revoke;\n- `app/README.md` and `README.md`;\n-\
      \ `docs/workflows.md` and `docs/security.md` (this also corrects a stale line that still described the `ANTHROPIC_API_KEY`\
      \ fallback);\n- an `AGENTS.md` sync duty;\n- ADR 0006 (proposed), and feature `GHAI-008` with the PRD block\
      \ regenerated.\n\n## How verified\n\n- **CI is green on `de5d858`:** `tests`, `relay`, `shell`, `standard\
      \ / ci`, `verify / Scenarios + evidence`, `conformance / UPS conformance` and `oneline`. The review and auto-merge\
      \ evaluation lanes skipped, as they do on a draft.\n- `python3 -m pytest -q` passes, 88 tests. That includes\
      \ the 23 new ones in `tests/test_identity.py`:\n  - the manifest's least privilege, with a cap on which permissions\
      \ are allowed;\n  - the action's fallback defaults, and that the token is never printed;\n  - every lane's\
      \ wiring (parametrized across all 7);\n  - the handoff's guards: people only, a kill switch, nothing interpolated\
      \ into the script, and a read-only job token;\n  - `register.py` end to end against a real local HTTP callback,\
      \ including the state check, HTML escaping and the key's 0600 mode;\n  - `agent_token.py` with a real RS256\
      \ JWT, generated by openssl and verified against the public key, plus token scoping and the guarantee that\
      \ no mode except `env` prints the token.\n- `(cd app/relay && npm test)` passes, 68 of 68.\n- `shellcheck\
      \ setup/install.sh` is clean.\n- `tools/gen_reference.py --check` and `tools/docs_index.py --check` report\
      \ both up to date.\n- The hub's `governance_lint.py check` is OK.\n- `actionlint` only reports `github.job_workflow_sha`\
      \ as unknown. That's a gap in this actionlint version: all six automation lanes already use it on `main`,\
      \ and `claude.yml` now uses the same pattern.\n- `unwrap-prose --check` flags only `ai-seed/seed/kernel/SCHEMA.md`,\
      \ which already fails on `main` and is untouched here.\n- **Not verified: a live run.** The App doesn't exist\
      \ yet. Registering it needs the maintainer's browser, and agents can't create Apps or secrets. Once it's registered,\
      \ the dogfooding runs on this repo are the behavioral check.\n\n## Risk & compatibility\n\n- **Purely additive\
      \ to the public API:** two new optional `workflow_call` secrets, a new workflow file and stub, and a new composite\
      \ action. Nothing is renamed.\n- **No behavior change without the secrets.** `github_token` is empty, so `claude-code-action`\
      \ still does its own token exchange, and `bot_id`/`bot_name` are its defaults. `gh` steps still use `github.token`.\n\
      - **With the App, write scope is set by the App, not by `permissions:`.** An installation token is bounded\
      \ by the App's permissions and the repos it's installed on, not by the job's `permissions:` block. The manifest\
      \ is least-privilege, and the test caps it.\n- **In the auto-merge lane, the approval comes from the bot when\
      \ the App is configured.** It still satisfies a one-approval rule for the PRs that lane exists for. It can\
      \ never approve a PR the bot authored.\n- **Installed repos gain `agent-handoff.yml` on their next install.**\
      \ It's a no-op without the App's secrets.\n\n## Definition of Done\n\n<!-- fleet-dod:start v1 -->\n- [x] **Title**\
      \ is a Conventional Commit (`feat:`, `fix:`, `do"
  expected:
