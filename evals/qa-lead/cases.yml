- id: bamr87-846
  source: 'https://github.com/bamr87/bamr87/pull/846 — a one-file CI fix: neither major nor frontend'
  input:
    author: bamr87
    labels:
    - automation
    - fleet-doctor
    additions: 13
    deletions: 3
    files:
    - .github/workflows/markdown-oneline.yml
    ci_runs:
    - id: 42896189299
      head_match: false
      conclusion: failure
    body: '<!-- fleet-doctor key="bamr87/bamr87:.github/workflows/markdown-oneline.yml" -->


      ## Problem


      `bamr87/bamr87` · `.github/workflows/markdown-oneline.yml` · queued as a priority cost candidate (401 runs
      / 14d, 285.4 job-min, 15.2 job-min wasted, 96.9% success). The run history has **12 `pull_request` failures**.
      7 of them are on `chore/jev-numbering`, and the others are on short-lived agent/amend branches.


      ## Root cause


      The job checks out `github.event.pull_request.head.ref`, which is the branch **name**. The JEV numbering PR
      is merged right after its last push, and auto-delete removes the head branch before this job starts. On run
      42896189299, PR #817 merged at 20:31:52 and the job started at 20:31:55. `actions/checkout` then retried the
      fetch of a ref that no longer existed and failed after ~35 s:


      ```

      git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 origin +refs/heads/chore/jev-numbering*:refs/remotes/origin/chore/jev-numbering*
      ...

      ##[error]The process ''/usr/bin/git'' failed with exit code 1

      ```


      So these failures were not prose violations. The job was trying to check out a branch that had already been
      deleted.


      ## Fix


      - `ref:` is now `github.event.pull_request.head.sha || github.sha`. GitHub still serves the head commit through
      `refs/pull/N/head` after the branch is deleted, so checkout succeeds and the prose check runs. The repair
      commit still lands on the same base, and `git push origin HEAD:refs/heads/$HEAD_REF` works the same from a
      detached HEAD. If someone pushes to the branch in the meantime, the push is now rejected as non-fast-forward
      instead of committing on top of a branch tip this run never checked.

      - Before pushing, the repair step runs `git ls-remote --exit-code --heads`. If the branch is gone (the PR
      already merged or closed), it writes a notice and exits 0 instead of recreating the deleted branch. Any wrapped
      prose that reached `main` is still reported by the `push` run, which fails as before.


      This touches the hub''s own copy only. It is already a hand-diverged variant of `templates/prose/markdown-oneline.yml`
      (it has extra path filters and job-level permissions). The kit template has the same `head.ref` checkout,
      so fleet repos with fast-merging bot PRs can fail the same way. That fix needs a kit bump to 0.5.0 with an
      `archive/` shape and is left for a follow-up.


      Checks run: `tools/check-drift.sh` reports no drift, `tools/dash workflows lint` reports 0 errors, and `python3
      tools/test_unwrap_prose.py` passes. `actionlint` was not available in this runner.


      ## Expected impact


      About 7 of every 12 red runs go away: the false reds on JEV numbering merges. That saves ~35 s of retry backoff
      each (~0.6 job-min) and removes a false failure from `pr-review`''s sticky comment and from triage. That is
      a small number of minutes, but it takes out most of the failure noise behind this candidate.


      ## Links


      - Failing run: https://github.com/bamr87/bamr87/actions/runs/42896189299 (others: 42747239633, 42178245696,
      41780272418, 41569439008, 41372165919, 41360388240, 41352111293)

      - Dash Actions page: https://bamr87.github.io/bamr87/actions/


      🤖 Generated with [Claude Code](https://claude.com/claude-code)

      '
  expected:
    review: false
    major: false
    frontend: false
  pass: review, major and frontend equal expected; when reviewed, the event and every line's status too
- id: bamr87-872
  source: 'https://github.com/bamr87/bamr87/pull/872 — a two-file workflow tweak that links runs: still not reviewed'
  input:
    author: bamr87
    labels:
    - skip-evidence
    additions: 10
    deletions: 6
    files:
    - .github/workflows/python-tests.yml
    - docs/WORKFLOW-OPTIMIZATION.md
    ci_runs:
