- id: bamr87-946
  source: https://github.com/bamr87/bamr87/pull/946 — a small python-tests trigger change
  input:
    author: bamr87
    labels: []
    additions: 129
    deletions: 3
    files:
    - .github/workflows/python-tests.yml
    - .github/workflows/update-submodules.yml
    - docs/WORKFLOW-OPTIMIZATION.md
    - tools/SCHEMA.md
    - tools/test_python_tests_paths.py
    ci_runs: []
    body: '## Description


      Why did Python Tests run 977 run in full after the ratify merge? On 2026-11-20 four code merges (#937, #943,
      #936, #933) landed between 20:30:57 and 20:33:35 UTC. The jev-number ratify job then merged its record PR
      #945 (two lines in `docs/adr/`) at 20:36:22, **167 s** after #933. That gap is longer than the 110 s push
      debounce, so the following happened:


      1. #933''s push run had already started its three shards.

      2. #945''s push joined the `python-tests-refs/heads/main` concurrency group and cancelled #933''s run about
      50 s in.

      3. #945''s run (number 977) then ran every shard on a tree that differed from #933''s only by those two docs
      lines. The `changes` job''s docs-only skip applies only to PRs. On a push it always answers "run".


      The ratify merge always follows a code merge by a few minutes, because it waits for its own PR''s checks.
      The debounce cannot absorb that gap without going over its 115 s billing ceiling.


      **Fix:** add a `paths:` filter to the push trigger that skips the same directories as the PR-side case statement
      (`docs/`, `changelog.d/`, `features/features.d/`, with `docs/JEV.md`, `docs/FRONTEND-PLATFORM.md` and `docs/SCHEMA-FRAMEWORK.md`
      re-included). A docs-only push now starts no run, so it never enters the concurrency group and never cancels
      its predecessor. In the Nov 20 burst, #933''s run would have finished and tested the whole burst. A step inside
      `changes` could not do this, because a run cancels the one before it as soon as it enters the group.


      Pull requests and the nightly run stay unfiltered, so the floating-dependency sensor is unchanged. The ratify
      guard reads checks on the record PR''s head, not on main, so it is unaffected.


      ## Governance Trace


      Governed by: constitution § 10 (DevOps methodology); docs/WORKFLOW-OPTIMIZATION.md (Actions waste passes,
      continuing bamr87/bamr87#799 and bamr87/bamr87#821). No FR covers Actions cost directly. Handoff: none (operator
      question in a local session).


      ## Related Issues


      - Follows bamr87/bamr87#799, bamr87/bamr87#821


      ## Type Of Change


      - [ ] Bug fix

      - [ ] New feature

      - [ ] Breaking change

      - [x] Documentation update

      - [x] Maintenance or refactor

      - [x] Test improvement


      ## Verification


      - [x] Tests pass: `python3 tools/test_python_tests_paths.py` (new: keeps the case statement and the filter
      equal and checks sample paths in GitHub''s last-match-wins order), `tools/test_fleetcore_workflows.py`, `test_schedule.py`

      - [x] Lint/type checks pass: `actionlint` on both workflows, `tools/dash workflows lint` (0 errors; its 5
      warnings were already there), `tools/check-drift.sh` green, `schema_lint` clean, `unwrap-prose --check`

      - [x] Documentation updated: the workflow header (new DOCS-ONLY PUSHES section), a `docs/WORKFLOW-OPTIMIZATION.md`
      entry, a `tools/SCHEMA.md` row, and the now-stale comment in `update-submodules.yml`

      - [ ] Manual verification completed, if needed: `skip-evidence` (CI-only, nothing to see)


      ## Notes For Reviewers


      - **Risk:** a docs-only push leaves main''s tip without a push run. Tests do not read those paths (2026-11-05
      read trace), and the nightly run still runs everything.

      - **Not changed (follow-ups):** CodeQL default setup runs on every push, bot commits included (254 runs /
      1,512 job-min in 14 days). PR-side cancellations of Python Tests (about 1,100 cancel-minutes in 14 days) have
      no debounce. `PR review`''s `workflow_run: ["**"]` fires about 1,100 runs a week, most of them skipped.


      ---

