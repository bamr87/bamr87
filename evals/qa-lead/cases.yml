      \ and `_data/`.\n\n**Left out on purpose.**\n- The Django `X-Frame-Options` fixes for djangoerp, fredgar-ai\
      \ and zer0-CMS. The issue scopes them as one PR per repo, and they belong to ADR 0006's django kit (#716).\n\
      - No real stack was started (§ 10.5).\n- `features/features.yml` HUB-078 still says the launcher joins only\
      \ \"compose-hosted\" ports. That text is direction (§ 26, § 28), so I left it for a Grok bot or Amr to update.\n\
      \n## Governance Trace\n\nGoverned by: FR76, https://github.com/bamr87/bamr87/pull/667 (ADR 0005 P1) Handoff:\
