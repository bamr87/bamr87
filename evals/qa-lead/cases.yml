- id: bamr87-903
  source: 'https://github.com/bamr87/bamr87/pull/903 — a desktop link fix: frontend with a desktop+laptop evidence
    bundle'
  input:
    author: bamr87
    labels: []
    additions: 840
    deletions: 54
    files:
    - docs/FRONTEND-PLATFORM.md
    - features/features.yml
    - test/evidence/desktop-context-menu/README.md
    - test/evidence/desktop-context-menu/desktop-crafted-link-falls-back.png
    - test/evidence/desktop-context-menu/desktop-live-beside-local-menu.png
    - test/evidence/desktop-context-menu/desktop-reopened-from-link.png
    - test/evidence/desktop-context-menu/laptop-crafted-link-falls-back.png
    - test/evidence/desktop-context-menu/laptop-live-beside-local-menu.png
    - test/evidence/desktop-context-menu/laptop-reopened-from-link.png
    - test/evidence/desktop-context-menu/report.json
    - tools/console/README.md
    - tools/console/web/src/pages/Desktop.tsx
    - verify/scenarios/desktop-context-menu.yml
    ci_runs: []
    body: "## Description\n\nA shared or restored Desktop layout lost each app window's target. Live beside Local\
      \ reopened as two windows on the app's default target. #747 called this the part of #701 it left open. This\
      \ PR adds it.\n\n- **Desktop layout (`tools/console/web/src/pages/Desktop.tsx`).** The layout now carries\
      \ each app window's view beside the reducer's own layout. The new field `a` holds one entry per window: the\
      \ target id, the device and the path inside the app, or `null`. This applies to both the `?windows=` link\
      \ and the tab's sessionStorage layout. On boot an entry is kept only if:\n  - the app declares the target\
      \ (`targets[].id`),\n  - the device is in the verify kit's device matrix (`doc.viewports`), and\n  - the path\
      \ stays inside the app's address (AppPane's own `inside()`).\n\n  Anything else falls back to the app's default\
      \ target, Fit and no path. A layout still carries ids, never an address.\n- **Restoring views.** Each restored\
      \ window is paired with its own entry by walking the layout's windows in order. `decodeLayout` drops entries\
      \ but never reorders them, so the pairing holds.\n- **Vendored reducer.** `vendor/bashos/shell.js` is unchanged,\
      \ so the bashOS GUI still reads these links: it ignores `a`.\n- **Link encoding.** The link is now base64url\
      \ of the layout's UTF-8. A path typed with a non-Latin character used to make `btoa` throw and broke the link\
      \ button. An ASCII layout encodes byte-for-byte as before, so old links still open.\n- **Scenario (`verify/scenarios/desktop-context-menu.yml`).**\
      \ After Live beside Local, the scenario:\n  - copies the taskbar's layout link,\n  - reloads `/desktop` and\
      \ asserts left = Live, right = Local,\n  - opens the copied link with the tab's layout cleared and asserts\
      \ the same,\n  - opens a crafted link. Its left window asks for `local`, `mobile` and `/docs/` and gets all\
      \ three. Its right window asks for target `https://example.com`, device `watch` and a path on another site,\
      \ and falls back to Live, Fit and no path.\n\n  It now runs at two desktop widths, 1280×800 and 1024×768.\
      \ The title-bar menu screenshot now waits for the menu's fade-in. Before, the image showed no menu.\n- **Docs.**\
      \ `tools/console/README.md` and `docs/FRONTEND-PLATFORM.md` say what a layout link keeps. The Desktop.tsx\
      \ header comment explains `a`.\n- **HUB-079 stamped `verified: {date: 2026-11-16, by: agent}`.** All three\
      \ of its scenarios pass on the static build. See the reviewer notes for how the stamp was written.\n\n## Governance\
      \ Trace\n\nGoverned by: FR77, https://github.com/bamr87/bamr87/pull/667 (ADR 0005, phase D1 of epic #698)\
      \ Handoff: #701\n\n## Related Issues\n\n- Closes #701\n\n#701's four acceptance boxes:\n- Page windows: #697.\n\
      - `frame-ancestors 'self'`: #697, pinned by `test_console.py`.\n- Live beside Local: #747.\n- Context menus\
      \ by keyboard: #747.\n\nThis PR adds what #747 left open: a restored or shared layout reopens each window\
      \ on its own target.\n\n## Type Of Change\n\n- [ ] Bug fix\n- [x] New feature\n- [ ] Breaking change\n- [x]\
      \ Documentation update\n- [ ] Maintenance or refactor\n- [x] Test improvement\n\n## Verification\n\n- [x]\
      \ Tests pass:\n  - `python3 tools/console/test_bashos_shell.py`: OK. `shell.js` is identical to `origin/main`.\
      \ The submodule-parity case is skipped because `projects/bashos` is not checked out.\n  - `python3 tools/console/test_pages.py`:\
      \ OK.\n  - `test_console.py` in a venv with `tools/console/requirements.txt`: 60 passed, including the frame-policy\
      \ tests.\n  - `python3 tools/test_features_index.py`: 4/4.\n  - `python3 tools/test_vscode_launch.py`: OK.\n\
      - [x] Lint/type checks pass:\n  - `npm run typecheck` and `npm run build` in `tools/console/web`.\n  - `python3\
      \ tools/schema_lint.py check .`: 0 errors, 0 warnings.\n  - `python3 tools/governance_lint.py check .`: ok,\
      \ with two existing warnings on HUB-039 and HUB-094.\n  - `python3 tools/unwrap-prose.py --check` on the three\
      \ changed Markdown files.\n  - `/opt/homebrew/bin/bash tools/check-drift.sh`: \"No drift\".\n- [x] Documentation\
      \ updated: `tools/console/README.md`, `docs/FRONTEND-PLATFORM.md`, the evidence README.\n- [x] Manual verification\
      \ completed. I built the static site with `CONSOLE_BASE=/ OUT=_site tools/console/build-pages.sh`, served\
      \ it on 127.0.0.1:4071 and ran `node verify/runner.mjs`:\n  - `desktop-context-menu`: PASS at both viewports.\
      \ Evidence is in `test/evidence/desktop-context-menu/`, three images per viewport, each described in its README.\n\
      \  - `desktop` (desktop + mobile), `desktop-pages`, `apps`, `repo-app`, `console-shell`, `console-nav`: all\
      \ PASS.\n  - I also ran a one-off Playwright probe. A window with device tablet and path `/café/ünïcode?q=1`\
      \ survives the copied link exactly. No page errors.\n\n**What CI should show:** console-web, build-dash, verify\
      \ (`desktop-context-menu` at two viewports), python-tests and drift-check green.\n\n## Notes For Reviewers\n\
      \n- **Existing flake, not caused by this PR.** The scenario's `focus_returned` step fails now and then with\
      \ \"Execution context was destroyed\". Pressing Escape on the context menu sometimes sends headless Chromium\
      \ to `about:blank`. It happened 1 in 6 runs of the unchanged scenario on a `main` build, and 2 in 12 in a\
      \ probe on this branch. The second viewport doubles the chance of hitting it. A separate issue should look\
      \ at it.\n- **The stamp was not written by `runner.mjs --stamp`.** In a scratch copy, `--stamp` rewrote about\
      \ 3,000 lines of `features/features.yml`. The yaml library re-serializes the whole file, for example `[FR2,\
      \ FR5]` becomes `[ FR2, FR5 ]`. So I added only the three `verified:` lines it wrote for HUB-079. That full-file\
      \ rewrite is worth its own fix in `verify/runner.mjs`.\n- **Unchanged.** When the tab already holds a layout,\
      \ a `?windows=` link still wins over it, as before. A reload of a tab opened from a link therefore restores\
      \ the link's layout.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n"
