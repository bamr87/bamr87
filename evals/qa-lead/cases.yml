    body: "## Description\n\nThe writing section (`pages/posts/`) served every post at its bare slug. The weekly\
      \ routine drafts a `YYYY-MM-DD-chronicle.md` for every active day (constitution § 23.2) and a `YYYY-MM-DD-weekly-retro.md`\
      \ every week, so every chronicle was `/blog/chronicle` and every retro `/blog/weekly-retro`:\n\n- on the console,\
      \ `/api/site/post/chronicle` returned only the newest entry, and the others had no address;\n- on Pages, the\
      \ snapshot wrote one `site/post/chronicle.json` (the newest), one `blog/chronicle/index.html` whose title\
      \ and description came from the oldest, and a `feed.xml` with one `<id>` repeated per entry.\n\nReproduced\
      \ on `origin/main` with two un-drafted fixture chronicles: `blog/` held only `chronicle/`, titled \"Fleet\
      \ chronicle: 2026-11-05\" while its document was 2026-11-06's, and the feed ids were `['chronicle', 'chronicle']`.\n\
      \nWhat changed:\n\n- `tools/console/site_docs.py`: a post in a series (`SERIES`: `chronicle`, `weekly-retro`)\
      \ is served at its dated stem, `/blog/YYYY-MM-DD-chronicle`, from the first entry on, so no entry's address\
      \ moves when the next lands. Every file of a bare slug that two files share is served at its dated stem too.\
      \ A one-off post keeps its bare slug, so the three existing posts keep their addresses (`welcome`, `observability-for-ai-agents`,\
      \ `triaging-a-fleet-backlog-through-a-governed-write-path`). Drafts count when slugs are assigned, so a post\
      \ has the same address on a console and on Pages. `post()` accepts the longer dated slug (`POST_SLUG_RX`).\n\
      - `site_docs.py`: when `excerpt:` is missing, `description:` is the excerpt. The weekly routine writes `description:`,\
      \ which used to be ignored in favour of the first paragraph.\n- `tools/console/snapshot.py`: the site's documents\
      \ (index, pages, published posts) are built by a new `site_documents()`, which `documents()` calls, so a test\
      \ can build them from a fixture. The output is unchanged.\n- `tools/console/test_pages.py`: three new tests\
      \ and a fixture holding two published chronicles, a draft chronicle, a retro, a one-off post and a slug shared\
      \ by two posts. They check that:\n  - every post gets a distinct address that `post()` resolves;\n  - the\
      \ bare series slugs no longer resolve;\n  - `description` is used as the excerpt, and `excerpt` wins when\
      \ both are set;\n  - each published entry appears exactly once in the snapshot documents, the `blog/<slug>`\
      \ routes and `feed.xml`, and the draft appears in none of them;\n  - the hub's real posts each have a unique\
      \ address.\n\n  The console test now also checks that `/api/site` lists a series draft at its dated address\
      \ and serves it there, and that `/api/site/post/chronicle` returns 404.\n- Layout documented in `pages/SCHEMA.md`\
      \ Placement: file naming, front matter keys (`title`, `date`, `excerpt` or `description`, `categories`, `tags`,\
      \ `draft`), the series addresses and where a new series is declared, and the draft-until-reviewed rule (§\
      \ 23.4). The Posts row of `docs/CONSOLE-PAGES.md` and the Writing section of `docs/WEEKLY.md` link to it.\n\
      \nNothing is published by this PR: the three existing posts stay drafts. Publishing them is still the author's\
      \ call.\n\n## Governance Trace\n\nGoverned by: amendment 0021 `writing-chronicle` (docs/amendments/0021-writing-chronicle.md,\
      \ constitution § 23) Handoff: #662\n\n## Related Issues\n\nCloses #662\n\n## Type Of Change\n\n- [x] Bug fix\n\
      - [ ] New feature\n- [ ] Breaking change\n- [x] Documentation update\n- [ ] Maintenance or refactor\n- [x]\
      \ Test improvement\n\n## Verification\n\nRun locally in this branch's worktree:\n\n- [x] `python3 tools/console/test_pages.py`:\
      \ the new address test fails before the fix (`two posts share an address: ['weekly-retro', 'chronicle', 'chronicle',\
      \ 'chronicle', 'welcome', 'notes', 'notes']`). After it, all 16 tests pass, both with plain `python3` and\
      \ in a venv with `tools/console/requirements.txt`, where the FastAPI checks run instead of skipping.\n- [x]\
      \ `tools/console/test_console.py` in the same venv: 60 checks pass, exit 0 (`OK — console fixture tests`).\n\
      - [x] `python3 tools/test_weekly.py`: 174 tests OK.\n- [x] Static build: `snapshot.py --out <scratch> --base\
      \ / --site-url http://127.0.0.1:4000`, with two un-drafted chronicles and a retro added to `pages/posts/`\
      \ for the run only and removed afterwards. It wrote `blog/2026-11-05-chronicle/`, `blog/2026-11-06-chronicle/`\
      \ and `blog/2026-11-08-weekly-retro/`, one snapshot document each, one feed entry each, and the matching sitemap\
      \ rows. The 2026-11-06 page carries its own title and its description as the excerpt. The same run on `origin/main`\
      \ produced the collision described above. The Vite half of `build-pages.sh` (npm install, tsc, vite build)\
      \ was not run, because no web code changed.\n- [x] `/opt/homebrew/bin/bash tools/check-drift.sh`: No drift.\n\
      - [x] `python3 tools/schema_lint.py check .`: 0 errors, 0 warnings.\n- [x] `python3 tools/unwrap-prose.py\
      \ --check pages/SCHEMA.md docs/CONSOLE-PAGES.md docs/WEEKLY.md`: already unwrapped.\n- [x] `python3 tools/governance_lint.py\
      \ check .`: ok (2 warnings on HUB-039 and HUB-094, which are already on main).\n- [x] `flake8 --select=F`\
      \ on the three Python files: clean.\n\nCI should show drift-check and python-tests green.\n\nEvidence: skipped\
      \ (`skip-evidence`). No page code changed, and the three existing posts render and resolve exactly as before.\
      \ The new addresses exist only once the weekly routine's first chronicles land. The fixture tests above check\
      \ them through the FastAPI app and the snapshot build.\n\n## Notes For Reviewers\n\n- Rule chosen for a slug\
      \ two files share: both files get their dated stem, rather than the newest keeping the bare slug. A bare address\
      \ that silently switched to a different post would be worse than one that stops resolving. Today no two posts\
      \ share a slug, so no address changes.\n- The open PR #844 touches only the imports, `_load` and `_split`\
      \ in `site_docs.py`, so it should not conflict with these hunks.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n"
