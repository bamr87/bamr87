    ci_runs: []
    body: '<!-- issue-pipeline tier="2" key="bamr87/scripts#62" -->


      Closes #62


      ## What changed and why


      `trap cleanup EXIT INT TERM` ran `cleanup()` on a signal and then *returned*, and neither `cleanup()` calls
      `exit`, so both tools carried on after Ctrl-C / SIGTERM. Both scripts now use `trap cleanup EXIT` plus `trap
      ''exit 130'' INT` and `trap ''exit 143'' TERM`. `exit` inside a signal trap fires the EXIT trap, so cleanup
      runs exactly once (before, it ran twice).


      | # | Acceptance criterion | How it is met |

      | --- | --- | --- |

      | 1 | SIGINT/SIGTERM to `stashme.sh` (slow stub push, two dirty repos) → 130/143, only the first push started
      | smoke cases `stashme.sh stops on SIG{INT,TERM} with exit {130,143} after the first push` |

      | 2 | SIGINT/SIGTERM to `forkme.sh --no-fork --strategy bundle owner/repo` (slow stub clone) → 130/143, no
      `*_temp` left | smoke cases `forkme.sh stops on SIG{INT,TERM} … and removes its _temp clone` |

      | 3 | `grep -n "trap cleanup EXIT INT TERM"` returns nothing; each file has `trap cleanup EXIT` plus two signal
      traps | `FORKME/forkme.sh:43-45`, `STASHME/stashme.sh:34-36` |

      | 4 | new interrupt cases in `tests/smoke.sh` (offline, stubbed git/gh, sandboxed HOME) fail on `f7cdd0b`,
      pass after | section 10 of `tests/smoke.sh`; before/after output below |

      | 5 | `shellcheck --severity=warning …` and `tests/smoke.sh` pass | both exit 0 (below) |

      | 6 | no README change; exit codes documented only where exit codes already are | no doc in `FORKME/` or `STASHME/`
      documents exit codes, so no doc change; `CHANGELOG.md` is release-please''s |


      The test uses a separate slow `git` stub in `$WORK/slowbin` (prepended ahead of the recording stub) that logs
      each push/clone as it starts — a clone also creates its target — then sleeps 2 s; the test signals the tool
      as soon as the log is non-empty. The background job is started under `set -m`, because a non-interactive shell''s
      `&` job inherits an ignored SIGINT, which a script can then not trap.


      ## Verification


      ```text

      $ git stash -- FORKME/forkme.sh STASHME/stashme.sh && bash tests/smoke.sh   # on f7cdd0b scripts, new tests

      FAIL stashme.sh after SIGINT exited 0, not 130:   ... Failed: 0

      FAIL forkme.sh after SIGINT exited 1, not 130: ... forkme.sh: line 715: cd: .../forkme-workspace/repo_temp:
      No such file or directory

      FAIL stashme.sh after SIGTERM exited 0, not 143: ...

      FAIL forkme.sh after SIGTERM exited 1, not 143: ... line 715: cd: .../repo_temp: No such file or directory

      rc=1


      $ bash tests/smoke.sh        # with the fix

      ok   stashme.sh stops on SIGINT with exit 130 after the first push

      ok   forkme.sh stops on SIGINT with exit 130 and removes its _temp clone

      ok   stashme.sh stops on SIGTERM with exit 143 after the first push

      ok   forkme.sh stops on SIGTERM with exit 143 and removes its _temp clone

      rc=0   (59 ok, 0 FAIL; run 3 times, stable)


      $ shellcheck --severity=warning *.sh FORKME/forkme.sh STASHME/stashme.sh tests/*.sh completions/*.bash

      rc=0

      $ grep -n "trap cleanup EXIT INT TERM" FORKME/forkme.sh STASHME/stashme.sh

      rc=1 (no match)

      ```


      The "before" run also shows the forkme bug tier 1 predicted: the INT/TERM trap deleted `repo_temp` and the
      script then tried to `cd` into it.


      ## Risk / blast radius


      Two one-line trap changes. Normal (non-signal) runs are unchanged: `cleanup` still runs on EXIT. A caller
      that relied on a signalled run exiting 0 now sees 130/143, which is the point. The smoke test adds ~8 s (four
      2 s stub sleeps). Out of scope, noted by tier 1 for its own issue: stashme''s `Repositories found: 0` summary
      bug (assignment inside a process substitution).


