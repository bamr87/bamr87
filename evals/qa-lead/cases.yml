- id: bamr87-942
  source: 'https://github.com/bamr87/bamr87/pull/942 — release through a GitHub App: major (security, fleet.yml,
    size)'
  input:
    author: bamr87
    labels:
    - security
    - tokens
    - skip-evidence
    - needs-amr
    additions: 744
    deletions: 64
    files:
    - .env.example
    - .github/workflows/README.md
    - .github/workflows/release-please.yml
    - .github/workflows/token-rotation.yml
    - _data/fleet.yml
    - changelog.d/release-app-token.md
    - docs/RELEASES.md
    - docs/TOKEN-ROTATION.md
    - features/features.yml
    - templates/release-pipeline/RELEASING.md
    - tools/README.md
    - tools/SCHEMA.md
    - tools/fleet-config.py
    - tools/pm_review.py
    - tools/test_fleet_config.py
    - tools/test_release_please.py
    ci_runs: []
    body: '## Description


      Release PRs across the fleet are opened with `RELEASE_PLEASE_TOKEN`, a fine-grained PAT that expires, is re-minted
      by hand, and covers one owner, so the four repos under `bash-365`, `year-of-ai` and `ai-world-view` have never
      had a working release credential (their release runs end green with versioning paused). This replaces it with
      a GitHub App, the **release app**.


      `release-please.yml` mints an installation token per job from two secrets, `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY`,
      and uses it to tag, to open the release PR and to push the lockfile commit. The token is for the caller''s
      own repo, cut to contents + pull-requests write, and revoked when the job ends. Nothing expires and one app
      serves every owner it is installed on.


      - **Order:** the app, then `RELEASE_PLEASE_TOKEN`, then `GITHUB_TOKEN`. A repo that holds only the PAT releases
      exactly as before, so merging this changes nothing until the app is provisioned.

      - **The key arms the app.** The client ID alone is inert. The token contract declares the client ID first
      and `dash secrets push` writes in contract order, so a fan-out never leaves a repo holding a key it cannot
      use.

      - **No silent fallback.** A key without a client ID, or an app that cannot mint (not installed on the repo,
      a key that is not the app''s), fails the run and names the cause.

      - **By-name callers.** Both secrets are declared under `workflow_call.secrets`, because `secrets: inherit`
      does not cross owners.

