      | `fix-controls` | 33 | 31 miss a turn cap, 18 of them nothing else: see decision 2 |

      | `lane-adopt` | 30 | a PR per repo: githubai (6), bash-365.com (6), the two org sites (10), zer0-mistakes
      (3), godotgo (2), it-journey (2), README (1) |

      | `factory-recompile` | 6 | blueprint changes in GitFactory (gitorio 4, lifehacker.dev 2) |

      | `hub-fix` | 3 | done in this PR: all eight hub harnesses grade as on the standard on this branch |

