    ci_runs: []
    body: '## Description


      A pull request that is opened ready, marked ready, or given the `review` label now gets an AI review: one
      comment-only review on its head commit that says what was found and who does what next, plus inline comments
      on the lines the pull request adds. Asked for directly by the maintainer: "after every PR that''s marked for
      review, there should be an AI agent that comments on performing the review accordingly, and then delegating/recommending
      actions." This is the AI review that constitution § 19.7 and ADR 0012 (stage B) describe and that `templates/pr-review/README.md`
      listed under "Not built yet".


      **How it works**


      | Step | Where | Holds | Does |

      | --- | --- | --- | --- |

      | `plan` | `pr-ai-review.yml` (new) | a read-only token | Decides whether the pull request gets a review now
      and writes the brief: the diff with new-file line numbers, the description, what the PR queue already knows
      |

      | `review` | `pr-ai-review.yml` | the Claude credential, no GitHub credential | One session through `claude-run`:
      `claude-sonnet-5-5`, 25 turns, $4 cap, Read / Grep / Glob only. Then the reply is held to a contract and saved
      as two artifacts |

      | post | `pr-review.yml` (existing `ci-failure` pass) | the token that writes on pull requests, no model |
      Posts the findings inline through the `fleet-findings` channel, then the review. No step was added to the
      workflow |


      - **Triggers (§ 19.7):** opened ready, marked ready, or the `review` label. Never a push. Once per head commit.
      A manual dispatch is a dry run: the review goes to the run''s summary and nothing is posted.

      - **Who is reviewed:** a pull request whose author has write-level standing (`author_association`), or any
      pull request a maintainer labels `review`. Dependabot, release and bot pull requests are skipped unless labelled
      (§ 19.6).

      - **Delegation:** the model names who moves each action from a fixed set (`agent`, `author`, `maintainer`);
      the hand-off text is the code''s, never the model''s. For an agent it is one comment a maintainer posts, `@claude
      address the AI review findings on this pull request`, which starts the existing mention handler. Nothing is
      started without a person.

      - **The pull request is never checked out.** Every checkout takes the event''s default ref, the base branch.
      The reviewer''s working directory holds the hub''s tooling, the base branch and the diff as text, so no `.claude/`
      settings, hook or `CLAUDE.md` from the pull request can load.

      - **The reply is untrusted twice.** `collect` keeps only what fits the contract; the posting pass validates
      the artifact again, believes it only from a `pull_request_target` run of `pr-ai-review.yml`, and escapes every
      word. It posts a `COMMENT` review: it never approves or requests changes (§ 19.5).

      - **The label is read by the script, never by a job condition**, and a pull request whose head moved after
      the event is told so and not reviewed. This follows what code scanning reported on bamr87/bamr87#960 (`actions/untrusted-checkout-toctou`).

      - **Always hears back:** past the day''s cap (30), after a head that moved, or on a diff of only generated
      or binary files, the pull request gets one line saying so and how to ask again.

      - **Switch (§ 17):** `vars.PR_AI_REVIEW_ENABLED` must be `true` (a new loop starts off). `PR_REVIEW_ENABLED=false`
      stops it too.

      - **Local entry (§ 10.9):** `tools/dash prs review --pr owner/repo#n`, a capped session through `dash-gen
      ai-run --isolate` that prints the review and posts nothing.


      **Also fixed:** with `PR_READINESS_ENABLED` on, `pr_readiness.py` replaced `pr_review.py` as the entry point
      and never read the findings channel, so turning readiness on turned inline findings off. It posts them again.


      <details><summary>What the review looks like: a made-up reply, rendered by the real code</summary>


      ## AI review of `aaaaaaa`


      Adds a widget. One bug before it merges.


      **Findings:** 1 error, 1 warning, 1 note. 1 is inline on the line it names.


      ### Findings not on a line this pull request adds


      - **Warning** · `tests` · `src/x.py:40`: No test covers the empty list.

      - **Note** · `design`: Consider one module.


      ### Next actions


      **An agent** (to hand these off, a maintainer comments `@claude address the AI review findings on this pull
      request`):


      - Guard the division.


      **The author** (push the change to this branch):


      - Say which caller needs this.


      **The maintainer** (a decision, not work):


      - Decide whether v1 stays.


      ---

      Automated review by `claude-sonnet-5-5`. It comments and never approves (§ 19.5), and its findings are advisory.
      It read 2 of 3 changed file(s); 1 was left out as generated, binary or too large. For another review after
      new commits, add the `review` label.


      </details>


      ## Governance Trace


      Governed by: FR61 (HUB-065, the fleet PR review; constitution § 19.7, `docs/amendments/0017-fleet-pr-review.md`)
      and FR137 (merge readiness; `docs/adr/0012-merge-readiness.md`, stage B). Handoff: direct maintainer request
      in a Claude Code session (2026-11-23).


      No constitution text changes: the rule and the design were already ratified and accepted. Per § 28.3 a Grok
      direction review before merge is welcome.


      ## Related Issues


      - Completes the AI review item in the scope of bamr87/bamr87#564 (closed), and phase P2 of ADR 0012 (bamr87/bamr87#917).

      - Sibling of bamr87/bamr87#960 (AI analysis of failed CI runs). See the notes on merge order below.


      ## Type Of Change


      - [x] Bug fix

      - [x] New feature

      - [ ] Breaking change

      - [x] Documentation update

      - [ ] Maintenance or refactor

      - [x] Test improvement


      ## Verification


      - [x] Tests pass: `test_pr_ai_review.py` (32, new), `test_pr_review.py` (48), `test_pr_readiness.py` (14),
      `test_ai_budget.py` (222 checks), `test_agent_inventory.py`, `test_harness_registry.py`, `test_workflow_atlas.py`,
      `test_schedule.py`, `tools/test_loop_switches.py`, `tools/test_fleet_config.py`, `tools/test_vscode_launch.py`,
      `tools/test_claude_run.py`, `tools/console/test_pages.py`

      - [x] Lint/type checks pass: `tools/check-drift.sh` (no drift), `actionlint` and `shellcheck` on both workflows,
      `tools/dash workflows lint` (nothing on the new file), `schema_lint`, `unwrap-prose --check`, `governance_lint
      check`, `docs_index --check`, the generated-file guard

      - [x] Documentation updated: `templates/pr-review/README.md` ("AI review"), the workflow and dash-gen READMEs,
      AGENTS.md loop row, `.vscode` entry, `docs/DASH.md` regenerated

      - [x] Harness standard: `pr-ai-review.yml` reads as route `claude-run`, pinned model, turn cap, budget cap,
      kill switch, ordered auth, trusted-author gate, least privilege, no `pull_request_target` head checkout, timeout;
      `tools/dash agents --check` is current with `ci:bamr87:pr-ai-review` registered

      - [ ] Manual verification: not possible before merge (below)


      `skip-evidence`: `pull_request_target` runs only the default branch''s file, so the workflow cannot run before
      merge, and no model was called in building it. The sample above comes from the real rendering code. First
      live evidence: `gh workflow run pr-ai-review.yml -f pr=<n>` (a dry run) after merge, then the first pull request
      marked ready with the switch on.


      `tools/run-all-tests.sh` here: 134 ran, four failed, none from this change. `test_remediation.py` fails one
      check on `origin/main` too (a daily snapshot); `shellcheck tools/*.sh` fails on `origin/main` in this container
      (style notes in scripts this does not touch; `tools/dash` has the same three notes before and after); `test_weekly.py`
      has one file-permission test that cannot fail as root; `test_console.py` needs FastAPI, which this container
      lacks.


      ## Notes For Reviewers


      - **Gated (`needs-amr`):** it adds a `budget.call_sites` entry, a kill switch and an AI workflow that runs
      on `pull_request_target`.

      - **To arm it after merge:** `gh variable set PR_AI_REVIEW_ENABLED -R bamr87/bamr87 --body true`. Try the
      dry run first; it works with the switch off.

      - **No eval set yet (§ 13.1).** The findings are advisory: they fail no build, and merge readiness does not
      count them. An eval set of about 20 past pull requests is the next piece, and the condition for an `error`
      finding to become a `todo` item as ADR 0012 describes. bamr87/bamr87#960 adds the `tools/evals.py` adapter
      pattern to copy.

      - **Hub only.** Fleet repos need a stub with the `pull_request_target` trigger and the credential passed to
      a reusable form of this workflow, then a `v2` cut and one fan-out pull request per repo.

      - **One deliberate difference from ADR 0012:** the ADR says stage B runs "once CI is green". This runs when
      the pull request is marked ready and gives the reviewer the check state as context, because the ask was a
      review after every pull request that is marked for review, and waiting for green needs state that survives
      between events. Say if you want it to wait.

      - **Merge order with bamr87/bamr87#960.** Both touch `pr-review.yml`, `_data/fleet.yml`, the two READMEs and
      `_data/agents.yml`. This change was laid out to merge beside it: its settings sit under their own key (`pr_ai_review`,
      not a second `pr_review:` block, which YAML would silently drop), the posting is a function call in the existing
      pass (no new workflow step), and each insertion is at a different place. Two conflicts remain whichever merges
      second: the "Not built yet" bullet in `templates/pr-review/README.md` (both rewrite it; keep both texts) and
      `_data/agents.yml` (regenerate with `tools/dash agents`).

      - **Cost:** capped at $4 a review, API-equivalent (estimate), and 30 reviews a day. Every `labeled` event
      with the switch on starts the short `plan` job, because the label cannot be read in a job condition.

      - **Residual risk:** the reviewer reads a diff with the Claude credential in its process environment. It has
      no shell and no network tool, a deny list keeps it out of `/proc` and the runner''s credential directories,
      token-shaped text is scrubbed twice, and only a trusted author''s or a maintainer-labelled pull request is
      reviewed.

      - CodeQL will scan the new workflow on this pull request; I am watching for alerts.


      ---

