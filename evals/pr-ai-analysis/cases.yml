# evals/pr-ai-analysis/cases.yml — the eval set for the CI failure analyst of
# .github/workflows/pr-review.yml (the `ai-analysis` job, constitution § 19.11, § 13.1).
#
# Every case is a REAL failed run on a pull request in this repository, collected on
# 2026-11-23 from the runs whose logs GitHub still kept (logs before about 2026-08-26 have
# expired). Each holds what the workflow would hand the model: the failed job and step,
# the fleet's deterministic reading of it (pr_review.explain and the failure class), the
# failed step's log as recorded (timestamps and colour codes stripped; GitHub had already
# masked secrets as ***) and the PR's changed files. The patch itself was not recorded.
# `expected` comes from what fixed the run (`fixed_by`), never from what a model answered:
# whether the PR caused it, and phrases any correct root cause names (one is enough,
# case-insensitive). `why` is the collector's account of the cause, for a reader.
#
# Gap: no case of a missing secret or credential exists among the kept logs; add one when
# the analyst meets one.
#
#   python3 tools/evals.py run pr-ai-analysis --dry-run   # schema + prompt budget, no model (CI)
#   python3 tools/evals.py run pr-ai-analysis             # SPENDS: the shipped prompt, one turn, no tools
#
# `model` must be the shipped analyst's (pr_ai_analysis.MODEL) and an id in
# _data/fleet.yml ai_models.allowed.
schema: evals/v1
role: pr-ai-analysis
mode: model
target: .github/workflows/pr-review.yml#ai-analysis
model: claude-sonnet-5-5
min_cases: 10
rubric: An LLM judge, if used, scores 1 when the verdict matches and the root cause names the concrete thing that broke (the
  file, key, rule or version) and the fix would turn the run green; 0 for a generic 'a test failed, check the logs'.
cases:
- id: drift-check-38625268177-fleet-yml
  source: bamr87/bamr87#353, run 38625268177 (.github/workflows/drift-check.yml)
  fixed_by: bac487ab60 put the three crons back to their fleet.yml values and commented out git_digs in _data/fleet.yml with
    the paused git-digs.yml schedule; drift-check passed.
  input:
    repo: bamr87/bamr87
    pr: 353
    title: ''
    runs:
    - id: 38625268177
      name: 🚧 Drift Check
      conclusion: failure
      path: .github/workflows/drift-check.yml
      jobs:
      - job: drift
        step: Run dash-gen fixture tests
        reason: FAIL — 2 schedule test(s)
        class: defect
        cause: test
        log: "  PASS  category emphasis file exists for `full-stack-ai`\n  PASS  category emphasis file exists for `docs`\n\
          \  PASS  category emphasis file exists for `dev-tools`\n  FAIL  cron matches _data/fleet.yml schedule.repo_evolution\n\
          \  PASS  write-capable scheduled workflow has a concurrency group\n  PASS  every job sets timeout-minutes\n  PASS\
          \  evolve needs plan (needs:, not workflow_run)\n\nFAILED (1/144)\n##[endgroup]\n##[error]test_evolution.py failed\n\
          ##[group]test_schedule.py\n  ✗ test_every_declared_schedule_has_a_workflow: fleet.yml schedule.git_digs names no\
          \ scheduled workflow\n  ✗ test_every_scheduled_workflow_is_declared_with_the_same_cron: fleet-pulse.yml runs '11\
          \ 5 * * *' but fleet.yml says '37 5 * * *'\n  ✓ test_hub_crons_never_fire_on_the_hour\n  ✓ test_scheduled_agents_carry_a_kill_switch_that_spares_manual_runs\n\
          FAIL — 2 schedule test(s)\n##[endgroup]\n##[error]test_schedule.py failed\ndash-gen: 20/22 suites passed\nFAILED:\
          \ test_evolution.py\nFAILED: test_schedule.py\n##[error]Process completed with exit code 1."
    files:
    - .github/workflows/fleet-pulse.yml
    - .github/workflows/repo-evolution.yml
    - .github/workflows/git-digs.yml
    - .github/workflows/issue-pipeline.yml
    diff: '(not recorded: the case keeps the changed file names, not the patch)'
  expected:
    caused_by_pr: 'yes'
    root_cause_any:
    - fleet.yml
    - cron
    - schedule
  pass: caused_by_pr equals expected, and the summary, root cause or evidence names one of root_cause_any
  why: The PR's first commit moved the fleet-pulse, issue-pipeline and repo-evolution crons to new staggered times and commented
    out git-digs's schedule, but left _data/fleet.yml `schedule:` unchanged. The dash-gen contract tests require every workflow
    cron to equal its fleet.yml entry and every fleet.yml entry to have a scheduled workflow, so test_schedule.py and test_evolution.py
    failed on the mismatch.
