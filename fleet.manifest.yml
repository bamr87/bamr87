# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See packages/wtd/docs/FLEET-SPEC.md
# in bamr87/gitorio. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/bamr87
provenance: derived
summary: The dash — control plane for ~40 submodule repos. Runs the daily fleet-pulse
  loop, the three-tier issue pipeline, the weekly repo-evolution pass, registry reconciliation,
  and the standardization fan-outs.
lanes:
- id: backlog-fanout
  kind: fanout
  harness: engine
  implementation: .github/workflows/backlog-fanout.yml
  description: backlog-fanout
  triggers:
  - kind: schedule
    cron: 27 8 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: true
- id: build-dash
  kind: other
  harness: engine
  implementation: .github/workflows/build-dash.yml
  description: 🛰️ Build & Deploy Dash
  triggers:
  - kind: schedule
    cron: 37 8 * * *
  - kind: event
    events:
    - pull_request
    - push
  - kind: dispatch
  switch: null
  uses_tokens:
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: fleet-pulse
  kind: maintenance
  harness: claude-code-action
  implementation: .github/workflows/fleet-pulse.yml
  description: 🩺 Fleet Pulse
  triggers:
  - kind: schedule
    cron: 37 5 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: issue-pipeline
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/issue-pipeline.yml
  description: 🧭 Issue Pipeline
  triggers:
  - kind: schedule
    cron: 37 7 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: reconcile-registry
  kind: maintenance
  harness: engine
  implementation: .github/workflows/reconcile-registry.yml
  description: 🧭 Reconcile Registry
  triggers:
  - kind: schedule
    cron: 7 5 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: repo-evolution
  kind: maintenance
  harness: claude-code-action
  implementation: .github/workflows/repo-evolution.yml
  description: 🌿 Repo Evolution
  triggers:
  - kind: schedule
    cron: 37 10 * * 1
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
- id: fanout
  kind: fanout
  harness: claude-code-action
  implementation: .github/workflows/fanout.yml
  description: fanout — every kit (standardize, harness, schema, verify, feedback, deps-latest, docker) through one dispatch
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: true
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
  - fleet-pulse
  - issue-pipeline
  - repo-evolution
  - fanout
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by `claude setup-token`.'
  used_by:
  - claude
  - fleet-pulse
  - issue-pipeline
  - repo-evolution
  - fanout
- name: FLEET_TOKEN
  scope: fleet
  required: true
  purpose: 'Cross-repo PAT: lets a lane see and act on other repositories.'
  used_by:
  - fleet-pulse
  - issue-pipeline
  - reconcile-registry
  - repo-evolution
  - fanout
- name: GITHUB_TOKEN
  scope: repo
  required: true
  purpose: Ambient Actions token; cannot write to other repositories.
  used_by:
  - build-dash
  - fleet-pulse
  - issue-pipeline
  - reconcile-registry
agents:
- feature-scout
skills:
- actions-triage
- drift-report
- estimate-issue
- evolve-project
- issue-pipeline
- new-project
- onboard-dir
- refresh-portfolio
- run-dash
- standardize-audit
- standardize-project
- sync-cv
- sync-project-docs
- triage-attention
- update-registry
