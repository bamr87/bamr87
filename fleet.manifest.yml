# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/bamr87
provenance: derived
summary: The dash — control plane for ~40 submodule repos. Runs the daily fleet-pulse
  loop, the three-tier issue pipeline, registry reconciliation, and the standardization fan-outs.
lanes:
- id: build-dash
  kind: other
  harness: engine
  implementation: .github/workflows/build-dash.yml
  description: 🛰️ Build & Deploy Dash
  triggers:
  - kind: schedule
    cron: 0 7 * * *
  - kind: event
    events:
    - pull_request
    - push
  - kind: dispatch
  switch: null
  uses_tokens:
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: fleet-pulse
  kind: maintenance
  harness: claude-code-action
  implementation: .github/workflows/fleet-pulse.yml
  description: 🩺 Fleet Pulse
  triggers:
  - kind: schedule
    cron: 0 6 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ACTIONS_ANALYTICS_TOKEN
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - DAILY_ANALYSIS_TOKEN
  - FANOUT_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: issue-pipeline
  kind: triage
  harness: claude-code-action
  implementation: .github/workflows/issue-pipeline.yml
  description: 🧭 Issue Pipeline
  triggers:
  - kind: schedule
    cron: 0 8 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - DAILY_ANALYSIS_TOKEN
  - FANOUT_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: reconcile-registry
  kind: maintenance
  harness: engine
  implementation: .github/workflows/reconcile-registry.yml
  description: 🧭 Reconcile Registry
  triggers:
  - kind: schedule
    cron: 0 5 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ACTIONS_ANALYTICS_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: refresh-dash
  kind: other
  harness: engine
  implementation: .github/workflows/refresh-dash.yml
  description: 🔄 Refresh Dash
  triggers:
  - kind: schedule
    cron: 0 4 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: schema-fanout
  kind: fanout
  harness: claude-code-action
  implementation: .github/workflows/schema-fanout.yml
  description: schema-fanout
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FANOUT_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: standardize-fanout
  kind: fanout
  harness: claude-code-action
  implementation: .github/workflows/standardize-fanout.yml
  description: standardize-fanout
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FANOUT_TOKEN
  - FLEET_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: unified-evolution
  kind: other
  harness: claude-code-action
  implementation: .github/workflows/unified-evolution.yml
  description: 🌱 AI Evolution Pass
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - FLEET_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: true
tokens:
- name: ACTIONS_ANALYTICS_TOKEN
  scope: repo
  required: true
  used_by:
  - fleet-pulse
  - reconcile-registry
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
  - fleet-pulse
  - issue-pipeline
  - schema-fanout
  - standardize-fanout
  - unified-evolution
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by `claude setup-token`.'
  used_by:
  - claude
  - fleet-pulse
  - issue-pipeline
  - schema-fanout
  - standardize-fanout
  - unified-evolution
- name: DAILY_ANALYSIS_TOKEN
  scope: repo
  required: true
  used_by:
  - fleet-pulse
  - issue-pipeline
- name: FANOUT_TOKEN
  scope: repo
  required: true
  used_by:
  - fleet-pulse
  - issue-pipeline
  - schema-fanout
  - standardize-fanout
- name: FLEET_TOKEN
  scope: fleet
  required: true
  purpose: 'Cross-repo PAT: lets a lane see and act on other repositories.'
  used_by:
  - fleet-pulse
  - issue-pipeline
  - reconcile-registry
  - schema-fanout
  - standardize-fanout
  - unified-evolution
- name: GITHUB_TOKEN
  scope: repo
  required: true
  purpose: Ambient Actions token; cannot write to other repositories.
  used_by:
  - build-dash
  - fleet-pulse
  - issue-pipeline
  - reconcile-registry
  - refresh-dash
  - unified-evolution
agents:
- feature-scout
skills:
- actions-triage
- drift-report
- estimate-issue
- evolve-project
- issue-pipeline
- new-project
- onboard-dir
- refresh-portfolio
- run-dash
- standardize-audit
- standardize-project
- sync-cv
- sync-project-docs
- triage-attention
- update-registry
