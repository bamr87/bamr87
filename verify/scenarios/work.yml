# The Work board on the published site: every open item on six lanes, read-only.
id: work
feature: HUB-028
title: "The Work board shows every open item in the order the loops take it"
description: "/work renders the issue pipeline's issues, every open PR and the roadmap specs on six lanes with the next run's picks marked, a Priorities view and a Throughput view of each loop's cap and drain time; the public build says reprioritising runs on a console and does not scroll sideways."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /work
  - expect: { status: 200 }
  - wait: { selector: "section[aria-label^='Triage lane']" }
  - expect: { text: "Next run" }
  - expect: { text: "Runs on a console" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: work-board
  - click: "role=tab[name=/Throughput/]"
  - wait: { selector: "text=By repository" }
  - expect: { text: "Issue pipeline · T1 intake" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: work-throughput
