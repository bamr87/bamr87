id: roadmap
feature: HUB-015
title: "Roadmap renders the backlog"
description: "The /roadmap page renders roadmap entries from _data/roadmap.yml, filterable by status and readable at mobile width."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /roadmap
  - expect: { status: 200 }
  - wait: { selector: "main table.dt" }
  - expect: { text: "FF-" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: roadmap
