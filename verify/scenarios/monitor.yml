id: monitor
feature: HUB-002
title: "Projects table renders with or without live health data"
description: "The /projects table (the retired /monitor/ board) renders every registry project with its health and triage state; a project drill-down opens from it."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /projects
  - expect: { status: 200 }
  - wait: { selector: "main table.dt" }
  - expect: { count: { selector: "main table.dt tbody tr", min: 10 } }
  - expect: { no_horizontal_scroll: true }
  - screenshot: monitor
  - goto: /projects/zer0-mistakes
  - expect: { status: 200 }
  - expect: { text: "zer0-mistakes" }
  - screenshot: project
