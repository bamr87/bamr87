id: triage
feature: HUB-003
title: "Fleet inbox renders the committed snapshot"
description: "The /inbox page shows the flagged issues, pull requests and failing workflows from _data/fleet_triage.yml; no sideways scroll on mobile (wide tables scroll inside their own container). The retired /triage/ URL lands here."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /triage/
  - wait: { url: "/inbox" }
  - wait: { selector: "main table.dt" }
  - expect: { text: "Inbox" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: triage
