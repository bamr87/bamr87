# The first thing a visitor does: land on the site and see who it is about,
# the fleet's vital signs, and the way into the console.
id: home
feature: HUB-001
title: "Home renders the profile, the fleet's vitals and the console navigation"
description: "A visitor lands on the root of the public site (the Harness Console built static), sees the profile, the KPI tiles read from the snapshot and the featured projects, and can reach every console section from the sidebar — without sideways scrolling."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /
  - expect: { status: 200 }
  - wait: { selector: "main a[href*='/projects/']" }
  - expect: { visible: "main" }
  - expect: { text: "Featured projects" }
  - expect: { text: "Need attention" }
  - expect: { no_horizontal_scroll: true }
  - expect: { no_console_errors: true }
  - screenshot: home
