id: harnesses
feature: HUB-005
title: "Harness inventory renders the deployment matrix"
description: "The /harnesses page renders the inventory from _data/harness_registry.yml — the totals, the attention list and the per-repo table — without sideways scrolling; /harnesses/health renders the trip wires and scorecard."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /harnesses
  - expect: { status: 200 }
  - wait: { selector: "main table.dt" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: harnesses
  - goto: /harnesses/health
  - expect: { status: 200 }
  - wait: { selector: "main h2" }
  - screenshot: harness-health
