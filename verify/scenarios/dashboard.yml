# The portfolio surface driven by _data/projects.yml.
id: dashboard
feature: HUB-001
title: "Portfolio lists the registry's projects"
description: "The /portfolio page renders one card per registry project, each a link to its project page, at desktop and mobile widths; the retired /dashboard/ URL still lands on the projects table."
viewports: [desktop, mobile]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /portfolio
  - expect: { status: 200 }
  - wait: { selector: "main a[href*='/projects/']" }
  - expect: { count: { selector: "main a[href*='/projects/']", min: 10 } }
  - expect: { no_horizontal_scroll: true }
  - screenshot: dashboard
  - goto: /dashboard/
  - wait: { url: "/projects" }
  - wait: { selector: "main table.dt" }
  - screenshot: dashboard-legacy
