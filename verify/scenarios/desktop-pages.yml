# Console pages as windows on the bashOS desktop: a page opens in a window without its own header and sidebar, and the start menu opens any other.
id: desktop-pages
feature: HUB-079
title: "A console page opens in a desktop window without its own chrome, and the start menu opens any page"
description: "On the Desktop the Console icon opens the console's Overview in a window. The page inside drops its own header and sidebar, because the window is its frame, and the window is titled after the page. The taskbar's bashOS button lists every page of the console and opens the one picked in another window. The desktop itself stays on screen and nothing scrolls sideways. Desktop width only: at a phone's width there is no taskbar, and the Console icon leaves for the classic console."
viewports: [desktop]
ignore_console: ["Failed to load resource", "net::ERR_"]
steps:
  - goto: /desktop
  - expect: { status: 200 }
  - wait: { selector: "nav[aria-label='Apps']" }
  - click: "nav[aria-label='Apps'] button:has-text('Console')"
  - wait: { selector: "iframe[title^='Console page']" }
  # The page inside the window rendered, and without a second frame of its own.
  - eval: { name: framed_page, script: "(async () => { const f = document.querySelector(\"iframe[title^='Console page']\"); for (let i = 0; i < 80 && !f.contentDocument?.querySelector('h2'); i += 1) await new Promise((r) => setTimeout(r, 250)); const d = f.contentDocument; if (!d || !d.querySelector('h2')) throw new Error('the page did not render in the window'); if (d.querySelector('header') || d.querySelector('.mantine-AppShell-navbar')) throw new Error('the framed page kept its own header or sidebar'); return d.querySelector('h2').innerText; })()" }
  - wait: { selector: "footer button:has-text('Overview')" }
  - expect: { url: "/desktop" }
  - click: "footer button:has-text('bashOS')"
  - click: "role=menuitem[name='Roadmap']"
  - wait: { selector: "footer button:has-text('Roadmap')" }
  - expect: { count: { selector: "iframe[title^='Console page']", min: 2 } }
  - eval: { name: second_page, script: "(async () => { const frames = [...document.querySelectorAll(\"iframe[title^='Console page']\")]; const f = frames[frames.length - 1]; for (let i = 0; i < 80 && !f.contentDocument?.querySelector('h2'); i += 1) await new Promise((r) => setTimeout(r, 250)); return f.contentWindow.location.pathname; })()" }
  - expect: { no_horizontal_scroll: true }
  - screenshot: console-pages-in-windows
