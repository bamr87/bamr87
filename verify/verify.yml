# =============================================================================
# verify/verify.yml — how to run the DASH the way a user would
# =============================================================================
# kit: verify v0.1.0 — the hub practices what it seeds (templates/verify/).
#
# The dash is the Harness Console's page built static (tools/console/
# build-pages.sh) and published under the /bamr87 project subpath. For
# verification it is built at the ROOT (CONSOLE_BASE=/) and served statically —
# every route has its own index.html, so a deep link answers 200 — and scenarios
# navigate to clean routes (/portfolio, /features, …) exactly as they read on
# the nav, locally and in fleet-verify.yml alike. Read by verify/runner.mjs, .github/workflows/
# verify.yml (via fleet-verify.yml), and .claude/skills/verify-feature.
#
#   local:  tools/dash verify                              (builds + serves + runs)
#           tools/dash verify --base http://127.0.0.1:4000  (against `dash serve`)
# =============================================================================
schema: verify/v1

app:
  build: "CONSOLE_BASE=/ SITE_URL=http://127.0.0.1:4000 OUT=_site tools/console/build-pages.sh"
  start: ""
  static_dir: _site
  url: http://127.0.0.1:4000
  ready: /
  timeout_s: 240
  install: ""

viewports:
  desktop: { width: 1280, height: 800 }
  tablet: { width: 768, height: 1024 }
  mobile: { width: 390, height: 844 }

features: features/features.yml
scenarios: verify/scenarios
evidence_dir: test/evidence

agent:
  entry_routes: ["/", "/portfolio", "/overview", "/features", "/connect"]
  never:
    - "follow links off 127.0.0.1 — the dash links to ~40 live repos and sites; verify THIS site"
    - "dispatch workflows or edit GitHub state — the published snapshot is read-only, and the Connect page's GitHub and console modes are for a human to enable"
    - "paste a token into the Connect page"
